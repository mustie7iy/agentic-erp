# Code standards checked by machine (CLAUDE.md, docs/design/06-engineering-process.md).
# gofmt, vet, staticcheck and gosec run as their own CI steps; this file adds the
# structural rules. `make lint` reports only issues in code changed since the
# merge base with main, so existing code is tightened as it is touched.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - funlen       # long functions
    - gocognit     # hard-to-follow functions
    - dupl         # copy-paste
    - wrapcheck    # errors from other packages returned without context
    - errorlint    # == / type assertions on wrapped errors
    - nilerr       # returning nil when err != nil
    - exhaustive   # enum switches missing cases
    - forbidigo    # banned calls, see below
    - thelper      # test helpers call t.Helper()
    - tparallel    # inconsistent t.Parallel use
    - gocritic
    - bodyclose
    - noctx        # HTTP requests without a context
    - misspell
  settings:
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 20
    dupl:
      threshold: 120
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - problem. # problem+json values are the API error contract
        - .WithCause(
      ignore-package-globs:
        - github.com/mustie7iy/agentic-erp/*
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^time\.Sleep$
          msg: in tests, poll for the condition or inject a clock instead of sleeping
        - pattern: ^panic$
          msg: return an error; panic only in main or init-time wiring
        - pattern: ^float(32|64)$
          msg: money and quantities are money.Minor / integer units (ADR-0005)
  exclusions:
    generated: strict
    paths:
      - api/gen
    rules:
      # time.Sleep is legitimate in production code (back-off); banned in tests only.
      - path-except: _test\.go$
        linters: [forbidigo]
        text: time\.Sleep
      # panic is allowed in main packages and test helpers.
      - path: (^cmd/|_test\.go$|/internal/platform/[a-z]+test/|/internal/llm/llmtest/|/internal/platform/pgtest/|/internal/platform/fixture/)
        linters: [forbidigo]
        text: panic
      # Floats are fine outside money: metrics, rate limiting, analytics display, load tests.
      - path: (internal/(nfr|analytics|platform/(ratelimit|telemetry))/|_test\.go$)
        linters: [forbidigo]
        text: float
      # Table-driven tests and fixtures are long and similar by nature.
      - path: _test\.go$
        linters: [funlen, dupl, gocognit, wrapcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
