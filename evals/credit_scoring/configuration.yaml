# The credit scoring suite's tenants' configuration (ADR-0039, ADR-0072):
# one Canadian company, 3000 (CAD), that adopted Canada pack 2026.6, with a
# customer reconciliation account, 1200 Trade receivables, one output code
# for its sales, GO5 at 5% to 2300, the payment term NT30 and the number
# ranges a customer invoice and its journal entry take, as the
# walkthrough's pilot settings configure them (scripts/walkthrough.sh,
# PILOT_SETTINGS; evals/tax's configuration is the base). The cases are
# dated in 2026, whose periods are opened by the suite's setup.
version: 1
companies:
  - code: "3000"
    name: Maple Eval Ltd
    currency: CAD
    country: CA
    fiscal_year_start_month: 1
    time_zone: America/Toronto
    chart_of_accounts:
      - number: "100000"
        name: Bank - Operating
        type: asset
      - number: "1200"
        name: Trade receivables
        type: asset
        customer_reconciliation: true
      - number: "1300"
        name: GST/HST input tax credits
        type: asset
      - number: "211000"
        name: Accounts Payable - Domestic
        type: liability
        vendor_reconciliation: true
      - number: "2300"
        name: GST/HST payable
        type: liability
      - number: "300000"
        name: Share Capital
        type: equity
      - number: "4000"
        name: Sales
        type: revenue
      - number: "6000"
        name: Office expenses
        type: expense
    account_determination:
      ap_reconciliation: "211000"
      input_tax: "1300"
      bank: "100000"
    tax_codes:
      - code: GO5
        description: GST 5% on sales
        direction: output
        kind: standard
        category: S
        components:
          - key: gst
            jurisdiction: CA
            account_key: output
            account: "2300"
            rates: [{rate_percent: "5", valid_from: "2025-01-01"}]
      - code: GI
        description: GST/HST instalment paid (line 110)
        direction: input
        kind: adjustment
        components:
          - key: instalment
            jurisdiction: CA
            account_key: input
            account: "2300"
            rates: [{rate_percent: "0", valid_from: "2025-01-01"}]
    tax_registrations:
      - code: GSTHST
        authority: CRA
        number: "123456789 RT 0001"
        return_type: GST34
        frequency: quarterly
        first_period_start: "2026-01-01"
    house_bank: {name: RBC, bic: ROYCCAT2, institution_number: "003", transit_number: "00002", account_number: "1000001"}
    invoice_tolerance:
      price_percent: 2
      price_absolute: "5.00"
    auto_post_limit: "50000.00"
    manual_entry_approval_limit: "10000.00"
    gr_over_delivery_percent: 0
packs:
  - {company: "3000", country: CA, version: "2026.6", applied_on: "2026-01-01"}
payment_terms:
  - key: NT30
    description: Net 30 days
    net_days: 30
purchasing:
  requisition_approval:
    - steps:
        - role: Z_PURCH_MGR
          approvals: 1
  order_release_approval:
    - steps:
        - role: Z_PURCH_MGR
          approvals: 1
  contract_expiry_notice_days: 30
payments:
  release_role: Z_TREASURY_MGR
  release_approvals: 1
  bank_change_hold_days: 5
  vendor_approver_role: vendor_master_approver
output:
  purchase_order_channel: email
number_ranges:
  - {company: "3000", document_type: journal_ab, fiscal_year: 2026, first: 100000, last: 999999}
  - {company: "3000", document_type: journal_sa, fiscal_year: 2026, first: 100000, last: 999999}
  - {company: "3000", document_type: customer_invoice, fiscal_year: 2026, prefix: CI, first: 1, last: 999999}
  - {company: "3000", document_type: journal_dr, fiscal_year: 2026, first: 1800000000, last: 1899999999}
