# The tax suite's tenants' configuration (ADR-0039, ADR-0049 §13): one
# Canadian company, 3000 (CAD), that adopted Canada pack 2026.6, whose
# returns.yaml defines the GST/HST return (the GST34's lines, T61j, not
# signed off), with a quarterly GST/HST registration from 2026-01-01, one
# output code for its sales, GO5 at 5% to 2300, and one code of tax alone
# for an instalment paid, GI (kind adjustment, rate 0, keyed instalment:
# line 110, ADR-0049 §11 As built), as the walkthrough's pilot settings
# configure them (scripts/walkthrough.sh, PILOT_SETTINGS).
# The registration number is illustrative. The cases are dated in 2026,
# whose periods have all ended whenever a suite runs.
version: 1
companies:
  - code: "3000"
    name: Maple Eval Ltd
    currency: CAD
    country: CA
    fiscal_year_start_month: 1
    time_zone: America/Toronto
    chart_of_accounts:
      - number: "100000"
        name: Bank - Operating
        type: asset
      - number: "1300"
        name: GST/HST input tax credits
        type: asset
      - number: "211000"
        name: Accounts Payable - Domestic
        type: liability
        vendor_reconciliation: true
      - number: "2300"
        name: GST/HST payable
        type: liability
      - number: "300000"
        name: Share Capital
        type: equity
      - number: "4000"
        name: Sales
        type: revenue
      - number: "6000"
        name: Office expenses
        type: expense
    account_determination:
      ap_reconciliation: "211000"
      input_tax: "1300"
      bank: "100000"
    tax_codes:
      - code: GO5
        description: GST 5% on sales
        direction: output
        kind: standard
        category: S
        components:
          - key: gst
            jurisdiction: CA
            account_key: output
            account: "2300"
            rates: [{rate_percent: "5", valid_from: "2025-01-01"}]
      - code: GI
        description: GST/HST instalment paid (line 110)
        direction: input
        kind: adjustment
        components:
          - key: instalment
            jurisdiction: CA
            account_key: input
            account: "2300"
            rates: [{rate_percent: "0", valid_from: "2025-01-01"}]
    tax_registrations:
      - code: GSTHST
        authority: CRA
        number: "123456789 RT 0001"
        return_type: GST34
        frequency: quarterly
        first_period_start: "2026-01-01"
    house_bank: {name: RBC, bic: ROYCCAT2, institution_number: "003", transit_number: "00002", account_number: "1000001"}
    invoice_tolerance:
      price_percent: 2
      price_absolute: "5.00"
    auto_post_limit: "50000.00"
    manual_entry_approval_limit: "10000.00"
    gr_over_delivery_percent: 0
packs:
  - {company: "3000", country: CA, version: "2026.6", applied_on: "2026-01-01"}
payment_terms:
  - key: NT30
    description: Net 30 days
    net_days: 30
purchasing:
  requisition_approval:
    - steps:
        - role: Z_PURCH_MGR
          approvals: 1
  order_release_approval:
    - steps:
        - role: Z_PURCH_MGR
          approvals: 1
  contract_expiry_notice_days: 30
payments:
  release_role: Z_TREASURY_MGR
  release_approvals: 1
  bank_change_hold_days: 5
  vendor_approver_role: vendor_master_approver
output:
  purchase_order_channel: email
number_ranges:
  - {company: "3000", document_type: journal_ab, fiscal_year: 2026, first: 100000, last: 999999}
  - {company: "3000", document_type: journal_sa, fiscal_year: 2026, first: 100000, last: 999999}
