name: deploy

# The infrastructure code's checks (ADR-0035), only when it changes: fmt,
# validate, `terraform test` against a mock provider, tflint, and the
# encryption-at-rest policy with conftest (scripts/deploy-checks.sh); and
# the cluster's Helm content: the pinned add-ons rendered and validated,
# the erp-cluster, erp-cell and erp-global charts, and the admission policies run by Kyverno's CLI
# against images signed in a local registry (scripts/helm-checks.sh). No
# credentials and no account: nothing here plans against or applies to AWS.
on:
  push:
    branches: [main]
    paths: &paths
      - deploy/**
      # Promotions have a workflow of their own (promotion.yml).
      - "!deploy/environments/**"
      - scripts/deploy-checks.sh
      - scripts/helm-checks.sh
      - scripts/admission-checks.sh
      - scripts/mirror-images.sh
      - scripts/test-mirror-images.sh
      - scripts/nats-checks.sh
      - scripts/temporal-checks.sh
      - temporal/**
      - scripts/lib/**
      # The workflows themselves, which deploy-checks.sh lints.
      - .github/workflows/**
  pull_request:
    paths: *paths

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TERRAFORM_VERSION: 1.16.4
      TERRAFORM_SHA256: dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Terraform, tflint, conftest and actionlint (pinned)
        run: |
          cd "$RUNNER_TEMP"
          archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -sSfLO "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${archive}"
          echo "${TERRAFORM_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "${archive}" terraform
          mkdir -p bin && mv terraform bin/
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C bin actionlint
          GOBIN="$RUNNER_TEMP/bin" go install github.com/terraform-linters/tflint@v0.63.1
          GOBIN="$RUNNER_TEMP/bin" go install github.com/open-policy-agent/conftest@v0.71.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Infrastructure checks
        run: ./scripts/deploy-checks.sh

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HELM_VERSION: 4.1.4
      HELM_SHA256: 70b2c30a19da4db264dfd68c8a3664e05093a361cefd89572ffb36f8abfa3d09
      KUBECONFORM_VERSION: 0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KYVERNO_VERSION: 1.19.1
      KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
      ZOT_VERSION: 2.1.22
      ZOT_SHA256: a053169f97b4ceaa051e054d53971799188a398cb36acbaf5e08622ec8664c44
      SYFT_VERSION: 1.52.0
      SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
      # The Prometheus the monitoring add-on runs (kube-prometheus-stack 91.8.2).
      PROMTOOL_VERSION: 3.15.0
      PROMTOOL_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No module and build cache: under go.sum's key it is the test
          # job's (2 GB compressed, several times that unpacked), which this
          # job never uses and which, with the erp-temporal build and the
          # renders, filled the runner's disk and killed it without a log
          # (runs 39597088469). It builds four tools and two binaries cold.
          cache: false
      - name: Install Helm, kubeconform, Kyverno, zot, syft, promtool, cosign, crane and conftest (pinned)
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p bin
          fetch() { curl -sSfL -o "$1" "$2"; echo "$3  $1" | sha256sum -c -; }
          fetch helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" "$HELM_SHA256"
          tar -xzf helm.tgz --strip-components=1 -C bin linux-amd64/helm
          fetch kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" "$KUBECONFORM_SHA256"
          tar -xzf kubeconform.tgz -C bin kubeconform
          fetch kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz" "$KYVERNO_SHA256"
          tar -xzf kyverno.tgz -C bin kyverno
          fetch bin/zot "https://github.com/project-zot/zot/releases/download/v${ZOT_VERSION}/zot-linux-amd64-minimal" "$ZOT_SHA256"
          chmod +x bin/zot
          fetch syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" "$SYFT_SHA256"
          tar -xzf syft.tgz -C bin syft
          fetch prometheus.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz" "$PROMTOOL_SHA256"
          tar -xzf prometheus.tgz --strip-components=1 -C bin "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool"
          # The cosign the release signs with (ADR-0032).
          GOBIN="$RUNNER_TEMP/bin" go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.1
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
          GOBIN="$RUNNER_TEMP/bin" go install github.com/open-policy-agent/conftest@v0.71.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Helm and admission checks
        # Disk and memory before and after, so a runner that dies in the
        # step leaves what it had in the log of the steps before it.
        run: |
          df -h / "$RUNNER_TEMP" && free -m
          ./scripts/helm-checks.sh
          df -h / "$RUNNER_TEMP" && free -m
      - name: Mirroring of the upstream images
        run: ./scripts/test-mirror-images.sh
      - name: NATS authorization by SPIFFE identity
        run: ./scripts/nats-checks.sh

  # The workflow engine's module (temporal/, ADR-0035), which the
  # repository's CI does not reach: vet, lint, -race tests and 100%
  # coverage, its schema tests on a PostgreSQL of the cell's version.
  temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: temporal/go.mod
          cache-dependency-path: temporal/go.sum
      - name: Install golangci-lint (pinned)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: erp-temporal checks
        run: GOLANGCI=golangci-lint ./scripts/temporal-checks.sh
