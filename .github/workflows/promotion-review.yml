name: promotion-review

# A review of a production promotion is judged by the promotion workflow's
# approvals job (ADR-0035, T40d4), which runs as pull_request_target and so
# not on a review. This re-runs that job alone, of the run for the reviewed
# head, so an approval, a change request or a dismissal is judged again by
# BASE's checks; it judges nothing itself (scripts/merge-pr.sh judges the
# approvals again at merge). A review of any other pull request finds no
# such job and ends in seconds; a comment starts nothing.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  rerun:
    if: github.event.action == 'dismissed' || github.event.review.state != 'commented'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write # re-run the promotion workflow's approvals job
    steps:
      - name: Judge the promotion again
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run="$(gh run list -R "$REPO" --workflow promotion.yml --event pull_request_target \
            --commit "$HEAD_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          job=""
          if [ -n "$run" ]; then
            job="$(gh run view "$run" -R "$REPO" --json jobs --jq '.jobs[] | select(.name == "approvals") | .databaseId')"
          fi
          if [ -n "$job" ]; then
            gh run rerun -R "$REPO" --job "$job"
          else
            echo "promotion-review: no approvals job for $HEAD_SHA"
          fi
