name: weekly

on:
  schedule:
    - cron: "15 2 * * 0" # Sundays
  workflow_dispatch:
    inputs:
      soak:
        description: Soak duration
        default: 2h
      jobs:
        description: Which jobs to run
        type: choice
        options: [all, images, release, shuffle, nfr, dr]
        default: all

# Weekly, and on demand before a release (06 §6.5): about four hours of
# runner time, which every night cost more than CI on every pull request.
# The load and soak suites of 05-scalability §5.8 at length, and longer
# fuzzing. Budgets are 01-requirements §1.3; the runner is far smaller than
# a cell (about 110 requests/s against a laptop's 500 and a cell's 2,000),
# so the budgets are scaled by ERP_BUDGET_SCALE: the run validates the
# suite, the consistency checks and trends, and fails on a regression, not
# on the machine. The budgets at scale 1 are checked in a cell-sized
# environment (05 §5.1, the first scalability gate).
#
# The shuffle job runs the whole suite three times in a random order, so a
# test that depends on another's leftovers (a package variable, a row, a
# hook) fails here rather than at random in CI. A failure prints the seed;
# `go test -shuffle=<seed>` replays that order.
jobs:
  images:
    # Vulnerabilities are disclosed after a commit passed CI, and the base
    # image moves under its tag: rescan main's images every week, and fail
    # when the pinned distroless digest is no longer the tag's (ADR-0032).
    # The reproducibility gate and the signing round trip, which pull
    # requests run only when their inputs change, run here regardless.
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'images'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      registry:
        image: registry:2.8.3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Free disk for the image builds
        run: ./scripts/free-disk.sh
      - name: Container images, built twice and compared
        run: |
          make images-reproducible
          df -h / | tail -1
      - name: Image scan
        run: |
          make image-scan
          df -h / | tail -1
      - name: Signing round trip
        if: success() || failure()
        run: |
          make signing-roundtrip SIGNING_REGISTRY=localhost:5000/erp
          df -h / | tail -1
      - name: Go vulnerabilities, standard library included
        # ko's SBOM lists the modules but not the standard library, where
        # most Go advisories are; govulncheck covers both, in the code that
        # is called.
        if: success() || failure()
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... # the version scripts/ci-tools.sh pins
      - name: Base image still current
        # Distroless is rebuilt often: this step goes red whenever the tag
        # moves, which asks for a reviewed digest bump, not a fix.
        if: success() || failure()
        run: ./scripts/base-image-current.sh

  release-scripts:
    # The version rules and the changelog (scripts/test-release-scripts.sh),
    # which pull requests run only when those scripts change.
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_CLIFF_VERSION: 2.14.2
      GIT_CLIFF_SHA512: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
    steps:
      - uses: actions/checkout@v7
      - name: Install git-cliff
        run: |
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${GIT_CLIFF_SHA512}  ${archive}" | sha512sum -c -
          tar xzf "${archive}"
          echo "GIT_CLIFF=$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" >> "$GITHUB_ENV"
      - name: Version rules and changelog
        run: ./scripts/test-release-scripts.sh

  dr:
    # The restore drill of ADR-0040 in Docker (scripts/restore-drill.sh,
    # local): a base backup and the WAL archive restored to a point in time,
    # verified by erp-server dr verify. On demand only; staging's drills on
    # AWS are the ones the promotion checks count. The run's record stays
    # in the runner: a local run does not count.
    if: inputs.jobs == 'dr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Restore drill (local)
        run: make restore-drill RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  shuffle:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'shuffle'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install the Temporal CLI
        # As in ci.yml: the workflow tests start its development server.
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Raise the database connection limit
        # As in ci.yml and the nfr job below.
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart $(docker ps -q --filter ancestor=postgres:17)
          for i in $(seq 1 60); do
            PGPASSWORD=dev psql -h localhost -U postgres -tAc "SHOW max_connections" 2>/dev/null | grep -qx 300 && exit 0
            sleep 1
          done
          echo "the database did not come back with max_connections = 300" >&2; exit 1
      - name: Tests in a random order, three times
        # Three race runs triple each package binary's time; go test's default
        # 10 minutes per binary would stop the slowest (workflows, nfr) early.
        run: go test -race -shuffle=on -count=3 -timeout 45m ./...

  nfr:
    if: github.event_name == 'schedule' || inputs.jobs == 'all' || inputs.jobs == 'nfr'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
      ERP_LOAD_USERS: 16
      ERP_BUDGET_SCALE: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Raise the database connection limit
        # The service container keeps PostgreSQL's default of 100 connections; the
        # suites run packages in parallel, each with its own pool, and have hit
        # "too many clients already" on the runner. 300 matches the local setup.
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart $(docker ps -q --filter ancestor=postgres:17)
          for i in $(seq 1 60); do
            PGPASSWORD=dev psql -h localhost -U postgres -tAc "SHOW max_connections" 2>/dev/null | grep -qx 300 && exit 0
            sleep 1
          done
          echo "the database did not come back with max_connections = 300" >&2; exit 1
      - name: Load (2 minutes)
        run: make load ERP_LOAD_DURATION=2m
      - name: Resilience
        run: make resilience
      - name: Database failover
        run: make failover
      - name: Soak
        run: make soak ERP_SOAK_DURATION=${{ github.event.inputs.soak || '2h' }} ERP_SOAK_WINDOW=1m
      - name: Fuzz (5 minutes per target)
        run: make fuzz FUZZTIME=5m
