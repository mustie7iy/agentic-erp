name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes a running check obsolete: on a pull request its
# previous commit, on main the merges before it, whose changes the newer
# run's tree contains. Cancel it, so merges in quick succession pay for one
# full run (06 §6.5).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Always runs: the secret scan, and whether the jobs below have to run
    # (scripts/ci-changes.sh, 06 §6.5): they are skipped for documentation
    # alone. A skipped job counts as passed for a required check.
    # No Go and no tool builds here: it gates everything, so it stays a
    # minute long. gitleaks comes as its released binary, checked by hash.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the last green run on main, which a push is compared with
    outputs:
      run: ${{ steps.decide.outputs.run }}
      images: ${{ steps.decide.outputs.images }}
      release: ${{ steps.decide.outputs.release }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the comparisons and the secret scan read the commit range
      - name: Install gitleaks (pinned)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p bin && tar xzf "${archive}" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scanning
        # The scanner itself rather than gitleaks-action, whose v3 demands a
        # license whenever it cannot look the account up. Pushes scan the
        # commits they bring, pull requests theirs; .gitleaks.toml applies.
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range="${BASE:-$BEFORE}..HEAD"
          if [ -z "${BASE}${BEFORE}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="HEAD~1..HEAD"; fi
          gitleaks git --redact --no-banner --log-opts="--no-merges $range" .
      - name: The skip rules' own tests
        # Seconds: the decision below is only as good as these.
        run: ./scripts/test-ci-changes.sh
      - name: Does the suite have to run?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        # bash with pipefail, so a failing script fails the step rather than
        # tee hiding it; the gates below also run on anything but "false".
        shell: bash
        run: ./scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  signing:
    # The signing round trip of ADR-0032 against a registry made for the
    # job: images pushed, signed and attested (SBOM, provenance) with a key
    # pair made for the run, standing in for the release KMS key; verified;
    # and refused with another key, another commit, a tag or no signature.
    # On main, when its inputs changed; the weekly run does it regardless.
    # A pull request's author ran it locally (scripts/ci-local.sh).
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.images != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # two image builds, erp-analytics's compiling api/gen with cgo
    services:
      registry:
        image: registry:2.8.3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Free disk for the image build
        run: ./scripts/free-disk.sh
      - name: A buildx builder that exports OCI archives (erp-analytics)
        run: docker buildx create --use --name erp-images --driver docker-container
      - name: Signing round trip
        # One platform, to fit the runner: building both on main had the
        # runner shut down mid-build on every push (2026-10-20). The weekly
        # run signs and verifies both platforms and their indexes.
        env:
          KO_PLATFORMS: linux/amd64
        run: |
          make signing-roundtrip SIGNING_REGISTRY=localhost:5000/erp
          df -h / | tail -1

  release-scripts:
    # The version rules and the changelog of ADR-0032 on throwaway
    # repositories (scripts/test-release-scripts.sh), with the git-cliff the
    # release workflow installs. On main, when those scripts changed; a
    # pull request's author ran them locally (scripts/ci-local.sh).
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.release != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_CLIFF_VERSION: 2.14.2
      GIT_CLIFF_SHA512: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
    steps:
      - uses: actions/checkout@v7
      - name: Install git-cliff
        run: |
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP" # outside the checkout, as the release workflow does
          curl -sSfLO "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${GIT_CLIFF_SHA512}  ${archive}" | sha512sum -c -
          tar xzf "${archive}"
          echo "GIT_CLIFF=$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" >> "$GITHUB_ENV"
      - name: Version rules and changelog
        run: ./scripts/test-release-scripts.sh

  short:
    # The light pull-request check (06 §6.5, since 2026-10-21): the full
    # gates ran once, on the author's machine (scripts/ci-local.sh), for
    # exactly this tree, which scripts/merge-pr.sh requires; this job
    # checks the cheap guards on a clean runner: format, vet, the whole
    # tree lint, the generated code, the contract lint and breaking-change
    # check, the build and the suite in short mode without the race
    # detector, within ten minutes. main runs the full suite again (test).
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 10 warm; building the tools on a cache miss adds about 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the breaking-change check reads main
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: CI tools (pinned, cached)
        # The test job's cache on main, restored: a pull request builds them
        # only when it changes scripts/ci-tools.sh.
        id: tools
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/ci-tools/bin
          key: ci-tools-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('scripts/ci-tools.sh') }}
      - name: Free disk before building the tools
        # Building them (grype alone fetches hundreds of modules) left the
        # suite's link step without space on #42.
        if: steps.tools.outputs.cache-hit != 'true'
        run: ./scripts/free-disk.sh
      - name: Install CI tools
        run: ./scripts/ci-tools.sh >> "$GITHUB_PATH"
      - name: Install the Temporal CLI
        # The workflow tests start its development server (ADR-0012).
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Raise the database connection limit
        # As in the test job: the suites' parallel pools exceed the default 100.
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart $(docker ps -q --filter ancestor=postgres:17)
          for i in $(seq 1 60); do
            PGPASSWORD=dev psql -h localhost -U postgres -tAc "SHOW max_connections" 2>/dev/null | grep -qx 300 && exit 0
            sleep 1
          done
          echo "the database did not come back with max_connections = 300" >&2; exit 1
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Structural lint of the whole tree (.golangci.yml, CLAUDE.md)
        run: make lint-all GOLANGCI=golangci-lint
      - name: Generated code matches its sources (the contract, the templ components)
        run: |
          make generate
          git diff --exit-code -- api/gen internal/web || (echo "api/gen or internal/web is stale: run make generate" && exit 1)
          test -z "$(git status --porcelain -- api/gen internal/web)" || (git status --porcelain -- api/gen internal/web && echo "make generate made files that are not committed" && exit 1)
      - name: API contract lint
        run: vacuum lint -r api/vacuum-ruleset.yaml -b -q -d api/openapi.yaml api/control.yaml api/directory.yaml api/model.yaml
      - name: API breaking-change check against main
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          for spec in openapi control directory; do
            if git cat-file -e "FETCH_HEAD:api/$spec.yaml" 2>/dev/null; then
              git show "FETCH_HEAD:api/$spec.yaml" > "/tmp/base-$spec.yaml"
              oasdiff breaking --fail-on ERR --deprecation-days-stable=365 --err-ignore api/breaking-accepted.txt "/tmp/base-$spec.yaml" "api/$spec.yaml"
            fi
          done
          # Events change only additively within a .vN (ADR-0041).
          if git cat-file -e "FETCH_HEAD:api/asyncapi.yaml" 2>/dev/null; then
            git show "FETCH_HEAD:api/asyncapi.yaml" > /tmp/base-asyncapi.yaml
            go run ./cmd/eventcompat /tmp/base-asyncapi.yaml api/asyncapi.yaml
          fi
      - name: Build
        run: make build
      - name: Tests in short mode (without the race detector)
        # Short mode leaves out the performance budgets; main runs them.
        run: go test -short -count=1 ./...

  test:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.run != 'false'
    # The full suite on main (06 §6.5), the second line after the author's
    # local gates: the static checks, the race detector, the performance
    # budgets, the coverage gate and the images, on the tree main really
    # holds, about 35 minutes warm; the first run after a tool change also
    # builds the pinned tools (about 10 minutes) before the cache has them.
    # A pull request runs the short job above instead.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the breaking-change check reads main
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Free disk before the tools and the suite
        # Building the CI tools on a cache miss (grype alone fetches hundreds
        # of modules) left the suite's link step without space on #42; the
        # unused toolchains go first, before anything is built.
        run: ./scripts/free-disk.sh
      - name: CI tools (pinned, cached)
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/ci-tools/bin
          key: ci-tools-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('scripts/ci-tools.sh') }}
      - name: Install CI tools
        run: ./scripts/ci-tools.sh >> "$GITHUB_PATH"
      - name: Install the Temporal CLI
        # The workflow engine's development server (ADR-0012): tests start it
        # headless on a free port when the CLI is on the path.
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Raise the database connection limit
        # The service container keeps PostgreSQL's default of 100 connections; the
        # suites run packages in parallel, each with its own pool, and have hit
        # "too many clients already" on the runner. 300 matches the local setup.
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart $(docker ps -q --filter ancestor=postgres:17)
          for i in $(seq 1 60); do
            PGPASSWORD=dev psql -h localhost -U postgres -tAc "SHOW max_connections" 2>/dev/null | grep -qx 300 && exit 0
            sleep 1
          done
          echo "the database did not come back with max_connections = 300" >&2; exit 1
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Structural lint of the whole tree (.golangci.yml, CLAUDE.md)
        # The refactoring recorded in docs/refactoring-progress.md brought every linter
        # to zero across the tree, so the whole tree is held to the rules, not
        # only the code a push changes. api/gen is left out as the Makefile does.
        run: make lint-all GOLANGCI=golangci-lint
      - name: Static analysis
        run: staticcheck ./...
      - name: Vulnerabilities
        run: govulncheck ./...
      - name: Static security analysis
        # Excluded by decision (docs/design/06-engineering-process.md): G104 (errors ignored on purpose carry a comment),
        # G115 (integer conversions of bounded domain values), G304 and G107 (paths and URLs come from settings and flags by design).
        run: gosec -quiet -exclude=G104,G115,G304,G107 -exclude-dir=api/gen ./...
      - name: Generated code matches its sources (the contract, the templ components)
        run: |
          make generate
          git diff --exit-code -- api/gen internal/web || (echo "api/gen or internal/web is stale: run make generate" && exit 1)
          test -z "$(git status --porcelain -- api/gen internal/web)" || (git status --porcelain -- api/gen internal/web && echo "make generate made files that are not committed" && exit 1)
      - name: API contract lint
        run: vacuum lint -r api/vacuum-ruleset.yaml -b -q -d api/openapi.yaml api/control.yaml api/directory.yaml api/model.yaml
      - name: Schema tests (migrations and database-enforced rules)
        run: go test -count=1 -v ./db
      - name: Functional and non-functional tests (race detector)
        # The web workspace's end-to-end suite drives the runner's Chrome
        # (internal/web/e2e, ADR-0052): it fails rather than skips without one.
        env:
          ERP_E2E_REQUIRE_BROWSER: "true"
        # -timeout 30m as in weekly.yml and ci-local: cmd/erp's walkthrough
        # (TestWalkthrough) builds the binaries and tells the whole story.
        # The race build shares nothing with the plain build cache above; drop
        # it first so the runner's disk (72 GB, most of it taken by the image)
        # holds the race build and later the instrumented coverage build.
        run: |
          go clean -cache
          df -h / | tail -1
          go test -race -count=1 -timeout 30m ./...
      - name: Performance budgets (without the race detector)
        # The runner is about twice as slow as a laptop on these; the scaled
        # budgets still catch a regression (ERP_BUDGET_SCALE, docs/testing.md).
        env:
          ERP_BUDGET_SCALE: 2
        run: |
          go test -count=1 -run Budget -v ./internal/ledger
          go test -count=1 -run Perf -v ./internal/nfr
      - name: Coverage gate
        # The race build above and the instrumented build here share nothing,
        # so the race cache is dropped first; the runner's disk ran out once.
        run: |
          go clean -cache
          df -h / | tail -1
          ./scripts/coverage.sh
          df -h / | tail -1
      - name: Build
        run: make build
      - name: Free disk for the image builds
        # The suite leaves about 8 GB of the 72 GB disk; two clean
        # multi-platform builds need more (run 39031819702 died of it). The
        # Go caches the tests filled are no longer needed either.
        run: |
          go clean -cache
          ./scripts/free-disk.sh
      - name: Image scripts, with fake tools
        run: ./scripts/test-images.sh
      - name: A buildx builder that exports OCI archives (erp-analytics)
        # For the single build below (make images); the double build makes
        # builders of its own.
        run: docker buildx create --use --name erp-images --driver docker-container
      - name: Container images, built twice and compared (ADR-0032)
        # ko builds the four images (.ko.yaml) and buildx erp-analytics
        # (cgo, ADR-0044) twice, each time with empty Go and ko caches and a
        # buildx builder of its own, and fails unless every digest matches:
        # an image that cannot be rebuilt bit for bit from its commit cannot
        # be checked against it. Nothing is pushed here; T39c's release
        # workflow pushes and signs. Only when the image inputs changed (the
        # weekly run does it regardless); otherwise one build for the scan.
        # Both platforms, as .ko.yaml lists them; a pull request's author
        # built linux/amd64 (scripts/ci-local.sh).
        env:
          IMAGES_CHANGED: ${{ needs.changes.outputs.images }}
        run: |
          if [ "$IMAGES_CHANGED" != false ]; then
            make images-reproducible
          else
            make images
          fi
          df -h / | tail -1
      - name: Image scan
        # grype on each image's SBOM and on the pinned base image, failing on
        # a high or critical vulnerability that has a fix (.grype.yaml lists
        # accepted exceptions with their expiry).
        run: |
          make image-scan
          df -h / | tail -1

  fuzz:
    # On main, whenever code changed. A pull request's tests already run
    # every target's seed corpus, its author fuzzed 30 s per target locally
    # (scripts/ci-local.sh), and the weekly run fuzzes 5 minutes per target.
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.run != 'false'
    # No database: the fuzz targets are parsers (money, config, analytics,
    # bankfile, sap), and a package's database tests skip without one.
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 8 targets of 30 s each, run twice at most, and their builds
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz (30s per target)
        run: make fuzz FUZZTIME=30s

  ci-ok:
    # The one check branch protection requires. A job skipped by an `if`
    # reports success, so requiring the jobs themselves would let a failed
    # `changes` (a leaked secret, a broken skip rule) skip the suite and
    # pass: this job fails unless `changes` succeeded and nothing it gates
    # failed or was cancelled.
    # On a pull request it aggregates the light jobs (changes, short), the
    # others skipped; on main, the full ones.
    needs: [changes, short, test, fuzz, signing, release-scripts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was rightly skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.changes.result == "success"
            and ([.[] | .result] | all(. == "success" or . == "skipped"))' >/dev/null
