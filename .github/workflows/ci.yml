name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Functional and non-functional tests (race detector)
        run: go test -race -count=1 ./...
      - name: Coverage gate
        run: ./scripts/coverage.sh
      - name: Fuzz (30s per target)
        run: make fuzz FUZZTIME=30s
      - name: Build
        run: go build -o bin/erp ./cmd/erp
