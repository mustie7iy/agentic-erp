name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The full run is started by hand, not on every push (PO 2026-10-26) nor
  # nightly (PO 2026-10-27): the coordinator starts it on main after each
  # batch of merges, and on any branch a change to the full jobs is tried
  # before it reaches main (2026-10-25, main's suite stopped by the runner).
  # It runs the race, coverage and fuzz jobs a pull request runs, and the
  # test job: the static checks, the budgets and the images.
  workflow_dispatch:

# A newer run of the same event and ref makes a running one obsolete: on a
# pull request its previous commit, on main the merges before it, whose
# changes the newer run's tree contains. Cancel it, so merges in quick
# succession pay for one run (06 §6.5).
# A manual run is the exception: it is never cancelled by a newer one. A
# second one waits in the group until the first has finished, and a third
# replaces the one waiting, never the one running. On 2026-11-11 a new
# full run on main cancelled the one in progress two hours in, whose
# result nobody then had, and its ci-ok read as failed.
concurrency:
  # The event is in the group, so a push and a dispatch on main do not
  # cancel each other's runs.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  changes:
    # Always runs: the secret scan, and whether the jobs below have to run
    # (scripts/ci-changes.sh, 06 §6.5): they are skipped for documentation
    # alone. A skipped job counts as passed for a required check.
    # No Go and no tool builds here: it gates everything, so it stays a
    # minute long. gitleaks comes as its released binary, checked by hash.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # main's runs: a push's last green one
    outputs:
      run: ${{ steps.decide.outputs.run }}
      images: ${{ steps.decide.outputs.images }}
      release: ${{ steps.decide.outputs.release }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the comparisons and the secret scan read the commit range
      - name: Install gitleaks (pinned)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p bin && tar xzf "${archive}" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scanning
        # The scanner itself rather than gitleaks-action, whose v3 demands a
        # license whenever it cannot look the account up. Pushes scan the
        # commits they bring, pull requests theirs; .gitleaks.toml applies.
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range="${BASE:-$BEFORE}..HEAD"
          if [ -z "${BASE}${BEFORE}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="HEAD~1..HEAD"; fi
          gitleaks git --redact --no-banner --log-opts="--no-merges $range" .
      - name: The skip rules' own tests, and those of the other scripts the gates stand on
        # Seconds: the decision below is only as good as these. The second
        # holds that the static checks reach every Go module (06 §6.5); the
        # third that a script stopped by an unbound variable never exits 0
        # (scripts/lib/on-exit.sh); then the shard plan (no package or test
        # left out), the coverage gate over the shards' profiles, the budget
        # tests' time limit and the merge rules.
        run: |
          ./scripts/test-ci-changes.sh
          ./scripts/test-each-module.sh
          ./scripts/test-on-exit.sh
          ./scripts/test-ci-shards.sh
          ./scripts/test-coverage-gate.sh
          ./scripts/test-budget-times.sh
          ./scripts/test-merge-pr.sh
      - name: Does the suite have to run?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        # bash with pipefail, so a failing script fails the step rather than
        # tee hiding it; the gates below that read it also run on anything
        # but "false".
        shell: bash
        run: ./scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  signing:
    # The signing round trip of ADR-0032 against a registry made for the
    # job: images pushed, signed and attested (SBOM, provenance) with a key
    # pair made for the run, standing in for the release KMS key; verified;
    # and refused with another key, another commit, a tag or no signature.
    # On a push to main, when its inputs changed; the manual and weekly runs
    # do it regardless.
    # A pull request's author ran it locally (scripts/ci-local.sh).
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.images != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # two image builds, erp-analytics's compiling api/gen with cgo
    services:
      registry:
        image: registry:2.8.3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Free disk for the image build
        run: ./scripts/free-disk.sh
      - name: A buildx builder that exports OCI archives (erp-analytics)
        run: docker buildx create --use --name erp-images --driver docker-container
      - name: Signing round trip
        # One platform, to fit the runner: building both on main had the
        # runner shut down mid-build on every push (2026-10-20). The weekly
        # run signs and verifies both platforms and their indexes.
        env:
          KO_PLATFORMS: linux/amd64
        run: |
          make signing-roundtrip SIGNING_REGISTRY=localhost:5000/erp
          df -h / | tail -1

  release-scripts:
    # The version rules and the changelog of ADR-0032 on throwaway
    # repositories (scripts/test-release-scripts.sh), with the git-cliff the
    # release workflow installs. On a push to main, when those scripts
    # changed, and on every manual run; a pull request's author
    # ran them locally (scripts/ci-local.sh).
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.release != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_CLIFF_VERSION: 2.14.2
      GIT_CLIFF_SHA512: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
    steps:
      - uses: actions/checkout@v7
      - name: Install git-cliff
        run: |
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP" # outside the checkout, as the release workflow does
          curl -sSfLO "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${GIT_CLIFF_SHA512}  ${archive}" | sha512sum -c -
          tar xzf "${archive}"
          echo "GIT_CLIFF=$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" >> "$GITHUB_ENV"
      - name: Version rules and changelog
        run: ./scripts/test-release-scripts.sh

  short:
    # The pull request's static half (06 §6.5): the cheap guards on a clean
    # runner: format, vet, the whole tree lint, the generated code, the
    # contract lint and breaking-change check, the build and the suite in
    # short mode without the race detector. The race, coverage and fuzz
    # jobs below run beside it (PO 2026-11-10); the staticcheck, gosec and
    # govulncheck passes, the budgets and the images ran on the author's
    # machine (scripts/ci-local.sh), for exactly this tree, which
    # scripts/merge-pr.sh requires. A manual run on main after each batch
    # of merges runs the test job instead.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # about 10 warm; a cold run (tools rebuilt after ci-tools.sh changes, cold build cache) took over 30 on #49; the tools are saved to the cache as soon as they are built, so a job that fails or times out later still leaves them for the retry
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the breaking-change check reads main
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: CI tools (pinned, cached)
        # The test job's cache, restored: a pull request builds them when
        # it changes scripts/ci-tools.sh, and every pull request does after
        # such a change merges until the next manual run on main saves them
        # again.
        id: tools
        uses: actions/cache/restore@v5.1.0
        with:
          path: ~/.cache/ci-tools/bin
          key: ci-tools-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('scripts/ci-tools.sh') }}
      - name: Free disk before building the tools
        # Building them (grype alone fetches hundreds of modules) left the
        # suite's link step without space on #42.
        if: steps.tools.outputs.cache-hit != 'true'
        run: ./scripts/free-disk.sh
      - name: Install CI tools
        run: ./scripts/ci-tools.sh >> "$GITHUB_PATH"
      - name: Save the CI tools to the cache
        # Saved here, not in actions/cache's post step, which runs only when
        # the whole job succeeds (see the test job below).
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.1.0
        with:
          path: ~/.cache/ci-tools/bin
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Install the Temporal CLI
        # The workflow tests start its development server (ADR-0012).
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Raise the database connection limit
        # As in the test job: the suites' parallel pools exceed the default 100.
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart $(docker ps -q --filter ancestor=postgres:17)
          for i in $(seq 1 60); do
            PGPASSWORD=dev psql -h localhost -U postgres -tAc "SHOW max_connections" 2>/dev/null | grep -qx 300 && exit 0
            sleep 1
          done
          echo "the database did not come back with max_connections = 300" >&2; exit 1
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Structural lint of the whole tree (.golangci.yml, CLAUDE.md)
        run: make lint-all GOLANGCI=golangci-lint
      - name: Generated code matches its sources (the contract, the templ components)
        run: |
          make generate
          git diff --exit-code -- api/gen internal/web || (echo "api/gen or internal/web is stale: run make generate" && exit 1)
          test -z "$(git status --porcelain -- api/gen internal/web)" || (git status --porcelain -- api/gen internal/web && echo "make generate made files that are not committed" && exit 1)
      - name: API contract lint
        run: vacuum lint -r api/vacuum-ruleset.yaml -b -q -d api/openapi.yaml api/control.yaml api/directory.yaml api/model.yaml
      - name: API breaking-change check against main
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          for spec in openapi control directory; do
            if git cat-file -e "FETCH_HEAD:api/$spec.yaml" 2>/dev/null; then
              git show "FETCH_HEAD:api/$spec.yaml" > "/tmp/base-$spec.yaml"
              oasdiff breaking --fail-on ERR --deprecation-days-stable=365 --err-ignore api/breaking-accepted.txt "/tmp/base-$spec.yaml" "api/$spec.yaml"
            fi
          done
          # Events change only additively within a .vN (ADR-0041).
          if git cat-file -e "FETCH_HEAD:api/asyncapi.yaml" 2>/dev/null; then
            git show "FETCH_HEAD:api/asyncapi.yaml" > /tmp/base-asyncapi.yaml
            go run ./cmd/eventcompat /tmp/base-asyncapi.yaml api/asyncapi.yaml
          fi
          # No value leaves an open enumeration (x-extensible-enum), which
          # oasdiff does not read (ci:batch65), unless the accepted list
          # carries the removal under its reason.
          for spec in openapi control directory asyncapi; do
            if [ -f "/tmp/base-$spec.yaml" ]; then
              go run ./cmd/enumcompat api/breaking-accepted.txt "/tmp/base-$spec.yaml" "api/$spec.yaml"
            fi
          done
      - name: Build
        run: make build
      - name: Tests in short mode (without the race detector)
        # Short mode leaves out the performance budgets, which the author
        # ran (scripts/ci-local.sh) and main's manual run runs.
        run: go test -short -count=1 ./...

  test:
    needs: changes
    # On demand only (PO 2026-10-26, 2026-10-27): the coordinator starts it
    # on main after each batch of merges. A push to main runs the other
    # jobs, and its ci-ok passes with this one skipped; a manual run is red
    # when this one fails, and while the latest one on main is red nothing
    # merges but the fix forward (06 §6.5). A manual run never skips it
    # (scripts/ci-changes.sh), so the documentation rule is not consulted.
    if: github.event_name == 'workflow_dispatch'
    # The full run on main (06 §6.5), the second line after the author's
    # local gates, on the tree main really holds: here the static checks,
    # the schema tests, the performance budgets and the images; the race
    # suite and the coverage gate are the race and coverage jobs below, in
    # parallel shards, as on a pull request (PO 2026-11-10). The first run
    # after a tool change also builds the pinned tools (14 minutes in run
    # 40334507190) before the cache has them.
    runs-on: ubuntu-latest
    # Run 43072109681 (2026-11-11, 4 CPUs, 16 GB) took 170 minutes with the
    # race suite (75) and the coverage gate (26) in this job; without them
    # about 70: the static checks 17, the budgets 15, the images built
    # twice 35 and their scan. 150 leaves room for a cold tools cache and a
    # slow runner in a run nobody is watching.
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the breaking-change check reads main
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Free disk before the tools and the suite
        # Building the CI tools on a cache miss (grype alone fetches hundreds
        # of modules) left the suite's link step without space on #42; the
        # unused toolchains go first, before anything is built.
        run: ./scripts/free-disk.sh
      - name: CI tools (pinned, cached)
        id: tools
        uses: actions/cache/restore@v5.1.0
        with:
          path: ~/.cache/ci-tools/bin
          key: ci-tools-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('scripts/ci-tools.sh') }}
      - name: Install CI tools
        run: ./scripts/ci-tools.sh >> "$GITHUB_PATH"
      - name: Save the CI tools to the cache
        # Saved as soon as they are built. actions/cache saves only in its
        # post step, which does not run when the job fails or is cancelled:
        # run 40334507190 (2026-10-26) was cancelled at the time limit, so
        # the 14 minutes of tools it built were lost, as on every run of
        # main since 2026-10-21.
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.1.0
        with:
          path: ~/.cache/ci-tools/bin
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Install the Temporal CLI
        # The workflow engine's development server (ADR-0012): tests start it
        # headless on a free port when the CLI is on the path.
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Raise the database connection limit
        # The service container keeps PostgreSQL's default of 100 connections; the
        # suites run packages in parallel, each with its own pool, and have hit
        # "too many clients already" on the runner. 300 matches the local setup.
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart $(docker ps -q --filter ancestor=postgres:17)
          for i in $(seq 1 60); do
            PGPASSWORD=dev psql -h localhost -U postgres -tAc "SHOW max_connections" 2>/dev/null | grep -qx 300 && exit 0
            sleep 1
          done
          echo "the database did not come back with max_connections = 300" >&2; exit 1
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Structural lint of the whole tree (.golangci.yml, CLAUDE.md)
        # The refactoring recorded in docs/refactoring-progress.md brought every linter
        # to zero across the tree, so the whole tree is held to the rules, not
        # only the code a push changes. api/gen is left out as the Makefile does.
        run: make lint-all GOLANGCI=golangci-lint
      - name: Static analysis
        run: ./scripts/each-module.sh staticcheck ./...
      - name: Vulnerabilities
        # In every module: from the root alone, ./... skips temporal/.
        run: ./scripts/each-module.sh govulncheck ./...
      - name: Static security analysis
        # Excluded by decision (docs/design/06-engineering-process.md): G104 (errors ignored on purpose carry a comment),
        # G115 (integer conversions of bounded domain values), G304 and G107 (paths and URLs come from settings and flags by design).
        run: ./scripts/each-module.sh gosec -quiet -exclude=G104,G115,G304,G107 -exclude-dir=api/gen ./...
      - name: Generated code matches its sources (the contract, the templ components)
        run: |
          make generate
          git diff --exit-code -- api/gen internal/web || (echo "api/gen or internal/web is stale: run make generate" && exit 1)
          test -z "$(git status --porcelain -- api/gen internal/web)" || (git status --porcelain -- api/gen internal/web && echo "make generate made files that are not committed" && exit 1)
      - name: API contract lint
        run: vacuum lint -r api/vacuum-ruleset.yaml -b -q -d api/openapi.yaml api/control.yaml api/directory.yaml api/model.yaml
      - name: Schema tests (migrations and database-enforced rules)
        run: go test -count=1 -v ./db
      - name: Performance budgets (without the race detector)
        # The runner is about twice as slow as a laptop on these; the scaled
        # budgets still catch a regression (ERP_BUDGET_SCALE, docs/testing.md).
        env:
          ERP_BUDGET_SCALE: 2
        # Every package's budget tests (scripts/budgets.sh finds them), and
        # each test's whole time with its seeding (scripts/budget-times.sh).
        run: ./scripts/budgets.sh -v
      - name: Build
        run: make build
      - name: Free disk for the image builds
        # Two clean multi-platform builds need the disk (run 39031819702
        # died of it). The Go caches the checks and the budgets filled are
        # no longer needed either.
        run: |
          go clean -cache
          ./scripts/free-disk.sh
      - name: Image scripts, with fake tools
        run: ./scripts/test-images.sh
      - name: Container images, built twice and compared (ADR-0032)
        # ko builds the four images (.ko.yaml) and erp-temporal (temporal/),
        # and buildx erp-analytics
        # (cgo, ADR-0044) twice, each time with empty Go and ko caches and a
        # buildx builder of its own, and fails unless every digest matches:
        # an image that cannot be rebuilt bit for bit from its commit cannot
        # be checked against it. Nothing is pushed here; T39c's release
        # workflow pushes and signs. Every time: this job runs only on a
        # manual run, which runs everything (scripts/ci-changes.sh), as does
        # weekly.yml's images job, on Sundays and on a dispatch of all or
        # images. Both platforms, as .ko.yaml lists them; a pull request's author
        # built linux/amd64 (scripts/ci-local.sh). ko builds one binary and
        # platform at a time (scripts/images.sh): with two at once, each
        # compiling api/gen cold, the runner was stopped 6 minutes into the
        # first build (runs 40460447291 and 40547406558). Memory and disk are
        # logged every 30 s, as in the race step.
        run: |
          echo "cpus $(nproc)"; free -m
          ( while sleep 30; do
              echo "monitor $(date -u +%T) $(free -m | awk 'NR==2{print "memory used "$3" of "$2" MiB, available "$7}'), $(df -h / | awk 'NR==2{print "disk free "$4}')"
            done ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          make images-reproducible
          df -h / | tail -1
      - name: Image scan
        # grype on each image's SBOM, on the pinned base images and on the
        # upstream images the release copies (deploy/images/upstream.txt),
        # failing on a high or critical vulnerability that has a fix
        # (.grype.yaml lists accepted exceptions with their expiry).
        run: |
          make image-scan
          df -h / | tail -1

  shards:
    # The shards the race suite and the coverage gate run in, computed from
    # the packages go list names (scripts/ci-shards.sh): a pull request and
    # a manual run split the suite over parallel jobs, since one runner
    # needs over an hour for a single race run of it (PO 2026-11-10). The
    # check fails when a package, or a test of a package split by test
    # name, would land in no shard or in two.
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      race: ${{ steps.plan.outputs.race }}
      coverage: ${{ steps.plan.outputs.coverage }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # go list -find reads the module's own directories alone
      - name: Every package and every test of a split package is in exactly one shard
        run: ./scripts/ci-shards.sh check
      - name: The shards
        id: plan
        # bash with pipefail, so a failing script fails the step rather than
        # tee hiding it.
        shell: bash
        run: ./scripts/ci-shards.sh matrix | tee -a "$GITHUB_OUTPUT"

  race:
    # The suite with the race detector, three times in random order (07
    # §7.7), one shard of it per job. Until 2026-11-10 the three runs were
    # the author's (scripts/ci-local.sh, 58 minutes with the machine to
    # itself) and main's manual run did one, 75 minutes in one job; a shard
    # is planned at about 25 minutes (scripts/ci-shards.sh).
    needs: [changes, shards]
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.run != 'false'
    strategy:
      fail-fast: false # every shard's failures in one run
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.race) }}
    runs-on: ubuntu-latest
    # A shard is planned at about 25 minutes with its set-up. Each go test in it (the whole
    # packages together, then each other piece: a part of a split package, a
    # test run alone, or one of the walkthrough's three runs) has -timeout
    # 35m (scripts/ci-shards.sh), so a hung one is named by go test before
    # this limit stops the runner.
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
      # The web workspace's end-to-end suite drives the runner's Chrome
      # (internal/web/e2e, ADR-0052): it fails rather than skips without one.
      ERP_E2E_REQUIRE_BROWSER: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No cache: the race build shares nothing with the plain one, and
          # some twenty jobs of a run would each try to save theirs under
          # the key the other jobs restore.
          cache: false
      - name: Install the Temporal CLI
        # The workflow engine's development server (ADR-0012): tests start it
        # headless on a free port when the CLI is on the path.
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Raise the database connection limit
        # As in the test job: the suites' parallel pools exceed the default 100.
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart $(docker ps -q --filter ancestor=postgres:17)
          for i in $(seq 1 60); do
            PGPASSWORD=dev psql -h localhost -U postgres -tAc "SHOW max_connections" 2>/dev/null | grep -qx 300 && exit 0
            sleep 1
          done
          echo "the database did not come back with max_connections = 300" >&2; exit 1
      - name: Race suite of this shard, three shuffled runs
        # The generated API (api/gen, ~620k lines) is the package that needs
        # the most memory to compile: built alone first, then the shard's
        # packages two at a time (scripts/ci-shards.sh), as the one job did
        # since the runner stopped it on 2026-10-21. Memory and disk are
        # logged every 30 s, so a runner stopped again shows why.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "cpus $(nproc)"; free -m
          ( while sleep 30; do
              echo "monitor $(date -u +%T) $(free -m | awk 'NR==2{print "memory used "$3" of "$2" MiB, available "$7}'), $(df -h / | awk 'NR==2{print "disk free "$4}')"
            done ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          go build -race ./api/gen
          ./scripts/ci-shards.sh run race "$SHARD"

  coverage-shard:
    # The coverage gate's tests, one shard of the packages per job, each
    # instrumented as the whole suite is (scripts/coverage.sh run): a
    # shard's tests cover other shards' code, so the gate is applied to
    # the shards' profiles together, in the coverage job below.
    needs: [changes, shards]
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.run != 'false'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.coverage) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40 # the whole gate took 26 minutes in one job (run 43072109681)
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # as the race job: an instrumented build of its own
      - name: Install the Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Raise the database connection limit
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart $(docker ps -q --filter ancestor=postgres:17)
          for i in $(seq 1 60); do
            PGPASSWORD=dev psql -h localhost -U postgres -tAc "SHOW max_connections" 2>/dev/null | grep -qx 300 && exit 0
            sleep 1
          done
          echo "the database did not come back with max_connections = 300" >&2; exit 1
      - name: Tests of this shard, instrumented
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE_DIR: coverage-profile
        run: ./scripts/ci-shards.sh run coverage "$SHARD"
      - name: Hand the shard's profile to the gate
        # The run's own cache entry, a few megabytes (one line per block),
        # named by the run so that no other run restores it: the workflows
        # pin no artifact action, and the cache action is pinned already.
        # The attempt is in the key because a key is written once: a re-run
        # of a failed shard saves a new entry, and the gate takes the latest.
        uses: actions/cache/save@v5.1.0
        with:
          path: coverage-profile
          key: coverage-${{ github.run_id }}-shard${{ matrix.shard }}-${{ github.run_attempt }}

  coverage:
    # The coverage gate (scripts/coverage.sh gate): 100% of production
    # statements, counted over the shards' profiles together, with the
    # exclusions and the report of the whole-suite run. One restore step
    # per shard, which scripts/ci-shards.sh check holds equal to the plan;
    # a shard whose profile is missing fails its step, and the gate names
    # the profiles from the plan itself (ci-shards.sh gate), so it cannot
    # count fewer shards than the plan has.
    needs: [changes, shards, coverage-shard]
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Profile of shard 1
        uses: actions/cache/restore@v5.1.0
        with:
          path: coverage-profile
          key: coverage-${{ github.run_id }}-shard1-${{ github.run_attempt }}
          restore-keys: coverage-${{ github.run_id }}-shard1-
          fail-on-cache-miss: true
      - name: Profile of shard 2
        uses: actions/cache/restore@v5.1.0
        with:
          path: coverage-profile
          key: coverage-${{ github.run_id }}-shard2-${{ github.run_attempt }}
          restore-keys: coverage-${{ github.run_id }}-shard2-
          fail-on-cache-miss: true
      - name: Profile of shard 3
        uses: actions/cache/restore@v5.1.0
        with:
          path: coverage-profile
          key: coverage-${{ github.run_id }}-shard3-${{ github.run_attempt }}
          restore-keys: coverage-${{ github.run_id }}-shard3-
          fail-on-cache-miss: true
      - name: Profile of shard 4
        uses: actions/cache/restore@v5.1.0
        with:
          path: coverage-profile
          key: coverage-${{ github.run_id }}-shard4-${{ github.run_attempt }}
          restore-keys: coverage-${{ github.run_id }}-shard4-
          fail-on-cache-miss: true
      - name: Coverage gate
        env:
          COVERAGE_DIR: coverage-profile
        run: ./scripts/ci-shards.sh gate

  fuzz:
    # On every event whenever code changed: a pull request (since PO
    # 2026-11-10; until then its author fuzzed locally, scripts/ci-local.sh),
    # a push to main and a manual run. The weekly run fuzzes 5 minutes per
    # target.
    needs: changes
    if: needs.changes.outputs.run != 'false'
    # No database: the fuzz targets are parsers (money, config, analytics,
    # bankfile, sap), and a package's database tests skip without one.
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 19 targets of 30 s each and their builds took 13 minutes on a push (run 43072047720); a target is run twice at most
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz (30s per target)
        run: make fuzz FUZZTIME=30s

  tracker:
    # Every tracker item names its source (07 §7.5). A change to the
    # tracker alone is documentation, which skips the suite, so this job
    # runs on every event: the docs package reads the tracker and the design
    # files and imports the standard library alone, so it needs no module
    # download and stays well under a minute.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Tracker items name their source
        run: go test -count=1 ./docs

  ci-ok:
    # The one check branch protection requires. A job skipped by an `if`
    # reports success, so requiring the jobs themselves would let a failed
    # `changes` (a leaked secret, a broken skip rule) skip the suite and
    # pass: this job fails unless `changes` succeeded and nothing it gates
    # failed or was cancelled.
    # A matrix of shards reports one result: success only when every shard
    # succeeded. And a job that should have run and was skipped fails this
    # one: the jobs of each event are named below, so a shard plan that
    # came out empty, or a condition that went wrong, is not a pass. On a
    # pull request: the shards, race, coverage and fuzz jobs and short; on
    # a manual run: the same and test in place of short; on a push to main:
    # fuzz (signing and release-scripts when their inputs changed, test
    # never: it runs on demand). For documentation alone only changes and
    # tracker run. scripts/merge-pr.sh reads the manual run's list from the
    # workflow_dispatch line below, as it is written, to judge a full run
    # whose ci-ok never ran: keep the line's form.
    needs: [changes, tracker, shards, race, coverage-shard, coverage, short, test, fuzz, signing, release-scripts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was rightly skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          RUN: ${{ needs.changes.outputs.run }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          case "$EVENT:$RUN" in
            *:false) required='["changes","tracker"]' ;;
            pull_request:*) required='["changes","tracker","shards","race","coverage-shard","coverage","fuzz","short"]' ;;
            workflow_dispatch:*) required='["changes","tracker","shards","race","coverage-shard","coverage","fuzz","test"]' ;;
            push:*) required='["changes","tracker","fuzz"]' ;;
            *) echo "an event this job does not know: $EVENT" >&2; exit 1 ;;
          esac
          echo "must have succeeded on $EVENT (run=$RUN): $required"
          echo "$RESULTS" | jq -e --argjson required "$required" '.changes.result == "success" and .tracker.result == "success"
            and ([.[] | .result] | all(. == "success" or . == "skipped"))
            and ([$required[] as $job | .[$job].result] | all(. == "success"))' >/dev/null
