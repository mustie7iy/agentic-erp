name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the pushed commit range, whose base a shallow clone lacks
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install the Temporal CLI
        # The workflow engine's development server (ADR-0012): tests start it
        # headless on a free port when the CLI is on the path.
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Raise the database connection limit
        # The service container keeps PostgreSQL's default of 100 connections; the
        # suites run packages in parallel, each with its own pool, and have hit
        # "too many clients already" on the runner. 300 matches the local setup.
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart $(docker ps -q --filter ancestor=postgres:17)
          for i in $(seq 1 60); do
            PGPASSWORD=dev psql -h localhost -U postgres -tAc "SHOW max_connections" 2>/dev/null | grep -qx 300 && exit 0
            sleep 1
          done
          echo "the database did not come back with max_connections = 300" >&2; exit 1
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Static security analysis
        # Excluded by decision (docs/design/06-engineering-process.md): G104 (errors ignored on purpose carry a comment),
        # G115 (integer conversions of bounded domain values), G304 and G107 (paths and URLs come from settings and flags by design).
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude=G104,G115,G304,G107 -exclude-dir=api/gen ./...
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generated server matches the contract
        run: |
          make generate
          git diff --exit-code -- api/gen || (echo "api/gen is stale: run make generate" && exit 1)
      - name: API contract lint
        run: go run github.com/daveshanley/vacuum@v0.32.0 lint -r api/vacuum-ruleset.yaml -b -q -d api/openapi.yaml api/control.yaml api/directory.yaml
      - name: API breaking-change check against main
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          for spec in openapi control directory; do
            if git cat-file -e "FETCH_HEAD:api/$spec.yaml" 2>/dev/null; then
              git show "FETCH_HEAD:api/$spec.yaml" > "/tmp/base-$spec.yaml"
              go run github.com/oasdiff/oasdiff@latest breaking --fail-on ERR --err-ignore api/breaking-accepted.txt "/tmp/base-$spec.yaml" "api/$spec.yaml"
            fi
          done
      - name: Schema tests (migrations and database-enforced rules)
        run: go test -count=1 -v ./db
      - name: Functional and non-functional tests (race detector)
        # The race build shares nothing with the plain build cache above; drop
        # it first so the runner's disk (72 GB, most of it taken by the image)
        # holds the race build and later the instrumented coverage build.
        run: |
          go clean -cache
          df -h / | tail -1
          go test -race -count=1 ./...
      - name: Performance budgets (without the race detector)
        # The runner is about twice as slow as a laptop on these; the scaled
        # budgets still catch a regression (ERP_BUDGET_SCALE, docs/testing.md).
        env:
          ERP_BUDGET_SCALE: 2
        run: |
          go test -count=1 -run Budget -v ./internal/ledger
          go test -count=1 -run Perf -v ./internal/nfr
      - name: Coverage gate
        # The race build above and the instrumented build here share nothing,
        # so the race cache is dropped first; the runner's disk ran out once.
        run: |
          go clean -cache
          df -h / | tail -1
          ./scripts/coverage.sh
          df -h / | tail -1
      - name: Fuzz (30s per target)
        run: make fuzz FUZZTIME=30s
      - name: Build
        run: go build -o bin/erp ./cmd/erp
