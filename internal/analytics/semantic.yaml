# Governed metric definitions (configuration as code).
#
# Every on-demand report and dashboard is computed from these definitions, so
# "revenue" means the same thing in every answer. This file is the seed: a
# tenant's model is the analytics section of its active configuration
# version, this one until a change request adds it. Owned by Finance; changes
# go through the configuration approval loop as tier 2 changes with a
# simulation of the affected metrics (ADR-0044, T55g).
version: 1

calendar:
  fiscal_year_start_month: 1

# What everyday words mean when a question doesn't name a metric exactly.
defaults:
  sales: revenue
  orders: order_intake
  billing: billed_value
  spend: spend
  profit: operating_profit
  forecast: forecast_lag_7
  variance: variance_lag_7
  accuracy: accuracy_lag_7

dimensions:
  - {name: company, label: Company code}
  - {name: fiscal_year, label: Fiscal year}
  - {name: fiscal_quarter, label: Fiscal quarter, description: "1-4"}
  - {name: fiscal_month, label: Fiscal month, description: "1-12 within the fiscal year"}
  - {name: posting_date, label: Posting date}
  - {name: account, label: G/L account}
  - {name: account_name, label: G/L account name}
  - {name: determination, label: Account determination, description: "The account determination keys that name the account for automatic postings in its company, e.g. cash_discount or fx_gain; none for the others"}
  - {name: document_type, label: Document type, description: "SAP document type, e.g. RE invoice, KZ payment, SA general"}
  - {name: vendor, label: Vendor}
  - {name: vendor_name, label: Vendor name}
  - {name: invoice_status, label: Invoice status, description: "parked, on_hold, posted, rejected"}
  - {name: cost_center, label: Cost center, description: "The cost center's code; empty for an item assigned to none"}
  - {name: contract, label: Contract, description: "The document number of the contract the item's purchase order was made on; empty for spend off contract"}
  - {name: customer, label: Customer, description: "The customer's business partner number"}
  - {name: customer_name, label: Customer name}
  - {name: item_key, label: Item key, description: "The free-text key naming what is sold; empty for an item without one"}
  - {name: currency, label: Currency, description: "The currency of the amounts: a company's house banks may keep other currencies than its own"}
  - {name: value_date, label: Value date, description: "The day a bank statement line's money moved on the account"}
  - {name: house_bank, label: House bank, description: "The company's house bank by its code, never its account"}
  - {name: match, label: Classified by, description: "What classified a bank statement line: payment, posting_rule, incoming, excluded, or unmatched (no decided match yet, its direction's default item)"}
  - {name: liquidity_item, label: Liquidity item, description: "The liquidity item's code; empty for a share of no item"}
  - {name: liquidity_item_name, label: Liquidity item name}
  - {name: flow_source, label: Forecast source, description: "Where a forecast flow came from: in_transit, payment_run, memo, payable, payable_blocked (a supplier blocked for payment), invoice_unposted, down_payment or purchase_order (ADR-0051 §4)"}
  - {name: certainty, label: Certainty, description: "How certain a forecast flow was: actual, confirmed, expected or planned"}
  - {name: lag_days, label: Lag in days, description: "The days from a snapshot's date to the value date it forecast"}
  - {name: blocked, label: Blocked supplier, description: "Whether a forecast flow was owed to a supplier blocked for payment (flow source payable_blocked), which the forecast's totals leave out"}
  - {name: figure, label: Accuracy figure, description: "Which figure of a cell of the forecast's accuracy a row holds: variance (actual less forecast), absolute_variance or absolute_forecast"}

metrics:
  - name: revenue
    label: Revenue
    description: Net sales recognized in the general ledger (credits to revenue accounts, net of reversals). Not the revenue accounts the account determination names for automatic postings, such as cash discounts received and exchange gains, which are other income (see income).
    synonyms: [sales, net sales, turnover]
    type: money
    source: gl_lines
    aggregate: sum
    sign: -1
    filter: {account_type: [revenue], determination: [none]}
    dimensions: [company, fiscal_year, fiscal_quarter, fiscal_month, posting_date, account, account_name, document_type]

  - name: income
    label: Income
    description: Credits to every revenue account in the general ledger, net of reversals - revenue and other income such as cash discounts received and exchange gains.
    synonyms: [total income, revenue and other income]
    type: money
    source: gl_lines
    aggregate: sum
    sign: -1
    filter: {account_type: [revenue]}
    dimensions: [company, fiscal_year, fiscal_quarter, fiscal_month, posting_date, account, account_name, determination, document_type]

  - name: expenses
    label: Operating expenses
    description: Debits to expense accounts in the general ledger.
    synonyms: [costs, opex, expenditure]
    type: money
    source: gl_lines
    aggregate: sum
    sign: 1
    filter: {account_type: [expense]}
    dimensions: [company, fiscal_year, fiscal_quarter, fiscal_month, posting_date, account, account_name, document_type]

  - name: operating_profit
    label: Operating profit
    description: Income (revenue and other income) minus operating expenses.
    synonyms: [profit, operating income]
    type: money
    derived: {op: subtract, left: income, right: expenses}

  - name: operating_margin
    label: Operating margin
    description: Operating profit as a share of revenue.
    synonyms: [margin, profit margin]
    type: ratio
    derived: {op: divide, left: operating_profit, right: revenue}

  - name: purchase_order_value
    label: Purchase order value
    description: Net value of purchase order lines by order date.
    synonyms: [purchasing, ordered, PO value]
    type: money
    source: po_lines
    aggregate: sum
    sign: 1
    dimensions: [company, fiscal_year, fiscal_quarter, fiscal_month, vendor, vendor_name, account, account_name]

  - name: purchase_order_count
    label: Purchase orders
    description: Number of purchase orders by order date.
    type: count
    source: po_lines
    aggregate: count_distinct
    dimensions: [company, fiscal_year, fiscal_quarter, fiscal_month, vendor, vendor_name]

  - name: invoice_value
    label: Supplier invoice value
    description: Gross amount of supplier invoices by invoice date, any status.
    synonyms: [invoiced, AP invoices, supplier invoices]
    type: money
    source: ap_invoices
    aggregate: sum
    sign: 1
    dimensions: [company, fiscal_year, fiscal_quarter, fiscal_month, vendor, vendor_name, invoice_status]

  - name: invoice_count
    label: Supplier invoices
    description: Number of supplier invoices by invoice date, any status.
    type: count
    source: ap_invoices
    aggregate: count_distinct
    dimensions: [company, fiscal_year, fiscal_quarter, fiscal_month, vendor, vendor_name, invoice_status]

  - name: spend
    label: Spend
    description: Net amount of the items of posted supplier invoices by posting date, less those of posted credit memos, in each document's currency; a subsequent debit adds to it and a subsequent credit reduces it. A document parked, on hold, rejected, cancelled or reversed is not counted.
    synonyms: [procurement spend, purchasing spend, supplier spend, spending]
    type: money
    source: spend_lines
    aggregate: sum
    sign: 1
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, posting_date, vendor, vendor_name, account, account_name, cost_center, contract]

  - name: spend_under_contract
    label: Spend under contract
    description: The part of spend whose items are on a purchase order made on a contract.
    synonyms: [contract spend, on-contract spend]
    type: money
    source: spend_lines
    aggregate: sum
    sign: 1
    filter: {on_contract: ["true"]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, posting_date, vendor, vendor_name, account, account_name, cost_center, contract]

  - name: spend_off_contract
    label: Spend off contract
    description: Spend less spend under contract - the part whose items are on no purchase order, or on one made on no contract.
    synonyms: [off-contract spend, maverick spend]
    type: money
    derived: {op: subtract, left: spend, right: spend_under_contract}

  - name: off_contract_share
    label: Off-contract share
    description: Spend off contract as a share of spend. None where there is no spend.
    synonyms: [off-contract rate, share of spend off contract]
    type: ratio
    derived: {op: divide, left: spend_off_contract, right: spend}

  - name: order_intake
    label: Order intake
    description: Net value of the items of confirmed sales orders by order date, in each order's currency. A draft order is not counted; an order counts whether or not it is delivered or billed.
    synonyms: [orders, incoming orders, sales orders, order value]
    type: money
    source: sales_lines
    aggregate: sum
    sign: 1
    filter: {sales_document: [order]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, customer, customer_name, item_key]

  - name: billed_value
    label: Billed value
    description: Net amount of the items of posted billing documents by billing date, in each document's currency. A billing document created and not yet posted as a customer invoice is not counted.
    synonyms: [billing, billed, invoiced sales, billings]
    type: money
    source: sales_lines
    aggregate: sum
    sign: 1
    filter: {sales_document: [billing]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, customer, customer_name, item_key]

  - name: billing_document_count
    label: Billing documents
    description: Number of posted billing documents by billing date.
    type: count
    source: sales_lines
    aggregate: count_distinct
    filter: {sales_document: [billing]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, customer, customer_name, item_key]

  - name: open_payables
    label: Open payables
    description: Uncleared items on vendor reconciliation accounts (what is owed to suppliers).
    synonyms: [payables, AP balance, owed to suppliers]
    type: money
    source: gl_lines
    aggregate: sum
    sign: -1
    filter: {vendor_recon: ["true"], cleared: ["false"]}
    dimensions: [company, fiscal_year, fiscal_quarter, fiscal_month, vendor, vendor_name]

  - name: actual
    label: Actual cash flow
    description: Bank statement lines by value date, posted or not, each line's share of a liquidity item as the cash actuals classify it by what its decided match clears; money in is positive, money out negative. A line with no decided match yet takes its direction's default item, classified by unmatched.
    synonyms: [actuals, cash actuals, actual cash flows, cash movements]
    type: money
    source: cash_actuals
    aggregate: sum
    sign: 1
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, house_bank, match, liquidity_item, liquidity_item_name]

  - name: forecast_lag_0
    label: Forecast on the day
    description: What the liquidity forecast expected to move on each value date, read from the company's snapshot taken on the value date itself (its daily snapshot, else the last taken on demand that day), in each flow's own currency, every certainty counted and what blocked suppliers were owed left out, as the forecast's totals; money in is positive, money out negative. Each day's figure is of the snapshot taken that day, so a week or a month adds days forecast by different snapshots, unlike the variance report, which compares one snapshot over its period.
    synonyms: [same-day forecast, forecast lag 0]
    type: money
    source: cash_snapshots
    aggregate: sum
    sign: 1
    filter: {lag_days: ["0"], blocked: ["false"]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, house_bank, flow_source, certainty, liquidity_item, liquidity_item_name]

  - name: forecast_lag_7
    label: Forecast a week ahead
    description: What the liquidity forecast expected to move on each value date, read from the company's snapshot taken seven days before the value date (its daily snapshot, else the last taken on demand that day), in each flow's own currency, every certainty counted and what blocked suppliers were owed left out, as the forecast's totals; money in is positive, money out negative. Each day's figure is of the snapshot seven days before, so a week or a month adds days forecast by different snapshots, unlike the variance report, which compares one snapshot over its period.
    synonyms: [cash forecast, forecast a week ahead, forecast lag 7]
    type: money
    source: cash_snapshots
    aggregate: sum
    sign: 1
    filter: {lag_days: ["7"], blocked: ["false"]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, house_bank, flow_source, certainty, liquidity_item, liquidity_item_name]

  - name: forecast_lag_30
    label: Forecast a month ahead
    description: What the liquidity forecast expected to move on each value date, read from the company's snapshot taken 30 days before the value date (its daily snapshot, else the last taken on demand that day), in each flow's own currency, every certainty counted and what blocked suppliers were owed left out, as the forecast's totals; money in is positive, money out negative. Each day's figure is of the snapshot 30 days before, so a week or a month adds days forecast by different snapshots, unlike the variance report, which compares one snapshot over its period.
    synonyms: [forecast a month ahead, forecast lag 30]
    type: money
    source: cash_snapshots
    aggregate: sum
    sign: 1
    filter: {lag_days: ["30"], blocked: ["false"]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, house_bank, flow_source, certainty, liquidity_item, liquidity_item_name]

  - name: variance_lag_0
    label: Forecast variance on the day
    description: What actually moved less what the forecast expected, on each value date that has passed and has the company's snapshot taken on the value date itself (its daily snapshot, else the last taken on demand that day), by currency and liquidity item as the variance report compares them; the forecast is forecast_lag_0's, blocked suppliers' flows left out, and the actual actual's. A value date without that snapshot, or not yet passed, is not compared. Positive is more money in, or less out, than forecast.
    synonyms: [same-day variance, variance lag 0]
    type: money
    source: cash_accuracy
    aggregate: sum
    sign: 1
    filter: {lag_days: ["0"], figure: [variance]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, liquidity_item, liquidity_item_name]

  - name: absolute_variance_lag_0
    label: Absolute forecast variance on the day
    description: The sizes of variance_lag_0's cells added up, each cell a company's value date, currency and liquidity item, so a cell's money in more than forecast does not offset another's out; the numerator of the weighted absolute percentage error (WAPE) of accuracy_lag_0.
    synonyms: [same-day absolute error, absolute variance lag 0]
    type: money
    source: cash_accuracy
    aggregate: sum
    sign: 1
    filter: {lag_days: ["0"], figure: [absolute_variance]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, liquidity_item, liquidity_item_name]

  - name: absolute_forecast_lag_0
    label: Absolute forecast on the day
    description: The sizes of forecast_lag_0's cells added up over the value dates variance_lag_0 compares, each cell a company's value date, currency and liquidity item; the denominator of the weighted absolute percentage error (WAPE) of accuracy_lag_0.
    synonyms: [absolute forecast lag 0]
    type: money
    source: cash_accuracy
    aggregate: sum
    sign: 1
    filter: {lag_days: ["0"], figure: [absolute_forecast]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, liquidity_item, liquidity_item_name]

  - name: accuracy_lag_0
    label: Forecast accuracy on the day
    description: 100% less the weighted absolute percentage error (WAPE) of the forecast on the day, absolute_variance_lag_0 in percent of absolute_forecast_lag_0 rounded to two decimals half away from zero as the variance report's variance_percent; for one cell, 100% less that cell's variance_percent. None where nothing was forecast, as the variance report shows no percent; below zero where the variance is larger than the forecast.
    synonyms: [same-day forecast accuracy, accuracy lag 0]
    type: ratio
    derived: {op: complement, left: absolute_variance_lag_0, right: absolute_forecast_lag_0}

  - name: variance_lag_7
    label: Forecast variance a week ahead
    description: What actually moved less what the forecast expected, on each value date that has passed and has the company's snapshot taken seven days before the value date (its daily snapshot, else the last taken on demand that day), by currency and liquidity item as the variance report compares them; the forecast is forecast_lag_7's, blocked suppliers' flows left out, and the actual actual's. A value date without that snapshot, or not yet passed, is not compared. Positive is more money in, or less out, than forecast.
    synonyms: [week-ahead variance, variance lag 7]
    type: money
    source: cash_accuracy
    aggregate: sum
    sign: 1
    filter: {lag_days: ["7"], figure: [variance]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, liquidity_item, liquidity_item_name]

  - name: absolute_variance_lag_7
    label: Absolute forecast variance a week ahead
    description: The sizes of variance_lag_7's cells added up, each cell a company's value date, currency and liquidity item, so a cell's money in more than forecast does not offset another's out; the numerator of the weighted absolute percentage error (WAPE) of accuracy_lag_7.
    synonyms: [week-ahead absolute error, absolute variance lag 7]
    type: money
    source: cash_accuracy
    aggregate: sum
    sign: 1
    filter: {lag_days: ["7"], figure: [absolute_variance]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, liquidity_item, liquidity_item_name]

  - name: absolute_forecast_lag_7
    label: Absolute forecast a week ahead
    description: The sizes of forecast_lag_7's cells added up over the value dates variance_lag_7 compares, each cell a company's value date, currency and liquidity item; the denominator of the weighted absolute percentage error (WAPE) of accuracy_lag_7.
    synonyms: [absolute forecast lag 7]
    type: money
    source: cash_accuracy
    aggregate: sum
    sign: 1
    filter: {lag_days: ["7"], figure: [absolute_forecast]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, liquidity_item, liquidity_item_name]

  - name: accuracy_lag_7
    label: Forecast accuracy a week ahead
    description: 100% less the weighted absolute percentage error (WAPE) of the forecast a week ahead, absolute_variance_lag_7 in percent of absolute_forecast_lag_7 rounded to two decimals half away from zero as the variance report's variance_percent; for one cell, 100% less that cell's variance_percent. None where nothing was forecast, as the variance report shows no percent; below zero where the variance is larger than the forecast.
    synonyms: [week-ahead forecast accuracy, accuracy lag 7]
    type: ratio
    derived: {op: complement, left: absolute_variance_lag_7, right: absolute_forecast_lag_7}

  - name: variance_lag_30
    label: Forecast variance a month ahead
    description: What actually moved less what the forecast expected, on each value date that has passed and has the company's snapshot taken 30 days before the value date (its daily snapshot, else the last taken on demand that day), by currency and liquidity item as the variance report compares them; the forecast is forecast_lag_30's, blocked suppliers' flows left out, and the actual actual's. A value date without that snapshot, or not yet passed, is not compared. Positive is more money in, or less out, than forecast.
    synonyms: [month-ahead variance, variance lag 30]
    type: money
    source: cash_accuracy
    aggregate: sum
    sign: 1
    filter: {lag_days: ["30"], figure: [variance]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, liquidity_item, liquidity_item_name]

  - name: absolute_variance_lag_30
    label: Absolute forecast variance a month ahead
    description: The sizes of variance_lag_30's cells added up, each cell a company's value date, currency and liquidity item, so a cell's money in more than forecast does not offset another's out; the numerator of the weighted absolute percentage error (WAPE) of accuracy_lag_30.
    synonyms: [month-ahead absolute error, absolute variance lag 30]
    type: money
    source: cash_accuracy
    aggregate: sum
    sign: 1
    filter: {lag_days: ["30"], figure: [absolute_variance]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, liquidity_item, liquidity_item_name]

  - name: absolute_forecast_lag_30
    label: Absolute forecast a month ahead
    description: The sizes of forecast_lag_30's cells added up over the value dates variance_lag_30 compares, each cell a company's value date, currency and liquidity item; the denominator of the weighted absolute percentage error (WAPE) of accuracy_lag_30.
    synonyms: [absolute forecast lag 30]
    type: money
    source: cash_accuracy
    aggregate: sum
    sign: 1
    filter: {lag_days: ["30"], figure: [absolute_forecast]}
    dimensions: [company, currency, fiscal_year, fiscal_quarter, fiscal_month, value_date, liquidity_item, liquidity_item_name]

  - name: accuracy_lag_30
    label: Forecast accuracy a month ahead
    description: 100% less the weighted absolute percentage error (WAPE) of the forecast a month ahead, absolute_variance_lag_30 in percent of absolute_forecast_lag_30 rounded to two decimals half away from zero as the variance report's variance_percent; for one cell, 100% less that cell's variance_percent. None where nothing was forecast, as the variance report shows no percent; below zero where the variance is larger than the forecast.
    synonyms: [month-ahead forecast accuracy, accuracy lag 30]
    type: ratio
    derived: {op: complement, left: absolute_variance_lag_30, right: absolute_forecast_lag_30}
