# United Arab Emirates (ADR-0048). 2026.3 is 2026.2 (T62f's codes, T61k's
# VAT 201) with the emirate guard (ADR-0049 §7 As built): S5, the code
# levying the emirate each sales line names, lists the seven emirates it
# accepts (tax.yaml), their ISO 3166-2 codes confirmed by the tax
# specialist (product owner, 2026-11-09), so the ledger refuses a line
# naming another (422 ledger.jurisdiction_not_levied) rather than leave
# its output VAT off the VAT 201's boxes 1a-1g. Every other file is
# 2026.2's, unchanged, the labels of returns.yaml that call the codes
# pending among them. It carries no sign_off, as 2026.2 does not: the
# sign-off of T62f's items and of the VAT 201 is the next version, since a
# released one never changes, so production refuses to apply it (409
# config.pack_not_signed_off).
#
# The sources below are those ADR-0049 records with a link, cited from its
# proposal of 2026-10-20 and not fetched again in T62f, T61k or the guard.
# The VAT Law (Federal Decree-Law No. 8 of 2017) and its Executive
# Regulation (Cabinet Decision No. 52 of 2017), on which the rate, the
# categories, blocked input and the tax invoice rest, are named by
# ADR-0049 without a link and are not listed here; the pending files say
# so for each fact.
