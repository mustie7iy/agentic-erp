# product owner) T62f's VAT codes, rates and their start, recovery,
# categories and tax settings with the items of ../TAX-PENDING-T62f.md,
# and the VAT 201's boxes, columns, totals, the emirates' letters and ISO
# codes and the tenant codes' mapping of ../TAX-PENDING-T61k.md: one
# version carries both sign-offs (T62f's and T61k's tracker leaves). Every
# file but this one and tax.yaml is 2026.3's, unchanged; tax.yaml differs
