# United Arab Emirates (ADR-0048). 2026.6 is 2026.5 plus the number
# ranges of the documents built since (product owner, 2026-11-12):
# customer invoices and credit memos, incoming payments, quotations,
# sales orders, billing documents and requests for quotation, and the
# journal ranges of the entries they post (DR, DZ, DG). Only
# numbering.yaml and this file differ: tax.yaml and returns.yaml, the
# VAT codes, rates, tax settings and the VAT 201, and every other file
# are 2026.5's byte for byte. Its sign_off is the tax specialist's of
# 2026-11-09 (2026.4, carried by 2026.5), carried here with the product
# owner's approval of 2026-11-13: the sign-off covers this numbering-only
# version, whose tax content is the content signed off, so production
# applies it.
#
# The sources below are those ADR-0049 records with a link, cited from its
# proposal of 2026-10-20 and not fetched again in T62f, T61k or the guard.
# The VAT Law (Federal Decree-Law No. 8 of 2017) and its Executive
# Regulation (Cabinet Decision No. 52 of 2017), on which the rate, the
# categories, blocked input and the tax invoice rest, are named by
# ADR-0049 without a link and are not listed here; the pending files say
# so for each fact.
