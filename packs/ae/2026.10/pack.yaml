# United Arab Emirates (ADR-0048). 2026.10 is 2026.9 plus two accounts
# and the account determination keys of their own that batch 92 split
# off (ADR-0063 and ADR-0061 As built batch 92): 6800 Cash discounts
# granted, an expense, as cash_discount_granted (SAP SKT), which a UAE
# customer's cash discount is debited to, and 4830 Supplier rebates
# received, a revenue beside 4800's discounts received, as
# supplier_rebate, which a volume discount's credit note (BTAE-03 VD)
# naming no order is credited to. Only accounts.yaml and this file
# differ: tax.yaml and returns.yaml, the VAT codes, rates, tax settings
# and the VAT 201, the number ranges and every other file are 2026.9's
# byte for byte. Its sign_off is the tax specialist's of 2026-11-09
# (2026.4, carried by 2026.5 to 2026.9), carried here by default (batch
# 92, for the product owner's review): as with a numbering-only version
# under the rule of 2026-11-18, the sign-off covers this version, whose
# tax content is the content signed off, so production applies it.
#
# The sources below are those ADR-0049 records with a link, cited from its
# proposal of 2026-10-20 and not fetched again in T62f, T61k or the guard.
# The VAT Law (Federal Decree-Law No. 8 of 2017) and its Executive
# Regulation (Cabinet Decision No. 52 of 2017), on which the rate, the
# categories, blocked input and the tax invoice rest, are named by
# ADR-0049 without a link and are not listed here; the pending files say
# so for each fact.
