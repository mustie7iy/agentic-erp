# United Arab Emirates (ADR-0048). 2026.5 is 2026.4 with the VAT 201's
# box labels' markers dropped, under 2026.4's sign-off (the tax
# specialist, Musto Ibrahim, 2026-11-09; the product owner approved the
# labels-only version on 2026-11-09): "(its ISO code pending the tax
# specialist)" on boxes 1a-1g, "(column pending the tax specialist)" on
# boxes 2-7 and "(from memory, pending the tax specialist)" on the totals
# 8, 11, 12 and 13, which the specialist confirmed as written
# (../TAX-PENDING-T61k.md). Each box 1 label names the ISO 3166-2 code of
# the emirate its box selects, as confirmed. Only the label strings of
# returns.yaml differ: its boxes, selections and sums, and every other
# file but this one, are 2026.4's byte for byte, the remarks of tax.yaml
# and returns.yaml included, which describe the unsigned versions' state.
#
# The sources below are those ADR-0049 records with a link, cited from its
# proposal of 2026-10-20 and not fetched again in T62f, T61k or the guard.
# The VAT Law (Federal Decree-Law No. 8 of 2017) and its Executive
# Regulation (Cabinet Decision No. 52 of 2017), on which the rate, the
# categories, blocked input and the tax invoice rest, are named by
# ADR-0049 without a link and are not listed here; the pending files say
# so for each fact.
