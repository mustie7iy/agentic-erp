# The general holidays of the Canada Labour Code (s. 166), federally
# regulated workplaces' statutory holidays, on their own dates. Provincial
# holidays (Family Day, Saint-Jean-Baptiste Day, Civic Holiday and others)
# depend on the company's province and are added by the tenant; the day
# observed when a holiday falls on a weekend is left to the tax specialist.
