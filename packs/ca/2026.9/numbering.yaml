# Number ranges for every document type the ERP numbers, created for the
# fiscal year of application. Supplier invoices are gapless; journal
# ranges cover the entries the documents post (KR, KG, WE, ZP, AB) and
# manual entries (SA). From here on, added by this version (product
# owner, 2026-11-12): requests for quotation, the sales documents
# (quotations, sales orders, billing documents) and the receivables
# documents (customer invoices, whose range numbers customer credit memos
# too, and incoming payments) with the journal ranges of their entries
# (DR customer invoices, DG customer credit memos, DZ incoming payments).
# None is gapless: no source recorded in the pack says a customer
# invoice's accounting number must be (it is not the legal tax invoice,
# ADR-0063 §2).
number_ranges:
  - {document_type: requisition, prefix: PR, first: 1, last: 9999999}
  - {document_type: purchase_order, prefix: PO, first: 1, last: 9999999}
  - {document_type: contract, prefix: CT, first: 1, last: 999999}
  - {document_type: goods_receipt, prefix: GR, first: 1, last: 9999999}
  - {document_type: supplier_invoice, prefix: SI, first: 1, last: 9999999, gapless: true}
  - {document_type: down_payment_request, prefix: DP, first: 1, last: 999999}
  - {document_type: payment_run, prefix: PY, first: 1, last: 999999}
  - {document_type: journal_sa, prefix: SA, first: 1, last: 9999999}
  - {document_type: journal_kr, prefix: KR, first: 1, last: 9999999}
  - {document_type: journal_kg, prefix: KG, first: 1, last: 9999999}
  - {document_type: journal_we, prefix: WE, first: 1, last: 9999999}
  - {document_type: journal_zp, prefix: ZP, first: 1, last: 9999999}
  - {document_type: journal_ab, prefix: AB, first: 1, last: 9999999}
  - {document_type: rfq, prefix: RQ, first: 1, last: 9999999}
  - {document_type: quotation, prefix: QT, first: 1, last: 9999999}
  - {document_type: sales_order, prefix: SO, first: 1, last: 9999999}
  - {document_type: billing_document, prefix: BD, first: 1, last: 9999999}
  - {document_type: customer_invoice, prefix: CI, first: 1, last: 9999999}
  - {document_type: incoming_payment, prefix: IP, first: 1, last: 9999999}
  - {document_type: journal_dr, prefix: DR, first: 1, last: 9999999}
  - {document_type: journal_dg, prefix: DG, first: 1, last: 9999999}
  - {document_type: journal_dz, prefix: DZ, first: 1, last: 9999999}
