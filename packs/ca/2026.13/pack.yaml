# Canada (ADR-0048, T62e). 2026.13 is 2026.12 plus two accounts and the
# account determination keys of their own that batch 92 split off
# (ADR-0063 and ADR-0061 As built batch 92): 6800 Cash discounts granted,
# an expense, as cash_discount_granted (SAP SKT), and 4810 Supplier
# rebates received, a revenue beside 4800's discounts received, as
# supplier_rebate. Only accounts.yaml and this file differ: tax.yaml and
# returns.yaml, the tax codes, rates, tax settings and the GST/HST return,
# the number ranges and every other file are 2026.12's byte for byte. Its
# sign_off is the tax specialist's of 2026-11-09 (2026.7, carried by
# 2026.8 to 2026.12), carried here by default (batch 92, for the product
# owner's review): as with a numbering-only version under the rule of
# 2026-11-18, the sign-off covers this version, whose tax content is the
# content signed off, so production applies it.
# The FPZ-500 for a Quebec registrant is not in the pack (its own tracker
# leaf).
