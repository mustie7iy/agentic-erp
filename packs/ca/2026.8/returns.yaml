# The GST/HST return (the GST34's lines; ADR-0049 §11, T61j), computed
# from the tax items of the companies a GST/HST registration covers. Not
# signed off: ../TAX-PENDING-T61j.md lists every line with its basis and
# what the tax specialist confirms, and a test (internal/countrypack,
# TestCanadaPackGST34) holds this file to that table.
#
# What a line means is ADR-0049's record (Context, "Return lines") of the
# CRA's "Instructions for preparing a GST/HST return" (pack.yaml's first
# source): 101 sales and other revenue, zero-rated and exempt included,
# without the tax; 103 GST/HST collected or collectible; 104 adjustments
# increasing the net tax; 105 = 103 + 104; 106 input tax credits; 107
# adjustments decreasing the net tax; 108 = 106 + 107; 109 = 105 - 108;
# 110 instalments; 111 rebates; 205 GST/HST on taxable real property or
# emission allowances, self-assessed; 405 other GST/HST self-assessed; 114
# a refund; 115 the balance owing. The ADR names 112, 113A, 113B and 113C
# a paper return's subtotals without their sums: those, and how 114 and
# 115 follow from them, are written from memory and say so in their label.
#
# Which items a line sums is the pack's mapping (decided by default in
# ADR-0049 §11 As built, T61j), for the tax specialist to confirm:
# - GST and HST are the components keyed gst and hst, as the pack's own
#   codes key them (tax.yaml); QST (qst) and the provincial sales taxes
#   (pst_bc, rst_mb, pst_sk) are on no line of this return.
# - A self-assessed tax (a reverse_charge or import code) is the
#   self_output component keyed after its line, gst_405 or hst_405
#   (gst_205, hst_205 for real property and emission allowances); the
#   claim beside it, self_input, is keyed gst or hst and its recovered
#   part is an input tax credit (106), as ADR-0049 §9 has for line 405.
# - Adjustments, instalments and rebates are manual entries of a code of
#   kind adjustment (§11): output to increase the net tax (104), input to
#   decrease it (107), and input codes keyed instalment (110) or rebate
#   (111).
# No prior-period threshold: a late item always goes into the next return
# (P7, zero for Canada).
returns:
  - type: GST34
    name: GST/HST return (GST34 lines)
    boxes:
      - code: "101"
        label: "Sales and other revenue, zero-rated and exempt supplies included, without the GST/HST"
        select: {direction: output, kinds: [standard, zero, exempt], components: [gst, hst], measure: base, negate: true}
      - code: "103"
        label: "GST/HST collected or collectible"
        select: {direction: output, kinds: [standard], components: [gst, hst], account_keys: [output], measure: tax, negate: true}
      - code: "104"
        label: "Adjustments that increase the net tax"
        select: {direction: output, kinds: [adjustment], components: [gst, hst], measure: tax, negate: true}
      - code: "105"
        label: "Line 103 plus line 104"
        expression: box_103 + box_104
      - code: "106"
        label: "Input tax credits (ITCs)"
        select: {direction: input, kinds: [standard, reverse_charge, import], components: [gst, hst], account_keys: [input, self_input], measure: recoverable}
      - code: "107"
        label: "Adjustments that decrease the net tax"
        select: {direction: input, kinds: [adjustment], components: [gst, hst], measure: tax}
      - code: "108"
        label: "Line 106 plus line 107"
        expression: box_106 + box_107
      - code: "109"
        label: "Net tax: line 105 less line 108"
        expression: box_105 - box_108
      - code: "110"
        label: "Instalments"
        select: {direction: input, kinds: [adjustment], components: [instalment], measure: tax}
      - code: "111"
        label: "Rebates"
        select: {direction: input, kinds: [adjustment], components: [rebate], measure: tax}
      - code: "112"
        label: "Line 110 plus line 111 (a paper return's subtotal)"
        expression: box_110 + box_111
      - code: "113a"
        label: "Line 109 less line 112 (a paper return's subtotal)"
        expression: box_109 - box_112
      - code: "205"
        label: "GST/HST on taxable real property or emission allowances, self-assessed"
        select: {direction: input, kinds: [reverse_charge, import], components: [gst_205, hst_205], account_keys: [self_output], measure: tax, negate: true}
      - code: "405"
        label: "Other GST/HST self-assessed"
        select: {direction: input, kinds: [reverse_charge, import], components: [gst_405, hst_405], account_keys: [self_output], measure: tax, negate: true}
      - code: "113b"
        label: "Line 205 plus line 405 (a paper return's subtotal)"
        expression: box_205 + box_405
      - code: "113c"
        label: "Line 113A plus line 113B (a paper return's subtotal)"
        expression: box_113a + box_113b
      - code: "114"
        label: "Refund claimed: line 113C when it is negative, shown positive"
        expression: "box_113c < 0 ? -box_113c : 0"
      - code: "115"
        label: "Balance owing: line 113C when it is positive"
        expression: "box_113c > 0 ? box_113c : 0"
