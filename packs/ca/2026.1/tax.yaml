# Purchase tax codes. GST and HST (Excise Tax Act, Part IX) are recovered
# as input tax credits; the rates and dates are the CRA's table (from
# April 1, 2013, the table's first period). The provincial sales taxes are
# not recovered and are expensed; QST is recovered as an input tax refund.
# The PST and QST rates are given from 2026-01-01, the earliest date the
# cited pages vouch for; their earlier history is left to the tax
# specialist.
tax_codes:
  - code: G5
    description: GST 5% (AB, BC, MB, NT, NU, QC, SK, YT)
    account: "1300"
    rates:
      - {rate_percent: "5", valid_from: 2013-04-01}
  - code: HON
    description: HST Ontario 13%
    account: "1300"
    rates:
      - {rate_percent: "13", valid_from: 2013-04-01}
  - code: HNB
    description: HST New Brunswick
    account: "1300"
    rates:
      - {rate_percent: "15", valid_from: 2016-10-01}
  - code: HNL
    description: HST Newfoundland and Labrador
    account: "1300"
    rates:
      - {rate_percent: "13", valid_from: 2013-04-01, valid_to: 2016-06-30}
      - {rate_percent: "15", valid_from: 2016-07-01}
  - code: HNS
    description: HST Nova Scotia
    account: "1300"
    rates:
      - {rate_percent: "15", valid_from: 2013-04-01, valid_to: 2025-03-31}
