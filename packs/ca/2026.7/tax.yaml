  # Manitoba Finance, Retail Sales Tax. Earlier start not sourced.
  - code: PMB
    description: Manitoba RST
    direction: input
    kind: standard
    category: S
    components:
      - key: rst_mb
        jurisdiction: CA-MB
        account_key: non_deductible
