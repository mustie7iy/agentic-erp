# Canada (ADR-0048, T62e). 2026.12 is 2026.11 plus the number ranges of
# physical inventory documents (PI) and outbound deliveries (OD), which
# the pilot's settings added themselves (review of batch 83) and a
# company activated from 2026.11 lacks (422 config.no_number_range for a
# count or a delivery). Only numbering.yaml and this file differ: tax.yaml
# and returns.yaml, the tax codes, rates, tax settings and the GST/HST
# return, and every other file are 2026.11's byte for byte. Its sign_off
# is the tax specialist's of 2026-11-09 (2026.7, carried by 2026.8 to
# 2026.11), carried here under the product owner's rule of 2026-11-18 (a
# numbering-only version carries the sign-off): the sign-off covers this
# numbering-only version, whose tax content is the content signed off, so
# production applies it.
# The FPZ-500 for a Quebec registrant is not in the pack (its own tracker
# leaf).
