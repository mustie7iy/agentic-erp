# Canada (ADR-0048, T62e). 2026.6 is 2026.5 plus the GST/HST return
# (returns.yaml, T61j): the GST34's lines as ADR-0049 records them from the
# CRA's instructions, the source added below, and the subtotals and the
# refund or balance owing the ADR does not spell out, marked in their
# labels. Every other file is 2026.5's, unchanged. It carries no
# sign_off: the tax specialist confirms the lines, how the pack's tax
# codes map to them and the open items of ../TAX-PENDING-T61j.md first,
# and a signed-off version is a new version, since a released one never
# changes (as 2026.4 was signed off as 2026.5). Production refuses to
# apply it until then (409 config.pack_not_signed_off); 2026.5 stays the
# signed-off version.
