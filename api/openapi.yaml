    CountryPack:
      type: object
      description: "A released country pack version (ADR-0048): a country's chart of accounts, tax codes, holidays, number ranges and payment terms, with the legal sources they rest on. Released versions never change."
      required:
        - country
        - version
        - name
        - valid_from
        - hash
        - signed_off
        - sources
        - contents
      properties:
        country:
          type: string
          description: Country (ISO 3166-1 alpha-2).
          pattern: "^[A-Z]{2}$"
          readOnly: true
        version:
          type: string
          description: "Version `YYYY.N`."
          pattern: "^[0-9]{4}\\.[1-9][0-9]*$"
          readOnly: true
        name:
          type: string
          description: Name of the pack.
          readOnly: true
        valid_from:
          type: string
          format: date
          description: First day the pack's settings hold.
          readOnly: true
        hash:
          type: string
          description: "SHA-256 of the pack's directory as released (`packs/released.sha256`), hex."
          pattern: "^[0-9a-f]{64}$"
          readOnly: true
        signed_off:
          type: boolean
          description: "Whether a tax specialist signed the pack off; required before the pilot. Applying a pack without it notes so."
          readOnly: true
        sign_off:
          $ref: "#/components/schemas/CountryPackSignOff"
          description: The tax specialist's sign-off; absent until given.
          readOnly: true
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CountryPackSource"
          description: The laws, regulations and authority publications the pack follows.
          readOnly: true
        contents:
          $ref: "#/components/schemas/CountryPackContents"
          description: How many settings of each kind the pack has.
          readOnly: true
      examples:
        - country: CA
          version: "2026.1"
          name: Canada
          valid_from: "2026-01-01"
          hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          signed_off: true
          sign_off:
            tax_specialist: A. Specialist, Example Tax LLP
            date: "2026-10-01"
          sources:
            - title: Excise Tax Act, Part IX (GST/HST)
              url: https://laws-lois.justice.gc.ca/eng/acts/E-15/
              retrieved: "2026-09-01"
          contents:
            accounts: 42
            tax_codes: 6
            holidays: 11
            number_ranges: 4
            payment_terms: 3
