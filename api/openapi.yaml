        - reconciliation_account_id
        - payment_term_code
      properties:
        legal_entity_id:
          type: string
          format: uuid
          description: Legal entity.
        reconciliation_account_id:
          type: string
          format: uuid
          description: Payables reconciliation account.
        payment_term_code:
          type: string
          description: Payment terms.
          pattern: "^[A-Z0-9_/]{1,10}$"
          example: NT30
        withholding_tax_codes:
          type: array
          description: "The withholding taxes to deduct from the supplier in this legal entity (T46e): active codes of the company's configuration, each once. The list replaces the supplier's codes in the legal entity: leaving it out takes every code off the supplier there, as the other company data is replaced too."
          maxItems: 10
          items:
            type: string
            pattern: "^[A-Z0-9]{1,4}$"
        payment_methods:
          type: array
          description: "The methods the supplier may be paid by in this legal entity, in order of preference (ADR-0038): active payment methods of the company's configuration, each once. A payment proposal pays the supplier through the first method a ranked house bank can pay. The list replaces the supplier's methods in the legal entity: leaving it out takes every method off the supplier there, as the other company data is replaced too."
          maxItems: 10
          items:
            type: string
            pattern: "^[A-Z0-9]$"
