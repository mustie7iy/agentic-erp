  responses:
    BadRequest:
      description: "Malformed request: invalid JSON, unknown field, wrong type or wrong money precision."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/malformed"
            title: Malformed request
            status: 400
            code: request.malformed
            detail: "amount 1080.0 has 1 decimal; EUR requires 2."
            instance: /v1/supplier-invoices
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
            errors:
              - field: gross_amount.amount
                code: precision
                message: EUR amounts need exactly 2 decimals.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
    Unauthorized:
      description: "Missing, expired or invalid bearer token (`authn.invalid_token`), or a person's token without the multi-factor authentication the tenant requires (`identity.mfa_required`, with the RFC 9470 challenge in `WWW-Authenticate`), or of a session that has ended (`identity.session_expired`, `identity.session_idle`) or cannot be told (`identity.session_unknown`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/authn/invalid-token"
            title: Unauthorized
            status: 401
            code: authn.invalid_token
            detail: The bearer token is invalid or expired.
            instance: /v1/supplier-invoices
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
    Forbidden:
      description: "No permission, no access to the legal entity, a segregation-of-duties conflict, or an agent attempting a human-only action. `code` says which (for example `identity.permission_missing`, `identity.sod_conflict`, `identity.agent_not_allowed`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/identity/sod_conflict"
            title: Segregation of duties
            status: 403
            code: identity.sod_conflict
            detail: The user who proposed payment run 2600000017 cannot release it.
            instance: /v1/supplier-invoices
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
    NotFound:
      description: The resource does not exist, or exists in a legal entity the caller cannot see (ids cannot be probed).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/not_found"
            title: Not found
            status: 404
            code: request.not_found
            detail: No supplier invoice with this id.
            instance: /v1/supplier-invoices
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
    Conflict:
      description: "Business rule conflict: wrong state for the transition, duplicate, closed period, or a request with the same `Idempotency-Key` is still running (then `Retry-After` is set)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/payables/duplicate_invoice"
            title: Duplicate supplier invoice
            status: 409
            code: payables.duplicate_invoice
            detail: Supplier S0001 already has invoice INV-2026/001 (5100000123).
            instance: /v1/supplier-invoices
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
            errors:
              - field: supplier_reference
                code: duplicate
                message: Already used by 5100000123.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
    PreconditionFailed:
      description: "`If-Match` does not match the current version; nothing was changed. Re-read and retry."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/version_mismatch"
            title: Version mismatch
            status: 412
            code: request.version_mismatch
            detail: Expected version 3, current version is 4.
            instance: /v1/supplier-invoices
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
    Unprocessable:
      description: "Validation failed (`errors` lists the fields), or the `Idempotency-Key` was reused with a different body."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/validation_failed"
            title: Validation failed
            status: 422
            code: request.validation_failed
            detail: "2 fields are invalid."
            instance: /v1/supplier-invoices
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
            errors:
              - field: "items[0].quantity.value"
                code: positive
                message: Quantity must be greater than zero.
              - field: invoice_date
                code: required
                message: invoice_date is required.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
    PreconditionRequired:
      description: "`If-Match` or `Idempotency-Key` is missing where required."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/precondition_required"
            title: Precondition required
            status: 428
            code: request.precondition_required
            detail: This operation requires an If-Match header.
            instance: /v1/supplier-invoices
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
    TooManyRequests:
      description: Rate limit exceeded for the tenant or principal.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/rate_limited"
            title: Too many requests
            status: 429
            code: request.rate_limited
            detail: Principal quota of 50 requests per second exceeded.
            instance: /v1/supplier-invoices
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
    ServiceUnavailable:
      description: "A dependency is unavailable. Safe to retry with the same `Idempotency-Key`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/platform/unavailable"
            title: Service unavailable
            status: 503
            code: platform.unavailable
            detail: The ledger service is temporarily unavailable.
            instance: /v1/supplier-invoices
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
