        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SupplierInvoiceCapture"
      responses:
        "202":
          description: "Accepted; captureSupplierInvoice continues as a long-running operation. Poll the Operation at `Location`."
