    ParkedJournalEntry:
      description: "A manual journal entry parked before it is posted (T35). It moves `parked` -> `pending_approval` -> `posted` or `rejected`, back to `parked` when its approval request is withdrawn, straight to `posted` within its company's `manual_entry_approval_limit`, or to `cancelled`; its content and lines change only while it is `parked`."
      allOf:
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          required:
            - legal_entity_id
            - ledger_id
            - document_type
            - document_date
            - posting_date
            - currency
            - status
            - created_by_kind
            - lines
          properties:
            legal_entity_id:
              type: string
              format: uuid
              description: Legal entity.
              readOnly: true
            ledger_id:
              type: string
              format: uuid
              description: Ledger.
              readOnly: true
            document_type:
              type: string
              description: Document type.
              readOnly: true
            document_date:
              type: string
              format: date
              description: Document date.
              readOnly: true
            posting_date:
              type: string
              format: date
              description: "Posting date; its period must be open when the entry is posted."
              readOnly: true
            currency:
              type: string
              description: Transaction currency.
              readOnly: true
            reference:
              type: string
              description: External reference.
              readOnly: true
            header_text:
              type: string
              description: Header text.
              readOnly: true
            status:
              type: string
              description: "Parked entry status. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
              x-extensible-enum:
                - parked
                - pending_approval
                - posted
                - rejected
                - cancelled
              readOnly: true
            created_by_kind:
              type: string
              description: "Kind of principal that parked the entry; `agent` marks an agent's proposal. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
              x-extensible-enum:
                - human
                - agent
                - service
              readOnly: true
            owner_id:
              type: string
              format: uuid
              description: "The person who owns the entry, and alone changes, posts or withdraws it: who parked it, or for an agent's entry the person who took it on; absent until then."
              readOnly: true
            approval_request_id:
              type: string
              format: uuid
              description: "The `manual_entry` approval request (workflow context) the entry waits for or was decided on; absent when it was never submitted or was posted within the limit."
              readOnly: true
            journal_entry_id:
              type: string
              format: uuid
              description: "The journal entry it was posted as; set once `posted`."
              readOnly: true
            journal_fiscal_year:
              type: integer
              format: int32
              description: Fiscal year of the journal entry, set with `journal_entry_id`.
              readOnly: true
            lines:
              type: array
              items:
                $ref: "#/components/schemas/ParkedJournalLine"
              description: The lines, balancing to zero.
              readOnly: true
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d42"
          version: 1
          created_at: "2026-10-09T14:03:11Z"
          created_by: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d08"
          updated_at: "2026-10-09T14:03:11Z"
          legal_entity_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
          ledger_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d09"
          document_type: SA
          document_date: "2026-10-09"
          posting_date: "2026-10-09"
          currency: EUR
          header_text: October consulting accrual
          status: parked
          created_by_kind: agent
          lines:
            - line_no: 1
              account_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d06"
              amount:
                amount: "1200.00"
                currency: EUR
            - line_no: 2
              account_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d07"
              amount:
                amount: "-1200.00"
                currency: EUR
