    RevaluationItem:
      type: object
      description: "One valued item: an open item (a journal line on a reconciliation account) or the balance in one currency of a flagged account."
      required:
        - account_id
        - amount
        - amount_lc
        - amount_gc
        - valued_lc
        - difference_lc
        - valued_gc
        - difference_gc
        - direction
      properties:
        account_id:
          type: string
          format: uuid
          description: The revalued account.
          readOnly: true
        partner_id:
          type: string
          format: uuid
          description: "The open item's supplier or customer; absent for a balance."
          readOnly: true
        fiscal_year:
          type: integer
          format: int32
          description: "The open item's entry's fiscal year; absent for a balance."
          readOnly: true
        journal_entry_id:
          type: string
          format: uuid
          description: "The open item's entry; absent for a balance."
          readOnly: true
        line_no:
          type: integer
          format: int32
          description: "The open item's line; absent for a balance."
          minimum: 1
          readOnly: true
        amount:
          $ref: "#/components/schemas/Money"
          description: "Amount in transaction currency, signed: debit positive."
          readOnly: true
        amount_lc:
          $ref: "#/components/schemas/Money"
          description: Booked amount in local currency, signed.
          readOnly: true
        amount_gc:
          $ref: "#/components/schemas/Money"
          description: Booked amount in group currency, signed.
          readOnly: true
        rate:
          $ref: "#/components/schemas/Decimal"
          description: "Units of local currency per unit of the transaction currency on the key date, of the valuation rate type (rounded to 12 decimals when only the reverse pair is recorded); absent for a balance that is zero in its currency, which is valued at zero without a rate."
          readOnly: true
        rate_valid_from:
          type: string
          format: date
          description: "The rate's valid_from; absent with the rate."
          readOnly: true
        valued_lc:
          $ref: "#/components/schemas/Money"
          description: The amount at the rate in local currency, rounded once.
          readOnly: true
        difference_lc:
          $ref: "#/components/schemas/Money"
          description: valued_lc less amount_lc.
          readOnly: true
        rate_gc:
          $ref: "#/components/schemas/Decimal"
          description: "Units of group currency per unit of the transaction currency on the key date, of the valuation rate type; 1 when the transaction currency is the group's; absent for a balance that is zero in its currency."
          readOnly: true
        rate_gc_valid_from:
          type: string
          format: date
          description: "rate_gc's valid_from; absent when the transaction currency is the group's or rate_gc is absent."
          readOnly: true
        valued_gc:
          $ref: "#/components/schemas/Money"
          description: The amount at rate_gc in group currency, rounded once.
          readOnly: true
        difference_gc:
          $ref: "#/components/schemas/Money"
          description: valued_gc less amount_gc.
          readOnly: true
        direction:
          type: string
          description: "gain for a positive local difference, loss for a negative one; without one, as the group difference's sign says; none when neither differs."
          x-extensible-enum: [gain, loss, none]
          readOnly: true
