            $ref: "#/components/schemas/AnalyticsColumn"
        rows:
          type: array
          description: One array of cells per row, in the order of `columns`.
          items:
            type: array
            items:
              $ref: "#/components/schemas/AnalyticsCell"
        source:
          type: string
          description: "`store` (the analytical store) or `database`."
          x-extensible-enum:
            - store
            - database
        as_of:
          type: string
          format: date-time
          description: "The state of the data answered: the store's snapshot, or the time of the database read."
        data_through:
          type: string
          description: "The latest posting or document date in the data read (YYYY-MM-DD); from the store, of the datasets the query read only."
        definitions:
          type: array
          description: The metric definitions that produced the measures.
          items:
            $ref: "#/components/schemas/AnalyticsDefinition"
        truncated:
          type: boolean
          description: The rows were cut at the limit.
