      summary: Post a foreign-currency revaluation run
      description: "Values what `previewRevaluation` values and, in one transaction, posts the differences (ADR-0042, T48c): a valuation entry (document type SA, in local currency, source the run) dated the key date and its reset, a separate entry of the negated lines dated the next day, the first of the next period, so the items stay open at their booked amounts. Each item's local and group differences go to the account itself for a flagged account and to its adjustment account for a reconciliation account, against the unrealised gain or loss account by the item's direction. Both periods must be open (409 `ledger.period_not_open`). A run whose items have no difference is recorded without entries. The run and its items are recorded, audited and published (`RevaluationRunPosted`, besides each entry's `JournalEntryPosted`). One run per legal entity, ledger and key date is posted: a second is 409 `ledger.revaluation_exists`, whose `detail` names the posted run and whose `Location` header links it; cancelling that run (`cancelRevaluationRun`) frees the key date. Concurrent clearings and reversals of the tenant wait for the run. Human-only."
