          pattern: "^[0-9]{3}$"
          example: "003"
        transit_number:
          type: string
          description: "Canadian transit (branch) number (5 digits). Required for scheme `ca`, refused for the others."
          pattern: "^[0-9]{5}$"
          example: "12345"
        bic:
          type: string
          description: BIC.
          pattern: "^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$"
        bank_country_code:
          type: string
          description: Country of the bank.
          pattern: "^[A-Z]{2}$"
