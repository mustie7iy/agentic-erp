      properties:
        valid_to:
          type: string
          format: date
          description: Day validity ends (exclusive). Must not be in the past and can only bring an existing end forward.
      additionalProperties: false
      examples:
        - valid_to: "2026-10-09"
    FieldError:
      type: object
      description: One field-level validation error.
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: "Path of the offending field, for example `items[0].quantity.value`."
        code:
          type: string
          description: "Stable machine-readable reason, for example `required`, `precision`, `duplicate`."
        message:
          type: string
          description: "Human-readable explanation; do not branch on it."
