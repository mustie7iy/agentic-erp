      tags:
        - agents
      summary: Get the tenant's AI policy
      description: "Whether the tenant's model calls and agents run, where its model aliases route, which models they may route to, its monthly cap on model spending and whether documents may go to models (ADR-0036). A tenant whose policy was never changed has the defaults, version 1: AI on, the platform's routes, any priced model, no cap, documents allowed. Human-only."
