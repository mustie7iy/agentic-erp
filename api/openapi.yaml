      description: "What the tenant's model calls through the gateway used and cost in one calendar month (UTC), per principal that called (ADR-0036): each agent, and each person or service whose request made a server-side call such as capture. Read from the model call ledger: tokens as the provider reported them, costs at the recorded prices, rounded to the cent per principal and in total. The month defaults to the current one. Human-only."
