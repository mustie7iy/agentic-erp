      required:
        - config_version
        - model
      properties:
        config_version:
          type: integer
          format: int32
          description: The configuration version the model is of.
        model:
          type: object
          additionalProperties: true
          description: "The model as the configuration document's `analytics` section holds it: `calendar`, `defaults`, `dimensions` and `metrics` (each with its name, label, description, synonyms, type, dimensions and definition)."
      additionalProperties: false
    AnalyticsResult:
      type: object
      description: "A query's columns and rows, with its lineage: the source it was answered from, as of when, the latest date in the data read, and each measure's definition."
      required:
        - query_id
        - columns
        - rows
        - source
        - as_of
        - data_through
        - definitions
        - truncated
        - config_version
      properties:
        config_version:
          type: integer
          format: int32
          description: "The configuration version whose metric definitions answered: the active one, or the one asked for."
        query_id:
          type: string
          description: Stable for the same query and company scope, so saved reports can refer to it.
        columns:
          type: array
          description: The dimensions, then the measures, in the order of each row's cells.
