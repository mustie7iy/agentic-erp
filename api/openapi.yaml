  "/v1/journal-entries/{id}:reverse":
    post:
      operationId: reverseJournalEntry
      tags:
        - ledger
      summary: Reverse a journal entry
      description: "Posts a reversal entry with every amount negated and links both entries. Open-item lines of the original are cleared against the reversal's lines in the same transaction (the reversal entry is the clearing document), so the pair leaves the open items. An entry can be reversed at most once (409). Manual entries (`source_context` `ledger`), entries a migration run loaded (`integration`) and payment entries (`payments`) are reversed here. A supplier invoice's entry (`payables`) is 409 `ledger.entry_owned_elsewhere` and is reversed with `POST /v1/supplier-invoices/{id}:reverse`; a goods movement's WE entry (`procurement`) is 409 `ledger.entry_owned_elsewhere` too: a goods receipt is reversed with `POST /v1/goods-receipts/{id}:reverse`, which posts its own entry. Entries of any other context are 409 `ledger.entry_owned_elsewhere` too: no reversal path exists for them yet. Returns the new reversal entry. Human-only."
      x-permission: ledger.entry.post
      x-agent: false
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Parameters of reverseJournalEntry.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryReverse"
            examples:
              reverse:
                summary: Reverse on the original date
                value:
