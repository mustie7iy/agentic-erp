      type: object
      description: "One case of a regression suite: a supplier invoice and the decision it got when the suite was captured."
      required:
        - case_no
        - supplier_invoice_id
        - document_number
        - company
        - why
        - expected_decision
        - expected_issues
      properties:
        case_no:
          type: integer
          format: int32
          description: "Position among the suite's cases the reader is shown: a reader of every company is shown the suite's own numbering; any other reader the cases of their companies numbered from 1, so that the numbers tell nothing of other companies' cases. It is therefore not a stable identifier (it changes with the reader's company access); `supplier_invoice_id` is."
          minimum: 1
          readOnly: true
        supplier_invoice_id:
          type: string
          format: uuid
          description: The invoice replayed.
          readOnly: true
        document_number:
          type: string
