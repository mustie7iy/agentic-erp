              account: {type: string, description: "The number of the account the line posts to.", readOnly: true}
          readOnly: true
        matching_rules:
          type: array
          description: "How lines are matched, in the order the rules are tried."
          items:
            type: object
            description: A matching rule.
            required: [kind]
