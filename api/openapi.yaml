            - description
            - event_types
            - status
          properties:
            url:
              type: string
              description: "The HTTPS endpoint, without credentials or fragment; a query may carry the endpoint's token."
              maxLength: 2048
            description:
              type: string
              description: What the endpoint is for.
              maxLength: 200
            event_types:
              type: array
              description: "CloudEvents types marked `x-webhook` in the AsyncAPI contract, or `<context>.*` for all of a context's."
              minItems: 1
              maxItems: 100
              items:
                type: string
                description: An event type or a context wildcard.
                maxLength: 200
            status:
              type: string
              description: "Status. `paused` (by `:pause`, how a tenant stops deliveries): deliveries are held and sent in order on `:resume`. `disabled`: the dispatcher stopped after 5 days of failures or a 410 Gone (`disabled_reason`); its pending deliveries are dropped, and `:resume` makes it active again for later events. Moving to `disabled` changes the version; `failing_since` alone does not. `deleted`: ended by `:delete`. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
              x-extensible-enum:
                - active
                - paused
                - disabled
                - deleted
              readOnly: true
            disabled_reason:
              type: string
              description: "Why the dispatcher disabled it; present only when `disabled`. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
              x-extensible-enum:
                - failing
                - gone
              readOnly: true
            failing_since:
              type: string
              format: date-time
              description: First failed delivery since the last success or the last `:pause` or `:resume`; absent while deliveries succeed.
              readOnly: true
            previous_secret_expires_at:
              type: string
              format: date-time
              description: "Until when the previous secret also signs, after a rotation; absent otherwise."
              readOnly: true
            secret:
              type: string
              description: "The `whsec_` signing secret: present only in the answers to create and `:rotateSecret`, never stored in the clear."
              readOnly: true
              maxLength: 200
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d51"
          version: 1
          created_at: "2026-10-19T09:00:00Z"
