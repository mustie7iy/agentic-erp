    ExchangeRate:
      type: object
      description: "An exchange rate. Insert-only; (rate_type, from_currency, to_currency, valid_from) is unique, and a correction is a new rate."
      required:
        - id
        - rate_type
        - from_currency
        - to_currency
        - valid_from
        - rate
        - source
        - created_at
        - created_by
      properties:
        id:
          type: string
          format: uuid
          description: Identifier (UUIDv7).
          readOnly: true
