        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      operationId: updateAiPolicy
      tags:
        - agents
      summary: Update the tenant's AI policy
      description: "Changes the policy. JSON Merge Patch (RFC 7396): absent fields are unchanged, `null` removes the monthly cap, `routes` and `allowed_models` are replaced as a whole. `enabled: false` is the tenant's kill switch: the model gateway refuses every call (403 `agents.ai_disabled`) and agents' requests are refused, while people and services work on. The platform's operators can suspend a tenant's AI too, which wins over `enabled`; only they lift it. The cap is in USD, the prices' currency. Every alias must route, under the policy, to a model it allows and that has a recorded price, and `routes` may name only the platform's aliases (422 `agents.invalid_policy`). A route may not move an alias to a model on which one of the tenant's agents on it, above level 0, is not certified for its level (ADR-0039), unless its type has never been certified (422 `agents.uncertified_route`). Human-only. Recorded in the audit trail and published as `AiPolicyChanged`."
      x-permission: agents.ai_policy.manage
      x-agent: false
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Merge patch for the policy.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AiPolicyUpdate"
      responses:
        "200":
          description: "Updated; the policy after the change."
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            RateLimit-Limit:
