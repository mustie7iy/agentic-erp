              readOnly: true
            base_revision:
              type: integer
              format: int32
              description: The order's revision the change is based on.
              readOnly: true
            revision:
              type: integer
              format: int32
              description: "The order's revision the change made; set once `applied`."
              readOnly: true
            order_date:
              type: string
              format: date
