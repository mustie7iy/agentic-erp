              readOnly: true
            cleared_invoice_id:
              type: string
              format: uuid
              description: The supplier invoice the down payment was cleared against; set with status `cleared`.
              readOnly: true
            clearing_entry_id:
              type: string
              format: uuid
              description: The transfer entry that cleared the down payment; set with status `cleared`.
              readOnly: true
            cancel_reason:
