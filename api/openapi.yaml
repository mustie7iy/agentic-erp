          code: required
          message: invoice_date is required.
    Problem:
      type: object
      description: "RFC 9457 problem details, returned as `application/problem+json` for every error."
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          description: URI identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
          minimum: 400
          maximum: 599
        code:
          type: string
          description: "Stable error code; clients and agents branch on this, never on `detail`."
          pattern: "^[a-z_]+(\\.[a-z_]+)+$"
        detail:
          type: string
          description: Explanation of this occurrence.
        instance:
          type: string
          description: URI reference of the request that failed.
          format: uri-reference
        trace_id:
          type: string
          description: W3C trace id of the request.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
          description: Field-level errors (422 and some 400/409).
      examples:
        - type: "https://errors.example.com/request/not-found"
          title: Raise the tier 2 approval limit
          status: 409
          code: payables.invoice.post
    OperationProgress:
      type: object
