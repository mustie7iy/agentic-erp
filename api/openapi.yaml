      description: "Runs the company's matching rules (`companies[].bank_statements.matching_rules`, ADR-0047) on the statement's unmatched lines, and again on the lines a rule left open, as the import does: in the rules' order, the first rule that finds candidates decides. A rule that finds exactly one candidate, whose payments pay the line's amount, matches the line (`matched`); one that finds several, or payments that do not pay it, leaves an open match listing them for a person (`proposed`). The rules on payments read debits, never reversals; a payment another line's match holds settles no line: the id rules leave the line open for a person, and the amount rule skips it. A line a rule left open is compared with what the rules find now: the same candidates leave it as it is, others reject its open match and record the new one (or make it unmatched again). Lines matched or excluded, and an agent's proposals, are never touched, so running it twice changes nothing the second time. Agents may call it: it only applies the rules, and what they cannot decide stays open for a person. The lines the rules matched are then posted as `POST .../lines/{line_no}:post` posts them, by the caller, unless the caller is an agent (agents never post) or lacks `payments.statement.post`, or the house bank has a statement in `gap`: each is posted (`posted`) or waits for the approval of its posting (`pending_approval`); one the ledger refuses (a locked period, no exchange rate) stays `matched` for a person, and the refusal is audited. A line whose posting was rejected or withdrawn is not submitted again by a run. If-Match is the statement's ETag; a run that matches, leaves open or posts a line, and a person's match, exclusion or posting, move it on. Returns the statement with its lines; `GET /v1/bank-statements/{id}/matches` has the matches."
