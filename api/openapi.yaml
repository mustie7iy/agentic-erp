    BankAccountInput:
      type: object
      description: Bank details to add.
      required:
        - account_number
        - account_scheme
        - bank_country_code
        - holder_name
        - valid_from
      properties:
        purpose:
          type: string
          description: "Use of the account. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
          x-extensible-enum:
            - payments
