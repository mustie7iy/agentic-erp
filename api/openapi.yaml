    InsertOnlyFields:
      type: object
      description: "Standard fields of insert-only resources. They are never updated, so they have no `version` or `updated_*`; their ETag is derived from the representation and changes only if derived fields change (for example when an entry is reversed)."
      required:
        - id
        - created_at
        - created_by
      properties:
        id:
          type: string
          format: uuid
          description: Identifier (UUIDv7).
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time (UTC).
          readOnly: true
        created_by:
          type: string
          format: uuid
          description: Principal that created the resource.
          readOnly: true
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d41"
          created_at: "2026-10-09T14:03:11Z"
          created_by: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d74"
    EffectiveDatedFields:
      type: object
      description: "Standard fields of effective-dated grants and assignments. They are insert-only except that validity can be ended (`valid_to`, `ended_at`, `ended_by`); nothing is deleted, so the state on any past date can be reconstructed. No `version`; the ETag is derived from the representation."
      required:
        - id
        - valid_from
        - created_at
        - created_by
      properties:
        id:
          type: string
          format: uuid
          description: Identifier (UUIDv7).
          readOnly: true
        valid_from:
          type: string
          format: date
          description: First day of validity.
          readOnly: true
        valid_to:
          type: string
          format: date
          description: "Day validity ends (exclusive); absent while open-ended. Set or brought forward by `:end`, never into the past."
          readOnly: true
        ended_at:
          type: string
          format: date-time
          description: When validity was ended.
          readOnly: true
        ended_by:
          type: string
          format: uuid
          description: Principal that ended validity.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time (UTC).
          readOnly: true
        created_by:
          type: string
          format: uuid
          description: Principal that created the resource.
          readOnly: true
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d41"
          valid_from: "2026-10-09"
          created_at: "2026-10-09T14:03:11Z"
          created_by: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d74"
    EndInput:
