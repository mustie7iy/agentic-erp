          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "OAuth 2.0 bearer access token (OIDC) issued by the tenant's identity provider; validated for signature, issuer and audience at the gateway and again in the service (ADR-0010). Agents and services use client-credentials tokens tied to their own principal. Authorization (permission, legal entity access, segregation of duties) is checked per operation; the required permission is the operation's `x-permission`. The identity provider the tenant registered decides the token's tenant (ADR-0031); a token of an issuer no tenant registered is 401 `authn.invalid_token`, and while the provider's keys or the registry cannot be read the answer is 503 (`platform.identity_provider_unavailable`, `platform.unavailable`). Where the tenant requires multi-factor authentication, a person's token must prove it by the provider's `acr` or `amr` values, or is answered 401 `identity.mfa_required` with the step-up challenge of RFC 9470 (`WWW-Authenticate: Bearer error=\"insufficient_user_authentication\"` with the `acr_values` to ask the provider for); service and agent tokens are not asked. A person's session (one authentication at the provider: its `sid`, or the subject's `auth_time`) lasts the tenant's session lifetime from that authentication and ends after its idle timeout without a request: 401 `identity.session_expired` or `identity.session_idle`, and an ended session never resumes, even with a refreshed token. A person's token with neither `auth_time` nor `sid` is 401 `identity.session_unknown`, and one valid for longer than the session lifetime (`exp` − `iat`) 401 `identity.session_expired`."
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier (UUIDv7).
      schema:
        type: string
        format: uuid
      example: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d04"
    PermissionId:
      name: permission_id
      in: path
      required: true
      description: Role permission grant identifier (UUIDv7).
      schema:
        type: string
        format: uuid
      example: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d1f"
    ChangeId:
      name: change_id
      in: path
      required: true
      description: Order change identifier (UUIDv7).
      schema:
        type: string
        format: uuid
      example: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d1f"
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      description: Webhook delivery identifier (UUIDv7).
      schema:
        type: string
        format: uuid
      example: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d61"
    BankAccountId:
      name: bank_account_id
      in: path
      required: true
      description: Bank account identifier (UUIDv7).
      schema:
        type: string
        format: uuid
      example: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d1e"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: "The ETag (version) the client last read. A mismatch returns 412 and changes nothing; a missing header returns 428 (ADR-0008)."
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: "\"3\""
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: "The ETag the client last read. When it still matches, the answer is 304 without a body."
      schema:
        type: string
        minLength: 1
        maxLength: 256
      example: "\"3\""
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Client-chosen key, unique per logical request (a UUID is recommended), kept for 7 days per tenant. A repeat with the same body returns the original status and body with `Idempotent-Replayed: true`; a different body returns 422; a repeat while the first is still running returns 409 with `Retry-After`. Missing returns 428."
      schema:
        type: string
        minLength: 8
        maxLength: 255
      example: "4f1c2a7e-8d55-4c3b-9a0e-6b2d1e3f4a5b"
    PageSize:
      name: page_size
      in: query
      required: false
      description: Maximum number of items to return. Defaults to 50, maximum 500.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 50
    PageToken:
      name: page_token
      in: query
      required: false
      description: "Opaque cursor from `next_page_token` of the previous page. Tokens are signed and encode the sort keys; they are only valid with the same filters and `order_by`."
      schema:
        type: string
        maxLength: 2048
    OrderBy:
      name: order_by
      in: query
      required: false
      description: "Sort order as `field [asc|desc]`, comma-separated. Only the fields listed in the operation description are accepted; others return 400."
      schema:
        type: string
        pattern: "^[a-z_]+( (asc|desc))?(, ?[a-z_]+( (asc|desc))?)*$"
        maxLength: 200
      example: posting_date desc
    Include:
      name: include
      in: query
      required: false
      description: "Optional extras. `total_estimate` adds a planner estimate of the number of matches where it is cheap."
      schema:
        type: string
        description: "Extras to include in a list response. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
        x-extensible-enum:
          - total_estimate
    Expand:
      name: expand
      in: query
      required: false
      description: "Referenced resources to embed as read-only copies under `expanded`. Only the values listed in the operation description are accepted. Expansion never crosses tenants or permissions."
      schema:
        type: array
        items:
          type: string
          pattern: "^[a-z_]+$"
        maxItems: 5
      style: form
      explode: false
      example:
        - supplier
    LegalEntityId:
      name: legal_entity_id
      in: query
      required: false
      description: Only resources of this legal entity (company code).
      schema:
        type: string
        format: uuid
    SupplierId:
      name: supplier_id
      in: query
      required: false
      description: Only resources of this supplier (business partner id).
      schema:
        type: string
        format: uuid
    PartnerId:
      name: partner_id
      in: query
      required: false
      description: Only resources of this business partner.
      schema:
        type: string
        format: uuid
    DocumentNumber:
      name: document_number
      in: query
      required: false
      description: Only the document with this human document number.
      schema:
        type: string
        maxLength: 40
    PostingDateFrom:
      name: posting_date_from
      in: query
      required: false
      description: Only documents with a posting date on or after this date.
      schema:
        type: string
        format: date
    PostingDateTo:
      name: posting_date_to
      in: query
      required: false
      description: Only documents with a posting date on or before this date.
      schema:
        type: string
        format: date
    FiscalYear:
      name: fiscal_year
      in: query
      required: false
      description: Only this fiscal year.
      schema:
        type: integer
        format: int32
        minimum: 1900
        maximum: 2999
  headers:
    ETag:
      description: "Strong entity tag of the returned resource. For mutable resources it equals `version` (for example `\"3\"`); send it back in `If-Match`."
      schema:
        type: string
      example: "\"3\""
    Location:
      description: URL of the created resource, or of the Operation for 202 responses.
      schema:
        type: string
        format: uri-reference
    IdempotentReplayed:
      description: "`true` when this response is a stored replay of an earlier request with the same `Idempotency-Key`."
      schema:
        type: boolean
    RateLimitLimit:
      description: Request quota of the current window for the caller.
      schema:
        type: integer
        format: int32
        minimum: 0
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
        format: int32
        minimum: 0
    RateLimitReset:
      description: Seconds until the current window resets.
      schema:
        type: integer
        format: int32
        minimum: 0
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        format: int32
        minimum: 0
    WwwAuthenticate:
      description: "Bearer challenge (RFC 6750); `error=\"insufficient_user_authentication\"` with `acr_values` asks for a step-up (RFC 9470)."
      schema:
        type: string
  schemas:
    Money:
      type: object
      description: A monetary amount (ADR-0005). The server stores minor units and rejects amounts with the wrong number of decimals (400).
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Decimal string with exactly the currency's minor-unit digits (2 for EUR, 0 for JPY, 3 for KWD). Never a JSON number. Negative only where the field says so.
          pattern: "^-?(0|[1-9][0-9]{0,17})(\\.[0-9]{1,4})?$"
          example: "1080.00"
        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: "^[A-Z]{3}$"
          example: EUR
      additionalProperties: false
      example:
        amount: "1080.00"
        currency: EUR
    Quantity:
      type: object
      description: A quantity with its unit of measure.
      required:
        - value
        - unit
      properties:
        value:
          type: string
          description: Decimal string with up to 6 decimals.
          pattern: "^-?(0|[1-9][0-9]{0,13})(\\.[0-9]{1,6})?$"
          example: "12.5"
        unit:
          type: string
          description: Unit of measure code (reference data).
          pattern: "^[A-Z0-9]{1,6}$"
          example: KG
      additionalProperties: false
      example:
        value: "12.5"
        unit: KG
    Decimal:
      type: string
      description: Decimal string (exchange rates, percentages). Never a JSON number.
      pattern: "^-?(0|[1-9][0-9]{0,15})(\\.[0-9]{1,12})?$"
      example: "1.083400000000"
    Extensions:
      type: object
      additionalProperties: true
      description: Tenant custom fields (ADR-0009), validated against the tenant's published schema for this resource type. Keys are snake_case.
      example:
        cost_object_hint: MKT-2026
    AiPolicy:
      type: object
      description: "A tenant's AI policy (ADR-0036)."
      required:
        - version
        - enabled
        - suspended
        - active
        - routes
        - effective_routes
        - allowed_models
        - documents_to_models
      properties:
        version:
          type: integer
          format: int32
          description: Optimistic-lock version; equals the ETag.
          minimum: 1
          readOnly: true
        enabled:
          type: boolean
          description: "The tenant's administrators' hand on the kill switch: false switches the tenant's AI off."
        suspended:
          type: boolean
          description: "The platform's operators' hand on the kill switch, which wins over `enabled`."
          readOnly: true
        suspended_reason:
          type: string
          description: "Why the operators suspended the tenant's AI, while suspended."
          readOnly: true
        active:
          type: boolean
          description: "Whether the tenant's AI runs: enabled and not suspended."
          readOnly: true
        monthly_cap:
          $ref: "#/components/schemas/Money"
          description: "The tenant's monthly cap on model spending, in USD; absent: none. Every caller's calls are held against it (ADR-0036)."
        routes:
          type: object
          description: "Model alias → model, over the platform's routes."
          additionalProperties:
            type: string
          examples:
            - erp-default: claude-opus-5-5
        effective_routes:
          type: object
          description: "Where each of the platform's aliases routes under the policy."
          additionalProperties:
            type: string
          readOnly: true
        allowed_models:
          type: array
          description: "The models the aliases may route to; empty: any model with a recorded price."
          items:
            type: string
        documents_to_models:
          type: boolean
          description: "Whether documents (PDF and image blocks) may go to models; while off, the gateway refuses a call carrying one, capture's included, with 422 `agents.documents_withheld`."
        updated_at:
          type: string
          format: date-time
          description: Last change, by the tenant's administrators or the platform's operators; absent while the policy has the defaults.
          readOnly: true
        updated_by:
          type: string
          format: uuid
          description: Who changed it last, one of the tenant's administrators or a platform operator (`suspendAi`, `resumeAi`); absent while the policy has the defaults.
          readOnly: true
      additionalProperties: false
    AiPolicyUpdate:
      type: object
      description: Merge patch of the AI policy.
      properties:
        enabled:
          type: boolean
          description: "false switches the tenant's AI off; true switches it back on, unless the operators have suspended it."
        monthly_cap:
          type:
            - object
            - "null"
          description: "The monthly cap in USD. Send null to remove it."
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Decimal string with exactly the currency's minor-unit digits.
              pattern: "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,4})?$"
              example: "500.00"
            currency:
              type: string
              description: ISO 4217 currency code; USD, the prices' currency.
              pattern: "^[A-Z]{3}$"
              example: USD
          additionalProperties: false
        routes:
          type: object
          description: "Model alias → model; replaces the policy's routes."
          maxProperties: 16
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 100
        allowed_models:
          type: array
          description: "The models the aliases may route to; replaces the list. Empty: any priced model."
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
        documents_to_models:
          type: boolean
          description: Whether documents may go to models.
      additionalProperties: false
      examples:
        - enabled: false
    AiUsage:
      type: object
      description: "A tenant's model usage in one month (ADR-0036)."
      required:
        - month
        - calls
        - cost
        - principals
      properties:
        month:
          type: string
          description: The month, YYYY-MM (UTC).
          example: "2026-10"
        calls:
          type: integer
          format: int64
          description: Model calls in the month.
          minimum: 0
        cost:
          $ref: "#/components/schemas/Money"
          description: What the month's calls cost, in USD, the prices' currency.
        monthly_cap:
          $ref: "#/components/schemas/Money"
          description: "The tenant's monthly cap as it is now (getAiPolicy), which for a past month may not be the cap that held then; absent: none."
        principals:
          type: array
          description: Usage per principal that called, the most costly first.
          maxItems: 10000
          items:
            $ref: "#/components/schemas/AiUsagePrincipal"
      additionalProperties: false
    AiUsagePrincipal:
      type: object
      description: "One principal's model usage in the month."
      required:
        - principal_id
        - calls
        - input_tokens
        - output_tokens
        - cache_write_tokens
        - cache_read_tokens
        - redactions
        - cost
      properties:
        principal_id:
          type: string
          format: uuid
          description: "The principal that called: an agent, or the person or service whose request made the call."
        calls:
          type: integer
          format: int64
          minimum: 0
          description: Calls made.
        input_tokens:
          type: integer
          format: int64
          minimum: 0
          description: Input tokens, as the provider reported them.
        output_tokens:
          type: integer
          format: int64
          minimum: 0
          description: Output tokens.
        cache_write_tokens:
          type: integer
          format: int64
          minimum: 0
          description: Input tokens written to the provider's cache.
        cache_read_tokens:
          type: integer
          format: int64
          minimum: 0
          description: Input tokens read from it.
        redactions:
          type: integer
          format: int64
          minimum: 0
          description: Replacements the gateway made in the calls' text before it left the cell.
        cost:
          $ref: "#/components/schemas/Money"
          description: What the calls cost, in USD.
      additionalProperties: false
    AgentSession:
      type: object
      description: "A session in which an agent worked through the API: what it was for, which model, its tool calls and recommendations, and what it used."
      required:
        - id
        - version
        - agent_id
        - purpose
        - model
        - status
        - input_tokens
        - output_tokens
        - started_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Identifier (UUIDv7).
          readOnly: true
        version:
          type: integer
          format: int32
          description: Optimistic-lock version; equals the ETag.
          minimum: 1
          readOnly: true
        agent_id:
          type: string
          format: uuid
          description: The agent principal.
          readOnly: true
        purpose:
          type: string
          description: What the session was for.
          readOnly: true
        model:
          type: string
          description: Model the agent ran on.
          readOnly: true
        status:
          type: string
          description: "Status. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
          x-extensible-enum:
            - running
            - completed
            - failed
            - refused
          readOnly: true
        input_tokens:
          type: integer
          format: int64
          description: Input tokens used.
          minimum: 0
          readOnly: true
        output_tokens:
          type: integer
          format: int64
          description: Output tokens used.
          minimum: 0
          readOnly: true
        cost:
          $ref: "#/components/schemas/Money"
          description: Cost of the session, once ended.
          readOnly: true
        autonomy_level:
          type: integer
          format: int32
          description: "On the response that starts the session: the agent's autonomy level then (ADR-0036). An agent offers its model only the operations its level performs (GET and `x-autonomy: read` at every level, `x-autonomy: propose` from level 1, other writes from level 2); the API refuses the others with 403 `identity.autonomy_insufficient` anyway."
          minimum: 0
          maximum: 3
          readOnly: true
        started_at:
          type: string
          format: date-time
          description: Start time.
          readOnly: true
        ended_at:
          type: string
          format: date-time
          description: End time.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Time of the last change.
          readOnly: true
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c01"
          version: 1
          agent_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c02"
          purpose: Investigate held supplier invoices
          model: claude-opus-5-5
          status: running
          input_tokens: 0
          output_tokens: 0
          started_at: "2026-10-09T14:03:11Z"
          updated_at: "2026-10-09T14:03:11Z"
    AgentSessionStart:
      type: object
      description: A session to start.
      required:
        - purpose
        - model
      properties:
        purpose:
          type: string
          description: What the session is for.
          minLength: 1
          maxLength: 500
        model:
          type: string
          description: Model the agent runs on.
          minLength: 1
          maxLength: 100
      additionalProperties: false
      examples:
        - purpose: Investigate held supplier invoices
          model: claude-opus-5-5
    AgentSessionEnd:
      type: object
      description: How a session ended and what it used.
      required:
        - status
        - input_tokens
        - output_tokens
      properties:
        status:
          type: string
          description: "Outcome. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
          x-extensible-enum:
            - completed
            - failed
            - refused
        input_tokens:
          type: integer
          format: int64
          description: "Ignored: the gateway's ledger counts the session's tokens (ADR-0036)."
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          description: "Ignored: the gateway's ledger counts the session's tokens (ADR-0036)."
          minimum: 0
        cost:
          $ref: "#/components/schemas/Money"
          description: "Ignored: the gateway's ledger prices the session's calls (ADR-0036)."
      additionalProperties: false
      examples:
        - status: completed
          input_tokens: 18200
          output_tokens: 2100
    AgentSessionPage:
      type: object
      description: One page of agent sessions.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentSession"
          description: The sessions on this page.
        next_page_token:
          type: string
          description: "Opaque cursor for the next page; absent on the last page."
          maxLength: 2048
      examples:
        - items: []
    AgentToolCall:
      type: object
      description: "One tool call of an agent session: the API operation it called, its input and a summary of the result. Insert-only."
      required:
        - session_id
        - seq
        - tool
        - input
        - is_error
        - called_at
      properties:
        session_id:
          type: string
          format: uuid
          description: Session.
          readOnly: true
        seq:
          type: integer
          format: int32
          description: Position in the session, from 1.
          minimum: 1
          readOnly: true
        tool:
          type: string
          description: "Tool called: the operationId of an API operation."
          readOnly: true
        input:
          type: object
          additionalProperties: true
          description: Input the agent gave.
          readOnly: true
        result_summary:
          type: string
          description: Summary of the result.
          readOnly: true
        is_error:
          type: boolean
          description: Whether the call failed.
          readOnly: true
        called_at:
          type: string
          format: date-time
          description: When it was recorded.
          readOnly: true
      examples:
        - session_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c01"
          seq: 1
          tool: getSupplierInvoice
          input:
            id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c03"
          result_summary: "200"
          is_error: false
          called_at: "2026-10-09T14:03:12Z"
    AgentToolCallCreate:
      type: object
      description: A tool call to record.
      required:
        - tool
        - input
      properties:
        tool:
          type: string
          description: The operationId called.
          pattern: "^[a-z][A-Za-z0-9]*$"
          maxLength: 100
        input:
          type: object
          additionalProperties: true
          description: Input the agent gave.
        result_summary:
          type: string
          description: Summary of the result.
          maxLength: 2000
        is_error:
          type: boolean
          description: Whether the call failed.
      additionalProperties: false
      examples:
        - tool: getSupplierInvoice
          input:
            id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c03"
          result_summary: "200"
    AgentToolCallPage:
      type: object
      description: One page of tool calls.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolCall"
          description: The tool calls on this page.
        next_page_token:
          type: string
          description: "Opaque cursor for the next page; absent on the last page."
          maxLength: 2048
      examples:
        - items: []
    Recommendation:
      type: object
      description: "An agent's recommendation on a business object, and what a person decided."
      required:
        - id
        - version
        - session_id
        - agent_id
        - object_type
        - object_id
        - kind
        - content
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Identifier (UUIDv7).
          readOnly: true
        version:
          type: integer
          format: int32
          description: Optimistic-lock version; equals the ETag.
          minimum: 1
          readOnly: true
        session_id:
          type: string
          format: uuid
          description: Session that made it.
          readOnly: true
        agent_id:
          type: string
          format: uuid
          description: The agent.
          readOnly: true
        object_type:
          type: string
          description: "Kind of object, for example `supplier_invoice` or `change_request`."
          readOnly: true
        object_id:
          type: string
          format: uuid
          description: The object.
          readOnly: true
        kind:
          type: string
          description: "What is recommended, for example `release_hold`."
          readOnly: true
        content:
          type: string
          description: The recommendation and its reasons.
          readOnly: true
        outcome:
          type: string
          description: "What people decided; absent while open. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
          x-extensible-enum:
            - accepted
            - overridden
            - ignored
          readOnly: true
        decided_by:
          type: string
          format: uuid
          description: The person who decided.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Time of the last change.
          readOnly: true
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c04"
          version: 1
          session_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c01"
          agent_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c02"
          object_type: supplier_invoice
          object_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c03"
          kind: release_hold
          content: The price matches the supplier's new price list; release the hold.
          created_at: "2026-10-09T14:03:13Z"
          updated_at: "2026-10-09T14:03:13Z"
    RecommendationCreate:
      type: object
      description: A recommendation to record.
      required:
        - session_id
        - object_type
        - object_id
        - kind
        - content
      properties:
        session_id:
          type: string
          format: uuid
          description: The caller's running session.
        object_type:
          type: string
          description: Kind of object.
          pattern: "^[a-z][a-z_]*$"
          maxLength: 100
        object_id:
          type: string
          format: uuid
          description: The object.
        kind:
          type: string
          description: What is recommended.
          pattern: "^[a-z][a-z_]*$"
          maxLength: 100
        content:
          type: string
          description: The recommendation and its reasons.
          minLength: 1
          maxLength: 10000
      additionalProperties: false
      examples:
        - session_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c01"
          object_type: supplier_invoice
          object_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5c03"
          kind: release_hold
          content: The price matches the supplier's new price list; release the hold.
    RecommendationDecide:
      type: object
      description: What a person did with a recommendation.
      required:
        - outcome
      properties:
        outcome:
          type: string
          description: "Decision. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
          x-extensible-enum:
            - accepted
            - overridden
            - ignored
        comment:
          type: string
          description: Optional comment, recorded in the audit trail.
          maxLength: 2000
      additionalProperties: false
      examples:
        - outcome: accepted
    RecommendationPage:
      type: object
      description: One page of recommendations.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
          description: The recommendations on this page.
        next_page_token:
          type: string
          description: "Opaque cursor for the next page; absent on the last page."
          maxLength: 2048
      examples:
        - items: []
    AuditFields:
      type: object
      description: "Standard fields of mutable resources (04-api-design §4.4)."
      required:
        - id
        - version
        - created_at
        - created_by
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Identifier (UUIDv7).
          readOnly: true
        version:
          type: integer
          format: int32
          description: "Optimistic-lock version; equals the ETag. Increases by one on every change."
          minimum: 1
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Creation time (UTC).
          readOnly: true
