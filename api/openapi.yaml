          type: string
          description: "Rate type (SAP M average, G bank buying, B bank selling, P planning). Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
          x-extensible-enum:
            - average
            - bank_buying
            - bank_selling
            - planning
          readOnly: true
        from_currency:
          type: string
          description: Source currency.
          pattern: "^[A-Z]{3}$"
          example: EUR
          readOnly: true
        to_currency:
          type: string
          description: Target currency.
          pattern: "^[A-Z]{3}$"
          example: EUR
          readOnly: true
        valid_from:
          type: string
          format: date
          description: "First day the rate applies; it applies until the next rate of the same pair and type."
          readOnly: true
        rate:
          $ref: "#/components/schemas/Decimal"
          description: "Units of `to_currency` per unit of `from_currency`."
          readOnly: true
        source:
          type: string
          description: "Where the rate came from, for example `ECB`."
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: When the rate was recorded.
          readOnly: true
        created_by:
          type: string
          format: uuid
          description: Principal that recorded it.
          readOnly: true
