    AnalyticsQuery:
      type: object
      description: "A semantic query: governed metrics, the dimensions to break them down by, filters on dimensions, ordering and a row limit. Unknown metrics or dimensions, dimensions the metrics do not share and malformed filters are 422 `analytics.invalid_query`."
      required:
        - measures
      properties:
        measures:
          type: array
          description: Metric names of the semantic model.
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 100
        by:
          type: array
          description: Dimensions to break the metrics down by.
          maxItems: 10
          items:
            type: string
            maxLength: 100
        where:
          type: array
          description: Filters on dimensions, all of which a row must meet.
          maxItems: 20
          items:
            $ref: "#/components/schemas/AnalyticsFilter"
        order_by:
          type: string
          description: A measure or dimension of the query to order rows by.
          maxLength: 100
        desc:
          type: boolean
          description: Order descending.
        limit:
          type: integer
          description: At most this many rows; the result is cut at 500 in any case.
          minimum: 1
          maximum: 500
        ledger:
          type: string
          format: uuid
          description: "The ledger journal metrics read; the tenant's leading ledger when omitted (ADR-0044)."
        as_of:
          type: string
          format: date-time
          description: "The answer must reflect the data as of this time or later: a store found current earlier is not used, and the database answers."
        companies:
          type: array
          description: Company codes to restrict the answer to, within those the principal may read; all of those when omitted.
          maxItems: 100
          items:
            type: string
            maxLength: 20
        config_version:
          type: integer
          format: int32
          description: "Answer under the metric definitions of this configuration version, on current data (an audit of what a report meant when it was made); the active version's when omitted. An unknown version is 422 `config.unknown_version` (ADR-0044)."
          minimum: 1
      additionalProperties: false
      examples:
        - measures: [revenue]
          by: [fiscal_year, fiscal_month]
          where:
            - dim: fiscal_year
              op: in
              values: ["2026"]
    AnalyticsFilter:
      type: object
      description: A filter on a dimension.
      required:
        - dim
        - op
        - values
      properties:
        dim:
          type: string
          description: The dimension filtered.
          maxLength: 100
        op:
          type: string
          description: "`in` and `not_in` take any number of values, `<=` and `>=` one, `between` two."
          x-extensible-enum:
            - in
            - not_in
            - "<="
            - ">="
            - between
        values:
          type: array
          description: The values compared with.
          maxItems: 1000
          items:
            type: string
            maxLength: 200
      additionalProperties: false
    AnalyticsModel:
      type: object
