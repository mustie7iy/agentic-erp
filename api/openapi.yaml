        - total
      properties:
        done:
          type: integer
          format: int64
          description: Units of work done.
          minimum: 0
        total:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          description: "Total units of work; `null` while unknown."
      examples:
        - done: 41000
          total: 100000
    Operation:
      type: object
      description: "A long-running operation (ADR-0012). Poll `GET /v1/operations/{id}` or subscribe to its completion event."
      required:
        - id
        - kind
        - status
        - progress
        - resource
        - version
        - created_at
        - created_by
        - updated_at
        - updated_by
      properties:
        id:
          type: string
          format: uuid
          description: Operation identifier.
          readOnly: true
        kind:
          type: string
          description: "What the operation does, as `<context>.<action>`."
          pattern: "^[a-z_]+\\.[a-z_]+$"
          example: payments.propose
          readOnly: true
        status:
          type: string
          description: "Lifecycle status. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
          x-extensible-enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
          readOnly: true
        progress:
          $ref: "#/components/schemas/OperationProgress"
          description: Progress so far.
          readOnly: true
        resource:
          type:
            - string
            - "null"
          format: uri-reference
          description: "API path of the resource the operation creates or changes; `null` until known."
          readOnly: true
        result:
          type: object
          additionalProperties: true
          description: "Operation-specific result, present when `status` is `succeeded`."
          readOnly: true
        error:
          $ref: "#/components/schemas/Problem"
          description: "Why the operation failed, present when `status` is `failed`."
          readOnly: true
        version:
          type: integer
          format: int32
          description: "Version; changes as the operation progresses."
          minimum: 1
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Start time.
          readOnly: true
        created_by:
          type: string
          format: uuid
          description: Principal that started the operation.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Time of the last progress update.
          readOnly: true
        updated_by:
          type: string
          format: uuid
          description: Principal that made the last change (the starter, or whoever cancelled).
          readOnly: true
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d41"
          kind: payments.propose
          status: queued
          progress:
            done: 41000
            total: 100000
          resource: /v1/operations/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d0c
          version: 1
          created_at: "2026-10-09T14:03:11Z"
          created_by: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d74"
          updated_at: "2026-10-09T14:03:11Z"
          updated_by: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d7f"
