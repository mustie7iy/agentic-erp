      operationId: submitChangeRequest
      tags:
        - configuration
      summary: Submit a change request
      description: "Moves a draft to `validating`. The server validates it and computes items and tier; it becomes `invalid` (fix it with PATCH, which returns it to `draft`, or `:withdraw` it) or `awaiting_evidence`. Once the evidence its tier requires has passed it becomes `pending_approval` and an approval request is opened; decisions are made on that approval request, which moves the change to `approved` or `rejected`. Requires status `draft`."
