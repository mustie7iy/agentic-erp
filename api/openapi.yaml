# Agentic ERP public API contract (OpenAPI 3.1), Phase 1.
# Source of truth for server interfaces and clients (ADR-0013); rules: docs/design/04-api-design.md.
# Every operation declares x-permission (a code seeded in ref.permission, db/migrations/000001_foundation.up.sql).
# api/spec_test.go enforces the API rules on this file; lint with vacuum (api/vacuum-ruleset.yaml).
openapi: "3.1.0"
info:
  title: Agentic ERP API
  version: "1.0.0"
  summary: Public API of the agentic ERP platform (Phase 1).
  description: |-
    Public API of the agentic ERP platform, Phase 1. The web UI, agents, CLI, SAP connectors and partner integrations all use this contract; there are no private endpoints.

    This file is the source of truth (ADR-0013): server interfaces and clients are generated from it. The rules every operation follows are in [04-api-design.md](../docs/design/04-api-design.md). In short:

    - **Tenancy.** The tenant comes from the access token, never from the URL or body. Resources in legal entities the caller cannot access return 404.
    - **Methods.** Standard methods map to HTTP verbs. State transitions are custom methods, `POST /v1/{collection}/{id}:{verb}`, each with its own permission (`x-permission`), validation, audit record and event. `PATCH` (JSON Merge Patch) is offered only on drafts and master data. Nothing is ever deleted: drafts are cancelled, master data is blocked, posted documents are reversed. Collection-level custom methods (`POST /v1/{collection}:{verb}`) start new long-running work and return 202.
    - **Concurrency and retries.** `GET` returns `ETag`; `PATCH` and instance custom methods require `If-Match` (412 on mismatch). Every `POST` and `PATCH` requires `Idempotency-Key` (ADR-0008).
    - **Representations.** `snake_case` fields. Money is `{"amount": "1080.00", "currency": "EUR"}` with a decimal string; quantities are `{"value": "12.5", "unit": "KG"}`. Instants are RFC 3339 UTC, business dates `YYYY-MM-DD`. Optional fields without a value are omitted; `null` is used in merge patches to clear a field and where a schema gives it a meaning (an Operation's unknown total or resource). Counts are JSON integers; there are no JSON floating-point numbers.
    - **Enumerations are open.** Enumerated values are listed with `x-extensible-enum` rather than `enum`: clients must accept and preserve values they do not know, because new values are added within `/v1`.
    - **Lists.** Cursor pagination with `page_size` (default 50, max 500), `page_token` and `next_page_token`; documented filters and `order_by` fields only.
    - **Errors.** RFC 9457 `application/problem+json` with a stable `code`.
    - **Resource kinds.** Mutable resources carry `id`, `version` (= ETag), `created_*` and `updated_*`. Insert-only resources (journal entries, goods receipts, clearings, match results, decisions, audit events) carry `id`, `created_at`, `created_by`; corrections are new documents (`:reverse`). Effective-dated grants (role assignments, role permissions, company access, SoD rules, bank accounts) add `valid_from`, `valid_to`, `ended_at`, `ended_by`: they are never updated otherwise and never deleted, only ended (`:end`). Resources without a version have an ETag derived from their representation, so `If-Match` still guards their custom methods.
    - **Long-running work** returns 202 with an `Operation` (ADR-0012).
    - **Approvals.** Approval decisions are made only on approval requests (`:approve`, `:reject`), which require `workflow.request.decide` plus the approval permission of the object type, listed per operation in `x-object-permissions` (object type to permission code). Payment runs are released directly (`payment-runs/{id}:release`) by a person other than the proposer.
    - **Agents** call the same operations. Operations marked `x-agent: false` (approval decisions, identity administration) are never exposed as agent tools and refuse agent tokens. An agent acts within its autonomy level (`agent_profile.autonomy_level`, ADR-0036): level 0 only reads; level 1 also performs the operations marked `x-autonomy: propose`, which only propose (its sessions, tool-call records and recommendations, change requests, drafts, down payment requests, bank statement line proposals); level 2 performs any write its permissions allow. Operations marked `x-autonomy: read` change no business data though they are not GET (a long-running verification), and every level performs them. Above its level an agent is refused with 403 `identity.autonomy_insufficient`. While the tenant's AI is off (`getAiPolicy`: switched off by its administrators or suspended by the platform's operators), every agent request is refused with 403 `agents.ai_disabled`.
    - **Rate limits.** Every response carries `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`; 429 adds `Retry-After`.
    - **Latency classes.** Each operation's latency objective (01-requirements §1.3) is that of its class: `read` (a GET of one resource), `list` (any other GET), `write` (any other method), unless `x-slo-class` names `approval` or `report` (ADR-0043).
  contact:
    name: Platform API team
    url: "https://github.com/mustie7iy/agentic-erp"
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: "https://{cell}.api.example.com"
    description: "Regional cell serving the tenant (ADR-0003). Paths carry the major version (`/v1/...`)."
    variables:
      cell:
        default: eu1
        description: "Cell identifier from the tenant directory, for example `eu1` or `us1`."
security:
  - oidc: []
tags:
  - name: tenancy
    description: Legal entities (company codes) and organizational units.
  - name: identity
    description: Principals (people, agents, services), roles, role assignments and segregation-of-duties rules. Administration is human-only.
  - name: configuration
    description: "Governed configuration: change requests, configuration versions, number ranges."
  - name: partner
    description: Business partners, bank accounts and governed partner changes.
  - name: ledger
    description: "General ledger: accounts, fiscal periods, journal entries, open items, clearings, balances, exchange rates."
  - name: procurement
    description: Requisitions, purchase orders, contracts and goods receipts.
  - name: payables
    description: Supplier invoices and three-way match results.
  - name: payments
    description: Payment runs, payments and bank files.
  - name: workflow
    description: Approval requests and decisions. Decisions are human-only.
  - name: audit
    description: Tamper-evident audit trail.
  - name: analytics
    description: Governed metrics answered by the semantic layer, from the analytical store or the database, with their lineage.
  - name: agents
    description: Agent sessions, their tool calls and recommendations for people to decide.
  - name: integration
    description: Connectors to external systems, data migration runs and webhook subscriptions.
  - name: platform
    description: Long-running operations.
paths:
  /v1/legal-entities:
    get:
      operationId: listLegalEntities
      tags:
        - tenancy
      summary: List legal entities
      description: "Legal entities the caller has access to. Sortable by: `code`, `name`."
      x-permission: tenancy.org.read
      parameters:
        - name: status
          in: query
          required: false
          description: Only legal entities in this status.
          schema:
            type: string
            description: "Legal entities status. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
            x-extensible-enum:
              - active
              - blocked
              - inactive
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/OrderBy"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: One page of legal entity results.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createLegalEntity
      tags:
        - tenancy
      summary: Create a legal entity
      description: "Creates a legal entity in status `inactive`."
      x-permission: tenancy.org.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The legal entity create request.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalEntityCreate"
      responses:
        "201":
          description: "Created; the new legal entity."
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/v1/legal-entities/{id}":
