    WebhookDelivery:
      type: object
      description: "One event sent, or to be sent, to a subscription's endpoint (ADR-0041). Kept 30 days."
      required:
        - id
        - version
        - subscription_id
        - event_id
        - type
        - subject
        - occurred_at
        - status
        - attempts
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: "Identifier (UUIDv7); the `webhook-delivery-id` header of its requests."
          readOnly: true
        version:
          type: integer
          format: int32
          description: "Optimistic-lock version; equals the ETag. Moves with every attempt."
          minimum: 1
          readOnly: true
        subscription_id:
          type: string
          format: uuid
          description: The subscription it is sent to.
          readOnly: true
        event_id:
          type: string
          format: uuid
          description: "The CloudEvent id: the `webhook-id` of every attempt, redelivery and replay."
          readOnly: true
        type:
          type: string
          description: "The CloudEvents type, or `webhook.ping` for a ping."
          maxLength: 200
          readOnly: true
        subject:
          type: string
          format: uuid
          description: "The resource the event is about (the subscription, for a ping); a resource's deliveries go out in event order."
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          description: When the event occurred.
          readOnly: true
        status:
          type: string
          description: "`pending`: waiting for its first or next attempt. `delivered`: the endpoint answered 2xx. `dead`: retries ran out or the endpoint answered 410 (a ping: its one attempt failed). `dropped`: never sent, since the subscription was disabled. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
          x-extensible-enum:
            - pending
            - delivered
            - dead
            - dropped
          readOnly: true
        attempts:
          type: integer
          format: int32
          description: Attempts made since it was last queued.
          minimum: 0
          readOnly: true
        next_attempt_at:
          type: string
          format: date-time
          description: "When it is attempted next; present only while `pending`."
          readOnly: true
        last_status:
          type: integer
          format: int32
          description: The endpoint's HTTP status at the last attempt.
          minimum: 100
          maximum: 599
          readOnly: true
        last_error:
          type: string
          description: Why the last attempt got no HTTP status.
          maxLength: 1000
          readOnly: true
        delivered_at:
          type: string
          format: date-time
          description: "When the endpoint accepted it; present only when `delivered`."
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: When the delivery was recorded (UTC).
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last change (UTC).
          readOnly: true
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d61"
          version: 3
          subscription_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d51"
          event_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d62"
          type: com.example.erp.ledger.journal_entry_posted.v1
          subject: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d63"
          occurred_at: "2026-10-19T08:59:59Z"
          status: delivered
          attempts: 1
          last_status: 204
          delivered_at: "2026-10-19T09:00:01Z"
          created_at: "2026-10-19T09:00:00Z"
          updated_at: "2026-10-19T09:00:01Z"
    WebhookDeliveryPage:
