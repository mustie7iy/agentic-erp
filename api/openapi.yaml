        business_partner: partner.supplier.read
        purchase_order: procurement.order.read
        supplier_invoice: payables.invoice.read
      parameters:
        - name: entity
          in: path
          required: true
          description: The extensible entity.
          schema:
            type: string
            description: "Extensible entity. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
