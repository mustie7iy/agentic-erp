    AgentProfile:
      type: object
      description: Settings of an agent principal.
      required:
        - autonomy_level
        - model
        - description
      properties:
        autonomy_level:
          type: integer
          format: int32
          description: "Autonomy level 0 (suggest only) to 3. Above 0 the agent's type must be certified for the level on the concrete model its alias routes to under the tenant's AI policy (ADR-0039), or a change that raises the level, or names another type or alias, is 422 `identity.autonomy_uncertified`. An agent whose type has never been certified keeps the level it has, as the agents from before certification do, but is raised by none."
          minimum: 0
          maximum: 3
        agent_type:
          type: string
          description: "What the agent is, whose evaluation suite certifies its autonomy (ADR-0039). The profile is replaced as a whole, so leaving it out clears it: an agent with none stays at level 0 (one from before certification, which never had one, keeps its level), and clearing or changing the type of an agent above level 0 is checked as a raise. Another value is 422 `identity.unknown_agent_type`. Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
          x-extensible-enum:
            - ap_exceptions
            - configuration
            - migration
            - test
            - analytics
            - reconciliation
          maxLength: 50
        model:
          type: string
          description: "The model alias the agent runs on, which the model gateway routes under the tenant's AI policy (ADR-0036): `erp-default`, `erp-extraction` or `erp-analytics`; another value is 422 `identity.unknown_model_alias`. Profiles that named a Claude model before were moved to `erp-default`."
          minLength: 1
          maxLength: 100
        monthly_budget:
          $ref: "#/components/schemas/Money"
          description: "Monthly spending budget; absent when unlimited."
        description:
          type: string
          description: What the agent is for.
          minLength: 1
          maxLength: 2000
      examples:
        - autonomy_level: 1
          agent_type: ap_exceptions
          model: erp-default
          description: Office chairs, ergonomic
