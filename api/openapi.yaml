          type: string
          description: "Full IBAN, domestic account number, or for scheme `ca` the Canadian account number (7-12 digits). Write-only; stored encrypted and never returned."
          minLength: 4
          maxLength: 34
          writeOnly: true
        account_scheme:
          type: string
          description: "Account number scheme: `iban`, `domestic`, or `ca` for a Canadian account (institution, transit and account number; no IBAN). Open enumeration: clients must accept and preserve values not listed here; values may be added within /v1."
          x-extensible-enum:
