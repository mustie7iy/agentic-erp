  "/v1/payment-runs/{id}:release":
    post:
      operationId: releasePaymentRun
      tags:
        - payments
      summary: Release a payment run
      description: "The F110 release step, a direct human transition (not an approval request), as an operation (ADR-0012): the run moves to `releasing`, each payment is posted with the entry that clears its items (one transaction per payment, progress on the operation), and the bank file is produced; the run is `released` when the operation succeeds. Every supplier, and every item of a proposed run, is checked again before anything is posted (409 `payments.proposal_outdated`). A payment not posted yet whose item was reversed, or is no longer open, since the proposal can never post: the release drops it (the supplier is excluded with `item_reversed` or `item_not_open`, its items are freed, the run's total no longer counts it, `PaymentExcluded` is published) and goes on with the others; a release that drops every payment fails with `payments.nothing_to_pay` and returns the run to `proposed`, to be rejected. Human-only. Segregation of duties: the proposer can never release or reject the run (403 `identity.sod_conflict`; the database enforces `decided_by` differs from `proposed_by`). Sets `decided_by` and `decided_at`. Requires status `proposed`, or `releasing` after a failed release operation, which resumes it. 409 `payments.discount_lapsed` when a payment takes a cash discount whose last day has passed (T36d): reject the run and propose again. 409 `ledger.withholding_changed` when an item would withhold another amount than its payment deducted (T46f); the payment is not posted."
      x-permission: payments.run.release
      x-agent: false
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: Parameters of releasePaymentRun.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "202":
          description: "Accepted; releasePaymentRun continues as a long-running operation. Poll the Operation at `Location`; the run is visible in `releasing` meanwhile."
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
