              description: "What is paid, tax included."
            tax_code:
              type: string
              description: "Input tax code of the legal entity; the payment claims the tax the amount includes."
              readOnly: true
            tax_amount:
              $ref: "#/components/schemas/Money"
              description: "The input tax the amount includes, amount × rate / (100 + rate) rounded half away from zero; 0 without a tax code."
