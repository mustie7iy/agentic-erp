# Agentic ERP model gateway contract (OpenAPI 3.1): every model call an agent or the server makes (T42, ADR-0036).
# Served by erp-server on the public listener under /v1/model, outside the generated server: hand-written handlers in
# internal/agents implement it, and internal/agents/gateway_test.go checks every operation here is served.
# Lint with vacuum (api/vacuum-ruleset.yaml).
openapi: "3.1.0"
info:
  title: Agentic ERP model gateway
  version: "1.0.0"
  summary: The cell's gateway to the language models agents use.
  description: |-
    Agents reach models only through their cell's gateway, with their own bearer tokens (certificate-bound in production, ADR-0033); they hold no provider key. The gateway speaks the provider's Messages API, so an agent keeps its SDK and points its base URL at `/v1/model`: the SDK's requests arrive at `POST /v1/model/v1/messages`.

    The request names a model alias, `erp-default`, `erp-extraction` or `erp-analytics`, which the gateway routes to a concrete model; a concrete model id is refused. Only the fields listed in `ModelRequest` are forwarded; server tools and streaming are refused. Every call, answered or not, is one row of the tenant's model call ledger with its tokens and cost, never its content (ADR-0036); a model without a recorded price is refused before the call, so no call goes unmetered. A call made within an agent session (`Erp-Agent-Session`) adds its tokens and cost to the session.

    The gateway authenticates in a short transaction of its own and writes the ledger in another after the call: no database transaction is held while the model works. A call is not idempotent: a retried call is another call, billed again.
  contact:
    name: Platform API team
    url: "https://github.com/mustie7iy/agentic-erp"
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: "https://{host}"
    description: "The tenant's cell, reached through the router."
    variables:
      host:
        default: "api.example.com"
        description: "The public API host."
security:
  - oidc: []
tags:
  - name: models
    description: "Model calls through the gateway (ADR-0036)."
paths:
  /v1/model/v1/messages:
    post:
      operationId: createModelMessage
      tags:
        - models
      summary: Call a model
      description: "Sends one Messages API request to the model the alias routes to and answers with the provider's message, unchanged but for the model it names. The answer carries `Erp-Model` (the model that answered) and `Erp-Model-Cost` (the call's cost in millionths of the currency's minor unit, with `Erp-Model-Cost-Currency`). A provider's error answer (429, 5xx and the like) is passed on as the provider sent it, so the SDK's retries apply; the call is recorded as failed. 422 `agents.unknown_model` for an alias the gateway does not route, 422 `agents.model_unpriced` for a model without a recorded price, 404 when `Erp-Agent-Session` names no running session of the caller's, 400 `request.invalid_body` for a field outside `ModelRequest`, a server tool or streaming, 502 `agents.model_unreachable` when the provider does not answer. Needs `agents.model.invoke`."
      x-permission: agents.model.invoke
      parameters:
        - name: Erp-Agent-Session
          in: header
          required: false
          description: "The caller's running agent session the call belongs to; its tokens and cost add to the session's."
          schema:
            type: string
            format: uuid
          example: "0192a000-0000-7000-8000-000000000501"
        - name: anthropic-beta
          in: header
          required: false
          description: "Provider betas, comma-separated; only `server-side-fallback-2026-07-01` is forwarded, others are refused (400)."
          schema:
            type: string
            maxLength: 200
          example: server-side-fallback-2026-07-01
      requestBody:
        description: The provider's Messages API request, limited to the fields below.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRequest"
      responses:
        "200":
          description: The model's message, as the provider sent it.
          headers:
            Erp-Model:
              description: The model that answered.
              schema:
                type: string
            Erp-Model-Cost:
              description: "The call's cost in millionths of the currency's minor unit."
              schema:
                type: string
                pattern: "^[0-9]+$"
            Erp-Model-Cost-Currency:
              description: The cost's currency (ISO 4217).
              schema:
                type: string
                pattern: "^[A-Z]{3}$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      description: "An agent's (or a person's) bearer token, as for the public API."
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ModelRequest:
      type: object
      description: "The fields of the provider's Messages API request the gateway forwards; any other is refused. Their meaning is the provider's (Anthropic Messages API, version 2023-06-01)."
      required:
        - model
        - max_tokens
        - messages
      properties:
        model:
          type: string
          description: "A model alias: `erp-default`, `erp-extraction` or `erp-analytics`."
          enum: ["erp-default", "erp-extraction", "erp-analytics"]
          example: erp-default
        max_tokens:
          type: integer
          format: int64
          minimum: 1
          description: The most tokens the answer may hold.
          example: 1024
        messages:
          type: array
          description: The conversation.
          items:
            type: object
          example:
            - role: user
              content: "Summarize the held invoice."
        system:
          description: The system prompt, a string or text blocks.
          example: "You investigate held supplier invoices."
        tools:
          type: array
          description: "The caller's own tools; server tools (with a `type`) are refused."
          items:
            type: object
          example:
            - name: getSupplierInvoice
              description: Read a supplier invoice.
              input_schema:
                type: object
        tool_choice:
          type: object
          description: How the model may use the tools.
          example:
            type: auto
        output_config:
          type: object
          description: Effort and structured output.
          example:
            effort: medium
        thinking:
          type: object
          description: Thinking configuration.
          example:
            type: adaptive
        stop_sequences:
          type: array
          description: Sequences that end the answer.
          items:
            type: string
          example: ["END"]
        fallbacks:
          description: The provider's server-side fallback (`default`).
          example: default
        metadata:
          type: object
          description: The provider's request metadata.
          example:
            user_id: "0192a000-0000-7000-8000-000000000601"
      examples:
        - model: erp-default
          max_tokens: 1024
          messages:
            - role: user
              content: "Summarize the held invoice."
    ModelMessage:
      type: object
      description: "The provider's message (Anthropic Messages API), passed on as the provider sent it."
      required:
        - type
        - content
      properties:
        type:
          type: string
          description: Always `message`.
          example: message
        content:
          type: array
          description: The answer's content blocks.
          items:
            type: object
          example:
            - type: text
              text: "The invoice is held for a price variance of 4.2%."
        stop_reason:
          type: string
          description: Why the model stopped.
          example: end_turn
        usage:
          type: object
          description: The tokens the call used, as the provider counted them.
          example:
            input_tokens: 812
            output_tokens: 64
      examples:
        - type: message
          content:
            - type: text
              text: "The invoice is held for a price variance of 4.2%."
          stop_reason: end_turn
          usage:
            input_tokens: 812
            output_tokens: 64
    Problem:
      type: object
      description: "The problem's body (RFC 9457), with the platform's `code`."
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: The problem type URI.
          example: "https://errors.example.com/agents.unknown_model"
        title:
          type: string
          description: A short summary.
          example: Unprocessable
        status:
          type: integer
          format: int32
          description: The HTTP status.
          example: 422
        detail:
          type: string
          description: What happened.
          example: "The gateway routes no model alias claude-x."
        code:
          type: string
          description: "The machine-readable code, such as `agents.unknown_model`."
          example: agents.unknown_model
      examples:
        - type: "https://errors.example.com/agents.unknown_model"
          title: Unprocessable
          status: 422
          code: agents.unknown_model
          detail: "The gateway routes no model alias claude-x."
