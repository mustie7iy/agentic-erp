# Agentic ERP model gateway contract (OpenAPI 3.1): every model call an agent or the server makes (T42, ADR-0036).
# Served by erp-server on the public listener under /v1/model, outside the generated server: hand-written handlers in
# internal/agents implement it, and internal/agents/gateway_test.go checks every operation here is served.
# Lint with vacuum (api/vacuum-ruleset.yaml).
openapi: "3.1.0"
info:
  title: Agentic ERP model gateway
  version: "1.0.0"
  summary: The cell's gateway to the language models agents use.
  description: |-
    Agents reach models only through their cell's gateway, with their own bearer tokens (certificate-bound in production, ADR-0033); they hold no provider key. The gateway speaks the provider's Messages API, so an agent keeps its SDK and points its base URL at `/v1/model`: the SDK's requests arrive at `POST /v1/model/v1/messages`.

    The request names a model alias, `erp-default`, `erp-extraction` or `erp-analytics`, which the gateway routes to a concrete model; a concrete model id is refused. Only the fields listed in `ModelRequest` are forwarded; server tools, streaming and provider fallbacks are refused, so the model the alias routes to, and prices, is the one that answers. Every call, answered or not, is one row of the tenant's model call ledger with its tokens and cost, never its content (ADR-0036); a model without a recorded price is refused before the call, so no call goes unmetered. A call made within an agent session (`Erp-Agent-Session`) adds its tokens and cost to the session.

    The gateway authenticates in a short transaction of its own and writes the ledger in another after the call: no database transaction is held while the model works. A call is not idempotent: a retried call is another call, billed again.
  contact:
    name: Platform API team
    url: "https://github.com/mustie7iy/agentic-erp"
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: "https://{host}"
    description: "The tenant's cell, reached through the router."
    variables:
      host:
        default: "api.example.com"
        description: "The public API host."
security:
  - oidc: []
tags:
  - name: models
    description: "Model calls through the gateway (ADR-0036)."
paths:
  /v1/model/v1/messages:
    post:
      operationId: createModelMessage
      tags:
        - models
      summary: Call a model
      description: "Sends one Messages API request to the model the alias routes to and answers with the provider's message, unchanged but for the model it names. The answer carries `Erp-Model` (the model that answered) and `Erp-Model-Cost` (the call's cost in millionths of the currency's minor unit, with `Erp-Model-Cost-Currency`). A provider's error answer (429, 5xx and the like) is passed on as the provider sent it, so the SDK's retries apply; the call is recorded as failed. The provider refusing the cell's own key (401, 403) is 502 `agents.model_unreachable`, never the caller's authentication failure. 403 `agents.ai_disabled` while the tenant's AI is off, switched off by its administrators or suspended by the platform's operators (ADR-0036); 422 `agents.unknown_model` for an alias the gateway does not route, 422 `agents.model_not_allowed` for an alias the tenant's AI policy routes to a model it does not allow, 422 `agents.documents_withheld` for a call carrying a document or image while the tenant's AI policy withholds documents from models, 422 `agents.model_unpriced` for a model without a recorded price, 404 when `Erp-Agent-Session` names no running session of the caller's, 400 `request.invalid_body` for a field outside `ModelRequest`, a server tool or streaming, 502 `agents.model_unreachable` when the provider does not answer. **What leaves.** Before forwarding, the text of the system prompt, the messages and the tool results is redacted: IBANs, payment card numbers and the tax identifiers of the tenant's countries are replaced by `[IBAN]`, `[CARD]` and `[TAX_ID]`; names and e-mail addresses pass. Documents and images cannot be redacted and go only while the tenant's policy lets them. Only the number of replacements is recorded. **Budgets.** Before forwarding, the call is held against the caller's monthly budget (an agent's `monthly_budget`) and the tenant's cap at what it may cost: all of `max_tokens` in output, and its input estimated from its size (a token per three bytes, at most a million tokens). Once answered it is settled at its cost. The input being an estimate, a call may cost more than it held, and a budget end its month past its cap by that much. A call that does not fit is 429 `agents.budget_exhausted` and not forwarded: with `Retry-After` at the start of the next month (UTC) when the budget is spent, or of 10 seconds when calls in flight hold it. 422 `agents.budget_currency` for an agent whose budget is not in the prices' currency (USD). Needs `agents.model.invoke`."
      x-permission: agents.model.invoke
      parameters:
        - name: Erp-Agent-Session
          in: header
          required: false
          description: "The caller's running agent session the call belongs to; its tokens and cost add to the session's."
          schema:
            type: string
            format: uuid
          example: "0192a000-0000-7000-8000-000000000501"
        - name: anthropic-beta
          in: header
          required: false
          description: "Provider betas: none is forwarded, and a request naming one is refused (400)."
          schema:
            type: string
            maxLength: 200
          example: ""
      requestBody:
        description: The provider's Messages API request, limited to the fields below.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRequest"
      responses:
        "200":
          description: The model's message, as the provider sent it.
          headers:
            Erp-Model:
              description: The model that answered.
              schema:
                type: string
            Erp-Model-Cost:
              description: "The call's cost in millionths of the currency's minor unit."
              schema:
                type: string
                pattern: "^[0-9]+$"
            Erp-Model-Cost-Currency:
              description: The cost's currency (ISO 4217).
              schema:
                type: string
                pattern: "^[A-Z]{3}$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          description: "`agents.budget_exhausted`: the call does not fit the monthly budget, spent or held by calls in flight; or the provider's own 429, passed on."
          headers:
            Retry-After:
              description: "Seconds until the budget renews at the start of the next month (UTC) when it is spent; 10 when calls in flight hold it; or as the provider said."
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    oidc:
      type: http
      scheme: bearer
      description: "An agent's (or a person's) bearer token, as for the public API."
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ModelRequest:
      type: object
      description: "The fields of the provider's Messages API request the gateway forwards; any other is refused. Their meaning is the provider's (Anthropic Messages API, version 2023-06-01)."
      required:
        - model
        - max_tokens
        - messages
      properties:
        model:
          type: string
          description: "A model alias: `erp-default`, `erp-extraction` or `erp-analytics`."
          enum: ["erp-default", "erp-extraction", "erp-analytics"]
          example: erp-default
        max_tokens:
          type: integer
          format: int64
          minimum: 1
          description: The most tokens the answer may hold.
          example: 1024
        messages:
          type: array
          description: The conversation.
          items:
            type: object
          example:
            - role: user
              content: "Summarize the held invoice."
        system:
          description: The system prompt, a string or text blocks.
          example: "You investigate held supplier invoices."
        tools:
          type: array
          description: "The caller's own tools; server tools (with a `type`) are refused."
          items:
            type: object
          example:
            - name: getSupplierInvoice
              description: Read a supplier invoice.
              input_schema:
                type: object
        tool_choice:
          type: object
          description: How the model may use the tools.
          example:
            type: auto
        output_config:
          type: object
          description: Effort and structured output.
          example:
            effort: medium
        thinking:
          type: object
          description: Thinking configuration.
          example:
            type: adaptive
        stop_sequences:
          type: array
          description: Sequences that end the answer.
          items:
            type: string
          example: ["END"]
        metadata:
          type: object
          description: The provider's request metadata.
          example:
            user_id: "0192a000-0000-7000-8000-000000000601"
      examples:
        - model: erp-default
          max_tokens: 1024
          messages:
            - role: user
              content: "Summarize the held invoice."
    ModelMessage:
      type: object
      description: "The provider's message (Anthropic Messages API), passed on as the provider sent it."
      required:
        - type
        - content
      properties:
        type:
          type: string
          description: Always `message`.
          example: message
        content:
          type: array
          description: The answer's content blocks.
          items:
            type: object
          example:
            - type: text
              text: "The invoice is held for a price variance of 4.2%."
        stop_reason:
          type: string
          description: Why the model stopped.
          example: end_turn
        usage:
          type: object
          description: The tokens the call used, as the provider counted them.
          example:
            input_tokens: 812
            output_tokens: 64
      examples:
        - type: message
          content:
            - type: text
              text: "The invoice is held for a price variance of 4.2%."
          stop_reason: end_turn
          usage:
            input_tokens: 812
            output_tokens: 64
    Problem:
      type: object
      description: "The problem's body (RFC 9457), with the platform's `code`."
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: The problem type URI.
          example: "https://errors.example.com/agents.unknown_model"
        title:
          type: string
          description: A short summary.
          example: Unprocessable
        status:
          type: integer
          format: int32
          description: The HTTP status.
          example: 422
        detail:
          type: string
          description: What happened.
          example: "The gateway routes no model alias claude-x."
        code:
          type: string
          description: "The machine-readable code, such as `agents.unknown_model`."
          example: agents.unknown_model
      examples:
        - type: "https://errors.example.com/agents.unknown_model"
          title: Unprocessable
          status: 422
          code: agents.unknown_model
          detail: "The gateway routes no model alias claude-x."
