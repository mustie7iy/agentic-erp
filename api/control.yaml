# Agentic ERP control-plane contract (OpenAPI 3.1): the operators' API for tenants (T11; docs/design/04-api-design.md §4.15).
# Served by erp-server on the admin listener under /control/v1, never on the public API. Hand-written handlers in
# internal/controlplane implement it; internal/controlplane/contract_test.go checks every operation here is served.
# Lint with vacuum (api/vacuum-ruleset.yaml).
openapi: "3.1.0"
info:
  title: Agentic ERP control plane
  version: "1.0.0"
  summary: Operators' API for the tenants of a cell.
  description: |-
    The control plane lets platform operators list the tenants of a cell, provision a tenant with its first administrator and configuration, suspend, resume or offboard one, and administer each tenant's identity providers and authentication policy (ADR-0031). It is served on the admin listener (`ERP_ADMIN_ADDR`, default `:9090`), which is reachable only inside the platform, and follows the rules of the public API ([04-api-design.md](../docs/design/04-api-design.md)): RFC 9457 problems, cursor pagination, `Idempotency-Key` on creation, `If-Match` on transitions.

    Operators are not principals of any tenant. They authenticate with bearer tokens from the operator identity providers (`ERP_OPERATOR_ISSUERS`); an operator token names no tenant, and a tenant's token is refused here. What an operator does to a tenant is recorded in that tenant's audit trail with actor kind `system` and an id derived from the operator's issuer and subject, and published as `TenantStatusChanged`.

    Tenants are provisioned active in one transaction. `:suspend` stops every request of the tenant at the door (`403 tenancy.tenant_inactive`) until `:resume`; `:offboard` is final. Data is never deleted by the control plane.
  contact:
    name: Platform API team
    url: "https://github.com/mustie7iy/agentic-erp"
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: "http://{admin}"
    description: "The admin listener of an erp-server replica of the cell (not exposed outside the platform)."
    variables:
      admin:
        default: "localhost:9090"
        description: "Host and port of the admin listener (`ERP_ADMIN_ADDR`)."
security:
  - operator: []
tags:
  - name: tenants
    description: The tenants of the cell and their lifecycle.
  - name: identity
    description: "Each tenant's identity providers and authentication policy (ADR-0031)."
paths:
  /control/v1/tenants:
    get:
      operationId: listTenants
      tags:
        - tenants
      summary: List tenants
      description: "The tenants of the cell, newest first. Sortable by: `created_at`, `name`."
      parameters:
        - name: status
          in: query
          required: false
          description: "Only tenants in this status: `provisioning`, `active`, `suspended` or `offboarded`."
          schema:
            type: string
            maxLength: 20
          example: active
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/OrderBy"
      responses:
        "200":
          description: One page of tenants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTenant
      tags:
        - tenants
      summary: Provision a tenant
      description: "Creates a tenant with its first administrator (every permission, through the `tenant_admin` role), the roles its configuration names, an active legal entity per company of the configuration and the configuration as version 1, all in one transaction; the tenant is active when the response arrives. With `identity_provider` the tenant's identity provider is registered with it, as `registerIdentityProvider` does (probed, claimed in the global directory, published as `IdentityProviderRegistered`), and the administrator is bound to its issuer with their subject (ADR-0031); with `ERP_ENV=production` it is required (422 `provisioning.identity_provider_required`). Without it, the administrator is bound to the cell's single deployment issuer (`ERP_OIDC_ISSUERS`, outside production); a cell that trusts several refuses with 422 `provisioning.issuer_ambiguous`. A retry with the same `Idempotency-Key` answers the tenant the first request created with `Idempotent-Replayed: true`; two concurrent requests with the same key create one tenant (409 for the loser, retry to get it)."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The tenant to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
      responses:
        "201":
          description: "Created; the tenant with what provisioning made for it."
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  "/control/v1/tenants/{id}":
    get:
      operationId: getTenant
      tags:
        - tenants
      summary: Get a tenant
      description: One tenant of the cell by id.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The tenant.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  "/control/v1/tenants/{id}/fingerprint":
    get:
      operationId: getTenantFingerprint
      tags:
        - tenants
      summary: Get a tenant's fingerprint
      description: "The tenant with its fingerprint (ADR-0030): the rows of every table carrying a `tenant_id` (outboxes left out) and the audit chain head, read in one snapshot. Two cells holding the same tenant give the same fingerprint; the global control plane compares them (`verifyTenant`) before a move switches the directory. Read-only; `ETag` is the tenant's version."
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The tenant with its fingerprint.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantFingerprint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  "/control/v1/tenants/{id}:suspend":
    post:
      operationId: suspendTenant
      tags:
        - tenants
      summary: Suspend a tenant
      description: "Moves an active tenant to `suspended`: every request of its principals is refused with `403 tenancy.tenant_inactive` until it is resumed. Workers leave its queued work where it is. Recorded in the tenant's audit trail and published as `TenantStatusChanged`."
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The suspended tenant.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  "/control/v1/tenants/{id}:resume":
    post:
      operationId: resumeTenant
      tags:
        - tenants
      summary: Resume a tenant
      description: "Moves a suspended tenant back to `active`; its principals' requests are served again. Recorded and published like a suspension."
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The active tenant.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  "/control/v1/tenants/{id}:offboard":
    post:
      operationId: offboardTenant
      tags:
        - tenants
      summary: Offboard a tenant
      description: "Moves an active or suspended tenant to `offboarded`, the final status: its requests are refused for good. The offboarding worker then exports the tenant's data to locked object storage and, after the grace period (`ERP_OFFBOARD_GRACE`), erases it from the cell; `offboarding` on the tenant shows how far that got, and `:erase` does it earlier. An offboarded tenant cannot be resumed."
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The offboarded tenant.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  "/control/v1/tenants/{id}:erase":
    post:
      operationId: eraseTenant
      tags:
        - tenants
      summary: Erase an offboarded tenant's data now
      description: "Erases the data of an offboarded tenant whose export is complete, before its grace period ends (the offboarding worker erases it after `offboarding.erase_after` otherwise): every row of the tenant but its audit trail, and every object of the tenant but the locked ones (its exports, its audit anchors). The tenant row stays, with `offboarding.erased_at`; the audit trail records the erasure as the operator. 409 `tenancy.invalid_transition` unless the tenant is offboarded and exported, or when it was erased before; 503 while the server has no object storage."
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The tenant with what the erasure did.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantErased"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/control/v1/tenants/{id}:rotateKey":
    post:
      operationId: rotateTenantKey
      tags:
        - tenants
      summary: Rotate a tenant's encryption key
      description: "Gives the tenant a new field-encryption key, wrapped by the deployment's current master key, and re-seals every sensitive field (bank accounts, tax identifiers, house bank IBANs) under it in one transaction; fingerprints move to the tenant's own fingerprint key. A tenant still on the deployment's legacy key gets its first key of its own. The tenant's version moves on. Recorded in the tenant's audit trail; 503 while the server has no master keys."
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The tenant with what the rotation did.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantKeyRotated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  "/control/v1/tenants/{id}/identity-providers":
    get:
      operationId: listIdentityProviders
      tags:
        - identity
      summary: List a tenant's identity providers
      description: "Every identity provider registered for the tenant, retired ones too, in the order they were registered (ADR-0031). A tenant has a handful, so there are no pages."
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The tenant's identity providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: registerIdentityProvider
      tags:
        - identity
      summary: Register an identity provider
      description: "Registers an identity provider of the tenant: tokens of its issuer for its audience authenticate the tenant's principals bound to it (ADR-0031). An active issuer and audience belong to one tenant, across cells when the cell has a global directory: 409 `identity.provider_taken` when another registration holds them. With `ERP_ENV=production` the issuer must be https. The provider's discovery document is read first: an issuer whose `/.well-known/openid-configuration` the cell cannot read is 422 `identity.provider_unreachable`. When the tenant requires multi-factor authentication the provider must prove it by `acr_values` or `amr_values` (422 `identity.mfa_unprovable`). Needs the `erp:admin` role. Recorded in the tenant's audit trail and published as `IdentityProviderRegistered`. A retry with the same `Idempotency-Key` answers the provider the first request registered with `Idempotent-Replayed: true`; a concurrent request with the key waits for the first and replays it. 503 while the cell's global directory cannot be reached, since the issuer could not be claimed. Refused with 409 `tenancy.invalid_transition` once the tenant's offboarding has started; a suspended tenant's can still be changed."
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The identity provider to register.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProviderCreate"
      responses:
        "201":
          description: Registered; the identity provider.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/DirectoryUnavailable"
  "/control/v1/tenants/{id}/identity-providers/{provider_id}":
    get:
      operationId: getIdentityProvider
      tags:
        - identity
      summary: Get an identity provider
      description: One identity provider of the tenant.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          description: The identity provider.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateIdentityProvider
      tags:
        - identity
      summary: Update an identity provider
      description: "Changes an active provider's tenant claim and the values that prove multi-factor authentication; issuer and audience never change (register a new provider instead). JSON Merge Patch (RFC 7396): absent fields are unchanged, `null` clears the tenant claim or empties a list. 409 `identity.provider_retired` for a retired provider; 422 `identity.mfa_unprovable` when the tenant requires multi-factor authentication and the provider would prove it by neither list. Needs the `erp:admin` role. Recorded in the tenant's audit trail. Refused with 409 `tenancy.invalid_transition` once the tenant's offboarding has started; a suspended tenant's can still be changed."
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        description: Merge patch for the identity provider.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/IdentityProviderUpdate"
      responses:
        "200":
          description: Updated; the identity provider after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  "/control/v1/tenants/{id}/identity-providers/{provider_id}:retire":
    post:
      operationId: retireIdentityProvider
      tags:
        - identity
      summary: Retire an identity provider
      description: "Retires an active provider: its tokens authenticate no one from the next cache period on (30 s), and its issuer and audience may be registered again. A tenant keeps one active provider: 409 `identity.last_provider` for its last one (register the replacement first); 409 `identity.provider_retired` when it is retired already. Needs the `erp:admin` role. Recorded in the tenant's audit trail and published as `IdentityProviderRetired`. Refused with 409 `tenancy.invalid_transition` once the tenant's offboarding has started; a suspended tenant's can still be changed."
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The retired identity provider.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  "/control/v1/tenants/{id}/auth-policy":
    get:
      operationId: getAuthPolicy
      tags:
        - identity
      summary: Get a tenant's authentication policy
      description: "Whether the tenant's people must prove multi-factor authentication, and how long their sessions last (ADR-0031); a tenant whose policy was never changed has the defaults, version 1."
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The authentication policy.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAuthPolicy
      tags:
        - identity
      summary: Update a tenant's authentication policy
      description: "Changes the policy. JSON Merge Patch (RFC 7396): absent fields are unchanged. The session lifetime is 900 to 86400 seconds, the idle timeout 300 to 28800 and at most the lifetime (422 `identity.invalid_policy`). Requiring multi-factor authentication while an active provider would prove it by neither `acr_values` nor `amr_values` is 422 `identity.mfa_unprovable`. Needs the `erp:admin` role. Recorded in the tenant's audit trail and published as `AuthPolicyChanged`. Refused with 409 `tenancy.invalid_transition` once the tenant's offboarding has started; a suspended tenant's can still be changed."
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        description: Merge patch for the policy.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AuthPolicyUpdate"
      responses:
        "200":
          description: Updated; the policy after the change.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  "/control/v1/tenants/{id}/principals":
    get:
      operationId: listTenantPrincipals
      tags:
        - identity
      summary: List a tenant's principals and their binding
      description: "The tenant's principals with the identity provider their subject belongs to (ADR-0031), oldest first. `binding=unbound` (the default) lists those whose issuer is no active registered provider of the tenant, such as the development issuer `erp-dev` migration 000046 bound some to: their tokens are refused until an operator binds them (`bindPrincipal`). Outside production a principal of an issuer the deployment configures for every tenant (`ERP_OIDC_ISSUERS`) is listed too, though its tokens sign in; production refuses such issuers. `binding=all` lists every principal."
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: binding
          in: query
          required: false
          description: "`unbound` (default) or `all`."
          schema:
            type: string
            enum: ["unbound", "all"]
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: One page of the tenant's principals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPrincipalPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  "/control/v1/tenants/{id}/principals/{principal_id}:bind":
    post:
      operationId: bindPrincipal
      tags:
        - identity
      summary: Bind a principal to an identity provider
      description: "Binds the principal to an active registered identity provider of the tenant with its subject there: from then on that provider's tokens with that subject sign in as it, and no other's (ADR-0031). This is how a principal left unbound (its issuer no active provider of the tenant) signs in again. 422 `request.reference_not_found` for a provider the tenant does not have, `identity.provider_retired` for a retired one, `identity.invalid_subject` for an empty or long subject; 409 `identity.subject_taken` when another principal of the tenant holds the subject there; 409 `tenancy.invalid_transition` once the tenant's offboarding has started. Needs the `erp:admin` role: whoever holds the subject acts as the principal. Recorded in the tenant's audit trail and published as `PrincipalBound`."
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/PrincipalId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        description: The provider and the principal's subject there.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrincipalBinding"
      responses:
        "200":
          description: The principal, bound.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPrincipal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
components:
  securitySchemes:
    operator:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Bearer token issued by an operator identity provider (`ERP_OPERATOR_ISSUERS`): signature, issuer, audience and expiry are verified, and the token must not name a tenant. Locally, `POST /dev/token` without `tenant_id` mints one (`ERP_DEV_ISSUER=true`, never in production)."
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Tenant identifier (UUIDv7).
      schema:
        type: string
        format: uuid
      example: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: "The ETag (version) the operator last read. A mismatch returns 412 and changes nothing; a missing header returns 428."
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: "\"1\""
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Operator-chosen key, unique per logical request (a UUID is recommended), kept for 7 days with what it created. A repeat with the same body returns the tenant (or identity provider) with `Idempotent-Replayed: true`; a different body or another operator returns 422. Missing returns 428."
      schema:
        type: string
        minLength: 8
        maxLength: 255
      example: "4f1c2a7e-8d55-4c3b-9a0e-6b2d1e3f4a5b"
    ProviderId:
      name: provider_id
      in: path
      required: true
      description: Identity provider identifier (UUIDv7).
      schema:
        type: string
        format: uuid
      example: "0192a000-0000-7000-8000-000000000301"
    PrincipalId:
      name: principal_id
      in: path
      required: true
      description: Principal identifier (UUIDv7).
      schema:
        type: string
        format: uuid
      example: "0192a000-0000-7000-8000-000000000107"
    PageSize:
      name: page_size
      in: query
      required: false
      description: Maximum number of items to return. Defaults to 50, maximum 500.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 50
    PageToken:
      name: page_token
      in: query
      required: false
      description: "Opaque cursor from `next_page_token` of the previous page; valid only with the same `status` filter and `order_by`."
      schema:
        type: string
        maxLength: 2048
    OrderBy:
      name: order_by
      in: query
      required: false
      description: "Sort order as `field [asc|desc]`: `created_at` (default, descending) or `name`."
      schema:
        type: string
        maxLength: 40
      example: name asc
  headers:
    ETag:
      description: "Strong entity tag of the tenant, identity provider or policy; equals its `version`. Send it back in `If-Match`."
      schema:
        type: string
      example: "\"1\""
    Location:
      description: URL of the created tenant or identity provider.
      schema:
        type: string
        format: uri-reference
    IdempotentReplayed:
      description: "`true` when this response answers an earlier request with the same `Idempotency-Key`."
      schema:
        type: boolean
  schemas:
    Tenant:
      type: object
      description: "A tenant of the cell: the row of `tenancy.tenant`, the only table without a `tenant_id` (it is the tenant)."
      required:
        - id
        - name
        - region
        - group_currency
        - status
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Identifier (UUIDv7); the `tenant_id` claim of the tenant's tokens.
          readOnly: true
          example: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
        name:
          type: string
          description: Display name.
          readOnly: true
          example: Acme
        region:
          type: string
          description: "Region the tenant's data stays in, for example `eu-west`."
          readOnly: true
          example: eu-west
        group_currency:
          type: string
          description: Group currency (ISO 4217).
          readOnly: true
          example: EUR
        status:
          type: string
          description: "Lifecycle status: `provisioning`, `active`, `suspended` or `offboarded` (open enumeration)."
          readOnly: true
          example: active
        version:
          type: integer
          format: int32
          description: "Optimistic-lock version; equals the ETag."
          minimum: 1
          readOnly: true
          example: 1
        created_at:
          type: string
          format: date-time
          description: When the tenant was provisioned (UTC).
          readOnly: true
          example: "2026-10-11T09:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Time of the last status change (UTC).
          readOnly: true
          example: "2026-10-11T09:00:00Z"
        offboarding:
          $ref: "#/components/schemas/Offboarding"
        encryption:
          $ref: "#/components/schemas/Encryption"
        audit_verification:
          $ref: "#/components/schemas/AuditVerification"
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
          name: Acme
          region: eu-west
          group_currency: EUR
          status: active
          version: 1
          created_at: "2026-10-11T09:00:00Z"
          updated_at: "2026-10-11T09:00:00Z"
          encryption:
            key_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d77"
            master_key_id: "kms"
            created_at: "2026-10-11T09:00:00Z"
          audit_verification:
            verified_at: "2026-10-12T08:00:00Z"
            ok: true
            head_seq: 4021
            checked: 4021
            anchors_checked: 3
            broken_at: null
    Encryption:
      type: object
      description: "The key that seals the tenant's sensitive fields (ADR-0018): present once the tenant has a key of its own; which master wraps it (ADR-0019) and since when. Rotation (`:rotateKey`, or the rotation policy) replaces it."
      required:
        - key_id
        - master_key_id
        - created_at
      properties:
        key_id:
          type: string
          format: uuid
          description: The active tenant key.
          readOnly: true
        master_key_id:
          type: string
          description: "The master key wrapping it: a local master's name, or the KMS master's."
          readOnly: true
          example: kms
        created_at:
          type: string
          format: date-time
          description: When the key was created (UTC); its age under the rotation policy.
          readOnly: true
      examples:
        - key_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d77"
          master_key_id: kms
          created_at: "2026-10-11T09:00:00Z"
    AuditVerification:
      type: object
      description: "The latest scheduled verification of the tenant's audit chain against its anchors (ADR-0025); present once a round has run."
      required:
        - verified_at
        - ok
        - head_seq
        - checked
        - anchors_checked
        - broken_at
      properties:
        verified_at:
          type: string
          format: date-time
          readOnly: true
        ok:
          type: boolean
          description: The chain verified end to end and every anchor matched.
          readOnly: true
        head_seq:
          type: integer
          format: int64
          description: The chain head at verification.
          readOnly: true
        checked:
          type: integer
          format: int64
          description: Entries recomputed.
          readOnly: true
        anchors_checked:
          type: integer
          format: int32
          readOnly: true
        broken_at:
          type: [integer, "null"]
          format: int64
          description: The first sequence number that did not verify; null when ok.
          readOnly: true
      examples:
        - verified_at: "2026-10-12T08:00:00Z"
          ok: true
          head_seq: 4021
          checked: 4021
          anchors_checked: 3
          broken_at: null
    Offboarding:
      type: object
      description: "What became of an offboarded tenant's data (ADR-0021); present once the export is complete."
      required:
        - exported_at
        - export_ref
        - erase_after
      properties:
        exported_at:
          type: string
          format: date-time
          description: When the export to object storage completed (UTC).
          readOnly: true
          example: "2026-10-11T09:05:00Z"
        export_ref:
          type: string
          description: "Object key of the export's manifest, which lists every exported table with its row count and hash; the export is locked for the retention period."
          readOnly: true
          example: "tenants/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01/exports/1791755602/manifest.json"
        erase_after:
          type: string
          format: date-time
          description: When the worker erases the tenant's data from the cell (UTC); `:erase` does it earlier.
          readOnly: true
          example: "2026-11-10T09:05:00Z"
        erased_at:
          type: string
          format: date-time
          description: When the data was erased (UTC); absent until then.
          readOnly: true
          example: "2026-11-10T09:06:00Z"
      examples:
        - exported_at: "2026-10-11T09:05:00Z"
          export_ref: "tenants/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01/exports/1791755602/manifest.json"
          erase_after: "2026-11-10T09:05:00Z"
    TenantErased:
      description: The tenant after an erasure, with what the erasure did.
      allOf:
        - $ref: "#/components/schemas/Tenant"
        - type: object
          required:
            - erasure
          properties:
            erasure:
              $ref: "#/components/schemas/Erasure"
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
          name: Acme
          region: eu-west
          group_currency: EUR
          status: offboarded
          version: 6
          created_at: "2026-10-11T09:00:00Z"
          updated_at: "2026-10-11T09:06:00Z"
          offboarding:
            exported_at: "2026-10-11T09:05:00Z"
            export_ref: "tenants/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01/exports/1791755602/manifest.json"
            erase_after: "2026-11-10T09:05:00Z"
            erased_at: "2026-10-11T09:06:00Z"
          erasure:
            rows:
              identity.principal: 12
              payables.supplier_invoice: 840
            objects: 37
            kept: 3
            erased_at: "2026-10-11T09:06:00Z"
    TenantFingerprint:
      description: The tenant with its fingerprint.
      allOf:
        - $ref: "#/components/schemas/Tenant"
        - type: object
          required:
            - fingerprint
          properties:
            fingerprint:
              $ref: "#/components/schemas/Fingerprint"
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
          name: Acme
          region: eu-west
          group_currency: EUR
          status: active
          version: 3
          created_at: "2026-10-11T09:00:00Z"
          updated_at: "2026-10-11T09:02:00Z"
          fingerprint:
            tenant_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
            computed_at: "2026-10-12T08:00:00Z"
            tables:
              - name: identity.principal
                rows: 12
              - name: payables.supplier_invoice
                rows: 840
            audit_chain_head:
              seq: 4021
              hash: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
    Fingerprint:
      type: object
      description: "The tenant's data in numbers, read in one snapshot: every table's rows and the audit chain head."
      required:
        - tenant_id
        - computed_at
        - tables
        - audit_chain_head
      properties:
        tenant_id:
          type: string
          format: uuid
          description: The tenant.
        computed_at:
          type: string
          format: date-time
          description: When the snapshot was read.
        tables:
          type: array
          description: Every table carrying a `tenant_id`, outboxes left out, in name order.
          items:
            type: object
            required:
              - name
              - rows
            properties:
              name:
                type: string
                description: "`schema.table`."
                example: ledger.journal_line
              rows:
                type: integer
                format: int64
                description: Rows of the tenant.
                minimum: 0
                example: 120
        audit_chain_head:
          description: The audit chain's last entry; null while the tenant has no audit trail.
          oneOf:
            - type: "null"
            - type: object
              required:
                - seq
                - hash
              properties:
                seq:
                  type: integer
                  format: int64
                  description: Sequence number of the last entry.
                  example: 4021
                hash:
                  type: string
                  description: Hash of the last entry, hex.
                  pattern: "^[0-9a-f]{64}$"
                  example: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
    Erasure:
      type: object
      description: What an erasure did.
      required:
        - rows
        - objects
        - kept
        - erased_at
      properties:
        rows:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Rows deleted, per table.
          readOnly: true
          example:
            identity.principal: 12
        objects:
          type: integer
          description: Objects deleted from the tenant's prefix in object storage.
          readOnly: true
          example: 37
        kept:
          type: integer
          description: Objects kept because their retention holds (audit anchors, exports).
          readOnly: true
          example: 3
        erased_at:
          type: string
          format: date-time
          description: When (UTC).
          readOnly: true
          example: "2026-10-11T09:06:00Z"
      examples:
        - rows:
            identity.principal: 12
          objects: 37
          kept: 3
          erased_at: "2026-10-11T09:06:00Z"
    Administrator:
      type: object
      description: The tenant's first person, who holds every permission and sets the tenant up through the public API.
      required:
        - subject
        - display_name
      properties:
        subject:
          type: string
          description: "The administrator's subject at the tenant's identity provider: the request's `identity_provider`, or the cell's single deployment issuer."
          minLength: 1
          maxLength: 255
        display_name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          description: Email (optional).
      examples:
        - subject: "auth0|ada"
          display_name: Ada Lovelace
          email: ada@acme.example
    TenantCreate:
      type: object
      description: What provisioning needs.
      required:
        - name
        - region
        - group_currency
        - administrator
        - configuration
      properties:
        name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 200
        region:
          type: string
          description: "Region the tenant's data stays in, for example `eu-west`."
          pattern: "^[a-z]{2}(-[a-z0-9]+)*$"
        group_currency:
          type: string
          description: Group currency (ISO 4217).
          pattern: "^[A-Za-z]{3}$"
        administrator:
          $ref: "#/components/schemas/Administrator"
        identity_provider:
          $ref: "#/components/schemas/IdentityProviderCreate"
        configuration:
          type: object
          description: "The first configuration as a JSON object: the configuration-as-code document (`erp config generate` writes one as YAML; JSON is the same document). Activated as version 1; its companies become active legal entities and the roles its approval policies name are created empty."
          additionalProperties: true
      examples:
        - name: Acme
          region: eu-west
          group_currency: EUR
          administrator:
            subject: "auth0|ada"
            display_name: Ada Lovelace
          configuration:
            group_currency: EUR
            companies: []
    Provisioned:
      type: object
      description: What provisioning created besides the tenant row.
      required:
        - tenant_id
        - administrator_id
        - administrator_role_id
        - roles
        - legal_entities
        - configuration_version
      properties:
        tenant_id:
          type: string
          format: uuid
          description: The tenant.
          readOnly: true
        administrator_id:
          type: string
          format: uuid
          description: The administrator principal.
          readOnly: true
        administrator_role_id:
          type: string
          format: uuid
          description: "The `tenant_admin` role holding every permission."
          readOnly: true
        identity_provider_id:
          type: string
          format: uuid
          description: "The tenant's identity provider, registered with it; absent when the request named none."
          readOnly: true
        roles:
          type: array
          items:
            type: string
          description: Roles the configuration's approval policies name, created empty.
          readOnly: true
        legal_entities:
          type: object
          additionalProperties:
            type: string
            format: uuid
          description: The configuration's companies as active legal entities, by company code.
          readOnly: true
        configuration_version:
          type: integer
          format: int32
          description: The number of the activated configuration version (1).
          minimum: 1
          readOnly: true
      examples:
        - tenant_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
          administrator_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d02"
          administrator_role_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d03"
          roles: [process_owner, controller]
          legal_entities:
            "1000": "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d04"
          configuration_version: 1
    TenantCreated:
      description: The provisioned tenant with what was made for it.
      allOf:
        - $ref: "#/components/schemas/Tenant"
        - type: object
          required:
            - provisioned
          properties:
            provisioned:
              $ref: "#/components/schemas/Provisioned"
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
          name: Acme
          region: eu-west
          group_currency: EUR
          status: active
          version: 1
          created_at: "2026-10-11T09:00:00Z"
          updated_at: "2026-10-11T09:00:00Z"
          provisioned:
            tenant_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
            administrator_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d02"
            administrator_role_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d03"
            roles: [process_owner]
            legal_entities:
              "1000": "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d04"
            configuration_version: 1
    TenantKeyRotated:
      description: The tenant after a key rotation, with what the rotation did.
      allOf:
        - $ref: "#/components/schemas/Tenant"
        - type: object
          required:
            - rotation
          properties:
            rotation:
              $ref: "#/components/schemas/KeyRotation"
      examples:
        - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
          name: Acme
          region: eu-west
          group_currency: EUR
          status: active
          version: 2
          created_at: "2026-10-11T09:00:00Z"
          updated_at: "2026-10-11T10:00:00Z"
          rotation:
            key_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d10"
            previous_key_id: "00000000-0000-0000-0000-000000000000"
            master_key_id: v2
            resealed: 42
            rotated_at: "2026-10-11T10:00:00Z"
    KeyRotation:
      type: object
      description: What a key rotation did.
      required:
        - key_id
        - previous_key_id
        - master_key_id
        - resealed
        - rotated_at
      properties:
        key_id:
          type: string
          format: uuid
          description: The tenant's new data key.
          readOnly: true
        previous_key_id:
          type: string
          format: uuid
          description: "The key retired; the nil UUID when the tenant was on the deployment's legacy key."
          readOnly: true
        master_key_id:
          type: string
          description: The master key the new key is wrapped by.
          readOnly: true
        resealed:
          type: integer
          format: int32
          description: Rows re-sealed under the new key.
          minimum: 0
          readOnly: true
        rotated_at:
          type: string
          format: date-time
          description: When (UTC).
          readOnly: true
      examples:
        - key_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d10"
          previous_key_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d0f"
          master_key_id: v2
          resealed: 42
          rotated_at: "2026-10-11T10:00:00Z"
    IdentityProviderCreate:
      type: object
      description: "An identity provider to register (ADR-0031)."
      required:
        - issuer
        - audience
      properties:
        issuer:
          type: string
          format: uri
          maxLength: 512
          description: "The OIDC issuer (`iss`) exactly as the provider's discovery document states it: https, without credentials, query or fragment (http only on loopback, outside production)."
        audience:
          type: string
          minLength: 1
          maxLength: 255
          description: "The audience (`aud`) the provider issues the ERP's tokens for; an active issuer and audience belong to one tenant."
        tenant_claim:
          type: ["string", "null"]
          pattern: "^[A-Za-z_][A-Za-z0-9_.:/-]{0,63}$"
          description: "Optional cross-check: a claim that must carry the tenant's id in every token."
        acr_values:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: "`acr` values any one of which proves multi-factor authentication at this provider."
        amr_values:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: "`amr` values (RFC 8176) any one of which proves multi-factor authentication, e.g. `mfa`, `otp`, `hwk`."
      examples:
        - issuer: "https://login.acme.example/"
          audience: erp-api
          amr_values: ["mfa"]
    IdentityProviderUpdate:
      type: object
      description: "Merge patch of an identity provider: absent fields are unchanged, `null` clears the tenant claim or empties a list."
      properties:
        tenant_claim:
          type: ["string", "null"]
          pattern: "^[A-Za-z_][A-Za-z0-9_.:/-]{0,63}$"
          description: A claim that must carry the tenant's id; null removes the check.
        acr_values:
          type: ["array", "null"]
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: "`acr` values that prove multi-factor authentication; replaced as a whole."
        amr_values:
          type: ["array", "null"]
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: "`amr` values that prove multi-factor authentication; replaced as a whole."
      examples:
        - acr_values: ["urn:acme:loa:2"]
    IdentityProvider:
      type: object
      description: "A registered identity provider of a tenant (ADR-0031)."
      required:
        - id
        - tenant_id
        - issuer
        - audience
        - tenant_claim
        - acr_values
        - amr_values
        - status
        - created_at
        - updated_at
        - retired_at
        - version
      properties:
        id:
          type: string
          format: uuid
          description: Identity provider identifier.
        tenant_id:
          type: string
          format: uuid
          description: The tenant.
        issuer:
          type: string
          description: The OIDC issuer (`iss`).
        audience:
          type: string
          description: The audience (`aud`).
        tenant_claim:
          type: ["string", "null"]
          description: A claim that must carry the tenant's id; null when there is none.
        acr_values:
          type: array
          items:
            type: string
          description: "`acr` values that prove multi-factor authentication."
        amr_values:
          type: array
          items:
            type: string
          description: "`amr` values that prove multi-factor authentication."
        status:
          type: string
          enum: ["active", "retired"]
          description: "`active` authenticates; `retired` is final."
        created_at:
          type: string
          format: date-time
          description: When it was registered.
        updated_at:
          type: string
          format: date-time
          description: When it last changed.
        retired_at:
          type: ["string", "null"]
          format: date-time
          description: When it was retired; null while active.
        version:
          type: integer
          format: int32
          description: "Optimistic-lock version; equals the ETag."
      examples:
        - id: "0192a000-0000-7000-8000-000000000301"
          tenant_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
          issuer: "https://login.acme.example/"
          audience: erp-api
          tenant_claim: null
          acr_values: []
          amr_values: ["mfa"]
          status: active
          created_at: "2026-10-16T09:00:00Z"
          updated_at: "2026-10-16T09:00:00Z"
          retired_at: null
          version: 1
    IdentityProviderList:
      type: object
      description: A tenant's identity providers.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IdentityProvider"
          description: The providers, in the order they were registered.
      examples:
        - items:
            - id: "0192a000-0000-7000-8000-000000000301"
              tenant_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
              issuer: "https://login.acme.example/"
              audience: erp-api
              tenant_claim: null
              acr_values: []
              amr_values: ["mfa"]
              status: active
              created_at: "2026-10-16T09:00:00Z"
              updated_at: "2026-10-16T09:00:00Z"
              retired_at: null
              version: 1
    AuthPolicy:
      type: object
      description: "A tenant's authentication policy (ADR-0031)."
      required:
        - tenant_id
        - mfa_required
        - session_max_age_seconds
        - idle_timeout_seconds
        - version
      properties:
        tenant_id:
          type: string
          format: uuid
          description: The tenant.
        mfa_required:
          type: boolean
          description: "Whether people must prove multi-factor authentication (services and agents never)."
        session_max_age_seconds:
          type: integer
          format: int32
          minimum: 900
          maximum: 86400
          description: "How long a session lasts from the person's authentication at the provider."
        idle_timeout_seconds:
          type: integer
          format: int32
          minimum: 300
          maximum: 28800
          description: "How long a session lasts without a request; at most the lifetime."
        version:
          type: integer
          format: int32
          description: "Optimistic-lock version; equals the ETag. 1 for the defaults."
      examples:
        - tenant_id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
          mfa_required: false
          session_max_age_seconds: 43200
          idle_timeout_seconds: 1800
          version: 1
    AuthPolicyUpdate:
      type: object
      description: "Merge patch of the policy: absent fields are unchanged."
      properties:
        mfa_required:
          type: boolean
          description: Whether people must prove multi-factor authentication.
        session_max_age_seconds:
          type: integer
          format: int32
          minimum: 900
          maximum: 86400
          description: Session lifetime in seconds.
        idle_timeout_seconds:
          type: integer
          format: int32
          minimum: 300
          maximum: 28800
          description: Idle timeout in seconds; at most the lifetime.
      examples:
        - mfa_required: true
          idle_timeout_seconds: 900
    TenantPrincipal:
      type: object
      description: "A principal of the tenant as the operators see it: its binding to an identity provider (ADR-0031)."
      required:
        - id
        - kind
        - display_name
        - external_issuer
        - external_subject
        - status
        - bound
        - version
      properties:
        id:
          type: string
          format: uuid
          description: Principal identifier.
        kind:
          type: string
          description: "Open enum: human, agent, service."
        display_name:
          type: string
          description: Display name.
        external_issuer:
          type: ["string", "null"]
          description: The identity provider (OIDC iss) the subject belongs to; null without a subject.
        external_subject:
          type: ["string", "null"]
          description: The subject at that provider; null for an agent without one.
        status:
          type: string
          description: "Open enum: active, blocked, deprovisioned."
        bound:
          type: boolean
          description: "Whether the principal has no subject or its issuer is an active registered provider of the tenant."
        version:
          type: integer
          format: int32
          description: "Optimistic-lock version; equals the ETag."
      examples:
        - id: "0192a000-0000-7000-8000-000000000107"
          kind: human
          display_name: Ada Lovelace
          external_issuer: erp-dev
          external_subject: "idp|ada"
          status: active
          bound: false
          version: 2
    TenantPrincipalPage:
      type: object
      description: One page of a tenant's principals.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantPrincipal"
          description: The principals of this page.
        next_page_token:
          type: string
          description: Cursor of the next page; absent on the last page.
      examples:
        - items:
            - id: "0192a000-0000-7000-8000-000000000107"
              kind: human
              display_name: Ada Lovelace
              external_issuer: erp-dev
              external_subject: "idp|ada"
              status: active
              bound: false
              version: 2
    PrincipalBinding:
      type: object
      description: "The identity provider and the principal's subject there."
      required:
        - identity_provider_id
        - subject
      properties:
        identity_provider_id:
          type: string
          format: uuid
          description: An active registered identity provider of the tenant.
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: The principal's subject (sub) at that provider.
      examples:
        - identity_provider_id: "0192a000-0000-7000-8000-000000000301"
          subject: "00u1abcd"
    TenantPage:
      type: object
      description: One page of tenants.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
          description: The tenants of this page.
        next_page_token:
          type: string
          description: Cursor of the next page; absent on the last page.
      examples:
        - items:
            - id: "01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01"
              name: Acme
              region: eu-west
              group_currency: EUR
              status: active
              version: 1
              created_at: "2026-10-11T09:00:00Z"
              updated_at: "2026-10-11T09:00:00Z"
          next_page_token: "eyJ2IjoiMjAyNi0xMC0xMVQwOTowMDowMFoiLCJpIjoiMDE5MjlhMWUtNGMyYi03YTEwLTliM2UtMWYyYTNiNGM1ZDAxIn0.sig"
    FieldError:
      type: object
      description: One invalid input field.
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: JSON pointer-like path of the field.
        code:
          type: string
          description: Stable error code for the field.
        message:
          type: string
          description: What is wrong with the field.
      examples:
        - field: region
          code: invalid
          message: required, e.g. eu-west
    Problem:
      type: object
      description: "RFC 9457 problem details, returned as `application/problem+json` for every error."
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          description: URI identifying the problem type.
          format: uri-reference
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
          minimum: 400
          maximum: 599
        code:
          type: string
          description: "Stable error code; clients branch on this, never on `detail`."
          pattern: "^[a-z_]+(\\.[a-z_]+)+$"
        detail:
          type: string
          description: Explanation of this occurrence.
        instance:
          type: string
          description: URI reference of the request that failed.
          format: uri-reference
        trace_id:
          type: string
          description: W3C trace id of the request.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
          description: Field-level errors (422 and some 400).
      examples:
        - type: "https://errors.example.com/tenancy/invalid-transition"
          title: Conflict
          status: 409
          code: tenancy.invalid_transition
          detail: "The tenant is offboarded; resume applies to suspended tenants."
          instance: "/control/v1/tenants/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01:resume"
          trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
  responses:
    BadRequest:
      description: "Malformed request: invalid JSON, unknown field, invalid parameter, bad page token or order."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/invalid-parameter"
            title: Bad request
            status: 400
            code: request.invalid_parameter
            detail: Parameter status is invalid.
            instance: /control/v1/tenants
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
            errors:
              - field: status
                code: invalid
                message: "one of provisioning, active, suspended, offboarded"
    Unauthorized:
      description: "Missing, expired or invalid bearer token, or a token that names a tenant."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/authn/invalid-token"
            title: Unauthorized
            status: 401
            code: authn.invalid_token
            detail: An operator token must not name a tenant.
            instance: /control/v1/tenants
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
    NotFound:
      description: No tenant with this id in the cell, or no such method.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/not-found"
            title: Not found
            status: 404
            code: request.not_found
            detail: No tenant with this id.
            instance: "/control/v1/tenants/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d09"
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
    Conflict:
      description: "The tenant is not in a status the transition applies to (`tenancy.invalid_transition`), or a provisioning request with the same `Idempotency-Key` is running (`request.idempotency_key_in_use`, with `Retry-After`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/tenancy/invalid-transition"
            title: Conflict
            status: 409
            code: tenancy.invalid_transition
            detail: "The tenant is suspended; suspend applies to active tenants."
            instance: "/control/v1/tenants/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01:suspend"
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
    PreconditionFailed:
      description: "`If-Match` does not match the tenant's current version; nothing changed."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/version-mismatch"
            title: Precondition failed
            status: 412
            code: request.version_mismatch
            detail: "The resource has changed (current ETag \"2\"); read it again and retry."
            instance: "/control/v1/tenants/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01:suspend"
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
    PayloadTooLarge:
      description: The request body exceeds 5 MB.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/body-too-large"
            title: Request body too large
            status: 413
            code: request.body_too_large
            detail: The request body exceeds 5 MB.
            instance: /control/v1/tenants
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
    Unprocessable:
      description: "The request is well-formed but invalid: a tenant field (`tenancy.invalid_tenant`, with `errors`), an invalid configuration document, or an `Idempotency-Key` reused for a different request (`request.idempotency_key_reused`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/tenancy/invalid-tenant"
            title: Unprocessable request
            status: 422
            code: tenancy.invalid_tenant
            detail: The tenant request is invalid.
            instance: /control/v1/tenants
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
            errors:
              - field: group_currency
                code: invalid
                message: an ISO 4217 code
    PreconditionRequired:
      description: "A required header is missing: `Idempotency-Key` on creation, `If-Match` on a transition."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/request/precondition-required"
            title: Precondition required
            status: 428
            code: request.precondition_required
            detail: If-Match header is required for this operation.
            instance: "/control/v1/tenants/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01:suspend"
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
    ServiceUnavailable:
      description: The server has no master keys configured, so keys cannot be rotated.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/platform/unavailable"
            title: Service unavailable
            status: 503
            code: platform.unavailable
            detail: Key rotation is not configured on this server.
            instance: "/control/v1/tenants/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01:rotateKey"
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
    DirectoryUnavailable:
      description: "The cell's global directory cannot be reached, so the issuer cannot be claimed; retry later."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://errors.example.com/platform/unavailable"
            title: Service unavailable
            status: 503
            code: platform.unavailable
            detail: The global directory could not be reached; try again shortly.
            instance: "/control/v1/tenants/01929a1e-4c2b-7a10-9b3e-1f2a3b4c5d01/identity-providers"
            trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
