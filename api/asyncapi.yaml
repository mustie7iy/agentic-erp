    # ----------------------------------------------------------------- ledger
    JournalEntryPosted:
      name: JournalEntryPosted
      title: Journal entry posted
      summary: A balanced journal entry was posted to the ledger.
      description: |
        Emitted when a journal entry and its lines are inserted (manual
        posting, or posting on behalf of payables, payments, procurement or
        integration; reversal entries too, with `reversal_of_id` set). The
        lines are included because the period-balance and analytics
        projectors need them; amounts are signed (debit positive, credit
        negative) and the entry balances to zero in every currency. Subject
        is the journal entry id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.ledger.journal_entry_posted.v1}
      payload: {$ref: '#/components/schemas/JournalEntryPostedV1'}
      examples:
        - name: supplier-invoice
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000000b, source: /erp/eu-1/ledger, type: com.example.erp.ledger.journal_entry_posted.v1, subject: 0192a000-0000-7000-8000-000000000501, time: '2026-10-08T14:03:11Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101, traceid: 8bf92f3577b34da6a3ce929d0e0e4736}
