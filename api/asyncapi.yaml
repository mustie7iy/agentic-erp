      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.payables.down_payment_requested.v1}
      payload: {$ref: '#/components/schemas/DownPaymentRequestedV1'}
      examples:
        - name: requested
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000305, source: /erp/eu-1/payables, type: com.example.erp.payables.down_payment_requested.v1, subject: 0192a000-0000-7000-8000-000000000711, time: '2026-10-05T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
