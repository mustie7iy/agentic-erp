asyncapi: 3.0.0

info:
  title: Agentic ERP domain events
  version: 1.0.0
  description: |
    Domain events published by the bounded contexts of the ERP platform
    (docs/design/02-architecture.md §2.2, 04-api-design.md §4.12, ADR-0007,
    ADR-0012). This document is the contract; producers and consumers are
    generated or checked against it.

    ## Envelope

    Every event is a CloudEvents 1.0 event (trait `CloudEvent`):

    - `type` is `com.example.erp.<context>.<event>.v<major>`, for example
      `com.example.erp.payables.supplier_invoice_posted.v1`. `<context>` is
      the publishing bounded context and always equals the channel the
      event is published on.
    - `subject` is the uuid of the resource the event is about (the
      resource of the public API, so `journal-entries/{id}:reverse`
      publishes with the journal entry id as subject). Per-resource
      ordering is keyed on `subject`.
    - `id` is the outbox row id (UUIDv7). `source` is `/erp/<cell>/<context>`.
    - Extension attributes: `tenantid` (tenant uuid, always present),
      `actorid` (principal that caused the change: human, agent or service;
      always present, from `outbox.actor_id`), `traceid` (W3C trace id, 32
      lower-case hex digits, from `outbox.trace_id` when the change ran
      inside a trace).
    - The outbox row maps one to one: `id` → `id`, `event_type` → `type`,
      `aggregate_id` → `subject`, `occurred_at` → `time`, `actor_id` →
      `actorid`, `trace_id` → `traceid`, `payload` → data. The outbox
      CHECK requires `event_type` to name the outbox's own context (schema
      `config` publishes context `configuration`).
    - On NATS the event is sent in binary content mode: every attribute is
      a message header named `ce-<attribute>` and the payload is the JSON
      body. External subscribers receive the same events, in structured
      mode, through signed webhooks (ADR-0041): only messages marked
      `x-webhook: true` can be subscribed. Events carrying bank or personal
      data are not marked: the identity context (principals, roles,
      access), partner bank accounts and partner master data (a partner
      may be a person); nor are events that are not business facts for a
      tenant's systems (agents, platform operations and audit, the
      tenant's own lifecycle).

    ## Payloads

    Payloads carry ids and the changed facts, not whole aggregates. Field
    names follow the data model (03-data-model.md, db/migrations). Money is
    `{"amount": "1080.00", "currency": "EUR"}` with the amount as a decimal
    string carrying exactly the currency's minor-unit digits; quantities are
    `{"value": "12.5", "unit": "KG"}`; business dates are `YYYY-MM-DD`;
    instants are RFC 3339 UTC; ids are UUIDs. Enumerations are lower-case
    strings and open: consumers must accept values they do not know.
    Sensitive values never appear (bank accounts expose `account_last4`,
    `account_scheme` and, for a Canadian account, the bank's institution and
    transit numbers, which name the bank as a BIC does).
    Custom fields (`extensions`, ADR-0046) appear with personal and
    sensitive values masked.

    ## Delivery

    Events are written to the owning context's outbox in the same
    transaction as the state change and relayed to NATS JetStream on
    `erp.<cell>.<context>.<tenant>.<event>`. Delivery is at least once and
    ordered per resource (`subject`); there is no order across resources. Consumers deduplicate on `id` through their inbox
    table and must be idempotent.

    ## Versioning

    - Within `v1` only additive changes are allowed: new event types, new
      optional payload fields, new enum values, new optional extension
      attributes.
    - Removing or renaming a field, changing its type or meaning, or making
      it required is a breaking change: it gets a new type with the next
      major (`...supplier_invoice_posted.v2`) and a new payload schema. The
      producer publishes `v1` and `v2` side by side, on the same subject,
      for at least 12 months (as for `/v1` of the HTTP API, §4.10);
      consumers select by `type` and ignore types they do not know.
    - Message names here are the event names without the version; a `v2`
      message is added as `<Event>V2` next to the existing one.
  contact:
    name: Platform architecture
  license:
    name: Proprietary
  tags:
    - name: tenancy
    - name: identity
    - name: configuration
    - name: partner
    - name: ledger
    - name: procurement
    - name: payables
    - name: receivables
    - name: collections
    - name: payments
    - name: workflow
    - name: integration
    - name: agents
    - name: cash
    - name: controlling
    - name: tax
    - name: closing
    - name: consolidation
    - name: einvoicing
    - name: assets
    - name: platform

defaultContentType: application/json

servers:
  jetstream:
    host: 'nats.{cell}.erp.internal:4222'
    protocol: nats
    title: NATS JetStream of one cell
    summary: Event bus of a cell; one stream per bounded context.
    description: |
      Each cell (ADR-0003) runs its own JetStream cluster. There is one
      stream per bounded context (`ERP_LEDGER`, `ERP_PAYABLES`, ...) bound
      to the subjects `erp.<cell>.<context>.>`. Subjects are
      `erp.<cell>.<context>.<tenant>.<event>`: `<tenant>` is the tenant
      uuid (the `tenantid` attribute) and `<event>` is the snake_case event
      name, the second-to-last segment of the CloudEvents `type` (for
      example
      `erp.eu-1.payables.0192a000-0000-7000-8000-000000000001.supplier_invoice_posted`).
      The tenant token lets a stream be partitioned by tenant with a
      deterministic subject-mapping partition on that token and lets a consumer
      filter one tenant (`erp.<cell>.<context>.<tenant>.>`); all events of
      a tenant and context stay in one partition, which preserves the
      per-resource order. Major versions share the subject and differ in
      the `ce-type` header.
      The relay publishes with `Nats-Msg-Id` = CloudEvents `id`, so
      JetStream's duplicate window drops relay retries; consumers still
      deduplicate through their inbox.
    variables:
      cell:
        description: Cell identifier from the tenant directory.
        default: eu-1
        examples: [eu-1, us-1, ch-dedicated-1]

