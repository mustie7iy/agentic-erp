          payload: {assignment_kind: role_assignment, assignment_id: 0192a000-0000-7000-8000-000000000904, principal_id: 0192a000-0000-7000-8000-000000000101, role_id: 0192a000-0000-7000-8000-000000000903, legal_entity_id: null, valid_from: '2026-10-01', valid_to: '2027-01-01', ended_at: '2026-12-31T17:00:00Z'}

    # ---------------------------------------------------------- configuration
    ChangeRequestSubmitted:
      name: ChangeRequestSubmitted
      title: Change request submitted
      summary: A configuration change request was submitted for evidence and approval.
      description: Emitted by `change-requests/{id}:submit` when the change request moves from `draft` to `validating`. `ChangeRequestValidated` follows when validation finishes. Subject is the change request id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
