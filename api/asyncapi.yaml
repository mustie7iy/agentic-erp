          payload: {"run_id": "0192a000-0000-7000-8000-000000000711", "legal_entity_id": "0192a000-0000-7000-8000-000000000201", "ledger_id": "0192a000-0000-7000-8000-000000000202", "from_fiscal_year": 2026, "to_fiscal_year": 2027, "basis": "chained", "chained_from_id": "0192a000-0000-7000-8000-000000000710", "superseded_run_id": null, "retained_earnings_account_id": "0192a000-0000-7000-8000-000000000301", "row_count": 412, "result_lc": {"amount": "-125000.00", "currency": "CAD"}, "result_gc": {"amount": "-125000.00", "currency": "CAD"}, "results": [{"currency": "CAD", "result": {"amount": "-125000.00", "currency": "CAD"}, "result_lc": {"amount": "-125000.00", "currency": "CAD"}, "result_gc": {"amount": "-125000.00", "currency": "CAD"}}]}

