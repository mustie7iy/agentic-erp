    DownPaymentRequestPaidV1:
      type: object
      required: [down_payment_request_id, document_number, legal_entity_id, supplier_id, journal_entry_id, journal_entry_year, amount, status]
      properties:
        down_payment_request_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        journal_entry_id: {$ref: '#/components/schemas/Uuid'}
        journal_entry_year: {type: integer}
        amount: {$ref: '#/components/schemas/Money', description: 'What was paid, tax included.'}
        status: {type: string, description: 'Open enum; paid in v1.'}
    DownPaymentsClearedV1:
      type: object
      required: [supplier_invoice_id, supplier_id, legal_entity_id, clearing_entry_id, clearing_entry_year, down_payment_request_ids, amount]
      properties:
        supplier_invoice_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        clearing_entry_id: {$ref: '#/components/schemas/Uuid'}
        clearing_entry_year: {type: integer}
        down_payment_request_ids: {type: array, items: {$ref: '#/components/schemas/Uuid'}}
        amount: {$ref: '#/components/schemas/Money', description: 'The down payments cleared, tax included: the payables debit.'}
    SupplierInvoiceReversedV1:
      type: object
      required: [supplier_invoice_id, document_number, supplier_id, legal_entity_id, gross_amount, journal_entry_id, journal_entry_year, reversal_entry_id, reversal_entry_year, reversal_posting_date, status]
      properties:
        supplier_invoice_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        gross_amount: {$ref: '#/components/schemas/SignedMoney', description: 'Negative for credit memos and subsequent credits (kind gives the direction).'}
        kind: {type: string, description: 'Open enum: invoice, credit_memo, subsequent_debit, subsequent_credit. Absent from events of releases before it was kept: an invoice.'}
        journal_entry_id: {$ref: '#/components/schemas/Uuid', description: The invoice's original (now reversed) entry.}
        journal_entry_year: {$ref: '#/components/schemas/FiscalYear'}
        reversal_entry_id: {$ref: '#/components/schemas/Uuid'}
        reversal_entry_year: {$ref: '#/components/schemas/FiscalYear'}
        reversal_posting_date: {$ref: '#/components/schemas/Date'}
        status: {type: string, description: 'Open enum; reversed in v1.'}

    # ------------------------------------------------------------- payments
    PaymentRunProposedV1:
      type: object
      required: [payment_run_id, document_number, legal_entity_id, house_bank_id, run_date, due_by, total_amount, payment_count, exclusion_count, proposed_by, status]
      properties:
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_code: {type: string, description: 'The company code of `legal_entity_id`, as LegalEntityCreated gives it; absent when the tenancy context no longer holds the legal entity. Added within v1 (review:batch28); consumers ignore it if absent.'}
        house_bank_id: {$ref: '#/components/schemas/NullableUuid', description: 'The house bank of a run proposed for one; null for a run proposed without one, whose payments each name their bank (T45c, ADR-0038).'}
        run_date: {$ref: '#/components/schemas/Date'}
        due_by: {$ref: '#/components/schemas/Date'}
        total_amount: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money', description: 'The cash discounts the run takes (T36c); total_amount is what it pays after them. Absent from events of releases before discounts were taken.'}
        withholding_amount: {$ref: '#/components/schemas/SignedMoney', description: 'The withholding taxes the run deducts at payment (T46f), netted over invoices and credit memos; total_amount is what it pays after them and the discounts. Absent from events of releases before withholding was deducted.'}
        payment_count: {type: integer, minimum: 0}
        exclusion_count: {type: integer, minimum: 0}
        proposed_by: {$ref: '#/components/schemas/Uuid'}
        operation_id: {$ref: '#/components/schemas/NullableUuid'}
        status: {type: string, description: 'Open enum; proposed in v1.'}
    PaymentRunReleasedV1:
      type: object
      required: [payment_run_id, document_number, legal_entity_id, house_bank_id, run_date, total_amount, payment_count, released_at, status]
      properties:
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_code: {type: string, description: 'The company code of `legal_entity_id`, as LegalEntityCreated gives it; absent when the tenancy context no longer holds the legal entity. Added within v1 (review:batch28); consumers ignore it if absent.'}
        house_bank_id: {$ref: '#/components/schemas/NullableUuid', description: 'The house bank of a run proposed for one; null for a run proposed without one, whose payments each name their bank (T45c, ADR-0038).'}
        run_date: {$ref: '#/components/schemas/Date'}
        total_amount: {$ref: '#/components/schemas/Money'}
        payment_count: {type: integer, minimum: 0}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
        released_at: {$ref: '#/components/schemas/Instant'}
        status: {type: string, description: 'Open enum; released in v1.'}
    PaymentRunRejectedV1:
      type: object
      required: [payment_run_id, document_number, legal_entity_id, released_item_count, status]
      properties:
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_code: {type: string, description: 'The company code of `legal_entity_id`, as LegalEntityCreated gives it; absent when the tenancy context no longer holds the legal entity. Added within v1 (review:batch28); consumers ignore it if absent.'}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
        released_item_count: {type: integer, minimum: 0, description: Payment items deactivated (open items free for another run).}
        status: {type: string, description: 'Open enum; rejected in v1.'}
    PaymentExcludedV1:
      type: object
      required: [payment_run_id, document_number, legal_entity_id, payment_id, supplier_id, reason_code, amount, released_item_count, status]
      properties:
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_code: {type: string, description: 'The company code of `legal_entity_id`, as LegalEntityCreated gives it; absent when the tenancy context no longer holds the legal entity. Added within v1 (review:batch28); consumers ignore it if absent.'}
        payment_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        supplier_number: {type: string, description: "The business partner number of `supplier_id`, as BusinessPartnerCreated gives it. The supplier's name is not given: the event is offered to webhooks (ADR-0038, as built). Added within v1 (review:batch28); consumers ignore it if absent."}
        reason_code: {type: string, description: 'Open enum; item_reversed or item_not_open in v1.'}
        amount: {$ref: '#/components/schemas/Money'}
        released_item_count: {type: integer, minimum: 0, description: Payment items deactivated (open items free for another run).}
        status: {type: string, description: 'Open enum; releasing in v1.'}
    BankFileTransmittedV1:
      type: object
      required: [bank_file_id, payment_run_id, format, sha256, status]
      properties:
        bank_file_id: {$ref: '#/components/schemas/Uuid'}
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        format: {type: string, description: 'Open enum: pain.001.001.03, pain.001.001.09.'}
        sha256: {$ref: '#/components/schemas/Sha256Hex', description: Hash of the transmitted file.}
        connector_id: {$ref: '#/components/schemas/NullableUuid', description: "The house bank's connector the file went through (ADR-0038, T44b); null when the bank names none and the file went to the server's directory."}
        integration_message_id: {$ref: '#/components/schemas/NullableUuid'}
        status: {type: string, description: 'Open enum; transmitted in v1.'}
        duplicate: {type: boolean, description: "True when the house bank had already taken a file with this content hash (ADR-0038, T44c), a transmission whose own commit was lost: the file was not uploaded again. Absent from events before T44c."}
    BankFileTransmissionFailedV1:
      type: object
      required: [bank_file_id, payment_run_id, status, attempts, error]
      properties:
        bank_file_id: {$ref: '#/components/schemas/Uuid'}
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, description: 'Open enum; failed in v1.'}
        attempts: {type: integer, minimum: 1, description: How often the file was claimed for this request.}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, description: The problem code of the last attempt.}
            message: {type: string}

    # ------------------------------------------------------------- workflow
    ApprovalEscalatedV1:
      type: object
      required: [approval_request_id, object_type, object_id, current_step, escalations, pending_since]
      properties:
        approval_request_id: {$ref: '#/components/schemas/Uuid'}
        object_type: {type: string, description: 'Open enum: requisition, partner_change, config_change, invoice_exception, period_unlock, manual_entry, purchase_order, order_change, bank_clearing, center_change.'}
        object_id: {$ref: '#/components/schemas/Uuid'}
        current_step: {type: integer, minimum: 1, description: The step waiting for a decision.}
        escalations: {type: integer, minimum: 1, description: How often the request has now been escalated.}
        pending_since: {type: string, format: date-time, description: When the request was opened.}
    ApprovalRequestedV1:
      type: object
      required: [approval_request_id, object_type, object_id, title, requester_id, steps]
      properties:
        approval_request_id: {$ref: '#/components/schemas/Uuid'}
        object_type: {type: string, description: 'Open enum: requisition, partner_change, config_change, invoice_exception, period_unlock, manual_entry, purchase_order, order_change, bank_clearing, center_change.'}
        object_id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        requester_id: {$ref: '#/components/schemas/Uuid', description: 'Principal that raised the request: human, agent or service.'}
        amount:
          oneOf:
            - {$ref: '#/components/schemas/Money'}
            - {type: 'null'}
        policy_id: {$ref: '#/components/schemas/NullableUuid'}
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required: [step_no, role_id, required]
            properties:
              step_no: {type: integer, minimum: 1}
              role_id: {$ref: '#/components/schemas/Uuid'}
              required: {type: integer, minimum: 1, description: Number of approvals needed at this step.}
    ApprovalCompletedV1:
      type: object
      required: [approval_request_id, object_type, object_id, outcome, decided_by, decided_by_kind, completed_at]
      properties:
        approval_request_id: {$ref: '#/components/schemas/Uuid'}
        object_type: {type: string}
        object_id: {$ref: '#/components/schemas/Uuid'}
        outcome: {type: string, description: 'Open enum: approved, rejected, cancelled.'}
        decided_by: {$ref: '#/components/schemas/Uuid', description: Principal whose decision completed the request (the requester for cancellations).}
        decided_by_kind: {type: string, description: 'Open enum: human, agent, service. Always human unless outcome is cancelled.'}
        comment: {type: [string, 'null'], description: Required for rejections and cancellations.}
        completed_at: {$ref: '#/components/schemas/Instant'}

    # ---------------------------------------------------------- integration
    MigrationRunCompletedV1:
      type: object
      required: [migration_run_id, connector_id, mode, is_rehearsal, scope, status, finished_at]
      properties:
        migration_run_id: {$ref: '#/components/schemas/Uuid'}
        connector_id: {$ref: '#/components/schemas/Uuid'}
        mode: {type: string, description: 'Open enum: documents, balances.'}
        is_rehearsal: {type: boolean}
        scope:
          type: object
          properties:
            legal_entity_ids: {type: array, items: {$ref: '#/components/schemas/Uuid'}}
            fiscal_year: {$ref: '#/components/schemas/FiscalYear'}
        status: {type: string, description: 'Open enum: reconciled, failed.'}
        operation_id: {$ref: '#/components/schemas/NullableUuid'}
        started_at: {$ref: '#/components/schemas/Instant'}
        finished_at: {$ref: '#/components/schemas/Instant'}
        summary:
          type: object
          description: "Headline figures of the run's report, both always present; the full report (`MigrationRunReport`) is read at `GET /v1/migration-runs/{id}`. Fields may be added within v1."
          properties:
            passed:
              type: [boolean, 'null']
              description: "Whether every reconciliation check passed and the reconciliation had no issue; null when the run failed before it was reconciled (its quality gate or its load refused something)."
            loaded:
              oneOf: [{$ref: '#/components/schemas/MigrationLoadedCounts'}, {type: 'null'}]
              description: "What the load created, by kind (the report's `loaded`); null when the quality gate stopped the run before the load."
    MigrationLoadedCounts:
      type: object
      description: "What a migration run's load created, by kind; a kind it created none of is absent. The same keys as the API's `MigrationLoadedCounts` (api/openapi.yaml), which describes each. A rehearsal, and a load with an `error` refusal, are rolled back: their counts are what the load created before the rollback. A kept load counts only what no earlier kept run loaded."
      properties:
        suppliers: {type: integer, minimum: 1, description: 'Suppliers created from SAP vendors (LFA1, LFB1).'}
        suppliers_extended: {type: integer, minimum: 1, description: Suppliers an earlier run created that this run extended to more company codes (LFB1).}
        suppliers_blocked: {type: integer, minimum: 1, description: Suppliers blocked for posting because SAP blocks the vendor (LFA1-SPERR).}
        purchase_orders: {type: integer, minimum: 1, description: 'Purchase orders (EKKO, EKPO).'}
        goods_receipts: {type: integer, minimum: 1, description: Goods receipts (MSEG).}
        supplier_invoices: {type: integer, minimum: 1, description: 'Parked supplier documents (RBKP, RSEG), each as its kind.'}
        posted_invoices_invoiced: {type: integer, minimum: 1, description: SAP's posted invoice documents whose invoiced quantities were taken over for matching.}
        journal_entries: {type: integer, minimum: 1, description: Journal entries.}
        down_payments: {type: integer, minimum: 1, description: Open down payments loaded as paid down payment requests.}
        clearings: {type: integer, minimum: 1, description: Clearings SAP made of vendor items (ACDOCA AUGBL).}
        gr_ir_positions: {type: integer, minimum: 1, description: Order items whose open GR/IR position this run took over.}
        gr_ir_top_ups: {type: integer, minimum: 1, description: Order items whose GR/IR position, taken over by an earlier run, this run topped up.}
        segments: {type: integer, minimum: 1, description: 'Segments (FAGL_SEGM, FAGL_SEGMT) the scope''s profit centers name.'}
        profit_centers: {type: integer, minimum: 1, description: 'Profit centers (CEPC, CEPCT, CEPC_BUKRS) created active, the run their approval.'}
        profit_centers_extended: {type: integer, minimum: 1, description: Profit centers an earlier run created that this run assigned to more company codes (CEPC_BUKRS).}
        cost_centers: {type: integer, minimum: 1, description: 'Cost centers (CSKS, CSKT) created active, the run their approval.'}
        hierarchies: {type: integer, minimum: 1, description: 'Alternative hierarchies created from SAP''s center groups (sets 0101, 0106).'}
        hierarchy_nodes: {type: integer, minimum: 1, description: 'SAP center groups loaded as hierarchy nodes, the run their approval, alternative hierarchies'' roots included.'}
        hierarchy_places: {type: integer, minimum: 1, description: 'Centers this run created placed at a leaf of SAP''s groups.'}

    # --------------------------------------------------------------- agents
    RecommendationMadeV1:
      type: object
      required: [recommendation_id, session_id, agent_id, object_type, object_id, kind, content]
      properties:
        recommendation_id: {$ref: '#/components/schemas/Uuid'}
        session_id: {$ref: '#/components/schemas/Uuid'}
        agent_id: {$ref: '#/components/schemas/Uuid', description: Agent principal.}
        object_type: {type: string}
        object_id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string}
        content: {type: string}

    # ------------------------------------------------------------- platform
    AuditChainTamperedV1:
      type: object
      required: [tenant_id, broken_at, head_seq, verified_at]
      properties:
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        broken_at: {type: integer, description: 'First sequence number that does not verify.'}
        head_seq: {type: integer, description: 'The chain head at verification.'}
        verified_at: {type: string, format: date-time}
    OperationCompletedV1:
      type: object
      required: [operation_id, kind, status, progress, resource]
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string, pattern: '^[a-z_]+\.[a-z_]+$', description: 'e.g. payments.propose, integration.migrate, ledger.close_period.'}
        status: {type: string, description: 'Open enum: succeeded, failed, cancelled.'}
        resource: {type: [string, 'null'], description: 'API path of the resource the operation created or changed (`platform.operation.resource`).'}
        progress:
          type: object
          required: [done, total]
          description: '`progress_done` and `progress_total` of the operation.'
          properties:
            done: {type: integer, minimum: 0}
            total: {type: [integer, 'null'], minimum: 0, description: Null when the total was never known.}
        error:
          type: [object, 'null']
          description: Problem details (04 §4.6) when status is failed.
          properties:
            code: {type: string}
            message: {type: string}

    # ------------------------------------------------ further state changes
    LegalEntityBlockedV1:
      type: object
      required: ["legal_entity_id", "code", "previous_status", "status"]
      properties:
        legal_entity_id: {"$ref": "#/components/schemas/Uuid"}
        code: {"type": "string", "pattern": "^[A-Z0-9]{1,10}$"}
        previous_status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
        status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
    LegalEntityStatusChangedV1:
      type: object
      description: The legal entity after a status transition (activated, blocked, unblocked).
      required: ["legal_entity_id", "code", "previous_status", "status"]
      properties:
        legal_entity_id: {"$ref": "#/components/schemas/Uuid"}
        code: {"type": "string", "pattern": "^[A-Z0-9]{1,10}$"}
        previous_status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
        status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
    LegalEntityUnblockedV1:
      type: object
      required: ["legal_entity_id", "code", "previous_status", "status"]
      properties:
        legal_entity_id: {"$ref": "#/components/schemas/Uuid"}
        code: {"type": "string", "pattern": "^[A-Z0-9]{1,10}$"}
        previous_status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
        status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
    OrgUnitCreatedV1:
      type: object
      required: ["org_unit_id", "legal_entity_id", "kind", "code", "name", "status"]
      properties:
        org_unit_id: {"$ref": "#/components/schemas/Uuid"}
        legal_entity_id: {"$ref": "#/components/schemas/Uuid"}
        kind: {"type": "string", "description": "Open enum: purchasing_org, plant, storage_location, sales_org."}
        code: {"type": "string", "pattern": "^[A-Z0-9_]{1,10}$"}
        name: {"type": "string"}
        parent_id: {"$ref": "#/components/schemas/NullableUuid"}
        status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
    OrgUnitBlockedV1:
      type: object
      required: ["org_unit_id", "legal_entity_id", "kind", "code", "previous_status", "status"]
      properties:
        org_unit_id: {"$ref": "#/components/schemas/Uuid"}
        legal_entity_id: {"$ref": "#/components/schemas/Uuid"}
        kind: {"type": "string", "description": "Open enum: purchasing_org, plant, storage_location, sales_org."}
        code: {"type": "string"}
        previous_status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
        status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
    OrgUnitStatusChangedV1:
      type: object
      description: The org unit after a status transition (activated, blocked, unblocked).
      required: ["org_unit_id", "legal_entity_id", "kind", "code", "previous_status", "status"]
      properties:
        org_unit_id: {"$ref": "#/components/schemas/Uuid"}
        legal_entity_id: {"$ref": "#/components/schemas/Uuid"}
        kind: {"type": "string", "description": "Open enum: purchasing_org, plant, storage_location, sales_org."}
        code: {"type": "string"}
        previous_status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
        status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
    OrgUnitUnblockedV1:
      type: object
      required: ["org_unit_id", "legal_entity_id", "kind", "code", "previous_status", "status"]
      properties:
        org_unit_id: {"$ref": "#/components/schemas/Uuid"}
        legal_entity_id: {"$ref": "#/components/schemas/Uuid"}
        kind: {"type": "string", "description": "Open enum: purchasing_org, plant, storage_location, sales_org."}
        code: {"type": "string"}
        previous_status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
        status: {"type": "string", "description": "Open enum: active, blocked, inactive."}
    CompanyAccessGrantedV1:
      type: object
      required: ["company_access_id", "principal_id", "legal_entity_id", "valid_from", "valid_to"]
      properties:
        company_access_id: {"$ref": "#/components/schemas/Uuid", "description": "`identity.company_access.id`."}
        principal_id: {"$ref": "#/components/schemas/Uuid"}
        legal_entity_id: {"$ref": "#/components/schemas/Uuid"}
        valid_from: {"$ref": "#/components/schemas/Date"}
        valid_to: {"$ref": "#/components/schemas/NullableDate", "description": "Exclusive end; null for open-ended."}
    SodRuleChangedV1:
      type: object
      required: ["sod_rule_id", "change", "permission_a", "permission_b", "valid_from", "valid_to"]
      properties:
        sod_rule_id: {"$ref": "#/components/schemas/Uuid"}
        change: {"type": "string", "description": "Open enum: created, ended."}
        permission_a: {"type": "string", "pattern": "^[a-z_]+(\\.[a-z_]+)+$"}
        permission_b: {"type": "string", "pattern": "^[a-z_]+(\\.[a-z_]+)+$"}
        description: {"type": "string"}
        valid_from: {"$ref": "#/components/schemas/Date"}
        valid_to: {"$ref": "#/components/schemas/NullableDate", "description": "Exclusive end; null while open-ended."}
        ended_at: {"oneOf": [{"$ref": "#/components/schemas/Instant"}, {"type": "null"}], "description": "Set when change is ended."}
    ChangeRequestValidatedV1:
      type: object
      required: ["change_request_id", "number", "tier", "outcome", "status"]
      properties:
        change_request_id: {"$ref": "#/components/schemas/Uuid"}
        number: {"type": "string"}
        tier: {"type": "integer", "minimum": 1, "maximum": 4}
        outcome: {"type": "string", "description": "Open enum: invalid, awaiting_evidence, pending_approval. Equals the new status."}
        status: {"type": "string", "description": "New change request status."}
        workflow_request_id: {"$ref": "#/components/schemas/NullableUuid", "description": "Approval request, once one is opened (pending_approval)."}
    ChangeRequestRejectedV1:
      type: object
      required: ["change_request_id", "number", "previous_status", "status"]
      properties:
        change_request_id: {"$ref": "#/components/schemas/Uuid"}
        number: {"type": "string"}
        workflow_request_id: {"$ref": "#/components/schemas/NullableUuid"}
        previous_status: {"type": "string", "description": "Open enum; pending_approval in v1."}
        status: {"type": "string", "description": "Open enum; rejected in v1."}
    ChangeRequestWithdrawnV1:
      type: object
      required: ["change_request_id", "number", "previous_status", "status"]
      properties:
        change_request_id: {"$ref": "#/components/schemas/Uuid"}
        number: {"type": "string"}
        previous_status: {"type": "string", "description": "Open enum: draft, validating, invalid, awaiting_evidence, pending_approval, approved."}
        status: {"type": "string", "description": "Open enum; withdrawn in v1."}
    PartnerUnblockedV1:
      type: object
      required: ["partner_id", "scope", "partner_change_id", "reason"]
      properties:
        partner_id: {"$ref": "#/components/schemas/Uuid"}
        scope: {"type": "string", "description": "Open enum: all (partner status active again), posting, payment (per legal entity)."}
        legal_entity_id: {"$ref": "#/components/schemas/NullableUuid", "description": "Set for posting and payment unblocks."}
        partner_change_id: {"$ref": "#/components/schemas/Uuid"}
        reason: {"type": "string"}
    RequisitionCancelledV1:
      type: object
