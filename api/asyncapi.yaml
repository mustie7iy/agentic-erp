      description: |
        Emitted by `supplier-invoices/{id}:clearDownPayments` (SAP F-54;
        ADR-0037) when the transfer entry posts: the down payments leave
        the down payment account, their input tax is reversed, and a
        payables debit with the invoice's terms nets against it in the next
        run. The requests are cleared. Subject is the supplier invoice id.
