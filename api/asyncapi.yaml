    # --------------------------------------------------------------- payments
    PaymentRunProposed:
      name: PaymentRunProposed
      title: Payment run proposed
      summary: A payment proposal was computed and awaits release.
      description: Emitted when `payment-runs:propose` finishes building the proposal (payments, items and exclusions) and the run moves from `proposing` to `proposed`. A proposal that fails moves to `failed` and only its operation's `OperationCompleted` is published. Large runs execute as an operation, which also publishes `OperationCompleted`. Subject is the payment run id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.payments.payment_run_proposed.v1}
      payload: {$ref: '#/components/schemas/PaymentRunProposedV1'}
      examples:
        - name: weekly-run
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000019, source: /erp/eu-1/payments, type: com.example.erp.payments.payment_run_proposed.v1, subject: 0192a000-0000-7000-8000-000000000801, time: '2026-10-19T06:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {payment_run_id: 0192a000-0000-7000-8000-000000000801, document_number: PR-2026-0042, legal_entity_id: 0192a000-0000-7000-8000-000000000201, house_bank_id: 0192a000-0000-7000-8000-000000000802, run_date: '2026-10-20', due_by: '2026-10-27', total_amount: {amount: '184220.50', currency: EUR}, payment_count: 57, exclusion_count: 3, proposed_by: 0192a000-0000-7000-8000-000000000101, operation_id: 0192a000-0000-7000-8000-000000000805, status: proposed}
    PaymentRunReleased:
      name: PaymentRunReleased
      title: Payment run released
      summary: A payment run was released for payment.
      description: |
        Emitted by `payment-runs/{id}:release` when the run moves to
        `released`. The releaser (`decided_by`) is a person other than the
        proposer; the database enforces this. Payments are not listed (a run can hold 100,000 items);
        consumers read them through `GET /v1/payment-runs/{id}/payments`.
        Subject is the payment run id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.payments.payment_run_released.v1}
      payload: {$ref: '#/components/schemas/PaymentRunReleasedV1'}
      examples:
        - name: released
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000001a, source: /erp/eu-1/payments, type: com.example.erp.payments.payment_run_released.v1, subject: 0192a000-0000-7000-8000-000000000801, time: '2026-10-19T11:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {payment_run_id: 0192a000-0000-7000-8000-000000000801, document_number: PR-2026-0042, legal_entity_id: 0192a000-0000-7000-8000-000000000201, house_bank_id: 0192a000-0000-7000-8000-000000000802, run_date: '2026-10-20', total_amount: {amount: '184220.50', currency: EUR}, payment_count: 57, workflow_request_id: 0192a000-0000-7000-8000-000000000901, released_at: '2026-10-19T11:00:00Z', status: released}
    PaymentRunRejected:
      name: PaymentRunRejected
      title: Payment run rejected
      summary: A proposed payment run was rejected; its items are free again.
      description: Emitted by `payment-runs/{id}:reject` (by a person other than the proposer) when the run moves to `rejected` and its payment items are deactivated, so the open items can be proposed again. Subject is the payment run id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.payments.payment_run_rejected.v1}
      payload: {$ref: '#/components/schemas/PaymentRunRejectedV1'}
      examples:
        - name: rejected
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000001b, source: /erp/eu-1/payments, type: com.example.erp.payments.payment_run_rejected.v1, subject: 0192a000-0000-7000-8000-000000000801, time: '2026-10-19T11:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {payment_run_id: 0192a000-0000-7000-8000-000000000801, document_number: PR-2026-0042, legal_entity_id: 0192a000-0000-7000-8000-000000000201, workflow_request_id: 0192a000-0000-7000-8000-000000000901, released_item_count: 212, status: rejected}
    PaymentExcluded:
      name: PaymentExcluded
      title: Payment dropped from a releasing run
      summary: A payment of a releasing run could never post and was dropped; its items are free again.
      description: Emitted by the release of a payment run when a payment it has not posted yet settles an item that was reversed, or is no longer open, since the proposal. The supplier is excluded with `reason_code` (`item_reversed` or `item_not_open`), the payment's items are deactivated, the run's total no longer counts it, and the release goes on with the other payments. Subject is the payment run id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.payments.payment_excluded.v1}
      payload: {$ref: '#/components/schemas/PaymentExcludedV1'}
      examples:
        - name: dropped
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000081, source: /erp/eu-1/payments, type: com.example.erp.payments.payment_excluded.v1, subject: 0192a000-0000-7000-8000-000000000801, time: '2026-10-19T11:02:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {payment_run_id: 0192a000-0000-7000-8000-000000000801, document_number: PR-2026-0042, legal_entity_id: 0192a000-0000-7000-8000-000000000201, payment_id: 0192a000-0000-7000-8000-000000000806, supplier_id: 0192a000-0000-7000-8000-000000000301, reason_code: item_reversed, amount: {amount: '40.00', currency: EUR}, released_item_count: 1, status: releasing}
    BankFileTransmitted:
      name: BankFileTransmitted
      title: Bank file transmitted
      summary: A payment file was transmitted to the bank.
      description: Emitted by `bank-files/{id}:transmit` when the connector confirms transmission and the bank file moves to `transmitted`. Subject is the bank file id.
