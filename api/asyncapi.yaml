      summary: A statement's lines are all posted or excluded and the ledger agrees with its closing balance.
      description: "Emitted once when a bank statement becomes `reconciled` (T49h, ADR-0047): every line of it and of the house bank's statements before it is posted or excluded, and its closing balance, less the lines excluded and those posted after its closing date, is the ledger's balance of the house bank's main bank account on that date. Made by the posting, exclusion, approval or run of the rules that left nothing unexplained; never undone by the server. Subject is the bank statement."
