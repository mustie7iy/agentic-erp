      summary: A supplier invoice was captured and parked, or held.
      description: "Emitted by `supplier-invoices:capture` (or manual, EDI or migration entry) when the invoice row is inserted: in status `parked`, or `on_hold` when the capture's confidence was below the threshold, in which case `SupplierInvoiceHeld` follows in the same transaction with the reason. Subject is the supplier invoice id."
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
