      payload: {$ref: '#/components/schemas/ChangeRequestSubmittedV1'}
      examples:
        - name: tolerance-change
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000004, source: /erp/eu-1/configuration, type: com.example.erp.configuration.change_request_submitted.v1, subject: 0192a000-0000-7000-8000-000000000a01, time: '2026-10-02T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101, traceid: 6bf92f3577b34da6a3ce929d0e0e4736}
          payload: {change_request_id: 0192a000-0000-7000-8000-000000000a01, number: CR-2026-0042, title: Raise price tolerance to 3%, author_id: 0192a000-0000-7000-8000-000000000101, base_version: 41, tier: 2, status: validating, item_count: 1, workflow_request_id: null}
    ChangeRequestApproved:
      name: ChangeRequestApproved
      title: Change request approved
      summary: A configuration change request was approved and can be activated.
      description: Emitted when the change request moves to `approved` after its approval request completed with outcome `approved`. Activation is a separate step (`:activate`). Subject is the change request id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.configuration.change_request_approved.v1}
      payload: {$ref: '#/components/schemas/ChangeRequestApprovedV1'}
      examples:
        - name: tolerance-change
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000005, source: /erp/eu-1/configuration, type: com.example.erp.configuration.change_request_approved.v1, subject: 0192a000-0000-7000-8000-000000000a01, time: '2026-10-03T10:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {change_request_id: 0192a000-0000-7000-8000-000000000a01, number: CR-2026-0042, tier: 2, base_version: 41, workflow_request_id: 0192a000-0000-7000-8000-000000000901, status: approved}
    ConfigurationActivated:
      name: ConfigurationActivated
      title: Configuration activated
      summary: A new configuration version became the tenant's active version.
      description: |
        Emitted when `config.active_version` moves to a new version (from a
        change request, a bootstrap or a rollback). Owning contexts apply
        their part of the document to their own tables on receipt; they
        apply versions in `config_version` (number) order using
        `previous_version`, because ordering is guaranteed per subject only.
        Subject is the configuration version id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.configuration.configuration_activated.v1}
      payload: {$ref: '#/components/schemas/ConfigurationActivatedV1'}
      examples:
        - name: version-42
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000006, source: /erp/eu-1/configuration, type: com.example.erp.configuration.configuration_activated.v1, subject: 0192a000-0000-7000-8000-000000000a02, time: '2026-10-03T11:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {config_version_id: 0192a000-0000-7000-8000-000000000a02, config_version: 42, previous_version: 41, source: change_request, change_request_id: 0192a000-0000-7000-8000-000000000a01, restored_from: null, hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08, activated_at: '2026-10-03T11:00:00Z'}

