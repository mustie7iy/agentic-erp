          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e000000000f5, source: /erp/eu-1/payments, type: com.example.erp.payments.bank_statement_gap_accepted.v1, subject: 0192a000-0000-7000-8000-000000000b21, time: '2026-10-20T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000105}
          payload: {bank_statement_id: 0192a000-0000-7000-8000-000000000b21, house_bank_id: 0192a000-0000-7000-8000-000000000b01, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: DE01, previous_statement_id: 0192a000-0000-7000-8000-000000000b20, opening_balance: {amount: '95000.00', currency: AED}, previous_closing_balance: {amount: '93196.75', currency: AED}, reason: The bank no longer holds the statement of 21 October; its bookings are posted by hand., status: imported}
    BankStatementFileRefused:
      name: BankStatementFileRefused
      title: Bank statement file refused
      summary: A statement file fetched from the bank's channel was not imported.
      description: "Emitted once per house bank and file content when a statement file fetched from the house bank's SFTP channel (T49d) is refused by the import (unreadable, too large, a statement already imported from another file, a statement of an account no house bank on the channel has: payments.statement_of_no_bank): the file is left in the bank's statements directory for a person to take up with the bank, and later fetches skip it. A file of the account of another house bank on the same channel is left for that bank and not refused. Subject is the fetch record (payments.statement_fetch)."
