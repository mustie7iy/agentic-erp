      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.payables.supplier_invoice_matched.v1}
      payload: {$ref: '#/components/schemas/SupplierInvoiceMatchedV1'}
