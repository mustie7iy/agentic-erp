              - {fiscal_year: 2026, journal_entry_id: 0192a000-0000-7000-8000-000000000504, line_no: 1, account_id: 0192a000-0000-7000-8000-000000000402, partner_id: 0192a000-0000-7000-8000-000000000301, amount_tc: {amount: '1080.00', currency: EUR}}
    PeriodOpened:
      name: PeriodOpened
      title: Posting period opened
      summary: A fiscal period was opened for posting in a legal entity and ledger.
      description: |
        Emitted by `fiscal-periods/{id}:open` when `ledger.period_status`
        becomes `open`. Subject is the period status id (`fiscal-periods/{id}`).
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
