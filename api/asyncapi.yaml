          payload: {entry_template_id: 0192a000-0000-7000-8000-000000000208, legal_entity_id: 0192a000-0000-7000-8000-000000000201, name: Office rent, status: active, previous_status: null, owner_id: 0192a000-0000-7000-8000-000000000103, amount: {amount: '4500.00', currency: CAD}, next_due_on: '2026-12-01', last_occurrence_on: null, refused_on: null, refusal_code: null}

