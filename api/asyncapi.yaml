          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000701, source: /erp/eu-1/tax, type: com.example.erp.tax.tax_return_prepared.v1, subject: 0192a000-0000-7000-8000-000000000e31, time: '2026-10-05T14:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {tax_return_id: 0192a000-0000-7000-8000-000000000e31, registration_id: 0192a000-0000-7000-8000-000000000e01, registration_code: GSTHST, legal_entity_id: 0192a000-0000-7000-8000-000000000201, kind: original, return_type: GST34, period_start: '2026-07-01', period_end: '2026-09-30', amends_id: null, pack_country: CA, pack_version: '2026.3', item_count: 2, items_hash: 9f2c1e0b5a7d3c4e8f6a1b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2d3e4f5a6, boxes: [{code: output_tax, amount: {amount: '60.00', currency: CAD}, corrected_amount: {amount: '60.00', currency: CAD}}], approval_request_id: 0192a000-0000-7000-8000-000000000e32}
    TaxReturnApproved:
      name: TaxReturnApproved
      x-webhook: true
      title: Tax return approved
      summary: "A person other than its preparer approved a tax return."
      description: "Emitted when the return's `tax_return` approval request is approved (ADR-0049 §11): it may now be recorded as filed. Subject is the tax return id."
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.tax.tax_return_approved.v1}
      payload: {$ref: '#/components/schemas/TaxReturnApprovedV1'}
