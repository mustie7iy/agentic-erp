          payload: {bank_statement_id: 0192a000-0000-7000-8000-000000000b21, house_bank_id: 0192a000-0000-7000-8000-000000000b01, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: DE01, previous_statement_id: 0192a000-0000-7000-8000-000000000b20, status: gap}
    BankStatementGapAccepted:
