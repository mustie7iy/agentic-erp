    OperationCompleted:
      name: OperationCompleted
      title: Operation completed
      summary: A long-running operation finished (succeeded, failed or cancelled).
      description: Emitted when a `platform.operation` reaches a final status (ADR-0012), so clients can subscribe instead of polling `GET /v1/operations/{id}`. Subject is the operation id.
