      description: |
        Emitted by `supplier-invoices/{id}:cancel` on a posted invoice when
        the reversal entry is posted and the invoice moves to `reversed`
        (`reversal_entry_year` and `reversal_entry_id` set). The ledger
        publishes `JournalEntryPosted` for the reversal entry and
        `JournalEntryReversed` for the invoice's entry in the same
        transaction. Subject is the supplier invoice id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.payables.supplier_invoice_reversed.v1}
      payload: {$ref: '#/components/schemas/SupplierInvoiceReversedV1'}
      examples:
