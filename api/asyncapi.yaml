components:
  parameters:
    cell:
      description: Cell identifier (tenant-cell) from the tenant directory, e.g. `eu-1`.
      examples: [eu-1, us-1]
    tenant:
      description: Tenant uuid (equals the `tenantid` attribute).
      examples: [0192a000-0000-7000-8000-000000000001]
    event:
      description: |
        snake_case event name; the second-to-last segment of the CloudEvents
        `type` (e.g. `journal_entry_posted`).

  messageTraits:
    CloudEvent:
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CloudEventHeaders'
      description: |
        CloudEvents 1.0 envelope in binary content mode: each attribute
        travels as a `ce-<attribute>` NATS header and the payload is the
        event `data`.

  messages:
    # ---------------------------------------------------------------- tenancy
    LegalEntityCreated:
      name: LegalEntityCreated
      x-webhook: true
      title: Legal entity created
      summary: A legal entity (company code) was created.
      description: Emitted when a legal entity row is inserted in `tenancy.legal_entity`. Subject is the legal entity id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.tenancy.legal_entity_created.v1}
      payload: {$ref: '#/components/schemas/LegalEntityCreatedV1'}
      examples:
        - name: de01
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000001, source: /erp/eu-1/tenancy, type: com.example.erp.tenancy.legal_entity_created.v1, subject: 0192a000-0000-7000-8000-000000000201, time: '2026-10-01T08:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101, traceid: 4bf92f3577b34da6a3ce929d0e0e4736}
          payload: {legal_entity_id: 0192a000-0000-7000-8000-000000000201, code: DE01, name: Example GmbH, country_code: DE, local_currency: EUR, fiscal_calendar_id: 0192a000-0000-7000-8000-000000000203, status: active}

    # --------------------------------------------------------------- identity
    RoleAssigned:
      name: RoleAssigned
      title: Role assigned
      summary: A role was granted to a principal for a validity period.
      description: Emitted when an `identity.principal_role` row (a role assignment) is inserted, after the agent-approval check passed at commit. Subject is the role assignment id; `AccessRevoked` for the same assignment shares it, so assignment and end are ordered.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.identity.role_assigned.v1}
      payload: {$ref: '#/components/schemas/RoleAssignedV1'}
      examples:
        - name: ap-clerk
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000002, source: /erp/eu-1/identity, type: com.example.erp.identity.role_assigned.v1, subject: 0192a000-0000-7000-8000-000000000904, time: '2026-10-01T08:05:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102, traceid: 5bf92f3577b34da6a3ce929d0e0e4736}
          payload: {role_assignment_id: 0192a000-0000-7000-8000-000000000904, principal_id: 0192a000-0000-7000-8000-000000000101, principal_kind: human, role_id: 0192a000-0000-7000-8000-000000000903, role_code: AP_CLERK, valid_from: '2026-10-01', valid_to: null}
    AccessRevoked:
      name: AccessRevoked
      title: Access revoked
      summary: A role assignment or a company access of a principal was ended.
      description: |
        Emitted when an `identity.principal_role` (role assignment) or
        `identity.company_access` row is ended: `valid_to`, `ended_at` and
        `ended_by` are set (assignments are never deleted). Consumers drop
        cached permissions and sessions for the principal from `valid_to`.
        Subject is the id of the ended assignment.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.identity.access_revoked.v1}
      payload: {$ref: '#/components/schemas/AccessRevokedV1'}
      examples:
        - name: role-ended
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000003, source: /erp/eu-1/identity, type: com.example.erp.identity.access_revoked.v1, subject: 0192a000-0000-7000-8000-000000000904, time: '2026-12-31T17:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {assignment_kind: role_assignment, assignment_id: 0192a000-0000-7000-8000-000000000904, principal_id: 0192a000-0000-7000-8000-000000000101, role_id: 0192a000-0000-7000-8000-000000000903, legal_entity_id: null, valid_from: '2026-10-01', valid_to: '2027-01-01', ended_at: '2026-12-31T17:00:00Z'}

    # ---------------------------------------------------------- configuration
    ChangeRequestSubmitted:
      name: ChangeRequestSubmitted
      x-webhook: true
      title: Change request submitted
      summary: A configuration change request was submitted for evidence and approval.
      description: Emitted by `change-requests/{id}:submit` when the change request moves from `draft` to `validating`. `ChangeRequestValidated` follows when validation finishes. Subject is the change request id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.configuration.change_request_submitted.v1}
      payload: {$ref: '#/components/schemas/ChangeRequestSubmittedV1'}
      examples:
        - name: tolerance-change
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000004, source: /erp/eu-1/configuration, type: com.example.erp.configuration.change_request_submitted.v1, subject: 0192a000-0000-7000-8000-000000000a01, time: '2026-10-02T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101, traceid: 6bf92f3577b34da6a3ce929d0e0e4736}
          payload: {change_request_id: 0192a000-0000-7000-8000-000000000a01, number: CR-2026-0042, title: Raise price tolerance to 3%, author_id: 0192a000-0000-7000-8000-000000000101, base_version: 41, tier: 2, status: validating, item_count: 1, workflow_request_id: null}
    ChangeRequestApproved:
      name: ChangeRequestApproved
      x-webhook: true
      title: Change request approved
      summary: A configuration change request was approved and can be activated.
      description: Emitted when the change request moves to `approved` after its approval request completed with outcome `approved`. Activation is a separate step (`:activate`). Subject is the change request id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.configuration.change_request_approved.v1}
      payload: {$ref: '#/components/schemas/ChangeRequestApprovedV1'}
      examples:
        - name: tolerance-change
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000005, source: /erp/eu-1/configuration, type: com.example.erp.configuration.change_request_approved.v1, subject: 0192a000-0000-7000-8000-000000000a01, time: '2026-10-03T10:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {change_request_id: 0192a000-0000-7000-8000-000000000a01, number: CR-2026-0042, tier: 2, base_version: 41, workflow_request_id: 0192a000-0000-7000-8000-000000000901, status: approved}
    ConfigurationActivated:
      name: ConfigurationActivated
      x-webhook: true
      title: Configuration activated
      summary: A new configuration version became the tenant's active version.
      description: |
        Emitted when `config.active_version` moves to a new version (from a
        change request, a bootstrap or a rollback). Owning contexts apply
        their part of the document to their own tables on receipt; they
        apply versions in `config_version` (number) order using
        `previous_version`, because ordering is guaranteed per subject only.
        Subject is the configuration version id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.configuration.configuration_activated.v1}
      payload: {$ref: '#/components/schemas/ConfigurationActivatedV1'}
      examples:
        - name: version-42
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000006, source: /erp/eu-1/configuration, type: com.example.erp.configuration.configuration_activated.v1, subject: 0192a000-0000-7000-8000-000000000a02, time: '2026-10-03T11:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {config_version_id: 0192a000-0000-7000-8000-000000000a02, config_version: 42, previous_version: 41, source: change_request, change_request_id: 0192a000-0000-7000-8000-000000000a01, restored_from: null, hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08, activated_at: '2026-10-03T11:00:00Z'}

    # ---------------------------------------------------------------- partner
    BusinessPartnerCreated:
      name: BusinessPartnerCreated
      title: Business partner created
      summary: A business partner was created (status `pending` until its create change is approved).
      description: Emitted when a `create` partner change inserts the business partner row in status `pending`. Subject is the business partner id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.partner.business_partner_created.v1}
      payload: {$ref: '#/components/schemas/BusinessPartnerCreatedV1'}
      examples:
        - name: new-supplier
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000007, source: /erp/eu-1/partner, type: com.example.erp.partner.business_partner_created.v1, subject: 0192a000-0000-7000-8000-000000000301, time: '2026-10-04T08:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {partner_id: 0192a000-0000-7000-8000-000000000301, number: BP-100231, kind: organization, name: Acme Industrial Supplies Ltd, country_code: GB, roles: [supplier], status: pending, partner_change_id: 0192a000-0000-7000-8000-000000000304}
    SupplierApproved:
      name: SupplierApproved
      x-webhook: true
      title: Supplier approved
      summary: A new supplier's create change was approved and applied; the supplier is active.
      description: Emitted when a `create` partner change for a partner with the supplier role is applied after approval and the partner becomes `active`. Procurement and payables may use the supplier from this point. Subject is the business partner id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.partner.supplier_approved.v1}
      payload: {$ref: '#/components/schemas/SupplierApprovedV1'}
      examples:
        - name: acme
