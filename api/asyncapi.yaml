              internal_order_id: {$ref: '#/components/schemas/Uuid', description: 'The internal order the line''s cost is posted to (ADR-0064 §2), `controlling.internal_order.id`. Absent on lines without one.'}
              trading_partner_id: {$ref: '#/components/schemas/Uuid', description: 'The line''s trading partner (ADR-0059 §4), a legal entity of the tenant other than the entry''s. Absent on lines without one.'}
