          payload: {role_assignment_id: 0192a000-0000-7000-8000-000000000904, principal_id: 0192a000-0000-7000-8000-000000000101, principal_kind: human, role_id: 0192a000-0000-7000-8000-000000000903, role_code: AP_CLERK, valid_from: '2026-10-01', valid_to: null}
