          - properties:
              type: {const: com.example.erp.payments.bank_statement_imported.v1}
      payload: {$ref: '#/components/schemas/BankStatementImportedV1'}
      examples:
        - name: mt940
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e000000000f2, source: /erp/eu-1/payments, type: com.example.erp.payments.bank_statement_imported.v1, subject: 0192a000-0000-7000-8000-000000000b20, time: '2026-10-20T08:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000104}
          payload: {bank_statement_id: 0192a000-0000-7000-8000-000000000b20, house_bank_id: 0192a000-0000-7000-8000-000000000b01, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: DE01, format: mt940, file_sha256: fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9, statement_ref: STMT20261020, sequence: 00293/001, line_count: 4, opening_balance: {amount: '120000.00', currency: AED}, closing_balance: {amount: '93196.75', currency: AED}, previous_statement_id: 0192a000-0000-7000-8000-000000000b19, status: imported}
    BankStatementGapClosed:
      name: BankStatementGapClosed
      title: Bank statement gap closed
      summary: The statement missing before a statement in gap arrived.
      description: "Emitted when a statement imported between two of the house bank's statements (the missing one) has as closing balance the opening balance of the next, which was in status `gap`: that statement moves to `imported`, with the new statement as its previous one (ADR-0047, T49c). Subject is the bank statement whose gap closed."
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
