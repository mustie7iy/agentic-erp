            legal_entity_id: 0192a000-0000-7000-8000-000000000201
            ledger_id: 0192a000-0000-7000-8000-000000000202
            document_type: KR
            document_number: '5100000123'
            document_date: '2026-10-05'
            posting_date: '2026-10-08'
            currency_tc: EUR
            currency_lc: EUR
            currency_gc: USD
            source_context: payables
            source_document_id: 0192a000-0000-7000-8000-000000000701
            reversal_of_id: null
            lines:
              - {line_no: 1, account_id: 0192a000-0000-7000-8000-000000000402, partner_id: 0192a000-0000-7000-8000-000000000301, amount_tc: {amount: '-1080.00', currency: EUR}, amount_lc: {amount: '-1080.00', currency: EUR}, amount_gc: {amount: '-1166.40', currency: USD}}
              - {line_no: 2, account_id: 0192a000-0000-7000-8000-000000000401, amount_tc: {amount: '1000.00', currency: EUR}, amount_lc: {amount: '1000.00', currency: EUR}, amount_gc: {amount: '1080.00', currency: USD}}
              - {line_no: 3, account_id: 0192a000-0000-7000-8000-000000000403, tax_code: V1, amount_tc: {amount: '80.00', currency: EUR}, amount_lc: {amount: '80.00', currency: EUR}, amount_gc: {amount: '86.40', currency: USD}}
    JournalEntryReversed:
      name: JournalEntryReversed
      title: Journal entry reversed
      summary: A posted journal entry was reversed by a new reversal entry.
      description: Emitted by `journal-entries/{id}:reverse` (and by reversals posted for other contexts, e.g. a reversed supplier invoice) once the reversal entry is posted and recorded in `ledger.reversal`. The reversal entry also publishes its own `JournalEntryPosted`; when the original has open-item lines, the reversal clears them against its own and an `ItemsCleared` follows, whose `clearing_entry_id` is the reversal entry. Subject is the id of the original (reversed) entry.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.ledger.journal_entry_reversed.v1}
      payload: {$ref: '#/components/schemas/JournalEntryReversedV1'}
      examples:
        - name: reverse-invoice-entry
