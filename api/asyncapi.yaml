      description: "Emitted when a statement imported between two of the house bank's statements (an older statement imported later) has a closing balance that is not the opening balance of the next, which was `imported`: that statement moves to `gap`, with the new statement as its previous one, and automatic posting stops for the bank (ADR-0047, T49c). Subject is the bank statement now in gap."
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
