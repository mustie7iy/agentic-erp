components:
  parameters:
    cell:
      description: Cell identifier (tenant-cell) from the tenant directory, e.g. `eu-1`.
      examples: [eu-1, us-1]
    tenant:
      description: Tenant uuid (equals the `tenantid` attribute).
      examples: [0192a000-0000-7000-8000-000000000001]
    event:
      description: |
        snake_case event name; the second-to-last segment of the CloudEvents
        `type` (e.g. `journal_entry_posted`).

  messageTraits:
    CloudEvent:
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CloudEventHeaders'
      description: |
        CloudEvents 1.0 envelope in binary content mode: each attribute
        travels as a `ce-<attribute>` NATS header and the payload is the
        event `data`.

  messages:
    # ---------------------------------------------------------------- tenancy
    LegalEntityCreated:
      name: LegalEntityCreated
      title: Legal entity created
      summary: A legal entity (company code) was created.
