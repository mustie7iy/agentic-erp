      title: Migration run completed
      summary: A migration run (or rehearsal) finished, reconciled or failed.
      description: Emitted when a migration run reaches a final status, `reconciled` or `failed` (`loaded`, data loaded but not yet reconciled, is intermediate and publishes nothing). Its operation also publishes `OperationCompleted`. Subject is the migration run id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
