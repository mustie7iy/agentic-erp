      description: Emitted by the bank file transmitter, which sends the files `bank-files/{id}:transmit` asked for (T44e), when the connector confirms transmission, or the house bank had already taken a file with the same content hash (`duplicate`, T44c), and the bank file moves to `transmitted`. Subject is the bank file id.
