      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.payments.bank_statement_file_changed.v1}
      payload: {$ref: '#/components/schemas/BankStatementFileChangedV1'}
