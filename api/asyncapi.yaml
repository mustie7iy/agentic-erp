              type: {const: com.example.erp.payments.bank_statement_gap_closed.v1}
      payload: {$ref: '#/components/schemas/BankStatementGapClosedV1'}
      examples:
        - name: closed
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e000000000f3, source: /erp/eu-1/payments, type: com.example.erp.payments.bank_statement_gap_closed.v1, subject: 0192a000-0000-7000-8000-000000000b21, time: '2026-10-20T08:05:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000104}
          payload: {bank_statement_id: 0192a000-0000-7000-8000-000000000b21, house_bank_id: 0192a000-0000-7000-8000-000000000b01, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: DE01, previous_statement_id: 0192a000-0000-7000-8000-000000000b20, status: imported}
    BankStatementGapFound:
