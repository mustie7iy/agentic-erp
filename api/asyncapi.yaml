      title: Budget threshold reached
      summary: "A model budget line reached 80% or 100% of its monthly cap."
      description: "Emitted by the model gateway (ADR-0036) when a call settling on a budget line takes its month's spend to 80% or to 100% of the line's cap, each once a month. A line is an agent's (its `monthly_budget`) or the tenant's (the AI policy's cap). Amounts are in the prices' currency, rounded to its minor unit. Subject is the budget line (`agents.spend`) id."
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.agents.budget_threshold_reached.v1}
      payload: {$ref: '#/components/schemas/BudgetThresholdReachedV1'}
      examples:
        - name: example
          headers: {"specversion": "1.0", "id": "0192a000-0000-7000-8000-e00000000401", "source": "/erp/eu-1/agents", "type": "com.example.erp.agents.budget_threshold_reached.v1", "subject": "0192a000-0000-7000-8000-000000000d01", "time": "2026-10-17T09:00:00Z", "datacontenttype": "application/json", "tenantid": "0192a000-0000-7000-8000-000000000001", "actorid": "0192a000-0000-7000-8000-000000000103"}
          payload: {"line": "agent", "agent_id": "0192a000-0000-7000-8000-000000000103", "month": "2026-10", "threshold": 80, "limit": {"amount": "50.00", "currency": "USD"}, "spent": {"amount": "40.12", "currency": "USD"}}

  schemas:
    # ------------------------------------------------------------- envelope
    CloudEventHeaders:
      type: object
      description: CloudEvents 1.0 context attributes (carried as `ce-<name>` headers on NATS).
      required: [specversion, id, source, type, subject, time, datacontenttype, tenantid, actorid]
      properties:
        specversion: {type: string, const: '1.0'}
        id:
          $ref: '#/components/schemas/Uuid'
          description: Event id (the outbox row id). Consumers deduplicate on it.
        source:
          type: string
          pattern: '^/erp/[a-z0-9-]+/[a-z_]+$'
          description: '`/erp/<cell>/<context>`.'
        type:
          type: string
          pattern: '^com\.example\.erp\.[a-z_]+\.[a-z_]+\.v[0-9]+$'
          description: '`com.example.erp.<context>.<event>.v<major>`.'
        subject:
          type: string
          minLength: 1
          description: Id of the resource the event is about; the per-resource ordering key.
        time: {$ref: '#/components/schemas/Instant'}
        datacontenttype: {type: string, const: application/json}
        dataschema:
          type: string
          format: uri
          description: Optional link to the payload schema of this event type and version.
        tenantid:
          $ref: '#/components/schemas/Uuid'
          description: Tenant that owns the event.
        actorid:
          $ref: '#/components/schemas/Uuid'
          description: Principal (human, agent or service) whose request caused the change.
        traceid:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: W3C trace id of the request or workflow that caused the change, when traced.

    # --------------------------------------------------------------- common
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    NullableUuid:
      type: [string, 'null']
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Date:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: Business date, `YYYY-MM-DD`.
    NullableDate:
      type: [string, 'null']
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    Instant:
      type: string
      format: date-time
      description: RFC 3339 instant in UTC.
    CurrencyCode: {type: string, pattern: '^[A-Z]{3}$', description: ISO 4217 code (`ref.currency`).}
    CountryCode: {type: string, pattern: '^[A-Z]{2}$', description: ISO 3166-1 alpha-2 code (`ref.country`).}
    FiscalYear: {type: integer, minimum: 1900, maximum: 2999}
    Sha256Hex: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 digest, lower-case hex.}
    Money:
      type: object
      description: Non-negative amount; decimal string with exactly the currency's minor-unit digits (ADR-0005, 04 §4.4).
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: {type: string, pattern: '^[0-9]+(\.[0-9]{1,4})?$'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
    SignedMoney:
      type: object
      description: Signed amount (debit positive, credit negative); same format as `Money`.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: {type: string, pattern: '^-?[0-9]+(\.[0-9]{1,4})?$'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
    Quantity:
      type: object
      description: Decimal quantity with unit of measure (`ref.unit_of_measure`).
      required: [value, unit]
      additionalProperties: false
      properties:
        value: {type: string, pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'}
        unit: {type: string, pattern: '^[A-Z0-9]{1,6}$'}

    # -------------------------------------------------------------- tenancy
    LegalEntityCreatedV1:
      type: object
      required: [legal_entity_id, code, name, country_code, local_currency, fiscal_calendar_id, status]
      properties:
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string, pattern: '^[A-Z0-9]{1,10}$', description: Company code.}
        name: {type: string}
        country_code: {$ref: '#/components/schemas/CountryCode'}
        local_currency: {$ref: '#/components/schemas/CurrencyCode'}
        fiscal_calendar_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, description: 'Open enum: active, blocked, inactive.'}

    # ------------------------------------------------------------- identity
    RoleAssignedV1:
      type: object
      required: [role_assignment_id, principal_id, principal_kind, role_id, role_code, valid_from, valid_to]
      properties:
        role_assignment_id: {$ref: '#/components/schemas/Uuid', description: '`identity.principal_role.id`.'}
        principal_id: {$ref: '#/components/schemas/Uuid'}
        principal_kind: {type: string, description: 'Open enum: human, agent, service.'}
        role_id: {$ref: '#/components/schemas/Uuid'}
        role_code: {type: string, pattern: '^[A-Za-z0-9_]{1,40}$'}
        valid_from: {$ref: '#/components/schemas/Date'}
        valid_to: {$ref: '#/components/schemas/NullableDate', description: Exclusive end; null for open-ended.}
    AccessRevokedV1:
      type: object
      required: [assignment_kind, assignment_id, principal_id, valid_from, valid_to, ended_at]
      properties:
        assignment_kind:
          type: string
          description: 'Open enum: role_assignment (`identity.principal_role`; `role_id` set), company_access (`identity.company_access`; `legal_entity_id` set).'
        assignment_id: {$ref: '#/components/schemas/Uuid', description: Id of the ended assignment (the event subject).}
        principal_id: {$ref: '#/components/schemas/Uuid'}
        role_id: {$ref: '#/components/schemas/NullableUuid'}
        legal_entity_id: {$ref: '#/components/schemas/NullableUuid'}
        valid_from: {$ref: '#/components/schemas/Date'}
        valid_to: {$ref: '#/components/schemas/Date', description: Exclusive end; first day without the access.}
        ended_at: {$ref: '#/components/schemas/Instant', description: When the assignment was ended; `ended_by` is the event's `actorid`.}

    # -------------------------------------------------------- configuration
    ChangeRequestSubmittedV1:
      type: object
      required: [change_request_id, number, title, author_id, base_version, tier, status, item_count]
      properties:
        change_request_id: {$ref: '#/components/schemas/Uuid'}
        number: {type: string}
        title: {type: string}
        author_id: {$ref: '#/components/schemas/Uuid'}
        base_version: {type: integer, minimum: 1, description: Configuration version the change is based on.}
        tier: {type: integer, minimum: 1, maximum: 4, description: Risk tier (highest tier of its items).}
        status: {type: string, description: 'Open enum; validating in v1.'}
        item_count: {type: integer, minimum: 1}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
    ChangeRequestApprovedV1:
      type: object
      required: [change_request_id, number, tier, base_version, status]
      properties:
        change_request_id: {$ref: '#/components/schemas/Uuid'}
        number: {type: string}
        tier: {type: integer, minimum: 1, maximum: 4}
        base_version: {type: integer, minimum: 1}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
        status: {type: string, description: 'Always approved in v1.'}
    ConfigurationActivatedV1:
      type: object
      required: [config_version_id, config_version, source, hash, activated_at]
      properties:
        config_version_id: {$ref: '#/components/schemas/Uuid'}
        config_version: {type: integer, minimum: 1, description: Version number.}
        previous_version: {type: [integer, 'null'], minimum: 1, description: Null for the bootstrap version.}
        source: {type: string, description: 'Open enum: bootstrap, change_request, rollback.'}
        change_request_id: {$ref: '#/components/schemas/NullableUuid', description: Set when source is change_request.}
        restored_from: {type: [integer, 'null'], minimum: 1, description: Set when source is rollback.}
        hash: {$ref: '#/components/schemas/Sha256Hex', description: SHA-256 of the canonical configuration document.}
        activated_at: {$ref: '#/components/schemas/Instant'}

    # -------------------------------------------------------------- partner
    BusinessPartnerCreatedV1:
      type: object
      required: [partner_id, number, kind, name, country_code, roles, status, partner_change_id]
      properties:
        partner_id: {$ref: '#/components/schemas/Uuid'}
        number: {type: string, pattern: '^[A-Z0-9-]{1,20}$'}
        kind: {type: string, description: 'Open enum: organization, person.'}
        name: {type: string}
        country_code: {$ref: '#/components/schemas/CountryCode'}
        roles: {type: array, items: {type: string, description: 'Open enum: supplier, customer.'}}
        status: {type: string, description: 'Open enum: pending, active, blocked, inactive.'}
        partner_change_id: {$ref: '#/components/schemas/Uuid'}
    SupplierApprovedV1:
      type: object
      required: [partner_id, number, partner_change_id, status]
      properties:
        partner_id: {$ref: '#/components/schemas/Uuid'}
        number: {type: string}
        partner_change_id: {$ref: '#/components/schemas/Uuid'}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
        status: {type: string, description: 'Partner status after approval (active).'}
        legal_entity_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
          description: Legal entities with supplier company data.
    BankAccountChangedV1:
      type: object
      required: [partner_id, bank_account_id, purpose, account_scheme, account_last4, bank_country_code, valid_from, valid_to, ended_bank_account_id, partner_change_id]
      properties:
        partner_id: {$ref: '#/components/schemas/Uuid'}
        bank_account_id: {$ref: '#/components/schemas/NullableUuid', description: The new account; null when the change only ends an account.}
        ended_bank_account_id: {$ref: '#/components/schemas/NullableUuid', description: The account this change ended; null for a partner's first account.}
        ended_valid_to: {$ref: '#/components/schemas/NullableDate', description: '`valid_to` set on the ended account.'}
        purpose: {type: string, description: 'Open enum: payments, collections.'}
        account_scheme: {type: string, description: 'Open enum: iban, domestic.'}
        account_last4: {type: string, pattern: '^[A-Z0-9]{1,4}$'}
        bic: {type: [string, 'null'], pattern: '^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$'}
        bank_country_code: {$ref: '#/components/schemas/CountryCode'}
        valid_from: {$ref: '#/components/schemas/Date'}
        valid_to: {$ref: '#/components/schemas/NullableDate', description: 'Exclusive end of the new account; usually null.'}
        partner_change_id: {$ref: '#/components/schemas/Uuid'}
    PartnerBlockedV1:
      type: object
      required: [partner_id, scope, partner_change_id, reason]
      properties:
        partner_id: {$ref: '#/components/schemas/Uuid'}
        scope: {type: string, description: 'Open enum: all (partner status blocked), posting, payment (per legal entity).'}
        legal_entity_id: {$ref: '#/components/schemas/NullableUuid', description: Set for posting and payment blocks.}
        partner_change_id: {$ref: '#/components/schemas/Uuid'}
        reason: {type: string}

    # --------------------------------------------------------------- ledger
    JournalEntryPostedV1:
      type: object
      required: [journal_entry_id, fiscal_year, fiscal_period, legal_entity_id, ledger_id, document_type, document_number, document_date, posting_date, currency_tc, currency_lc, currency_gc, source_context, lines]
      properties:
        journal_entry_id: {$ref: '#/components/schemas/Uuid'}
        fiscal_year: {$ref: '#/components/schemas/FiscalYear'}
        fiscal_period: {type: integer, minimum: 1, maximum: 16}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        ledger_id: {$ref: '#/components/schemas/Uuid'}
        document_type: {type: string, pattern: '^[A-Z0-9]{2}$'}
        document_number: {type: string}
        document_date: {$ref: '#/components/schemas/Date'}
        posting_date: {$ref: '#/components/schemas/Date'}
        currency_tc: {$ref: '#/components/schemas/CurrencyCode'}
        currency_lc: {$ref: '#/components/schemas/CurrencyCode'}
        currency_gc: {$ref: '#/components/schemas/CurrencyCode'}
        reference: {type: [string, 'null']}
        source_context: {type: string, description: 'Open enum: ledger, payables, payments, procurement, receivables, assets, integration.'}
        source_document_id: {$ref: '#/components/schemas/NullableUuid'}
        reversal_of_id: {$ref: '#/components/schemas/NullableUuid', description: Set on reversal entries.}
        reversal_of_year: {type: [integer, 'null']}
        lines:
          type: array
          minItems: 2
          maxItems: 10000
          items:
            type: object
            required: [line_no, account_id, amount_tc, amount_lc, amount_gc]
            properties:
              line_no: {type: integer, minimum: 1}
              account_id: {$ref: '#/components/schemas/Uuid'}
              partner_id: {$ref: '#/components/schemas/NullableUuid'}
              amount_tc: {$ref: '#/components/schemas/SignedMoney'}
              amount_lc: {$ref: '#/components/schemas/SignedMoney'}
              amount_gc: {$ref: '#/components/schemas/SignedMoney'}
              tax_code: {type: [string, 'null']}
              quantity: {$ref: '#/components/schemas/Quantity'}
              purchase_order_id: {$ref: '#/components/schemas/NullableUuid', description: 'Purchase order whose item a GR/IR line belongs to.'}
              po_item_no: {type: [integer, 'null'], minimum: 1, description: 'Item of the purchase order, set with purchase_order_id.'}
              special_gl: {type: string, description: 'Special G/L indicator of a supplier line (ADR-0037), open enum: A, a down payment. Absent on ordinary lines.'}
    JournalEntryReversedV1:
      type: object
      required: [journal_entry_id, fiscal_year, legal_entity_id, document_number, reversal_entry_id, reversal_fiscal_year, reversal_document_number, reversal_posting_date]
      properties:
        journal_entry_id: {$ref: '#/components/schemas/Uuid', description: The reversed (original) entry.}
        fiscal_year: {$ref: '#/components/schemas/FiscalYear'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        reversal_entry_id: {$ref: '#/components/schemas/Uuid'}
        reversal_fiscal_year: {$ref: '#/components/schemas/FiscalYear'}
        reversal_document_number: {type: string}
        reversal_posting_date: {$ref: '#/components/schemas/Date'}
    ItemsClearedV1:
      type: object
      required: [clearing_id, legal_entity_id, clearing_date, clearing_entry_id, clearing_entry_year, items]
      properties:
        clearing_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        clearing_date: {$ref: '#/components/schemas/Date'}
        clearing_entry_id: {$ref: '#/components/schemas/Uuid'}
        clearing_entry_year: {$ref: '#/components/schemas/FiscalYear'}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [fiscal_year, journal_entry_id, line_no, account_id, amount_tc]
            properties:
              fiscal_year: {$ref: '#/components/schemas/FiscalYear'}
              journal_entry_id: {$ref: '#/components/schemas/Uuid'}
              line_no: {type: integer, minimum: 1}
              account_id: {$ref: '#/components/schemas/Uuid'}
              partner_id: {$ref: '#/components/schemas/NullableUuid'}
              amount_tc: {$ref: '#/components/schemas/SignedMoney'}
    PeriodStatusChangedV1:
      type: object
      required: [period_id, legal_entity_id, ledger_id, calendar_id, fiscal_year, period, start_date, end_date, status]
      properties:
        period_id: {$ref: '#/components/schemas/Uuid', description: '`ledger.period_status.id`.'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        ledger_id: {$ref: '#/components/schemas/Uuid'}
        calendar_id: {$ref: '#/components/schemas/Uuid'}
        fiscal_year: {$ref: '#/components/schemas/FiscalYear'}
        period: {type: integer, minimum: 1, maximum: 16}
        start_date: {$ref: '#/components/schemas/Date'}
        end_date: {$ref: '#/components/schemas/Date'}
        status: {type: string, description: 'Open enum: open, closed, locked.'}
        previous_status: {type: [string, 'null'], description: Null when the period status row was created by this change.}
    ParkedJournalEntryChangedV1:
      type: object
      required: [parked_entry_id, legal_entity_id, posting_date, amount, status, previous_status, created_by_kind, owner_id, approval_request_id, journal_entry_id]
      properties:
        parked_entry_id: {$ref: '#/components/schemas/Uuid', description: '`ledger.parked_entry.id`.'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        posting_date: {$ref: '#/components/schemas/Date'}
        amount: {$ref: '#/components/schemas/Money', description: Debit total in transaction currency.}
        status: {type: string, description: 'Open enum: parked, pending_approval, posted, rejected, cancelled.'}
        previous_status: {type: [string, 'null'], description: Null when the entry was parked by this change.}
        created_by_kind: {type: string, description: 'Open enum: human, agent, service.'}
        owner_id: {$ref: '#/components/schemas/NullableUuid', description: The person who owns the entry; null for an agent's entry no person has taken on.}
        approval_request_id: {$ref: '#/components/schemas/NullableUuid', description: The manual_entry approval request the entry waits for or was decided on.}
        journal_entry_id: {$ref: '#/components/schemas/NullableUuid', description: The journal entry it was posted as.}

    # ---------------------------------------------------------- procurement
    RequisitionSubmittedV1:
      type: object
      required: [requisition_id, document_number, legal_entity_id, requester_id, estimated_total, item_count, status]
      properties:
        requisition_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        requester_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/NullableUuid', description: Suggested supplier.}
        contract_id: {$ref: '#/components/schemas/NullableUuid'}
        needed_by: {$ref: '#/components/schemas/NullableDate'}
        estimated_total: {$ref: '#/components/schemas/Money', description: 'Sum of quantity × unit_price / price_unit over the items, requisition currency.'}
        item_count: {type: integer, minimum: 1}
        status: {type: string, description: 'Open enum; pending_approval in v1.'}
    PurchaseOrderReleasedV1:
      type: object
      required: [purchase_order_id, document_number, legal_entity_id, supplier_id, order_date, payment_term_code, total_amount, items]
      properties:
        purchase_order_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        purchasing_org_id: {$ref: '#/components/schemas/NullableUuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        order_date: {$ref: '#/components/schemas/Date'}
        payment_term_code: {type: string}
        requisition_id: {$ref: '#/components/schemas/NullableUuid'}
        contract_id: {$ref: '#/components/schemas/NullableUuid'}
        valuation: {type: string, description: 'Open enum: direct, gr_ir. How the order is booked, fixed at release.'}
        total_amount: {$ref: '#/components/schemas/Money'}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [item_no, quantity, unit_price, price_unit, account_id]
            properties:
              item_no: {type: integer, minimum: 1}
              quantity: {$ref: '#/components/schemas/Quantity'}
              unit_price: {$ref: '#/components/schemas/Money'}
              price_unit: {type: integer, minimum: 1}
              account_id: {$ref: '#/components/schemas/Uuid'}
              tax_code: {type: [string, 'null']}
              contract_item_no: {type: [integer, 'null']}
    PurchaseOrderChangedV1:
      type: object
      required: [purchase_order_id, document_number, legal_entity_id, supplier_id, change_id, revision, reason, order_date, payment_term_code, total_before, total_after, items]
      properties:
        purchase_order_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        change_id: {$ref: '#/components/schemas/Uuid', description: '`procurement.purchase_order_change.id` applied.'}
        revision: {type: integer, minimum: 2, description: The revision the change made.}
        reason: {type: string}
        order_date: {$ref: '#/components/schemas/Date'}
        payment_term_code: {type: string}
        contract_id: {$ref: '#/components/schemas/NullableUuid'}
        total_before: {$ref: '#/components/schemas/Money'}
        total_after: {$ref: '#/components/schemas/Money'}
        items:
          type: array
          minItems: 1
          description: The order's live items after the change.
          items:
            type: object
            required: [item_no, quantity, unit_price, price_unit, account_id]
            properties:
              item_no: {type: integer, minimum: 1}
              quantity: {$ref: '#/components/schemas/Quantity'}
              unit_price: {$ref: '#/components/schemas/Money'}
              price_unit: {type: integer, minimum: 1}
              account_id: {$ref: '#/components/schemas/Uuid'}
              tax_code: {type: [string, 'null']}
              contract_item_no: {type: [integer, 'null']}
    GoodsMovementItem:
      type: object
      required: [item_no, purchase_order_id, po_item_no, quantity]
      properties:
        item_no: {type: integer, minimum: 1}
        purchase_order_id: {$ref: '#/components/schemas/Uuid'}
        po_item_no: {type: integer, minimum: 1}
        quantity: {$ref: '#/components/schemas/Quantity'}
    GoodsReceivedV1:
      type: object
      required: [goods_receipt_id, document_number, legal_entity_id, movement_type, document_date, posting_date, items]
      properties:
        goods_receipt_id: {$ref: '#/components/schemas/Uuid', description: '`procurement.goods_movement.id`.'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        plant_id: {$ref: '#/components/schemas/NullableUuid'}
        movement_type: {type: string, description: '101 (goods receipt for purchase order).'}
        document_date: {$ref: '#/components/schemas/Date'}
        posting_date: {$ref: '#/components/schemas/Date'}
        reference: {type: [string, 'null'], description: Delivery note.}
        journal_entry_id: {$ref: '#/components/schemas/NullableUuid', description: 'WE entry the receipt posted (items of orders valued gr_ir), else null.'}
        journal_entry_year: {type: [integer, 'null'], description: 'Fiscal year of journal_entry_id.'}
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GoodsMovementItem'}}
    GoodsReturnedV1:
      type: object
      required: [goods_receipt_id, document_number, legal_entity_id, movement_type, document_date, posting_date, reason, items]
      properties:
        goods_receipt_id: {$ref: '#/components/schemas/Uuid', description: '`procurement.goods_movement.id` of the return.'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        plant_id: {$ref: '#/components/schemas/NullableUuid'}
        movement_type: {type: string, description: '122 (return to the supplier).'}
        document_date: {$ref: '#/components/schemas/Date'}
        posting_date: {$ref: '#/components/schemas/Date'}
        reference: {type: [string, 'null'], description: Return delivery note.}
        reason: {type: string, description: Why the goods went back.}
        journal_entry_id: {$ref: '#/components/schemas/NullableUuid', description: 'WE entry the return posted (items of orders valued gr_ir), else null.'}
        journal_entry_year: {type: [integer, 'null'], description: 'Fiscal year of journal_entry_id.'}
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GoodsMovementItem'}}
    GoodsReceiptReversedV1:
      type: object
      required: [goods_receipt_id, reversal_id, document_number, legal_entity_id, movement_type, posting_date, items]
      properties:
        goods_receipt_id: {$ref: '#/components/schemas/Uuid', description: The reversed receipt (`reversal_of_id` of the reversal).}
        reversal_id: {$ref: '#/components/schemas/Uuid', description: The reversing goods movement.}
        document_number: {type: string, description: Document number of the reversing movement.}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        movement_type: {type: string, description: '102 (reversal of a 101) or 123 (reversal of a 122).'}
        posting_date: {$ref: '#/components/schemas/Date'}
        journal_entry_id: {$ref: '#/components/schemas/NullableUuid', description: 'WE entry the reversal posted (items of orders valued gr_ir), else null.'}
        journal_entry_year: {type: [integer, 'null'], description: 'Fiscal year of journal_entry_id.'}
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GoodsMovementItem'}}

    # ------------------------------------------------------------- payables
    SupplierInvoiceCapturedV1:
      type: object
      required: [supplier_invoice_id, document_number, legal_entity_id, supplier_id, supplier_reference, invoice_date, gross_amount, tax_amount, source, status]
      properties:
        supplier_invoice_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        supplier_reference: {type: string}
        invoice_date: {$ref: '#/components/schemas/Date'}
        gross_amount: {$ref: '#/components/schemas/SignedMoney', description: 'Negative for credit memos and subsequent credits, whose document amounts are positive (kind gives the direction).'}
        tax_amount: {$ref: '#/components/schemas/SignedMoney', description: 'Signed as gross_amount.'}
        purchase_order_id: {$ref: '#/components/schemas/NullableUuid'}
        kind: {type: string, description: 'Open enum: invoice, credit_memo, subsequent_debit, subsequent_credit. Absent from events of releases before it was kept: an invoice.'}
        reference_invoice_id: {$ref: '#/components/schemas/NullableUuid', description: 'The invoice a credit memo or subsequent debit/credit corrects.'}
        source: {type: string, description: 'Open enum: manual, capture, edi, migration.'}
        capture_sha256: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: Hash of the captured document when source is capture.}
        status: {type: string, description: 'Open enum: parked, or on_hold for a low-confidence capture.'}
    SupplierInvoiceMatchedV1:
      type: object
      required: [match_result_id, supplier_invoice_id, evaluated_at, is_clean, config_version, issues]
      properties:
        match_result_id: {$ref: '#/components/schemas/Uuid'}
        supplier_invoice_id: {$ref: '#/components/schemas/Uuid'}
        evaluated_at: {$ref: '#/components/schemas/Instant'}
        is_clean: {type: boolean}
        config_version: {type: integer, minimum: 1, description: Configuration version whose tolerances were applied.}
        invoice_version: {type: integer, minimum: 1, description: 'The supplier invoice version the match left the invoice at; posting accepts the latest clean match only at this version. Absent from events of releases before it was kept.'}
        issues:
          type: array
          description: Empty when clean.
          items:
            type: object
            required: [code]
            properties:
              code: {type: string, description: 'Open enum, e.g. price_variance, quantity_exceeds_received, quantity_exceeds_invoiced (credit memos), nothing_invoiced (subsequent debits and credits).'}
              item_no: {type: [integer, 'null']}
              po_item_no: {type: [integer, 'null']}
              detail: {type: string}
    InvoiceHeldV1:
      type: object
      required: [supplier_invoice_id, supplier_id, legal_entity_id, hold_reason, status]
      properties:
        supplier_invoice_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        hold_reason: {type: string}
        status: {type: string, description: 'Open enum; on_hold in v1.'}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
    SupplierInvoicePostedV1:
      type: object
      required: [supplier_invoice_id, document_number, legal_entity_id, supplier_id, supplier_reference, invoice_date, posting_date, gross_amount, tax_amount, journal_entry_id, journal_entry_year, status]
      properties:
        supplier_invoice_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        supplier_reference: {type: string}
        invoice_date: {$ref: '#/components/schemas/Date'}
        posting_date: {$ref: '#/components/schemas/Date'}
        gross_amount: {$ref: '#/components/schemas/SignedMoney', description: 'Negative for credit memos and subsequent credits (kind gives the direction).'}
        tax_amount: {$ref: '#/components/schemas/SignedMoney', description: 'Signed as gross_amount.'}
        kind: {type: string, description: 'Open enum: invoice, credit_memo, subsequent_debit, subsequent_credit. Absent from events of releases before it was kept: an invoice.'}
        purchase_order_id: {$ref: '#/components/schemas/NullableUuid'}
        journal_entry_id: {$ref: '#/components/schemas/Uuid'}
        journal_entry_year: {$ref: '#/components/schemas/FiscalYear'}
        status: {type: string, description: 'Open enum; posted in v1.'}
        payment_terms:
          description: 'The payment terms the invoice posted with (T36b); null when it has none (a credit memo or subsequent credit naming no invoice). Absent from events of releases before they were kept.'
          oneOf:
            - type: 'null'
            - type: object
              required: [code, baseline_date, net_due_date, discounts]
              properties:
                code: {type: string}
                baseline_date: {$ref: '#/components/schemas/Date'}
                net_due_date: {$ref: '#/components/schemas/Date'}
                discounts:
                  type: array
                  maxItems: 2
                  items:
                    type: object
                    required: [until, percent]
                    properties:
                      until: {$ref: '#/components/schemas/Date'}
                      percent: {type: string, description: 'Percent off, a decimal of up to three places.'}
    SupplierInvoiceCancelledV1:
      type: object
      required: [supplier_invoice_id, supplier_id, legal_entity_id, previous_status, status]
      properties:
        supplier_invoice_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        previous_status: {type: string, description: 'Open enum: parked, on_hold.'}
        status: {type: string, description: 'Open enum; cancelled in v1.'}
    DownPaymentRequestedV1:
      type: object
      required: [down_payment_request_id, document_number, legal_entity_id, supplier_id, amount, tax_amount, due_date, status]
      properties:
        down_payment_request_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        purchase_order_id: {$ref: '#/components/schemas/NullableUuid', description: 'The purchase order the down payment is for.'}
        amount: {$ref: '#/components/schemas/Money', description: 'What is paid, tax included.'}
        tax_code: {type: [string, 'null'], description: 'Input tax code; the payment claims the tax.'}
        tax_amount: {$ref: '#/components/schemas/Money', description: 'The input tax the amount includes; 0 without a tax code.'}
        due_date: {$ref: '#/components/schemas/Date'}
        reference: {type: [string, 'null']}
        status: {type: string, description: 'Open enum; open in v1.'}
    DownPaymentRequestCancelledV1:
      type: object
      required: [down_payment_request_id, legal_entity_id, supplier_id, previous_status, status]
      properties:
        down_payment_request_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        previous_status: {type: string, description: 'Open enum: open.'}
        status: {type: string, description: 'Open enum; cancelled in v1.'}
    DownPaymentsClearedV1:
      type: object
      required: [supplier_invoice_id, supplier_id, legal_entity_id, clearing_entry_id, clearing_entry_year, down_payment_request_ids, amount]
      properties:
        supplier_invoice_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        clearing_entry_id: {$ref: '#/components/schemas/Uuid'}
        clearing_entry_year: {type: integer}
        down_payment_request_ids: {type: array, items: {$ref: '#/components/schemas/Uuid'}}
        amount: {$ref: '#/components/schemas/Money', description: 'The down payments cleared, tax included: the payables debit.'}
    SupplierInvoiceReversedV1:
      type: object
      required: [supplier_invoice_id, document_number, supplier_id, legal_entity_id, gross_amount, journal_entry_id, journal_entry_year, reversal_entry_id, reversal_entry_year, reversal_posting_date, status]
      properties:
        supplier_invoice_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        gross_amount: {$ref: '#/components/schemas/SignedMoney', description: 'Negative for credit memos and subsequent credits (kind gives the direction).'}
        kind: {type: string, description: 'Open enum: invoice, credit_memo, subsequent_debit, subsequent_credit. Absent from events of releases before it was kept: an invoice.'}
        journal_entry_id: {$ref: '#/components/schemas/Uuid', description: The invoice's original (now reversed) entry.}
        journal_entry_year: {$ref: '#/components/schemas/FiscalYear'}
        reversal_entry_id: {$ref: '#/components/schemas/Uuid'}
        reversal_entry_year: {$ref: '#/components/schemas/FiscalYear'}
        reversal_posting_date: {$ref: '#/components/schemas/Date'}
        status: {type: string, description: 'Open enum; reversed in v1.'}

    # ------------------------------------------------------------- payments
    PaymentRunProposedV1:
      type: object
      required: [payment_run_id, document_number, legal_entity_id, house_bank_id, run_date, due_by, total_amount, payment_count, exclusion_count, proposed_by, status]
      properties:
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        house_bank_id: {$ref: '#/components/schemas/Uuid'}
        run_date: {$ref: '#/components/schemas/Date'}
        due_by: {$ref: '#/components/schemas/Date'}
        total_amount: {$ref: '#/components/schemas/Money'}
        discount_amount: {$ref: '#/components/schemas/Money', description: 'The cash discounts the run takes (T36c); total_amount is what it pays after them. Absent from events of releases before discounts were taken.'}
        payment_count: {type: integer, minimum: 0}
        exclusion_count: {type: integer, minimum: 0}
        proposed_by: {$ref: '#/components/schemas/Uuid'}
        operation_id: {$ref: '#/components/schemas/NullableUuid'}
        status: {type: string, description: 'Open enum; proposed in v1.'}
    PaymentRunReleasedV1:
      type: object
      required: [payment_run_id, document_number, legal_entity_id, house_bank_id, run_date, total_amount, payment_count, released_at, status]
      properties:
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        house_bank_id: {$ref: '#/components/schemas/Uuid'}
        run_date: {$ref: '#/components/schemas/Date'}
        total_amount: {$ref: '#/components/schemas/Money'}
        payment_count: {type: integer, minimum: 0}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
        released_at: {$ref: '#/components/schemas/Instant'}
        status: {type: string, description: 'Open enum; released in v1.'}
    PaymentRunRejectedV1:
      type: object
      required: [payment_run_id, document_number, legal_entity_id, released_item_count, status]
      properties:
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
        released_item_count: {type: integer, minimum: 0, description: Payment items deactivated (open items free for another run).}
        status: {type: string, description: 'Open enum; rejected in v1.'}
    PaymentExcludedV1:
      type: object
      required: [payment_run_id, document_number, legal_entity_id, payment_id, supplier_id, reason_code, amount, released_item_count, status]
      properties:
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        document_number: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        payment_id: {$ref: '#/components/schemas/Uuid'}
        supplier_id: {$ref: '#/components/schemas/Uuid'}
        reason_code: {type: string, description: 'Open enum; item_reversed or item_not_open in v1.'}
        amount: {$ref: '#/components/schemas/Money'}
        released_item_count: {type: integer, minimum: 0, description: Payment items deactivated (open items free for another run).}
        status: {type: string, description: 'Open enum; releasing in v1.'}
    BankFileTransmittedV1:
      type: object
      required: [bank_file_id, payment_run_id, format, sha256, status]
      properties:
        bank_file_id: {$ref: '#/components/schemas/Uuid'}
        payment_run_id: {$ref: '#/components/schemas/Uuid'}
        format: {type: string, description: 'Open enum: pain.001.001.03, pain.001.001.09.'}
        sha256: {$ref: '#/components/schemas/Sha256Hex', description: Hash of the transmitted file.}
        connector_id: {$ref: '#/components/schemas/NullableUuid'}
        integration_message_id: {$ref: '#/components/schemas/NullableUuid'}
        status: {type: string, description: 'Open enum; transmitted in v1.'}

    # ------------------------------------------------------------- workflow
    ApprovalEscalatedV1:
      type: object
      required: [approval_request_id, object_type, object_id, current_step, escalations, pending_since]
      properties:
        approval_request_id: {$ref: '#/components/schemas/Uuid'}
        object_type: {type: string, description: 'Open enum: requisition, partner_change, config_change, invoice_exception, period_unlock, manual_entry, purchase_order, order_change.'}
        object_id: {$ref: '#/components/schemas/Uuid'}
        current_step: {type: integer, minimum: 1, description: The step waiting for a decision.}
        escalations: {type: integer, minimum: 1, description: How often the request has now been escalated.}
        pending_since: {type: string, format: date-time, description: When the request was opened.}
    ApprovalRequestedV1:
      type: object
      required: [approval_request_id, object_type, object_id, title, requester_id, steps]
      properties:
        approval_request_id: {$ref: '#/components/schemas/Uuid'}
        object_type: {type: string, description: 'Open enum: requisition, partner_change, config_change, invoice_exception, period_unlock, manual_entry, purchase_order, order_change.'}
        object_id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        requester_id: {$ref: '#/components/schemas/Uuid', description: 'Principal that raised the request: human, agent or service.'}
        amount:
          oneOf:
            - {$ref: '#/components/schemas/Money'}
            - {type: 'null'}
        policy_id: {$ref: '#/components/schemas/NullableUuid'}
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required: [step_no, role_id, required]
            properties:
              step_no: {type: integer, minimum: 1}
              role_id: {$ref: '#/components/schemas/Uuid'}
              required: {type: integer, minimum: 1, description: Number of approvals needed at this step.}
    ApprovalCompletedV1:
      type: object
      required: [approval_request_id, object_type, object_id, outcome, decided_by, decided_by_kind, completed_at]
      properties:
        approval_request_id: {$ref: '#/components/schemas/Uuid'}
        object_type: {type: string}
        object_id: {$ref: '#/components/schemas/Uuid'}
        outcome: {type: string, description: 'Open enum: approved, rejected, cancelled.'}
        decided_by: {$ref: '#/components/schemas/Uuid', description: Principal whose decision completed the request (the requester for cancellations).}
        decided_by_kind: {type: string, description: 'Open enum: human, agent, service. Always human unless outcome is cancelled.'}
        comment: {type: [string, 'null'], description: Required for rejections and cancellations.}
        completed_at: {$ref: '#/components/schemas/Instant'}

    # ---------------------------------------------------------- integration
    MigrationRunCompletedV1:
      type: object
      required: [migration_run_id, connector_id, mode, is_rehearsal, scope, status, finished_at]
      properties:
        migration_run_id: {$ref: '#/components/schemas/Uuid'}
        connector_id: {$ref: '#/components/schemas/Uuid'}
        mode: {type: string, description: 'Open enum: documents, balances.'}
        is_rehearsal: {type: boolean}
        scope:
          type: object
          properties:
            legal_entity_ids: {type: array, items: {$ref: '#/components/schemas/Uuid'}}
            fiscal_year: {$ref: '#/components/schemas/FiscalYear'}
        status: {type: string, description: 'Open enum: reconciled, failed.'}
        operation_id: {$ref: '#/components/schemas/NullableUuid'}
        started_at: {$ref: '#/components/schemas/Instant'}
        finished_at: {$ref: '#/components/schemas/Instant'}
        summary:
          type: object
          description: Headline figures of the reconciliation report; the full report is read through the API.
          additionalProperties: true

    # --------------------------------------------------------------- agents
    RecommendationMadeV1:
      type: object
      required: [recommendation_id, session_id, agent_id, object_type, object_id, kind, content]
      properties:
        recommendation_id: {$ref: '#/components/schemas/Uuid'}
        session_id: {$ref: '#/components/schemas/Uuid'}
        agent_id: {$ref: '#/components/schemas/Uuid', description: Agent principal.}
        object_type: {type: string}
        object_id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string}
        content: {type: string}

    # ------------------------------------------------------------- platform
    AuditChainTamperedV1:
      type: object
      required: [tenant_id, broken_at, head_seq, verified_at]
      properties:
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        broken_at: {type: integer, description: 'First sequence number that does not verify.'}
        head_seq: {type: integer, description: 'The chain head at verification.'}
        verified_at: {type: string, format: date-time}
    OperationCompletedV1:
      type: object
      required: [operation_id, kind, status, progress, resource]
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string, pattern: '^[a-z_]+\.[a-z_]+$', description: 'e.g. payments.propose, integration.migrate, ledger.close_period.'}
        status: {type: string, description: 'Open enum: succeeded, failed, cancelled.'}
        resource: {type: [string, 'null'], description: 'API path of the resource the operation created or changed (`platform.operation.resource`).'}
        progress:
          type: object
          required: [done, total]
          description: '`progress_done` and `progress_total` of the operation.'
          properties:
            done: {type: integer, minimum: 0}
            total: {type: [integer, 'null'], minimum: 0, description: Null when the total was never known.}
        error:
          type: [object, 'null']
          description: Problem details (04 §4.6) when status is failed.
          properties:
            code: {type: string}
            message: {type: string}

