      description: |
        Emitted when the TakeCashSnapshot workflow takes a company's daily
        snapshot (`daily`, once per company and date) and by `cash-snapshots`
        (POST, `on_demand`, a person's) (ADR-0051 §6, §15). It names the
        snapshot, which `GET /v1/cash-snapshots/{id}` returns; a snapshot is
        never changed. Subject is the snapshot id. Offered to webhooks
        (ADR-0051 §14, T53h): a treasury system that pulls reads the
        snapshot, its flows (`GET /v1/cash-snapshots/{id}/flows`) or its
        exports when told it was taken.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.cash.cash_snapshot_taken.v1}
      payload: {$ref: '#/components/schemas/CashSnapshotTakenV1'}
      examples:
        - name: daily
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000601, source: /erp/eu-1/cash, type: com.example.erp.cash.cash_snapshot_taken.v1, subject: 0192a000-0000-7000-8000-000000000e01, time: '2026-10-21T11:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {cash_snapshot_id: 0192a000-0000-7000-8000-000000000e01, legal_entity_id: 0192a000-0000-7000-8000-000000000201, company_code: '3000', kind: daily, snapshot_date: '2026-10-21', line_count: 42}
    VarianceCommentProposed:
      name: VarianceCommentProposed
      title: Variance comment proposed
      summary: The forecast agent proposed a comment on a row of a company's forecast variance.
      description: |
        Emitted by `liquidity-forecast-variance/comment-proposals` (POST):
        the forecast agent proposed, in its session, an explanation of a
        row of a company's variance citing the documents behind its
        attribution, for a person to accept or reject (ADR-0051 §13, §15,
        T53i). It names the row (the liquidity item, null for what no rule
        assigns), period, lag, snapshot and session, and how many
        documents it cites; the text and citations are
        `GET /v1/liquidity-forecast-variance/comments/{id}`. Subject is the
        comment id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.cash.variance_comment_proposed.v1}
      payload: {$ref: '#/components/schemas/VarianceCommentProposedV1'}
      examples:
        - name: proposed
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000622, source: /erp/eu-1/cash, type: com.example.erp.cash.variance_comment_proposed.v1, subject: 0192a000-0000-7000-8000-000000000e22, time: '2026-05-04T13:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000a11}
          payload: {variance_comment_id: 0192a000-0000-7000-8000-000000000e22, legal_entity_id: 0192a000-0000-7000-8000-000000000201, company_code: '3000', from: '2026-04-24', to: '2026-04-30', lag: 7, liquidity_item: PAY_SUPPLIERS, snapshot_id: 0192a000-0000-7000-8000-000000000e01, session_id: 0192a000-0000-7000-8000-000000000a01, citation_count: 1}
    VarianceCommentDecided:
      name: VarianceCommentDecided
      title: Variance comment decided
      summary: A comment on a row of a company's forecast variance was decided.
      description: |
        Emitted by `liquidity-forecast-variance/comments` (POST): a person's
        comment is decided as it is written (`accepted`, decided by its
        author) (ADR-0051 §11, §15); and by `:acceptProposal` and
        `:rejectProposal`, when a person decides the forecast agent's
        proposal (`accepted` or `rejected`, decided by that person; T53i). It names the row the comment explains
        (the liquidity item, null for what no rule assigns), its period and
        lag, and the snapshot that variance compares with; the comment
        itself is `GET /v1/liquidity-forecast-variance/comments/{id}`.
        Subject is the comment id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.cash.variance_comment_decided.v1}
      payload: {$ref: '#/components/schemas/VarianceCommentDecidedV1'}
      examples:
        - name: accepted
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000621, source: /erp/eu-1/cash, type: com.example.erp.cash.variance_comment_decided.v1, subject: 0192a000-0000-7000-8000-000000000e21, time: '2026-05-04T14:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {variance_comment_id: 0192a000-0000-7000-8000-000000000e21, legal_entity_id: 0192a000-0000-7000-8000-000000000201, company_code: '3000', from: '2026-04-24', to: '2026-04-30', lag: 7, liquidity_item: PAY_SUPPLIERS, snapshot_id: 0192a000-0000-7000-8000-000000000e01, status: accepted, decided_by: 0192a000-0000-7000-8000-000000000101}
    CashExportDelivered:
      name: CashExportDelivered
      title: Cash export delivered
      summary: A snapshot of a company's liquidity forecast was delivered to a treasury system.
      description: |
        Emitted by the exporter when it has delivered a snapshot's export
        to a treasury channel (ADR-0051 §14, §15): the file, in the cash
        export schema v1, named by company, snapshot date and content hash,
        is in the channel's SFTP directory. `resend` is true when the
        channel had been delivered the same file before (the same snapshot
        exported again), so a treasury system recognises it by its name.
        The export is `GET /v1/cash-exports/{id}`. Subject is the export id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.cash.cash_export_delivered.v1}
      payload: {$ref: '#/components/schemas/CashExportDeliveredV1'}
      examples:
        - name: delivered
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000631, source: /erp/eu-1/cash, type: com.example.erp.cash.cash_export_delivered.v1, subject: 0192a000-0000-7000-8000-000000000e51, time: '2026-04-17T13:05:09Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {cash_export_id: 0192a000-0000-7000-8000-000000000e51, cash_snapshot_id: 0192a000-0000-7000-8000-000000000e01, legal_entity_id: 0192a000-0000-7000-8000-000000000201, company_code: '3000', snapshot_date: '2026-04-17', connector_id: 0192a000-0000-7000-8000-000000000c11, connector_name: Treasury SFTP, format: csv, file_name: cash-3000-2026-04-17-4f2c1e0b9a7d6c5b4a3928170615f4e3d2c1b0a99887766554433221100ffeed.csv, sha256: 4f2c1e0b9a7d6c5b4a3928170615f4e3d2c1b0a99887766554433221100ffeed, resend: false}
    AssetChanged:
      name: AssetChanged
      title: Asset changed
      summary: An asset was created, changed or cancelled.
      description: |
        Emitted by `assets` (POST, `created`), `assets/{id}` (PATCH,
        `changed`: its description, depreciation start or terms) and its
        `:cancel` (`cancelled`), ADR-0057 §10; the acquisitions, retirements
        and transfers that make an asset `active` or `retired` add
        `capitalised`, `retired` and `reactivated` with their slices. It
        says what changed, not the asset, which `GET /v1/assets/{id}`
        returns at `version`. Subject is the asset id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.assets.asset_changed.v1}
      payload: {$ref: '#/components/schemas/AssetChangedV1'}
      examples:
        - name: created
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000701, source: /erp/eu-1/assets, type: com.example.erp.assets.asset_changed.v1, subject: 0192a000-0000-7000-8000-000000000f01, time: '2026-11-02T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {asset_id: 0192a000-0000-7000-8000-000000000f01, legal_entity_id: 0192a000-0000-7000-8000-000000000201, asset_number: '1', class_code: MACHINES, change: created, status: planned, version: 1}
    AssetMovementPosted:
      name: AssetMovementPosted
      title: Asset movement posted
      summary: An acquisition, retirement or transfer of an asset was posted.
      description: |
        Emitted by `asset-acquisitions` (POST, `acquisition`) and
        `asset-retirements` (POST, `retirement`, T57g) and `asset-transfers`
        (POST, `transfer`, T57h), ADR-0057 §6, §8, §10. It carries the
        asset, its status and version after the posting, and per ledger the
        change of acquisition cost in local and group currency with the
        journal entry, a retirement also the change of accumulated
        depreciation (its catch-up included) and its gain or loss, so a
        consumer need not read the document for its values (a retirement's
        kind and proceeds are on `GET /v1/asset-retirements/{id}`). A
        retirement lists the ledgers it posted an entry in. A transfer
        carries its kind; a center transfer its centers before and after
        (its ledgers' cost unchanged, their accumulated depreciation its
        catch-up, a catch-up entry of its own named beside the main one);
        an asset transfer its receiver with the receiver's status and
        version after it (the cost and accumulated depreciation taken off
        the asset are brought onto the receiver). Subject is the document
        id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.assets.asset_movement_posted.v1}
      payload: {$ref: '#/components/schemas/AssetMovementPostedV1'}
      examples:
        - name: acquisition
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000702, source: /erp/eu-1/assets, type: com.example.erp.assets.asset_movement_posted.v1, subject: 0192a000-0000-7000-8000-000000000a01, time: '2026-11-03T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {document_kind: acquisition, document_id: 0192a000-0000-7000-8000-000000000a01, asset_id: 0192a000-0000-7000-8000-000000000f01, legal_entity_id: 0192a000-0000-7000-8000-000000000201, asset_number: '1', class_code: MACHINES, value_date: '2026-11-03', posting_date: '2026-11-03', currency_lc: CAD, currency_gc: USD, ledgers: [{ledger_id: 0192a000-0000-7000-8000-000000000301, cost: {amount: '6000.00', currency: CAD}, cost_gc: {amount: '4380.00', currency: USD}, journal_entry_id: 0192a000-0000-7000-8000-000000000e11, fiscal_year: 2026, document_number: '1'}], asset_status: active, asset_version: 2}
    AssetMovementReversed:
      name: AssetMovementReversed
      title: Asset movement reversed
      summary: An acquisition, retirement or transfer of an asset was reversed.
      description: |
        Emitted by `asset-acquisitions/{id}:reverse` (`acquisition`) and
        `asset-retirements/{id}:reverse` (`retirement`, T57g) and
        `asset-transfers/{id}:reverse` (`transfer`, T57h), ADR-0057 §6, §8,
        §10, a transfer with the same fields as when it was posted. It
        carries the asset, its status and version after
        the reversal, the reversal's posting date and reason, and per
        ledger the change of acquisition cost the reversal made (the
        original's negated) in local and group currency with the reversal
        entry and the entry it reversed. Subject is the document id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.assets.asset_movement_reversed.v1}
      payload: {$ref: '#/components/schemas/AssetMovementReversedV1'}
      examples:
        - name: acquisition
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000703, source: /erp/eu-1/assets, type: com.example.erp.assets.asset_movement_reversed.v1, subject: 0192a000-0000-7000-8000-000000000a01, time: '2026-11-04T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {document_kind: acquisition, document_id: 0192a000-0000-7000-8000-000000000a01, asset_id: 0192a000-0000-7000-8000-000000000f01, legal_entity_id: 0192a000-0000-7000-8000-000000000201, asset_number: '1', class_code: MACHINES, posting_date: '2026-11-04', reason: Capitalised onto the wrong machine., currency_lc: CAD, currency_gc: USD, ledgers: [{ledger_id: 0192a000-0000-7000-8000-000000000301, cost: {amount: '-6000.00', currency: CAD}, cost_gc: {amount: '-4380.00', currency: USD}, journal_entry_id: 0192a000-0000-7000-8000-000000000e12, fiscal_year: 2026, document_number: '2', reversed_entry_id: 0192a000-0000-7000-8000-000000000e11}], asset_status: planned, asset_version: 3}
    DepreciationRunCompleted:
      name: DepreciationRunCompleted
      title: Depreciation run completed
      summary: A depreciation run ended, posted or failed.
      description: |
        Emitted when a depreciation run (`POST /v1/depreciation-runs`,
        ADR-0057 §7, §10) ends: `posted` with what it posted, or `failed`
        with the problem that stopped it (`assets.run_cancelled` once its
        Operation was cancelled, `platform.internal` when a step's error
        outlasted its retries) and what its batches posted before (they
        stay posted). It carries the run's company, ledger,
        period and posting date, the assets it planned, posted and
        skipped, the depreciation posted in local currency, and its
        batches' journal entries. Subject is the run id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.assets.depreciation_run_completed.v1}
      payload: {$ref: '#/components/schemas/DepreciationRunCompletedV1'}
      examples:
        - name: posted
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000704, source: /erp/eu-1/assets, type: com.example.erp.assets.depreciation_run_completed.v1, subject: 0192a000-0000-7000-8000-000000000f31, time: '2026-11-30T17:00:04Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {run_id: 0192a000-0000-7000-8000-000000000f31, legal_entity_id: 0192a000-0000-7000-8000-000000000201, company_code: '1000', ledger_id: 0192a000-0000-7000-8000-000000000301, ledger_code: 0L, fiscal_year: 2026, period: 11, posting_date: '2026-11-30', status: posted, currency_lc: CAD, assets_planned: 2, assets_posted: 2, assets_skipped: 0, amount: {amount: '112.50', currency: CAD}, entries: [{batch_no: 1, journal_entry_id: 0192a000-0000-7000-8000-000000000f33, fiscal_year: 2026, document_number: AF-2026-000001}]}
    PlanCategoryChanged:
      name: PlanCategoryChanged
      title: Plan category changed
      summary: A plan category was created, locked or unlocked.
      description: |
        Emitted by `plan-categories` (POST, `created`) and its `:lock`
        (`locked`) and `:unlock` (`unlocked`), ADR-0050 §8: a locked
        category's plan does not move. Subject is the plan category id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.controlling.plan_category_changed.v1}
      payload: {$ref: '#/components/schemas/PlanCategoryChangedV1'}
      examples:
        - name: locked
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000601, source: /erp/eu-1/controlling, type: com.example.erp.controlling.plan_category_changed.v1, subject: 0192a000-0000-7000-8000-000000000a01, time: '2026-10-27T10:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {plan_category_id: 0192a000-0000-7000-8000-000000000a01, code: PLAN, name: Budget, locked: true, change: locked}
    PlanBatchApplied:
      name: PlanBatchApplied
      title: Plan batch applied
      summary: A batch replaced the plan of its category, legal entity, fiscal year and centers.
      description: |
        Emitted by `plan-batches` (POST) when a batch is applied, ADR-0050
        §8: the plan of the category, legal entity and fiscal year on the
        centers named is now the batch's lines (`GET /v1/plan-lines` with
        `plan_batch_id`). A batch key applied again with the same lines
        changes nothing and is not published again. Subject is the plan
        batch id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.controlling.plan_batch_applied.v1}
      payload: {$ref: '#/components/schemas/PlanBatchAppliedV1'}
      examples:
        - name: applied
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000602, source: /erp/eu-1/controlling, type: com.example.erp.controlling.plan_batch_applied.v1, subject: 0192a000-0000-7000-8000-000000000b01, time: '2026-10-27T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {plan_batch_id: 0192a000-0000-7000-8000-000000000b01, plan_category_id: 0192a000-0000-7000-8000-000000000a01, legal_entity_id: 0192a000-0000-7000-8000-000000000011, fiscal_year: 2027, batch_key: budget-2027-v1, line_count: 12, replaced_count: 0, cost_center_ids: [0192a000-0000-7000-8000-000000000201], profit_center_ids: []}
    InternalOrderChanged:
      name: InternalOrderChanged
      title: Internal order changed
      summary: An internal order was created or released.
      description: |
        Emitted by `internal-orders` (POST, `created`) and its `:release`
        (`released`), ADR-0064 §1: costs may be posted to a released
        order. Subject is the internal order id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.controlling.internal_order_changed.v1}
      payload: {$ref: '#/components/schemas/InternalOrderChangedV1'}
      examples:
        - name: released
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000603, source: /erp/eu-1/controlling, type: com.example.erp.controlling.internal_order_changed.v1, subject: 0192a000-0000-7000-8000-000000000c01, time: '2026-11-11T10:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {internal_order_id: 0192a000-0000-7000-8000-000000000c01, legal_entity_id: 0192a000-0000-7000-8000-000000000011, code: TRADEFAIR-26, name: Trade fair 2026, responsible_cost_center_id: 0192a000-0000-7000-8000-000000000201, responsible_cost_center_code: CC-1100, status: released, change: released}
    InternalOrderBudgetChanged:
      name: InternalOrderBudgetChanged
      title: Internal order budget changed
      summary: An internal order's budget was set or replaced.
      description: |
        Emitted by `internal-orders/{id}/budget` (PATCH), ADR-0064 §3: the
        order's budget, one overall amount in its legal entity's local
        currency, with the amount it replaced. Nothing is refused for a
        budget; `GET /v1/internal-orders/{id}/budget` compares it with the
        order's actual costs. Subject is the internal order id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.controlling.internal_order_budget_changed.v1}
      payload: {$ref: '#/components/schemas/InternalOrderBudgetChangedV1'}
      examples:
        - name: replaced
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000604, source: /erp/eu-1/controlling, type: com.example.erp.controlling.internal_order_budget_changed.v1, subject: 0192a000-0000-7000-8000-000000000c01, time: '2026-11-12T10:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {internal_order_id: 0192a000-0000-7000-8000-000000000c01, legal_entity_id: 0192a000-0000-7000-8000-000000000011, code: TRADEFAIR-26, name: Trade fair 2026, budget: {amount: '20000.00', currency: EUR}, previous_budget: {amount: '15000.00', currency: EUR}, version: 2}
    TaxReturnPrepared:
      name: TaxReturnPrepared
      x-webhook: true
      title: Tax return prepared
      summary: "A tax return of a registration's period was prepared and its tax items claimed."
      description: "Emitted by `prepareTaxReturn` (ADR-0049 §11): the snapshot of the period's draft, its boxes and the hash of the items it claimed, whose `reported_in` now names it; it waits for its `tax_return` approval request. Subject is the tax return id."
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
