          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000022, source: /erp/eu-1/payables, type: com.example.erp.payables.supplier_invoice_reversed.v1, subject: 0192a000-0000-7000-8000-000000000701, time: '2026-10-09T10:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
