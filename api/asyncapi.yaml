          payload: {migration_run_id: 0192a000-0000-7000-8000-000000000b01, connector_id: 0192a000-0000-7000-8000-000000000b02, mode: documents, is_rehearsal: true, scope: {legal_entity_ids: [0192a000-0000-7000-8000-000000000201], fiscal_year: 2026}, status: reconciled, operation_id: 0192a000-0000-7000-8000-000000000b03, started_at: '2026-10-10T01:00:00Z', finished_at: '2026-10-10T03:12:00Z', summary: {records_read: 128734, records_loaded: 128734, differences: 0}}

