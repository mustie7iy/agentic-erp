          - properties:
              type: {const: com.example.erp.payments.payment_excluded.v1}
      payload: {$ref: '#/components/schemas/PaymentExcludedV1'}
      examples:
        - name: dropped
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000081, source: /erp/eu-1/payments, type: com.example.erp.payments.payment_excluded.v1, subject: 0192a000-0000-7000-8000-000000000801, time: '2026-10-19T11:02:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {payment_run_id: 0192a000-0000-7000-8000-000000000801, document_number: PR-2026-0042, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: DE01, payment_id: 0192a000-0000-7000-8000-000000000806, supplier_id: 0192a000-0000-7000-8000-000000000301, supplier_number: BP-100231, reason_code: item_reversed, amount: {amount: '40.00', currency: EUR}, released_item_count: 1, status: releasing}
    BankStatementImported:
      name: BankStatementImported
      title: Bank statement imported
      summary: A bank account statement was imported for a house bank.
      description: "Emitted for each statement of a bank's file imported by `POST /v1/bank-statements` (ADR-0047, T49c), in the file's order. `status` is `gap` when its opening balance is not the closing balance of the house bank's statement before it (`previous_statement_id`); automatic posting then stops for the bank until the missing statement arrives (`BankStatementGapClosed`). The same file imported again publishes nothing. Subject is the bank statement id."
