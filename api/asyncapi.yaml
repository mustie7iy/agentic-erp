          payload: {recommendation_id: 0192a000-0000-7000-8000-000000000c02, session_id: 0192a000-0000-7000-8000-000000000c01, agent_id: 0192a000-0000-7000-8000-000000000103, object_type: supplier_invoice, object_id: 0192a000-0000-7000-8000-000000000701, kind: release_hold, content: The supplier's price list effective 2026-10-01 is 540.00 per EA; recommend updating the PO price and releasing the hold.}

