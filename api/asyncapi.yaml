          - properties:
              type: {const: com.example.erp.payments.bank_statement_file_refused.v1}
      payload: {$ref: '#/components/schemas/BankStatementFileRefusedV1'}
      examples:
        - name: unreadable
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e000000000f5, source: /erp/eu-1/payments, type: com.example.erp.payments.bank_statement_file_refused.v1, subject: 0192a000-0000-7000-8000-000000000b30, time: '2026-10-20T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000105}
          payload: {statement_fetch_id: 0192a000-0000-7000-8000-000000000b30, house_bank_id: 0192a000-0000-7000-8000-000000000b01, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: DE01, file_name: STMT20261020.sta, file_sha256: fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9, code: payments.statement_unreadable, reason: "line 4: the opening balance is not an amount"}
    BankStatementFileChanged:
      name: BankStatementFileChanged
      title: Bank statement file changed after its import
      summary: A statement file imported from the bank's channel holds other content now.
      description: "Emitted once per house bank and file content when a statement file fetched from the house bank's SFTP channel (T49d), read again before its move to the archive directory, no longer holds the content imported: the file is not archived, the fetch record moves to `changed_after_import`, and the next fetch imports the new content as a new file. The statement imported from the earlier content stays. Subject is the fetch record (payments.statement_fetch)."
