          payload: {payment_run_id: 0192a000-0000-7000-8000-000000000801, document_number: PR-2026-0042, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: DE01, house_bank_id: 0192a000-0000-7000-8000-000000000802, run_date: '2026-10-20', total_amount: {amount: '184220.50', currency: EUR}, payment_count: 57, workflow_request_id: 0192a000-0000-7000-8000-000000000901, released_at: '2026-10-19T11:00:00Z', status: released}
