    BankAccountChanged:
      name: BankAccountChanged
      title: Bank account changed
      summary: An approved bank change added a new effective-dated bank account for a partner, or ended one.
      description: |
        Emitted when a `bank_change` partner change is applied: a new
        `partner.bank_account` row becomes valid from `valid_from` and the
        account it replaces (if any) is ended (`valid_to`, `ended_at`,
        `ended_by` set; rows are never deleted), or an existing account is
        ended without a replacement (`bank_account_id` null, the ended
        account in `ended_bank_account_id`). Payments uses it to hold
        payments to the partner for the configured period after a bank
        change. Only `account_last4` and `account_scheme` are exposed.
        Subject is the business partner id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
