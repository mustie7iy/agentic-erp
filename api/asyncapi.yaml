      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.workflow.approval_requested.v1}
      payload: {$ref: '#/components/schemas/ApprovalRequestedV1'}
      examples:
        - name: payment-run
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000001d, source: /erp/eu-1/workflow, type: com.example.erp.workflow.approval_requested.v1, subject: 0192a000-0000-7000-8000-000000000901, time: '2026-10-19T06:00:01Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
