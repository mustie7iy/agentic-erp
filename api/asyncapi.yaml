      examples:
        - name: pain001
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000001c, source: /erp/eu-1/payments, type: com.example.erp.payments.bank_file_transmitted.v1, subject: 0192a000-0000-7000-8000-000000000803, time: '2026-10-19T11:05:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000104}
          payload: {bank_file_id: 0192a000-0000-7000-8000-000000000803, payment_run_id: 0192a000-0000-7000-8000-000000000801, format: pain.001.001.09, sha256: fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9, connector_id: 0192a000-0000-7000-8000-000000000b02, integration_message_id: null, status: transmitted}

    # --------------------------------------------------------------- workflow
    ApprovalRequested:
      name: ApprovalRequested
      title: Approval requested
      summary: An approval request was opened for a business object.
      description: Emitted when an `approval_request` is inserted in status `pending` with its steps resolved from the applicable policy. Notification and inbox read models use it. Subject is the approval request id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.workflow.approval_requested.v1}
      payload: {$ref: '#/components/schemas/ApprovalRequestedV1'}
      examples:
        - name: payment-run
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000001d, source: /erp/eu-1/workflow, type: com.example.erp.workflow.approval_requested.v1, subject: 0192a000-0000-7000-8000-000000000901, time: '2026-10-19T06:00:01Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {approval_request_id: 0192a000-0000-7000-8000-000000000901, object_type: requisition, object_id: 0192a000-0000-7000-8000-000000000801, title: Requisition 1000004711 (laptops), requester_id: 0192a000-0000-7000-8000-000000000101, amount: {amount: '184220.50', currency: EUR}, policy_id: 0192a000-0000-7000-8000-000000000902, steps: [{step_no: 1, role_id: 0192a000-0000-7000-8000-000000000903, required: 1}]}
    ApprovalEscalated:
      name: ApprovalEscalated
      title: Approval escalated
      summary: A pending approval request got no decision within its deadline.
      description: "Emitted by the request's deadline workflow (ADR-0012) when the request is still pending after the escalation period (`ERP_APPROVAL_ESCALATE_AFTER`); repeated each period up to a limit. Notification and inbox read models use it to remind the step's role and their managers. The actor is a service. Subject is the approval request id."
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.workflow.approval_escalated.v1}
      payload: {$ref: '#/components/schemas/ApprovalEscalatedV1'}
      examples:
        - name: requisition
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000005e, source: /erp/eu-1/workflow, type: com.example.erp.workflow.approval_escalated.v1, subject: 0192a000-0000-7000-8000-000000000901, time: '2026-10-21T06:00:01Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000999}
          payload: {approval_request_id: 0192a000-0000-7000-8000-000000000901, object_type: requisition, object_id: 0192a000-0000-7000-8000-000000000801, current_step: 1, escalations: 1, pending_since: '2026-10-19T06:00:01Z'}
    ApprovalCompleted:
      name: ApprovalCompleted
      title: Approval completed
      summary: An approval request reached a final outcome (approved, rejected or cancelled).
      description: |
        Emitted when the approval request leaves `pending`: the last required
        approval was given (`approved`), a person rejected it (`rejected`) or
        the requester cancelled it (`cancelled`). The owning context of the
        object reacts (requisition approved, payment run released, partner
        change applied...). Approvals and rejections are always by people
        (ADR-0010); a cancellation is by the requester, which may be an
        agent or service that raised the request, so `decided_by_kind` can
        be `agent` or `service` only when `outcome` is `cancelled`. Subject
        is the approval request id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.workflow.approval_completed.v1}
      payload: {$ref: '#/components/schemas/ApprovalCompletedV1'}
      examples:
        - name: approved
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000001e, source: /erp/eu-1/workflow, type: com.example.erp.workflow.approval_completed.v1, subject: 0192a000-0000-7000-8000-000000000901, time: '2026-10-19T10:59:59Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {approval_request_id: 0192a000-0000-7000-8000-000000000901, object_type: requisition, object_id: 0192a000-0000-7000-8000-000000000801, outcome: approved, decided_by: 0192a000-0000-7000-8000-000000000102, decided_by_kind: human, comment: null, completed_at: '2026-10-19T10:59:59Z'}

