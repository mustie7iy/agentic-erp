      title: Bank statement line proposed by the agent
      summary: The reconciliation agent proposed a match or the exclusion of a statement line.
      description: "Emitted when the reconciliation agent proposes, in one of its sessions, what a bank statement line the rules left unmatched or open clears (`match`, its candidate's targets) or that it clears nothing (`exclude`), with a reason (T49g, ADR-0047). The line is `proposed` until a person accepts, rejects or overrides the proposal; nothing is posted. Subject is the proposal (a match of kind agent)."
