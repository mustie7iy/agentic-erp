          payload: {supplier_invoice_id: 0192a000-0000-7000-8000-000000000701, document_number: '1900000456', supplier_id: 0192a000-0000-7000-8000-000000000301, legal_entity_id: 0192a000-0000-7000-8000-000000000201, gross_amount: {amount: '1080.00', currency: EUR}, journal_entry_id: 0192a000-0000-7000-8000-000000000501, journal_entry_year: 2026, reversal_entry_id: 0192a000-0000-7000-8000-000000000502, reversal_entry_year: 2026, reversal_posting_date: '2026-10-09', status: reversed}

