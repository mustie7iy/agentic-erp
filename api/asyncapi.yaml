    AiPolicyChangedV1:
      type: object
      required: ["changed_fields", "enabled", "suspended", "active", "routes", "allowed_models", "documents_to_models", "monthly_cap"]
      properties:
        changed_fields: {"type": "array", "items": {"type": "string"}, "description": "The fields changed: enabled, suspended, monthly_cap, routes, allowed_models, documents_to_models."}
        enabled: {"type": "boolean", "description": "The tenant's administrators' hand on the kill switch."}
        suspended: {"type": "boolean", "description": "The operators' hand, which wins."}
        active: {"type": "boolean", "description": "Whether the tenant's AI runs: enabled and not suspended."}
        routes: {"type": "object", "additionalProperties": {"type": "string"}, "description": "Model alias → model, over the platform's routes."}
        allowed_models: {"type": "array", "items": {"type": "string"}, "description": "The models the aliases may route to; empty: any priced model."}
        documents_to_models: {"type": "boolean", "description": "Whether documents may go to models."}
        monthly_cap: {"oneOf": [{"$ref": "#/components/schemas/Money"}, {"type": "null"}], "description": "The tenant's monthly cap; null: none."}
    BudgetThresholdReachedV1:
      type: object
      required: ["line", "agent_id", "month", "threshold", "limit", "spent"]
      properties:
        line: {"type": "string", "enum": ["agent", "tenant"], "description": "Whose budget: an agent's, or the tenant's."}
        agent_id: {"oneOf": [{"$ref": "#/components/schemas/Uuid"}, {"type": "null"}], "description": "The agent; null on the tenant's line."}
        month: {"type": "string", "pattern": "^[0-9]{4}-[0-9]{2}$", "description": "The calendar month (UTC)."}
        threshold: {"type": "integer", "enum": [80, 100], "description": "The share of the cap reached, in percent."}
        limit: {"$ref": "#/components/schemas/Money", "description": "The line's monthly cap."}
        spent: {"$ref": "#/components/schemas/Money", "description": "What the line has spent this month, the call included."}
    RecommendationDecidedV1:
      type: object
      required: ["recommendation_id", "session_id", "object_type", "object_id", "kind", "outcome", "decided_by"]
      properties:
        recommendation_id: {"$ref": "#/components/schemas/Uuid"}
        session_id: {"$ref": "#/components/schemas/Uuid"}
        object_type: {"type": "string"}
        object_id: {"$ref": "#/components/schemas/Uuid"}
        kind: {"type": "string"}
        outcome: {"type": "string", "description": "Open enum: accepted, overridden, ignored."}
        decided_by: {"$ref": "#/components/schemas/Uuid", "description": "The human who decided."}
