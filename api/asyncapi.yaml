        - name: rejected
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000001b, source: /erp/eu-1/payments, type: com.example.erp.payments.payment_run_rejected.v1, subject: 0192a000-0000-7000-8000-000000000801, time: '2026-10-19T11:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {payment_run_id: 0192a000-0000-7000-8000-000000000801, document_number: PR-2026-0042, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: DE01, workflow_request_id: 0192a000-0000-7000-8000-000000000901, released_item_count: 212, status: rejected}
    PaymentExcluded:
      name: PaymentExcluded
      x-webhook: true
      title: Payment dropped from a releasing run
      summary: A payment of a releasing run could never post and was dropped; its items are free again.
      description: Emitted by the release of a payment run when a payment it has not posted yet settles an item that was reversed, or is no longer open, since the proposal. The supplier's items the payment paid are excluded with `reason_code` (`item_reversed` or `item_not_open`). A payment of items that fix a payment method pays those alone, so the supplier's other payment of the run, if it has one, stands (`listPaymentExclusions` names the method). The payment's items are deactivated, the run's total no longer counts it, and the release goes on with the other payments. Subject is the payment run id.
