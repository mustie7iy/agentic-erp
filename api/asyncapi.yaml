    EntryTemplateChanged:
      name: EntryTemplateChanged
      x-webhook: true
      title: Entry template changed
      summary: An entry template was saved, changed or retired, or a due date of its schedule could not be parked.
      description: |
        Emitted when an entry template is saved (`entry-templates`, POST:
        `previous_status` null), changed (PATCH) or retired
        (`entry-templates/{id}:retire`, `previous_status` `active`), and when
        the ERP could not park the entry of a due date of its schedule
        (`refused_on`, `refusal_code`: the date is passed over, for the owner
        to correct the template and park it by hand). An entry parked for a
        due date publishes `ParkedJournalEntryChanged` instead (ADR-0056).
        `amount` is the template's debit total in its transaction currency.
        Subject is the entry template id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
