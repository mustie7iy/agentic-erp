          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000018, source: /erp/eu-1/payables, type: com.example.erp.payables.supplier_invoice_cancelled.v1, subject: 0192a000-0000-7000-8000-000000000703, time: '2026-10-07T10:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {supplier_invoice_id: 0192a000-0000-7000-8000-000000000703, supplier_id: 0192a000-0000-7000-8000-000000000301, legal_entity_id: 0192a000-0000-7000-8000-000000000201, previous_status: on_hold, status: cancelled}
