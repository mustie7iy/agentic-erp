      title: Partner blocked
      summary: A business partner was blocked, entirely or for posting or payment in one legal entity.
      description: Emitted when a `block` partner change is applied, either setting the partner's status to `blocked` (scope `all`) or setting `is_posting_blocked` / `is_payment_blocked` on its supplier data for one legal entity. Subject is the business partner id.
