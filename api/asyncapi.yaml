      description: "Emitted when a person decides the reconciliation agent's proposal for a bank statement line (T49g, ADR-0047): `accepted` (the person's match or exclusion by it follows, as BankStatementLineMatched or BankStatementLineExcluded), `rejected` (the line is unmatched again), or `overridden` (the person matched or excluded the line otherwise). Subject is the proposal."
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
