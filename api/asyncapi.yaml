      payload: {$ref: '#/components/schemas/BankStatementLineProposalDecidedV1'}
      examples:
        - name: accepted
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e000000000fb, source: /erp/eu-1/payments, type: com.example.erp.payments.bank_statement_line_proposal_decided.v1, subject: 0192a000-0000-7000-8000-000000000b42, time: '2026-10-21T09:30:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000104}
