      description: "Emitted by `POST /v1/revaluation-runs/{id}:cancel` (ADR-0042, T48d) when a `ledger.revaluation_run` goes from `posted` to `cancelled`. Each reversed entry publishes its own `JournalEntryReversed` in the same transaction; a run without entries reverses none, and the reversal fields are null. Subject is the run id."
