    EInvoiceChanged:
      name: EInvoiceChanged
      x-webhook: true
      title: E-invoice changed
      summary: An e-invoice was received from the tenant's accredited provider.
      description: |
        Emitted at each change of an e-invoice's status (ADR-0061 §12,
        T65a): when a fetch records a document the provider delivered
        (`received`, status_before null), and when a fetch finds the
        provider delivered other bytes under its message id (T65b:
        `changed_sha256` set, the status unchanged, so status_before is
        the status), once per different bytes. The processing slices add
        its entering, holding, refusal and dismissal (T65c-T65f). It
        carries no document content. `GET /v1/e-invoices/{id}` returns the
        document at `version` or later: its acknowledgement to the
        provider, which sets `acknowledged_at`, moves the version without
        an event. Subject is the e-invoice id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.einvoicing.einvoice_changed.v1}
      payload: {$ref: '#/components/schemas/EInvoiceChangedV1'}
      examples:
        - name: received
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000e01, source: /erp/eu-1/einvoicing, type: com.example.erp.einvoicing.einvoice_changed.v1, subject: 0192a000-0000-7000-8000-000000000e11, time: '2026-11-08T10:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {einvoice_id: 0192a000-0000-7000-8000-000000000e11, connector_id: 0192a000-0000-7000-8000-000000000e01, message_id: MSG-0001, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: AE01, status: received, status_before: null, sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08, changed_sha256: null, changed_fetch_operation_id: null, fetch_operation_id: 0192a000-0000-7000-8000-000000000e21, version: 1}
        - name: bytes_changed
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000e02, source: /erp/eu-1/einvoicing, type: com.example.erp.einvoicing.einvoice_changed.v1, subject: 0192a000-0000-7000-8000-000000000e11, time: '2026-11-08T11:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {einvoice_id: 0192a000-0000-7000-8000-000000000e11, connector_id: 0192a000-0000-7000-8000-000000000e01, message_id: MSG-0001, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: AE01, status: received, status_before: received, sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08, changed_sha256: 60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752, changed_fetch_operation_id: 0192a000-0000-7000-8000-000000000e22, fetch_operation_id: 0192a000-0000-7000-8000-000000000e21, version: 3}
    CustomerInvoiceChanged:
      name: CustomerInvoiceChanged
      x-webhook: true
      title: Customer invoice changed
      summary: A customer invoice was entered.
      description: |
        Emitted when a customer invoice is entered (ADR-0063 §9, T75a):
        `draft`, status_before null. Its posting is CustomerInvoicePosted,
        which is emitted alone. It carries the document's totals, not
        its items, and names the customer by id and number, never by name.
        `GET /v1/customer-invoices/{id}` returns the document at `version`
        or later. Subject is the customer invoice id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.receivables.customer_invoice_changed.v1}
      payload: {$ref: '#/components/schemas/CustomerInvoiceChangedV1'}
      examples:
        - name: entered
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000f01, source: /erp/eu-1/receivables, type: com.example.erp.receivables.customer_invoice_changed.v1, subject: 0192a000-0000-7000-8000-000000000f11, time: '2026-11-11T10:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {customer_invoice_id: 0192a000-0000-7000-8000-000000000f11, document_number: CI100001, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: '3000', customer_id: 0192a000-0000-7000-8000-000000000f21, customer_number: BP100042, kind: invoice, invoice_date: '2026-11-11', net_amount: {amount: '1000.00', currency: CAD}, tax_amount: {amount: '50.00', currency: CAD}, gross_amount: {amount: '1050.00', currency: CAD}, status: draft, status_before: null, version: 1}
    CustomerInvoicePosted:
      name: CustomerInvoicePosted
      x-webhook: true
      title: Customer invoice posted
      summary: A customer invoice was posted to the ledger.
      description: |
        Emitted when a draft customer invoice is posted (ADR-0063 §5, §9,
        T75b): its journal entry debits the customer's reconciliation
        account, and that line is the customer's open item with the payment
        term and net due date given here. It carries the document's totals,
        not its items, and names the customer by id and number, never by
        name. `GET /v1/customer-invoices/{id}` returns the document at
        `version` or later. Subject is the customer invoice id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.receivables.customer_invoice_posted.v1}
      payload: {$ref: '#/components/schemas/CustomerInvoicePostedV1'}
      examples:
        - name: posted
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000f02, source: /erp/eu-1/receivables, type: com.example.erp.receivables.customer_invoice_posted.v1, subject: 0192a000-0000-7000-8000-000000000f11, time: '2026-11-11T10:05:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {customer_invoice_id: 0192a000-0000-7000-8000-000000000f11, document_number: CI100001, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: '3000', customer_id: 0192a000-0000-7000-8000-000000000f21, customer_number: BP100042, kind: invoice, invoice_date: '2026-11-11', posting_date: '2026-11-11', net_amount: {amount: '1000.00', currency: CAD}, tax_amount: {amount: '50.00', currency: CAD}, gross_amount: {amount: '1050.00', currency: CAD}, payment_term_code: NT30, net_due_date: '2026-12-11', journal_entry_id: 0192a000-0000-7000-8000-000000000f31, journal_entry_year: 2026, journal_entry_number: '1800000001', status: posted, status_before: draft, version: 2}
    DunningRunChanged:
      name: DunningRunChanged
      x-webhook: true
      title: Dunning run changed
      summary: A dunning run was proposed.
      description: |
        Emitted at each change of a dunning run's status (ADR-0065 §6,
        T76a): when it is started (`proposed`, status_before null). The
        slice that confirms a run adds its confirmation. It carries the
        run's totals, not its notices, and names no customer:
        `GET /v1/dunning-runs/{id}/notices` returns the notices, and
        `GET /v1/dunning-runs/{id}` the run at `version` or later. Subject
        is the dunning run id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.collections.dunning_run_changed.v1}
      payload: {$ref: '#/components/schemas/DunningRunChangedV1'}
      examples:
        - name: proposed
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000f03, source: /erp/eu-1/collections, type: com.example.erp.collections.dunning_run_changed.v1, subject: 0192a000-0000-7000-8000-000000000f31, time: '2026-12-31T10:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {dunning_run_id: 0192a000-0000-7000-8000-000000000f31, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: '3000', key_date: '2026-12-31', notice_count: 1, item_count: 1, overdue_amount: {amount: '1050.00', currency: CAD}, status: proposed, status_before: null, version: 1}
    IncomingPaymentApplied:
      name: IncomingPaymentApplied
      x-webhook: true
      title: Incoming payment applied
      summary: An incoming payment was applied to a customer's open items.
      description: |
        Emitted when an incoming payment waiting on a house bank's incoming
        payments clearing account is applied to a customer's open items
        (ADR-0063 §6, §9, T75c): one clearing entry cleared the receipt and
        the items, which equal it exactly. It carries the amount and the
        number of items, not the items, and names the customer by id and
        number, never by name. `GET /v1/incoming-payments/{id}` returns the
        document, which never changes. Subject is the incoming payment id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.receivables.incoming_payment_applied.v1}
      payload: {$ref: '#/components/schemas/IncomingPaymentAppliedV1'}
      examples:
        - name: applied
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000f03, source: /erp/eu-1/receivables, type: com.example.erp.receivables.incoming_payment_applied.v1, subject: 0192a000-0000-7000-8000-000000000f41, time: '2026-11-12T10:05:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {incoming_payment_id: 0192a000-0000-7000-8000-000000000f41, document_number: IP100001, legal_entity_id: 0192a000-0000-7000-8000-000000000201, legal_entity_code: '3000', customer_id: 0192a000-0000-7000-8000-000000000f21, customer_number: BP100042, posting_date: '2026-11-12', amount: {amount: '1050.00', currency: CAD}, receipt_journal_entry_id: 0192a000-0000-7000-8000-000000000f32, journal_entry_id: 0192a000-0000-7000-8000-000000000f33, journal_entry_year: 2026, journal_entry_number: '1400000001', item_count: 1}
    AiPolicyChanged:
      name: AiPolicyChanged
      title: AI policy changed
      summary: "The tenant's AI policy changed: its kill switch, routes, allowed models, monthly cap or whether documents may go to models."
      description: "Emitted by `updateAiPolicy` (the tenant's administrators) and by the control plane's `suspendAi` and `resumeAi` (the platform's operators), ADR-0036. Carries the fields changed and the settings after the change; never the operators' reason for a suspension. Subject is the tenant id."
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.agents.ai_policy_changed.v1}
      payload: {$ref: '#/components/schemas/AiPolicyChangedV1'}
      examples:
        - name: example
          headers: {"specversion": "1.0", "id": "0192a000-0000-7000-8000-e00000000402", "source": "/erp/eu-1/agents", "type": "com.example.erp.agents.ai_policy_changed.v1", "subject": "0192a000-0000-7000-8000-000000000001", "time": "2026-10-18T09:00:00Z", "datacontenttype": "application/json", "tenantid": "0192a000-0000-7000-8000-000000000001", "actorid": "0192a000-0000-7000-8000-000000000102"}
          payload: {"changed_fields": ["enabled"], "enabled": false, "suspended": false, "active": false, "routes": {}, "allowed_models": [], "documents_to_models": true, "monthly_cap": {"amount": "500.00", "currency": "USD"}}
    BudgetThresholdReached:
      name: BudgetThresholdReached
      title: Budget threshold reached
      summary: "A model budget line reached 80% or 100% of its monthly cap."
      description: "Emitted by the model gateway (ADR-0036) when a call settling on a budget line takes its month's spend to 80% or to 100% of the line's cap, each once a month. A line is an agent's (its `monthly_budget`) or the tenant's (the AI policy's cap). Amounts are in the prices' currency, rounded to its minor unit. Subject is the budget line (`agents.spend`) id."
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.agents.budget_threshold_reached.v1}
      payload: {$ref: '#/components/schemas/BudgetThresholdReachedV1'}
      examples:
        - name: example
          headers: {"specversion": "1.0", "id": "0192a000-0000-7000-8000-e00000000401", "source": "/erp/eu-1/agents", "type": "com.example.erp.agents.budget_threshold_reached.v1", "subject": "0192a000-0000-7000-8000-000000000d01", "time": "2026-10-17T09:00:00Z", "datacontenttype": "application/json", "tenantid": "0192a000-0000-7000-8000-000000000001", "actorid": "0192a000-0000-7000-8000-000000000103"}
          payload: {"line": "agent", "agent_id": "0192a000-0000-7000-8000-000000000103", "month": "2026-10", "threshold": 80, "limit": {"amount": "50.00", "currency": "USD"}, "spent": {"amount": "40.12", "currency": "USD"}}

  schemas:
    # ------------------------------------------------------------- envelope
    CloudEventHeaders:
      type: object
      description: CloudEvents 1.0 context attributes (carried as `ce-<name>` headers on NATS).
      required: [specversion, id, source, type, subject, time, datacontenttype, tenantid, actorid]
      properties:
        specversion: {type: string, const: '1.0'}
        id:
          $ref: '#/components/schemas/Uuid'
          description: Event id (the outbox row id). Consumers deduplicate on it.
        source:
          type: string
          pattern: '^/erp/[a-z0-9-]+/[a-z_]+$'
          description: '`/erp/<cell>/<context>`.'
        type:
          type: string
          pattern: '^com\.example\.erp\.[a-z_]+\.[a-z_]+\.v[0-9]+$'
          description: '`com.example.erp.<context>.<event>.v<major>`.'
        subject:
          type: string
          minLength: 1
          description: Id of the resource the event is about; the per-resource ordering key.
        time: {$ref: '#/components/schemas/Instant'}
        datacontenttype: {type: string, const: application/json}
        dataschema:
          type: string
          format: uri
          description: Optional link to the payload schema of this event type and version.
        tenantid:
          $ref: '#/components/schemas/Uuid'
          description: Tenant that owns the event.
        actorid:
          $ref: '#/components/schemas/Uuid'
          description: Principal (human, agent or service) whose request caused the change.
        traceid:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: W3C trace id of the request or workflow that caused the change, when traced.

    # --------------------------------------------------------------- common
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    NullableUuid:
      type: [string, 'null']
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Date:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: Business date, `YYYY-MM-DD`.
    NullableDate:
      type: [string, 'null']
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    Instant:
      type: string
      format: date-time
      description: RFC 3339 instant in UTC.
    CurrencyCode: {type: string, pattern: '^[A-Z]{3}$', description: ISO 4217 code (`ref.currency`).}
    CountryCode: {type: string, pattern: '^[A-Z]{2}$', description: ISO 3166-1 alpha-2 code (`ref.country`).}
    FiscalYear: {type: integer, minimum: 1900, maximum: 2999}
    EventExtensions:
      type: object
      description: |
        The row's custom fields as written (ADR-0046). The value of every
        field the tenant's active schema does not declare `x-pii: none`
        (personal, sensitive, or not declared) is the string `[MASKED]`;
        the field's value is read through the API. Webhooks deliver these
        events, so they carry the same masking. Keys follow the tenant's
        schema at `GET /v1/schemas/{entity}`.
      additionalProperties: true
    ExtensionsSchemaVersion:
      type: [integer, 'null']
      minimum: 1
      description: The version of the tenant's custom field schema the extensions were written under; null when the tenant had none.
    Sha256Hex: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 digest, lower-case hex.}
    Money:
      type: object
      description: Non-negative amount; decimal string with exactly the currency's minor-unit digits (ADR-0005, 04 §4.4).
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: {type: string, pattern: '^[0-9]+(\.[0-9]{1,4})?$'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
    SignedMoney:
      type: object
      description: Signed amount (debit positive, credit negative); same format as `Money`.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: {type: string, pattern: '^-?[0-9]+(\.[0-9]{1,4})?$'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
    Quantity:
      type: object
      description: Decimal quantity with unit of measure (`ref.unit_of_measure`).
      required: [value, unit]
      additionalProperties: false
      properties:
        value: {type: string, pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'}
        unit: {type: string, pattern: '^[A-Z0-9]{1,6}$'}

    # -------------------------------------------------------------- tenancy
    LegalEntityCreatedV1:
      type: object
      required: [legal_entity_id, code, name, country_code, local_currency, fiscal_calendar_id, status]
      properties:
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string, pattern: '^[A-Z0-9]{1,10}$', description: Company code.}
        name: {type: string}
        country_code: {$ref: '#/components/schemas/CountryCode'}
        local_currency: {$ref: '#/components/schemas/CurrencyCode'}
        fiscal_calendar_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, description: 'Open enum: active, blocked, inactive.'}

    # ------------------------------------------------------------- identity
    RoleAssignedV1:
      type: object
      required: [role_assignment_id, principal_id, principal_kind, role_id, role_code, valid_from, valid_to]
      properties:
        role_assignment_id: {$ref: '#/components/schemas/Uuid', description: '`identity.principal_role.id`.'}
        principal_id: {$ref: '#/components/schemas/Uuid'}
        principal_kind: {type: string, description: 'Open enum: human, agent, service.'}
        role_id: {$ref: '#/components/schemas/Uuid'}
        role_code: {type: string, pattern: '^[A-Za-z0-9_]{1,40}$'}
        valid_from: {$ref: '#/components/schemas/Date'}
        valid_to: {$ref: '#/components/schemas/NullableDate', description: Exclusive end; null for open-ended.}
    AccessRevokedV1:
      type: object
      required: [assignment_kind, assignment_id, principal_id, valid_from, valid_to, ended_at]
      properties:
        assignment_kind:
          type: string
          description: 'Open enum: role_assignment (`identity.principal_role`; `role_id` set), company_access (`identity.company_access`; `legal_entity_id` set).'
        assignment_id: {$ref: '#/components/schemas/Uuid', description: Id of the ended assignment (the event subject).}
        principal_id: {$ref: '#/components/schemas/Uuid'}
        role_id: {$ref: '#/components/schemas/NullableUuid'}
        legal_entity_id: {$ref: '#/components/schemas/NullableUuid'}
        valid_from: {$ref: '#/components/schemas/Date'}
        valid_to: {$ref: '#/components/schemas/Date', description: Exclusive end; first day without the access.}
        ended_at: {$ref: '#/components/schemas/Instant', description: When the assignment was ended; `ended_by` is the event's `actorid`.}

    # -------------------------------------------------------- configuration
    ChangeRequestSubmittedV1:
      type: object
      required: [change_request_id, number, title, author_id, base_version, tier, status, item_count]
      properties:
        change_request_id: {$ref: '#/components/schemas/Uuid'}
        number: {type: string}
        title: {type: string}
        author_id: {$ref: '#/components/schemas/Uuid'}
        base_version: {type: integer, minimum: 1, description: Configuration version the change is based on.}
        tier: {type: integer, minimum: 1, maximum: 4, description: Risk tier (highest tier of its items).}
        status: {type: string, description: 'Open enum; validating in v1.'}
        item_count: {type: integer, minimum: 1}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
    ChangeRequestApprovedV1:
      type: object
      required: [change_request_id, number, tier, base_version, status]
      properties:
        change_request_id: {$ref: '#/components/schemas/Uuid'}
        number: {type: string}
        tier: {type: integer, minimum: 1, maximum: 4}
        base_version: {type: integer, minimum: 1}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
        status: {type: string, description: 'Always approved in v1.'}
    ConfigurationActivatedV1:
      type: object
      required: [config_version_id, config_version, source, hash, activated_at]
      properties:
        config_version_id: {$ref: '#/components/schemas/Uuid'}
        config_version: {type: integer, minimum: 1, description: Version number.}
        previous_version: {type: [integer, 'null'], minimum: 1, description: Null for the bootstrap version.}
        source: {type: string, description: 'Open enum: bootstrap, change_request, rollback.'}
        change_request_id: {$ref: '#/components/schemas/NullableUuid', description: Set when source is change_request.}
        restored_from: {type: [integer, 'null'], minimum: 1, description: Set when source is rollback.}
        hash: {$ref: '#/components/schemas/Sha256Hex', description: SHA-256 of the canonical configuration document.}
        activated_at: {$ref: '#/components/schemas/Instant'}

    # -------------------------------------------------------------- partner
    BusinessPartnerCreatedV1:
      type: object
      required: [partner_id, number, kind, name, country_code, roles, status, partner_change_id]
      properties:
        extensions: {$ref: '#/components/schemas/EventExtensions'}
        extensions_schema: {$ref: '#/components/schemas/ExtensionsSchemaVersion'}
        partner_id: {$ref: '#/components/schemas/Uuid'}
        number: {type: string, pattern: '^[A-Z0-9-]{1,20}$'}
        kind: {type: string, description: 'Open enum: organization, person.'}
        name: {type: string}
        country_code: {$ref: '#/components/schemas/CountryCode'}
        roles: {type: array, items: {type: string, description: 'Open enum: supplier, customer.'}}
        status: {type: string, description: 'Open enum: pending, active, blocked, inactive.'}
        partner_change_id: {$ref: '#/components/schemas/Uuid'}
        group_company_id: {$ref: '#/components/schemas/Uuid', description: "The legal entity of the tenant the partner is, when it is one of the group's companies (ADR-0059 §4); absent for none. Added within v1 (T68c); consumers ignore it if absent."}
    SupplierApprovedV1:
      type: object
      required: [partner_id, number, partner_change_id, status]
      properties:
        partner_id: {$ref: '#/components/schemas/Uuid'}
        number: {type: string}
        partner_change_id: {$ref: '#/components/schemas/Uuid'}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
        status: {type: string, description: 'Partner status after approval (active).'}
        legal_entity_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
          description: Legal entities with supplier company data.
    CustomerApprovedV1:
      type: object
      required: [partner_id, number, partner_change_id, status, legal_entity_ids]
      properties:
        partner_id: {$ref: '#/components/schemas/Uuid'}
        number: {type: string, description: The business partner's number.}
        partner_change_id: {$ref: '#/components/schemas/Uuid'}
        workflow_request_id: {$ref: '#/components/schemas/NullableUuid'}
        status: {type: string, description: 'Partner status after approval (active).'}
        legal_entity_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
          description: Legal entities with customer company data, ordered by id; empty for a customer without any.
    BankAccountChangedV1:
      type: object
      required: [partner_id, bank_account_id, purpose, account_scheme, account_last4, bank_country_code, valid_from, valid_to, ended_bank_account_id, partner_change_id]
      properties:
        partner_id: {$ref: '#/components/schemas/Uuid'}
