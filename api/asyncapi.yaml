        - name: posted
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000017, source: /erp/eu-1/payables, type: com.example.erp.payables.supplier_invoice_posted.v1, subject: 0192a000-0000-7000-8000-000000000701, time: '2026-10-08T14:03:11Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101, traceid: 8bf92f3577b34da6a3ce929d0e0e4736}
          payload: {supplier_invoice_id: 0192a000-0000-7000-8000-000000000701, document_number: '1900000456', legal_entity_id: 0192a000-0000-7000-8000-000000000201, supplier_id: 0192a000-0000-7000-8000-000000000301, supplier_reference: INV-2026-0981, invoice_date: '2026-10-05', posting_date: '2026-10-08', gross_amount: {amount: '1080.00', currency: EUR}, tax_amount: {amount: '80.00', currency: EUR}, purchase_order_id: 0192a000-0000-7000-8000-000000000602, journal_entry_id: 0192a000-0000-7000-8000-000000000501, journal_entry_year: 2026, status: posted}
    SupplierInvoiceCancelled:
      name: SupplierInvoiceCancelled
      title: Supplier invoice cancelled
