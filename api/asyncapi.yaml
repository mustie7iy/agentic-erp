              profit_center_id: {$ref: '#/components/schemas/Uuid', description: 'The line''s profit center, entered or derived. Absent on lines without one.'}
              profit_center_code: {type: string, description: 'Code of the profit center, set with profit_center_id.'}
              segment_id: {$ref: '#/components/schemas/Uuid', description: 'The line''s segment, its profit center''s. Absent on lines without one.'}
