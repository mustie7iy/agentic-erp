          payload: {period_id: 0192a000-0000-7000-8000-000000000204, legal_entity_id: 0192a000-0000-7000-8000-000000000201, ledger_id: 0192a000-0000-7000-8000-000000000202, calendar_id: 0192a000-0000-7000-8000-000000000203, fiscal_year: 2026, period: 10, start_date: '2026-10-01', end_date: '2026-10-31', status: open, previous_status: null}
    PeriodClosed:
      name: PeriodClosed
      title: Posting period closed
      summary: A fiscal period was closed for posting.
      description: |
        Emitted by `fiscal-periods/{id}:close` (synchronous: the request
        answers 200 with the period) when `ledger.period_status` becomes
        `closed`. Postings, reversals and clearings dated in the period are
        refused from then on. Subject is the period status id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.ledger.period_closed.v1}
      payload: {$ref: '#/components/schemas/PeriodStatusChangedV1'}
      examples:
        - name: sep-2026
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000000f, source: /erp/eu-1/ledger, type: com.example.erp.ledger.period_closed.v1, subject: 0192a000-0000-7000-8000-000000000205, time: '2026-10-06T18:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {period_id: 0192a000-0000-7000-8000-000000000205, legal_entity_id: 0192a000-0000-7000-8000-000000000201, ledger_id: 0192a000-0000-7000-8000-000000000202, calendar_id: 0192a000-0000-7000-8000-000000000203, fiscal_year: 2026, period: 9, start_date: '2026-09-01', end_date: '2026-09-30', status: closed, previous_status: open}
    PeriodLocked:
      name: PeriodLocked
      title: Posting period locked
      summary: A closed fiscal period was locked for good.
      description: |
        Emitted by `fiscal-periods/{id}:lock` (synchronous: the request
        answers 200 with the period) when `ledger.period_status` goes from
        `closed` to `locked`. The period refuses postings, reversals and
        clearings as a closed one does, and is not reopened by `:open`;
        only an approved unlock request returns it to `closed`. Subject is
        the period status id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.ledger.period_locked.v1}
      payload: {$ref: '#/components/schemas/PeriodStatusChangedV1'}
      examples:
        - name: sep-2026
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000082, source: /erp/eu-1/ledger, type: com.example.erp.ledger.period_locked.v1, subject: 0192a000-0000-7000-8000-000000000205, time: '2026-10-20T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000101}
          payload: {period_id: 0192a000-0000-7000-8000-000000000205, legal_entity_id: 0192a000-0000-7000-8000-000000000201, ledger_id: 0192a000-0000-7000-8000-000000000202, calendar_id: 0192a000-0000-7000-8000-000000000203, fiscal_year: 2026, period: 9, start_date: '2026-09-01', end_date: '2026-09-30', status: locked, previous_status: closed}

    PeriodUnlocked:
      name: PeriodUnlocked
      title: Posting period unlocked
      summary: A locked fiscal period returned to closed on an approved unlock request.
      description: |
        Emitted when the `period_unlock` approval request named by a locked
        period is approved (`approval-requests/{id}:approve`, in the same
        transaction as the decision): `ledger.period_status` goes from
        `locked` to `closed`. The period still refuses postings until it is
        opened (`:open`). Subject is the period status id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.ledger.period_unlocked.v1}
      payload: {$ref: '#/components/schemas/PeriodStatusChangedV1'}
      examples:
        - name: sep-2026
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000083, source: /erp/eu-1/ledger, type: com.example.erp.ledger.period_unlocked.v1, subject: 0192a000-0000-7000-8000-000000000205, time: '2026-10-22T09:00:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000102}
          payload: {period_id: 0192a000-0000-7000-8000-000000000205, legal_entity_id: 0192a000-0000-7000-8000-000000000201, ledger_id: 0192a000-0000-7000-8000-000000000202, calendar_id: 0192a000-0000-7000-8000-000000000203, fiscal_year: 2026, period: 9, start_date: '2026-09-01', end_date: '2026-09-30', status: closed, previous_status: locked}
    ParkedJournalEntryChanged:
      name: ParkedJournalEntryChanged
      title: Parked journal entry changed
      summary: A manual journal entry was parked, or its status changed before or as it was posted.
      description: |
        Emitted when a manual journal entry is parked (`parked-journal-entries`,
        `previous_status` null) and on every later change of its status:
        submitted for approval, withdrawn, posted, rejected or cancelled (T35).
        `created_by_kind` `agent` marks an agent's proposal, which only a
        person can post. `amount` is the entry's debit total in its
        transaction currency. Posting also publishes `JournalEntryPosted`,
        whose `source_document_id` is the parked entry. Subject is the parked
        entry id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.ledger.parked_journal_entry_changed.v1}
      payload: {$ref: '#/components/schemas/ParkedJournalEntryChangedV1'}
      examples:
        - name: agent-proposal
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e00000000084, source: /erp/eu-1/ledger, type: com.example.erp.ledger.parked_journal_entry_changed.v1, subject: 0192a000-0000-7000-8000-000000000207, time: '2026-10-09T14:03:11Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000103}
          payload: {parked_entry_id: 0192a000-0000-7000-8000-000000000207, legal_entity_id: 0192a000-0000-7000-8000-000000000201, posting_date: '2026-10-09', amount: {amount: '1200.00', currency: EUR}, status: parked, previous_status: null, created_by_kind: agent, owner_id: null, approval_request_id: null, journal_entry_id: null}

