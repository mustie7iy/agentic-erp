          payload: {journal_entry_id: 0192a000-0000-7000-8000-000000000501, fiscal_year: 2026, legal_entity_id: 0192a000-0000-7000-8000-000000000201, document_number: '5100000123', reversal_entry_id: 0192a000-0000-7000-8000-000000000502, reversal_fiscal_year: 2026, reversal_document_number: '5100000140', reversal_posting_date: '2026-10-09'}
    ItemsCleared:
      name: ItemsCleared
      title: Open items cleared
      summary: Open items on a reconciliation account were settled by a clearing.
      description: Emitted when a `ledger.clearing` with its clearing items is inserted (payment posting, manual clearing, or a reversal clearing the reversed pair). The cleared lines stop being open items; cleared is not paid. A reversal's clearing follows its `JournalEntryReversed` and has the reversal entry as `clearing_entry_id`. Subject is the clearing id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
          - $ref: '#/components/schemas/CloudEventHeaders'
          - properties:
              type: {const: com.example.erp.ledger.items_cleared.v1}
      payload: {$ref: '#/components/schemas/ItemsClearedV1'}
      examples:
        - name: payment-clearing
          headers: {specversion: '1.0', id: 0192a000-0000-7000-8000-e0000000000d, source: /erp/eu-1/ledger, type: com.example.erp.ledger.items_cleared.v1, subject: 0192a000-0000-7000-8000-000000000503, time: '2026-10-20T06:10:00Z', datacontenttype: application/json, tenantid: 0192a000-0000-7000-8000-000000000001, actorid: 0192a000-0000-7000-8000-000000000104}
