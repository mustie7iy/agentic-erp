      summary: An open down payment request was cancelled.
      description: |
        Emitted by `down-payment-requests/{id}:cancel` when an open request
        moves to `cancelled`; no payment run pays it any more. There is no
        ledger impact. Subject is the request id.
      traits: [{$ref: '#/components/messageTraits/CloudEvent'}]
      headers:
        allOf:
