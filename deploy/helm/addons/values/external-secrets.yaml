# The External Secrets Operator: the cell's Secrets Manager entries into
# Kubernetes secrets the platform mounts as files (ADR-0017, ADR-0035). It
# runs as the cell's external_secrets IRSA role (read only), which trusts
# external-secrets/external-secrets only; the environment sets the role
# (cell.workload_role_arns.external_secrets):
#   serviceAccount.annotations."eks.amazonaws.com/role-arn"
fullnameOverride: external-secrets
installCRDs: true
replicaCount: 2
serviceAccount:
  create: true
  name: external-secrets
podDisruptionBudget:
  enabled: true
  minAvailable: 1
