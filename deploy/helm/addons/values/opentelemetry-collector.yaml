# The cell's traces (ADR-0043, T54g): an OpenTelemetry Collector takes the
# server's spans over OTLP/HTTP (erp-cell's server.otlpEndpoint, the
# server's OTEL_EXPORTER_OTLP_TRACES_ENDPOINT) and sends what it keeps to
# AWS X-Ray, through the X-Ray VPC endpoint, as its own IRSA role, which
# may put trace segments and nothing else (irsa.tf tracing).
#
# Sampling: the server records every request; the collector keeps a trace
# when its trace id falls in 5% (the probabilistic policy hashes the id, so
# the choice is the one head sampling at 5% would make) or when any span of
# it failed (status ERROR: a 5xx or a panic, telemetry.Middleware). That
# needs every span of a trace in one place, so it runs as one replica; a
# second would need the load-balancing exporter by trace id first. Traces
# are diagnostics: a restart loses the traces it was holding, nothing else.
#
# Spans carry operation, method, path and status, never tenant or
# principal (they are in the logs); the collector makes no metrics of them
# (no spanmetrics connector, scripts/helm-checks.sh refuses one).
#
# The environment sets, from Terraform's outputs (cell.json
# addons.opentelemetry-collector):
#   serviceAccount.annotations   eks.amazonaws.com/role-arn:
#                                cell.workload_role_arns.tracing
# The chart's schema admits no values of ours: the region is the one EKS
# gives a Pod with an IRSA role (AWS_REGION, the cluster's), and the server
# is erp-cell's in the erp namespace (erp-delivery's platform.yaml).
# Sized for one cell: 200m and 512 MiB requested, at most 1 GiB, of which
# the memory limiter keeps a fifth free.
fullnameOverride: erp-tracing
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
serviceAccount:
  create: true
  name: erp-tracing
resources:
  requests: {cpu: 200m, memory: 512Mi}
  limits: {memory: 1Gi}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# OTLP over HTTP alone: the other receivers' ports closed.
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false

# Only the cell's server reaches the receiver.
networkPolicy:
  enabled: true
  allowIngressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: erp
      podSelector:
        matchLabels:
          app.kubernetes.io/name: erp-server

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc: null
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 20
    tail_sampling:
      decision_wait: 10s
      num_traces: 50000
      expected_new_traces_per_sec: 100
      policies:
        - name: failed
          type: status_code
          status_code: {status_codes: [ERROR]}
        - name: five-percent
          type: probabilistic
          probabilistic: {sampling_percentage: 5}
    batch: {}
  exporters:
    debug: null
    awsxray:
      region: ${env:AWS_REGION}
      # The server's trace ids are W3C's, random: X-Ray accepts them, but
      # the exporter by default drops a span whose id does not begin with
      # a timestamp (X-Ray's own format).
      skip_timestamp_validation: true
      # X-Ray indexes these attributes as annotations, so a trace is found
      # by its operation.
      indexed_attributes: [erp.operation]
  service:
    pipelines:
      logs: null
      metrics: null
      traces:
        receivers: [otlp]
        processors: [memory_limiter, tail_sampling, batch]
        exporters: [awsxray]
