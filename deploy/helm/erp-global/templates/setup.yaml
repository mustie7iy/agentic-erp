# The directory's setup (T72h), once per release before anything else of
# it: a pre-install and pre-upgrade hook Job running `erp-router
# setup-directory` with the RDS-managed master credentials, which only
# this hook holds. It makes the directory's schema, its privilege roles'
# grants and the router's, the cells' and erp-web's logins, and sets each
# login's password again from what operators set in Secrets Manager, so a
# changed one takes effect with the release (as erp-cell's
# erp-temporal-schema does for the engine's login). The master URL's
# ExternalSecret, the RDS bundle and the Job's network policy are hooks of
# lower weight, there before it. The secret holding the master URL is
# deleted once the hooks succeed; after a failed setup it stays (refreshed
# hourly) until the next release replaces it, as erp-cell's migrations'
# does, for a look at the failed Job.
{{- $prefix := required "secrets.prefix is required: erp/global" .Values.secrets.prefix }}
{{- $master := required "directory.masterSecretArn is required: global.directory_master_secret_arn" .Values.directory.masterSecretArn }}
{{- $directory := required "directory.endpoint is required: global.directory_endpoint" .Values.directory.endpoint }}
{{- $vpc := required "vpcCidr is required: cell.cidr" .Values.vpcCidr }}
{{- $logins := .Values.directory.logins }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-directory-setup
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-directory-setup") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: erp-directory-setup
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-url: "postgres://{{ "{{" }} .username | urlquery {{ "}}" }}:{{ "{{" }} .password | urlquery {{ "}}" }}@{{ $directory }}/{{ .Values.directory.name }}?sslmode=verify-full&sslrootcert=/etc/erp/rds/rds-ca.pem"
        router-password: "{{ "{{" }} .routerPassword {{ "}}" }}"
        cell-password: "{{ "{{" }} .cellPassword {{ "}}" }}"
        web-password: "{{ "{{" }} .webPassword {{ "}}" }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ $master }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $master }}
        property: password
    - secretKey: routerPassword
      remoteRef:
        key: {{ printf "%s/directory-router-password" $prefix }}
    - secretKey: cellPassword
      remoteRef:
        key: {{ printf "%s/directory-cell-password" $prefix }}
    - secretKey: webPassword
      remoteRef:
        key: {{ printf "%s/directory-web-password" $prefix }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-directory-setup-rds-ca
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-directory-setup") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  rds-ca.pem: |
    {{- required "directory.caBundle is required: the RDS certificate authorities' bundle" .Values.directory.caBundle | trim | nindent 4 }}
---
# A hook, as its Job is: on an upgrade the default deny is already there,
# and the Job runs before the release's other resources, the default
# deny among them on a first install, so the hook admits DNS itself: the
# cluster's DNS and the directory in the VPC, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-directory-setup
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-directory-setup") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: erp-directory-setup
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: {{ $vpc | quote }}}
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: erp-directory-setup
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-directory-setup") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    # A failed run stays for a look until the next release.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.directory.setupDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "erp-global.labels" (dict "root" . "component" "erp-directory-setup") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: {{ include "erp-global.image" (dict "root" . "name" "router") }}
          args: [setup-directory]
          env:
            - {name: ERP_ENV, value: production}
            - {name: ERP_DIRECTORY_ADMIN_URL, value: file:/etc/erp/setup/admin-url}
            - {name: ERP_DIRECTORY_ROUTER_USER, value: {{ required "directory.logins.router is required: the router's login" $logins.router | quote }}}
            - {name: ERP_DIRECTORY_ROUTER_PASSWORD, value: file:/etc/erp/setup/router-password}
            - {name: ERP_DIRECTORY_CELL_USER, value: {{ required "directory.logins.cell is required: the cells' login" $logins.cell | quote }}}
            - {name: ERP_DIRECTORY_CELL_PASSWORD, value: file:/etc/erp/setup/cell-password}
            - {name: ERP_DIRECTORY_WEB_USER, value: {{ required "directory.logins.web is required: erp-web's login" $logins.web | quote }}}
            - {name: ERP_DIRECTORY_WEB_PASSWORD, value: file:/etc/erp/setup/web-password}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: setup, mountPath: /etc/erp/setup, readOnly: true}
            - {name: rds, mountPath: /etc/erp/rds, readOnly: true}
      volumes:
        - name: setup
          secret:
            secretName: erp-directory-setup
        - name: rds
          configMap:
            name: erp-directory-setup-rds-ca
