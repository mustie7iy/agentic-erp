# The global router (ADR-0022) behind the load balancer, which passes TLS
# through (ADR-0035): it terminates the public TLS with the operators'
# certificate, takes the client's address from the balancer's PROXY v2
# header (its subnets alone), verifies each token, looks the tenant up in
# the directory and forwards to the tenant's cell as its SPIFFE identity
# over TLS 1.3 (ADR-0033). Its admin listener serves liveness, metrics and
# the global control plane, over TLS 1.3 as the same identity.
{{- $td := required "trustDomain is required" .Values.trustDomain }}
{{- $directory := required "directory.endpoint is required: global.directory_endpoint" .Values.directory.endpoint }}
{{- $proxyFrom := required "router.proxyFrom is required: global.router_proxy_sources" .Values.router.proxyFrom }}
{{- if not $proxyFrom }}
{{- fail "router.proxyFrom is required: global.router_proxy_sources, the load balancer's subnets" }}
{{- end }}
{{- range $proxyFrom }}
{{- if not (regexMatch "^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$" .) }}
{{- fail (printf "router.proxyFrom must list the load balancer's subnets as IPv4 CIDRs, not %q" .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erp-router
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-router") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: erp-router-tls
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-router") | nindent 4 }}
spec:
  secretName: erp-router-tls
  duration: {{ .Values.certificates.duration }}
  renewBefore: {{ .Values.certificates.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages: [digital signature, server auth, client auth]
  uris:
    - {{ printf "spiffe://%s/global/erp-router" $td }}
  dnsNames:
    - erp-router.{{ .Release.Namespace }}.svc
    - erp-router.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    group: awspca.cert-manager.io
    kind: AWSPCAClusterIssuer
    name: erp-subordinate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-router
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-router") | nindent 4 }}
spec:
  replicas: {{ .Values.router.replicas }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "erp-global.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "erp-global.labels" (dict "root" . "component" "erp-router") | nindent 8 }}
    spec:
      serviceAccountName: erp-router
      # No Service variables in the environment: the router reads ERP_*
      # settings, and ERP_ROUTER_* would be among them.
      enableServiceLinks: false
      automountServiceAccountToken: false
      # A new pod counts as ready once the load balancer finds it healthy,
      # so a rollout never leaves the target group short.
      readinessGates:
        - conditionType: target-health.elbv2.k8s.aws/erp-router
      # The balancer's deregistration (30 s) begins as the pod stops: the
      # pod keeps serving while it spreads, then drains (ERP_SHUTDOWN_TIMEOUT).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "erp-global.selector" . | nindent 14 }}
      containers:
        - name: router
          image: {{ include "erp-global.image" . }}
          ports:
            - {name: public, containerPort: 8081}
            - {name: admin, containerPort: 9091}
          env:
            - {name: ERP_ENV, value: production}
            - {name: ERP_TRUST_DOMAIN, value: {{ $td | quote }}}
            - {name: ERP_ROUTER_ADDR, value: ":8081"}
            - {name: ERP_ROUTER_ADMIN_ADDR, value: ":9091"}
            - {name: ERP_ROUTER_PROXY_FROM, value: {{ join "," $proxyFrom | quote }}}
            - {name: ERP_LOG_LEVEL, value: {{ .Values.router.logLevel | quote }}}
            - {name: ERP_DIRECTORY_CACHE, value: {{ .Values.router.cacheTtl | quote }}}
            - {name: ERP_SHUTDOWN_TIMEOUT, value: "20s"}
            # The directory over verified TLS as its master user, whose
            # rotating password is read again for each new connection.
            - {name: ERP_DIRECTORY_URL, value: {{ printf "postgres://%s@%s/%s?sslmode=verify-full&sslrootcert=/etc/erp/trust/rds-ca.pem" (.Values.directory.user | urlquery) $directory .Values.directory.name | quote }}}
            - {name: ERP_DIRECTORY_PASSWORD, value: file:/etc/erp/secrets/directory-password}
            - {name: ERP_OPERATOR_ISSUERS, value: {{ required "router.operatorIssuers is required" .Values.router.operatorIssuers | quote }}}
            - {name: ERP_PAGE_TOKEN_KEY, value: file:/etc/erp/secrets/page-token-key}
            - {name: ERP_TLS_CA, value: file:/etc/erp/trust/ca.crt}
            - {name: ERP_TLS_CERT, value: file:/etc/erp/tls/tls.crt}
            - {name: ERP_TLS_KEY, value: file:/etc/erp/tls/tls.key}
            - {name: ERP_ROUTER_PUBLIC_CERT, value: file:/etc/erp/public/tls.crt}
            - {name: ERP_ROUTER_PUBLIC_KEY, value: file:/etc/erp/public/tls.key}
            {{- range $name, $value := .Values.router.extraEnv }}
            - {name: {{ $name }}, value: {{ $value | quote }}}
            {{- end }}
          lifecycle:
            preStop:
              sleep: {seconds: 20}
          readinessProbe:
            httpGet: {path: /livez, port: admin, scheme: HTTPS}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: admin, scheme: HTTPS}
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet: {path: /livez, port: admin, scheme: HTTPS}
            periodSeconds: 2
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
          volumeMounts:
            - {name: secrets, mountPath: /etc/erp/secrets, readOnly: true}
            - {name: trust, mountPath: /etc/erp/trust, readOnly: true}
            - {name: tls, mountPath: /etc/erp/tls, readOnly: true}
            - {name: public, mountPath: /etc/erp/public, readOnly: true}
      volumes:
        - name: secrets
          secret:
            secretName: erp-router
        - name: trust
          configMap:
            name: erp-global-trust
        - name: tls
          secret:
            secretName: erp-router-tls
        - name: public
          secret:
            secretName: erp-router-public-tls
---
# The TargetGroupBinding's Service: the controller registers its
# endpoints' addresses; the cluster's own clients do not use it.
apiVersion: v1
kind: Service
metadata:
  name: erp-router
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-router") | nindent 4 }}
spec:
  selector:
    {{- include "erp-global.selector" . | nindent 4 }}
  ports:
    - {name: public, port: 8081, targetPort: public}
    - {name: admin, port: 9091, targetPort: admin}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp-router
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-router") | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "erp-global.selector" . | nindent 6 }}
