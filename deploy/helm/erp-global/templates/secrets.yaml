# The router's secrets, from AWS Secrets Manager through the External
# Secrets Operator (ADR-0017, ADR-0035), as files it reads with file:
# references. No secret value is in the chart, its values or Terraform's
# state.
#
# The router's directory login has no password: it authenticates with
# RDS IAM tokens its IRSA role signs (ADR-0035 As built 2026-11-01). The
# router holds no master credentials of the directory.
# The public certificate is the operators' (a public CA's, renewed by them
# in Secrets Manager); the router reads it again while it runs.
{{- $prefix := required "secrets.prefix is required: erp/global" .Values.secrets.prefix }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-router
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-router") | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: erp-router
    creationPolicy: Owner
  data:
    - secretKey: page-token-key
      remoteRef:
        key: {{ printf "%s/page-token-key" $prefix }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-router-public-tls
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-router") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: erp-router-public-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: {{ printf "%s/router-public-certificate" $prefix }}
    - secretKey: tls.key
      remoteRef:
        key: {{ printf "%s/router-public-key" $prefix }}
