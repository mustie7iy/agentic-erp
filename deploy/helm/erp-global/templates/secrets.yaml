# The router's secrets, from AWS Secrets Manager through the External
# Secrets Operator (ADR-0017, ADR-0035), as files it reads with file:
# references. No secret value is in the chart, its values or Terraform's
# state.
#
# The directory's password is the router's login's (T72h), which
# operators set in <prefix>/directory-router-password and the setup hook
# gives the login with each release: refreshed here every five minutes,
# read by the router again for each new connection
# (ERP_DIRECTORY_PASSWORD), so a change needs no restart; connections
# opened between the hook and the refresh fail and are retried by the
# next request. The router holds no master credentials of the directory.
# The public certificate is the operators' (a public CA's, renewed by them
# in Secrets Manager); the router reads it again while it runs.
{{- $prefix := required "secrets.prefix is required: erp/global" .Values.secrets.prefix }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-router
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-router") | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: erp-router
    creationPolicy: Owner
  data:
    - secretKey: page-token-key
      remoteRef:
        key: {{ printf "%s/page-token-key" $prefix }}
    - secretKey: directory-password
      remoteRef:
        key: {{ printf "%s/directory-router-password" $prefix }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-router-public-tls
  labels:
    {{- include "erp-global.labels" (dict "root" . "component" "erp-router") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: erp-router-public-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: {{ printf "%s/router-public-certificate" $prefix }}
    - secretKey: tls.key
      remoteRef:
        key: {{ printf "%s/router-public-key" $prefix }}
