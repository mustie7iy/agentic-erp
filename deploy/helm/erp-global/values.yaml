# An environment's global values: most from Terraform's outputs
# (envs/<env>: global.*, cell.cidr, subordinate_ca_certificate) and the
# release (the router's and erp-web's image digests, T40d). Every one without a default is
# required: rendering fails without it.

# The SPIFFE trust domain of the environment (ERP_TRUST_DOMAIN, ADR-0033).
# The router is spiffe://<trustDomain>/global/erp-router, as the cells
# expect it.
trustDomain: ""
# The namespace of the home cell's erp-cell release, whose API and admin
# listener the router and the global plane call.
cellNamespace: erp
# The home cell's VPC CIDR (cell.cidr): the directory database.
vpcCidr: ""

# The release's image, by digest from the release registry: the admission
# policy admits nothing else.
images:
  router:
    repository: ""
    digest: ""
  # The web workspace (ADR-0052).
  web:
    repository: ""
    digest: ""

# The environment's trust anchor (envs/<env> subordinate_ca_certificate,
# PEM): the subordinate CA, not the root (ADR-0035, Revocation).
trust:
  caBundle: ""

# The router's certificate: a day, renewed with a third left (the
# erp-cluster chart's policy refuses longer).
certificates:
  duration: 24h
  renewBefore: 8h

# The regional STS endpoint, which the home cell's VPC endpoint answers
# (cell.aws_endpoints.sts): where the router and erp-web exchange their
# service accounts' tokens for their IRSA roles, whose credentials sign
# their directory logins' IAM tokens (ERP_AWS_STS_ENDPOINT).
awsEndpoints:
  sts: ""

router:
  # Spread over the zones, as the load balancer is.
  replicas: 3
  # The router's IRSA role (cell.workload_role_arns.router), which may
  # connect to the directory as the router's login alone.
  roleArn: ""
  # The target group the load balancer forwards to (global.router_target_group_arn).
  targetGroupArn: ""
  # The load balancer's subnets (global.router_proxy_sources): the only
  # sources the public listener takes, each connection beginning with a
  # PROXY v2 header (ERP_ROUTER_PROXY_FROM).
  proxyFrom: []
  # ERP_OPERATOR_ISSUERS: the operators' issuers for the global control
  # plane on the admin listener, a JSON list.
  operatorIssuers: ""
  # How long a directory lookup is remembered (ERP_DIRECTORY_CACHE).
  cacheTtl: 30s
  logLevel: info
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 512Mi}
  # Further settings, by name.
  extraEnv: {}

# The web workspace (ADR-0052 §6): erp-web on its own hostname and load
# balancer, calling the API through the router.
web:
  replicas: 3
  # erp-web's IRSA role (cell.workload_role_arns.web), which may connect
  # to the directory as erp-web's login alone.
  roleArn: ""
  # The workspace's own hostname, app.<domain>: its address
  # (ERP_WEB_PUBLIC_URL, https), whose record points at global.web_dns_name
  # and whose public certificate operators load (<prefix>/web-public-*).
  hostname: ""
  # The public API's address, https://<the router's hostname>
  # (ERP_WEB_API_URL): erp-web reaches it at the router's Service and
  # verifies this name.
  apiUrl: ""
  # The target group the web load balancer forwards to (global.web_target_group_arn).
  targetGroupArn: ""
  # The web load balancer's subnets (global.web_proxy_sources): the only
  # sources the public listener takes, each connection beginning with a
  # PROXY v2 header (ERP_WEB_PROXY_FROM).
  proxyFrom: []
  # While the session sealing key rotates (ADR-0028): true mounts
  # <prefix>/web-session-key-previous as ERP_WEB_SESSION_KEY_PREVIOUS, so
  # sessions sealed under the previous key still open. To rotate: copy
  # web-session-key into web-session-key-previous, write a new
  # web-session-key, deploy with true (replicas read the keys at start);
  # after a session's lifetime (24 h), deploy with false and empty the
  # previous one.
  sessionKeyPrevious: false
  logLevel: info
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 512Mi}
  # Further settings, by name.
  extraEnv: {}

directory:
  # The directory database, host:port (global.directory_endpoint).
  endpoint: ""
  name: directory
  # The directory's region (global.directory_region), which the logins'
  # IAM tokens are signed for (ERP_DIRECTORY_REGION).
  region: ""
  # The clients' logins (T72h), each a member of its privilege role alone
  # (internal/directory: erp_router, erp_cell, erp_web), which the setup
  # hook makes, with no password, and grants rds_iam: they authenticate
  # with RDS IAM tokens their IRSA roles sign (ADR-0035 As built
  # 2026-11-01). The router and erp-web connect as theirs; the cells' is
  # erp-cell's directory.user. Terraform's directory_logins name the same.
  logins:
    router: erp_router_login
    cell: erp_cell_login
    web: erp_web_login
  # The RDS-managed master credentials in Secrets Manager
  # (global.directory_master_secret_arn): the setup hook's alone, which
  # makes the schema and the logins before each release; no service
  # holds them.
  masterSecretArn: ""
  # The RDS certificate authorities' bundle (PEM, AWS's published bundle
  # for the region), which the router, erp-web and the setup hook verify
  # the directory with.
  caBundle: ""
  # How long the setup hook may take before it fails.
  setupDeadlineSeconds: 600

secrets:
  # The global tier's entries in Secrets Manager (modules/global):
  # <prefix>/page-token-key (base64 of at least 32 random bytes),
  # router-public-certificate (the public listener's chain, PEM, from a
  # public CA) and router-public-key (its key, PEM), and the same pair for
  # the web workspace (web-public-certificate, web-public-key), which
  # operators load; the workspace's web-session-key (at least 32 random
  # bytes; web-session-key-previous during a rotation) and web-clients (a JSON object of file name to the web clients'
  # PEM keys or secrets, ADR-0052 G8).
  prefix: erp/global
  # The store of the erp-cluster chart.
  store: erp-cell
