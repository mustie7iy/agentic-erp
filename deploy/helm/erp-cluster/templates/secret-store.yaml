# The cell's secrets in AWS Secrets Manager (erp/<cell>/*), synced into
# Kubernetes secrets that the platform mounts as files and reads with file:
# references (ADR-0017). The operator reads them as its own IRSA role,
# which may read the cell's secrets and nothing else; only the platform's
# namespaces may use the store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: erp-cell
spec:
  conditions:
    - {{- include "erp-cluster.namespaceSelector" . | nindent 6 }}
  provider:
    aws:
      service: SecretsManager
      region: {{ include "erp-cluster.region" . | quote }}
