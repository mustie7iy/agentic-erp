# Certificates for scripts/admission-checks.sh, judged by the chart rendered
# with tests/values.yaml (trust domain dev.erp.example). Each "want" line
# names a certificate and whether the policy must admit it.
# want: admitted:admitted
# want: client-only:admitted
# want: other-issuer:refused
# want: issuer-kind:refused
# want: no-duration:refused
# want: two-days:refused
# want: late-renewal:refused
# want: no-usages:refused
# want: code-signing:refused
# want: no-spiffe:refused
# want: two-identities:refused
# want: other-domain:refused
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: admitted, namespace: erp}
spec: {"secretName": "admitted", "duration": "24h", "renewBefore": "8h", "usages": ["digital signature", "key encipherment", "server auth", "client auth"], "uris": ["spiffe://dev.erp.example/dev-1/erp-server"], "privateKey": {"algorithm": "ECDSA", "size": 256}, "issuerRef": {"group": "awspca.cert-manager.io", "kind": "AWSPCAClusterIssuer", "name": "erp-subordinate"}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: client-only, namespace: erp}
spec: {"secretName": "client-only", "duration": "24h", "renewBefore": "8h", "usages": ["digital signature", "client auth"], "uris": ["spiffe://dev.erp.example/dev-1/erp-server"], "privateKey": {"algorithm": "ECDSA", "size": 256}, "issuerRef": {"group": "awspca.cert-manager.io", "kind": "AWSPCAClusterIssuer", "name": "erp-subordinate"}}
---
