# The cell's secrets, from AWS Secrets Manager through the External Secrets
# Operator (ADR-0017, ADR-0035), as files the platform reads with file:
# references. No secret value is in the chart, its values or Terraform's
# state.
#
# The cell logs in to PgBouncer as erp with a static password operators
# set (<prefix>/database-client-password, letters and digits only, e.g.
# `openssl rand -hex 32`: it goes into a URL); PgBouncer logs in to the writer
# with the RDS-managed master credentials, which RDS rotates weekly. So the
# rotation reaches PgBouncer alone: External Secrets refreshes its
# configuration within minutes and PgBouncer reloads it (pgbouncer.yaml),
# replacing its server connections as they are released.
{{- $prefix := required "secrets.prefix is required: erp/<cell>" .Values.secrets.prefix }}
{{- $master := required "database.masterSecretArn is required" .Values.database.masterSecretArn }}
{{- $writer := required "database.writerHost is required: cell.database_endpoint" .Values.database.writerHost }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-server
  labels:
    {{- include "erp-cell.labels" (dict "root" . "component" "erp-server") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: erp-server
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        page-token-key: "{{ "{{" }} .pageTokenKey {{ "}}" }}"
        # Through PgBouncer, verified against the environment's CA.
        database-url: "postgres://erp:{{ "{{" }} .clientPassword | urlquery {{ "}}" }}@erp-pgbouncer.{{ .Release.Namespace }}.svc:{{ .Values.pgbouncer.port }}/{{ .Values.database.name }}?sslmode=verify-full&sslrootcert=/etc/erp/trust/ca.crt"
  data:
    - secretKey: pageTokenKey
      remoteRef:
        key: {{ printf "%s/page-token-key" $prefix }}
    - secretKey: clientPassword
      remoteRef:
        key: {{ printf "%s/database-client-password" $prefix }}
---
# PgBouncer's configuration: the cell's login (userlist.txt) and the
# writer, with the master credentials (pgbouncer.ini). In PgBouncer's
# connection string a quoted value escapes a single quote by doubling it
# and takes a backslash as it is; in its user list a double quote is
# doubled likewise (both tested in scripts/helm-checks.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-pgbouncer
  labels:
    {{- include "erp-cell.labels" (dict "root" . "component" "erp-pgbouncer") | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: erp-pgbouncer
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        userlist.txt: |
          "erp" "{{ "{{" }} .clientPassword | replace "\"" "\"\"" {{ "}}" }}"
        pgbouncer.ini: |
          [databases]
          {{ .Values.database.name }} = host={{ $writer }} port=5432 dbname={{ .Values.database.name }} user={{ "{{" }} .username {{ "}}" }} password='{{ "{{" }} .password | replace "'" "''" {{ "}}" }}'

          [pgbouncer]
          listen_addr = 0.0.0.0
          listen_port = {{ .Values.pgbouncer.port }}
          unix_socket_dir =
          auth_type = scram-sha-256
          auth_file = /etc/pgbouncer/config/userlist.txt
          pool_mode = transaction
          max_prepared_statements = 200
          default_pool_size = {{ .Values.pgbouncer.poolSize }}
          max_client_conn = {{ .Values.pgbouncer.maxClientConnections }}
          ignore_startup_parameters = extra_float_digits
          client_tls_sslmode = require
          client_tls_protocols = tlsv1.3
          client_tls_cert_file = /etc/pgbouncer/tls/tls.crt
          client_tls_key_file = /etc/pgbouncer/tls/tls.key
          server_tls_sslmode = verify-full
          server_tls_protocols = tlsv1.3
          server_tls_ca_file = /etc/pgbouncer/rds/ca.pem
          log_connections = 0
          log_disconnections = 0
  data:
    - secretKey: clientPassword
      remoteRef:
        key: {{ printf "%s/database-client-password" $prefix }}
    - secretKey: username
      remoteRef:
        key: {{ $master }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $master }}
        property: password
