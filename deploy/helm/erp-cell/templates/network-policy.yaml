        - {protocol: TCP, port: 4222}
    - from:
        - podSelector:
            matchLabels:
              {{- include "erp-cell.selector" (dict "root" . "component" "erp-nats") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 6222}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "erp-cell.selector" (dict "root" . "component" "erp-nats") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 6222}
---
