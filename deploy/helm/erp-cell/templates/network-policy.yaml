# The cell's traffic (ADR-0035), default deny: what is not allowed here
# does not happen.
# - The API and the admin listener (/control, metrics) take connections
#   from the router and the global plane's namespace only, and the admin
#   listener from the cell's Prometheus (monitoring.yaml); kubelet's
#   probes are not subject to policies.
# - The server reaches PgBouncer, NATS, the workflow engine, erp-analytics,
#   the cell's trace collector (OTLP/HTTP), on the home cell the global
#   directory in the VPC and, on 443, the AWS endpoints in the VPC and the
#   tenants' identity providers outside it.
# - erp-analytics takes the server alone, and reaches, on 443, the S3
#   gateway endpoint and STS in the VPC; no database, bus or engine.
# - NATS takes clients from the server and routes from its own nodes.
# - The workflow engine's frontend takes the server and the engine's own
#   nodes; its other services and membership ports, its nodes alone. It
#   reaches the writer, in the VPC.
# - PgBouncer and the migrations Jobs reach the writer, in the VPC, only;
#   the Jobs take no connections.
# - Every Pod resolves names through the cluster's DNS, the hook Jobs
#   through their own policies' rule as well (the default deny is not
#   there yet when they run on a first install).
{{- $vpc := required "vpcCidr is required: cell.cidr" .Values.vpcCidr }}
{{- $port := .Values.pgbouncer.port }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-default-deny
  labels:
    {{- include "erp-cell.labels" (dict "root" . "component" "erp-network") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "erp-cell.dnsEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-server
  labels:
    {{- include "erp-cell.labels" (dict "root" . "component" "erp-server") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "erp-cell.selector" (dict "root" . "component" "erp-server") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.routerNamespace }}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 9090}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "erp-cell.selector" (dict "root" . "component" "erp-pgbouncer") | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ $port }}}
    - to:
        - podSelector:
            matchLabels:
              {{- include "erp-cell.selector" (dict "root" . "component" "erp-nats") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 4222}
    - to:
        - podSelector:
            matchLabels:
              {{- include "erp-cell.selector" (dict "root" . "component" "erp-temporal") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 7233}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "tracingNamespace is required" .Values.tracingNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
              app.kubernetes.io/instance: opentelemetry-collector
      ports:
        - {protocol: TCP, port: 4318}
    - to:
        - podSelector:
            matchLabels:
              {{- include "erp-cell.selector" (dict "root" . "component" "erp-analytics") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8443}
    {{- if .Values.directory.endpoint }}
    # The global directory, in the home cell's VPC. The rule admits the
    # VPC's 5432, the writer's too, which the server could then reach past
    # PgBouncer; it holds no login for it (only PgBouncer and the Jobs
    # hold the master credentials), and the writer's security group, not
    # this policy, is what bounds it.
    - to:
        - ipBlock: {cidr: {{ $vpc | quote }}}
      ports:
        - {protocol: TCP, port: 5432}
    {{- end }}
    - ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-analytics
  labels:
    {{- include "erp-cell.labels" (dict "root" . "component" "erp-analytics") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "erp-cell.selector" (dict "root" . "component" "erp-analytics") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "erp-cell.selector" (dict "root" . "component" "erp-server") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8443}
  # S3 through the gateway endpoint (the region's public prefixes) and STS
  # through its interface endpoint: 443, as the server's.
  egress:
    - ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-pgbouncer
  labels:
    {{- include "erp-cell.labels" (dict "root" . "component" "erp-pgbouncer") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "erp-cell.selector" (dict "root" . "component" "erp-pgbouncer") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "erp-cell.selector" (dict "root" . "component" "erp-server") | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ $port }}}
  egress:
    - to:
        - ipBlock:
            cidr: {{ $vpc }}
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-migrate
  labels:
    {{- include "erp-cell.labels" (dict "root" . "component" "erp-migrate") | nindent 4 }}
  # A hook, as its Job is, of a lower weight, so it is there before the
  # Job's Pods. Helm runs pre-install hooks before it creates any of the
  # release's resources (Argo CD: PreSync), so on a first install the
  # default deny is not there yet: this policy alone holds the Job, both
  # ways, and admits the cluster's DNS itself, then the writer in the VPC.
  # On an upgrade the default deny adds nothing more.
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "erp-cell.selector" (dict "root" . "component" "erp-migrate") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "erp-cell.dnsEgress" . | nindent 4 }}
    - to:
        - ipBlock:
            cidr: {{ $vpc }}
      ports:
        - {protocol: TCP, port: 5432}
---
# The restore drill's one-off pods (scripts/restore-drill.sh, ADR-0040):
# erp-server dr mark against the writer, dr verify against a side cluster
# restored in the VPC; nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erp-restore-drill
  labels:
    {{- include "erp-cell.labels" (dict "root" . "component" "erp-restore-drill") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "erp-cell.selector" (dict "root" . "component" "erp-restore-drill") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ $vpc }}
      ports:
        - {protocol: TCP, port: 5432}
---
