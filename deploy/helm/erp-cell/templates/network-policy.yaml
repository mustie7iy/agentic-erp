    matchLabels:
      {{- include "erp-cell.selector" (dict "root" . "component" "erp-nats") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "erp-cell.selector" (dict "root" . "component" "erp-server") | nindent 14 }}
