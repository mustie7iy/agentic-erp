# Vulnerabilities the image scan accepts (scripts/image-scan.sh, ADR-0032).
# Each entry names the vulnerability and the package, says why it is
# accepted and until when; an expired entry is removed, not extended
# without a new reason. grype does not read the expiry: review does.
ignore:
  # libcares2 1.34.5-1+deb13u1 in the pinned PgBouncer image
  # (ghcr.io/cloudnative-pg/pgbouncer 1.26.1-202611121015-trixie, arm64
  # sha256:2df7fa82..., deploy/images/upstream.txt, pinned 2026-11-16 for
  # its apt 3.0.4 and zlib1g 1:1.3.dfsg+really1.3.1-1+deb13u1); Debian 13
  # fixes CVE-2026-33630 and CVE-2026-69184 (High) in 1.34.9-1~deb13u1, but
  # no PgBouncer image carries it yet: the pinned build is also the newest
  # (the moving tag 1.26.1 names the same arm64 digest on 2026-11-16), and
  # it still has 1.34.5 (scanned 2026-11-16). PgBouncer links libcares and uses it for its DNS lookups,
  # so this is not a "nothing loads it" exception. Accepted by the product
  # owner (2026-11-15): nothing is deployed (AWS deferred), the release runs
  # this scan again before it copies or signs any image, and PgBouncer
  # resolves only the database host in its own configuration (the cell's
  # database endpoint, from the erp-pgbouncer secret,
  # deploy/helm/erp-cell/templates/pgbouncer.yaml) through the cluster's
  # resolver. Until 2026-11-29, or sooner once a PgBouncer image with
  # libcares2 >= 1.34.9 is pinned. CVE-2025-62408 and CVE-2026-69186
  # (Medium) are below the scan's threshold and need no entry.
  - vulnerability: CVE-2026-33630
    package:
      name: libcares2
      type: deb
      version: 1.34.5-1+deb13u1
  - vulnerability: CVE-2026-69184
    package:
      name: libcares2
      type: deb
      version: 1.34.5-1+deb13u1
  # libc6 and libc-bin 2.41-12+deb13u4 in the pinned PgBouncer image
  # (1.26.1-202611121015-trixie, arm64 sha256:2df7fa82...); Debian 13 fixes
  # CVE-2026-19499 and CVE-2026-5435 (High) in 2.41-12+deb13u5, but no
  # PgBouncer build carries it yet. glibc is loaded by PgBouncer, so this is
  # a posture decision, not a "nothing loads it" exception. Accepted by the
  # product owner (2026-11-22): nothing is deployed (AWS deferred) and the
  # release runs this scan again before it copies or signs any image. Until
  # 2026-11-29, or sooner once a PgBouncer image with glibc 2.41-12+deb13u5
  # is pinned. The entries also covered erp-analytics's runtime base until
  # it moved on 2026-11-23 to distroless cc-debian13:nonroot
  # sha256:532c7a94..., which carries libc6 2.41-12+deb13u5 and needs none
  # of them. The Medium and Low findings of the same update are below the
  # scan's threshold and need no entry.
  - vulnerability: CVE-2026-19499
    package:
      name: libc6
      type: deb
      version: 2.41-12+deb13u4
  - vulnerability: CVE-2026-19499
    package:
      name: libc-bin
      type: deb
      version: 2.41-12+deb13u4
  - vulnerability: CVE-2026-5435
    package:
      name: libc6
      type: deb
      version: 2.41-12+deb13u4
  - vulnerability: CVE-2026-5435
    package:
      name: libc-bin
      type: deb
      version: 2.41-12+deb13u4
  # libgssapi-krb5-2, libk5crypto3, libkrb5-3 and libkrb5support0 (MIT
  # Kerberos) 1.21.3-5+deb13u1 in the pinned PgBouncer image
