  # CVE-2026-112323 and CVE-2026-119079 (High) in 1.21.3-5+deb13u2, but no
  # PgBouncer build carries it yet: the newest trixie tag is still the
  # pinned build (2026-11-23). The libraries are in the image, so this is a
