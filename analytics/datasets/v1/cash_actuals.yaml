# Dataset contract (ADR-0044). Additive changes only (a new nullable
# column); a removed, renamed or retyped column or a changed grain is a new
# version under ../v2. Columns are what the extractor writes to Parquet;
# internal/analytics/datasets_test.go checks them against semantic.yaml.
dataset: cash_actuals
version: 1
kind: fact
grain: One row per bank statement line and liquidity item, posted or not, of every value date, its share as the cash actuals classify it (ADR-0051 §11, getCashActuals); amount_minor is signed, money out negative.
# Classified by the cash context (its published ActualShares), never in
# SQL: a reconciliation or a configuration change reclassifies a line, so
# every run reads them whole.
load: snapshot
date: value_date
columns:
  - {name: tenant_id, type: uuid, role: tenant}
  - {name: statement_id, type: uuid, role: id}
  - {name: line_no, type: int32, role: key}
  - {name: company, type: string, role: dimension}
  - {name: value_date, type: date, role: date}
  - {name: house_bank, type: string, role: dimension}
  - {name: match, type: string, role: dimension}
  - {name: liquidity_item, type: string, role: dimension, nullable: true}
  - {name: liquidity_item_name, type: string, role: dimension, nullable: true}
  - {name: amount_minor, type: int64, role: amount}
  - {name: currency, type: string, role: currency}
  - {name: exponent, type: int32, role: exponent}
