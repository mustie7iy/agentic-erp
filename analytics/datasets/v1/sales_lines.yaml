# Dataset contract (ADR-0044). Additive changes only (a new nullable
# column); a removed, renamed or retyped column or a changed grain is a new
# version under ../v2. Columns are what the extractor writes to Parquet;
# internal/analytics/datasets_test.go checks them against semantic.yaml.
dataset: sales_lines
version: 1
kind: fact
grain: One row per item of a confirmed sales order, dated the order's date, and per item of a posted billing document, dated its billing date; amount_minor is the item's net amount in the document's currency. A draft order and a billing document not posted have no row.
# An order is confirmed and a billing document posted after they are
# written, and a customer is renamed, so each extract is a snapshot of the
# tenant's items.
load: snapshot
date: document_date
columns:
  - {name: tenant_id, type: uuid, role: tenant}
  - {name: document_id, type: uuid, role: id}
  - {name: item_no, type: int32, role: key}
  - {name: sales_document, type: string, role: dimension}
  - {name: company, type: string, role: dimension}
  - {name: document_date, type: date, role: date}
  - {name: customer, type: string, role: dimension}
  - {name: customer_name, type: string, role: dimension}
  - {name: item_key, type: string, role: dimension, nullable: true}
  - {name: amount_minor, type: int64, role: amount}
  - {name: currency, type: string, role: currency}
  - {name: exponent, type: int32, role: exponent}
