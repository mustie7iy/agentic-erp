# Dataset contract (ADR-0044). Additive changes only (a new nullable
# column); a removed, renamed or retyped column or a changed grain is a new
# version under ../v2. Columns are what the extractor writes to Parquet;
# internal/analytics/datasets_test.go checks them against semantic.yaml.
dataset: cash_accuracy
version: 1
kind: fact
grain: Three rows (figure variance, absolute_variance and absolute_forecast) per cell of each company's value date compared at a lag of 0, 7 or 30 days (passed, with the company's snapshot taken the lag before, the one the variance compares against), currency and liquidity item where the actuals or that snapshot's lines at document level (blocked suppliers' left out) hold a flow; variance is the actual less the forecast, signed, money out negative; the absolute figures are the variance's and the forecast's sizes, of the cell, so their sums are WAPE's terms.
# Compared by the cash context (its published ExtractAccuracyCells) from
# the same shares as cash_actuals and cash_snapshots, never in SQL; a day
# passing, a reconciliation or a snapshot changes cells, so every run
# reads them whole.
load: snapshot
date: value_date
columns:
  - {name: tenant_id, type: uuid, role: tenant}
  - {name: cell_id, type: uuid, role: id}
  - {name: company, type: string, role: dimension}
  - {name: value_date, type: date, role: date}
  - {name: lag_days, type: int32, role: dimension}
  - {name: figure, type: string, role: dimension}
  - {name: liquidity_item, type: string, role: dimension, nullable: true}
  - {name: liquidity_item_name, type: string, role: dimension, nullable: true}
  - {name: amount_minor, type: int64, role: amount}
  - {name: currency, type: string, role: currency}
  - {name: exponent, type: int32, role: exponent}
