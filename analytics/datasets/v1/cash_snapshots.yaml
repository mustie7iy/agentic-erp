# Dataset contract (ADR-0044). Additive changes only (a new nullable
# column); a removed, renamed or retyped column or a changed grain is a new
# version under ../v2. Columns are what the extractor writes to Parquet;
# internal/analytics/datasets_test.go checks them against semantic.yaml.
dataset: cash_snapshots
version: 1
kind: fact
grain: One row per line at document level (a value date within 31 days of the snapshot's date) of each company's snapshot of each date, the one the variance compares against (its daily snapshot, else the last taken on demand that day); lag_days is the value date less the snapshot's date; amount_minor is signed, money out negative.
# Read by the cash context (its published ExtractForecastShares), with its
# house banks' codes and today's names of its liquidity items, as the
# variance names its rows. A bucket's sum beyond the document level names
# no day, so it is not a row; a snapshot is never changed, but the
# retention deletes it after 25 months, so every run reads them whole.
load: snapshot
date: value_date
columns:
  - {name: tenant_id, type: uuid, role: tenant}
  - {name: snapshot_id, type: uuid, role: id}
  - {name: line_no, type: int32, role: key}
  - {name: company, type: string, role: dimension}
  - {name: value_date, type: date, role: date}
  - {name: lag_days, type: int32, role: dimension}
  - {name: house_bank, type: string, role: dimension, nullable: true}
  - {name: source, type: string, role: dimension}
  - {name: certainty, type: string, role: dimension}
  - {name: blocked, type: bool, role: dimension}
  - {name: liquidity_item, type: string, role: dimension, nullable: true}
  - {name: liquidity_item_name, type: string, role: dimension, nullable: true}
  - {name: amount_minor, type: int64, role: amount}
  - {name: currency, type: string, role: currency}
  - {name: exponent, type: int32, role: exponent}
